私<rt>わたし</rt></ruby>は<ruby>妹<rt>いもうと</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてあげます。</td><td>我 → 妹妹</td></tr><tr><td><mark class=\"study-key\">てくれる</mark></td><td><ruby>友達<rt>ともだち</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれます。</td><td>朋友 → 我</td></tr><tr><td><mark class=\"study-key\">てもらう</mark></td><td><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてもらいます。</td><td>朋友 → 我</td></tr></tbody></table></div><p>後兩句可以說同一件事。くれる從幫忙的人出發；もらう從接受幫助的人出發。表中的に配合教える使用，不是所有<mark class=\"study-key\">受惠者</mark>都一律加に。</p>\n<h3>① てくれる：別人替我方做</h3><p>基本結構：<ruby>動作<rt>どうさ</rt></ruby>者は／が＋動詞<mark class=\"study-key\">て形</mark>＋くれる／くれます。受惠者是我或語境中的我方親近者，清楚時常省略。</p><p><ruby>母<rt>はは</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>飴<rt>あめ</rt></ruby>を<ruby>買<rt>か</rt></ruby>ってくれます。<br>媽媽買糖果給我。<ruby>買<rt>か</rt></ruby>う → <ruby>買<rt>か</rt></ruby>って → <ruby>買<rt>か</rt></ruby>ってくれます。<br><br><ruby>高野<rt>たかの</rt></ruby>さんは<ruby>私<rt>わたし</rt></ruby>に<ruby>英語<rt>えいご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれます。<br>高野先生／小姐教我英文。<ruby>教<rt>おし</rt></ruby>える → <ruby>教<rt>おし</rt></ruby>えて → <ruby>教<rt>おし</rt></ruby>えてくれます。<br><br><ruby>電気<rt>でんき</rt></ruby>屋の人は新しいテレビを<ruby>家<rt>いえ</rt></ruby>まで運んでくれます。<br>電器行的人幫我把新電視搬到家。運ぶ → 運んで → 運んでくれます。<br><br>役所の人は<ruby>私<rt>わたし</rt></ruby>たちに道を<ruby>教<rt>おし</rt></ruby>えてくれます。<br>公所的人告訴我們怎麼走。<br><br>あのおじいさんは<ruby>妹<rt>いもうと</rt></ruby>の<ruby>靴<rt>くつ</rt></ruby>を<ruby>直<rt>なお</rt></ruby>してくれます。<br>那位老先生幫妹妹修鞋。直す → <ruby>直<rt>なお</rt></ruby>して。<br><br>旅行会社の人は家族のビザを申請してくれます。<br>旅行社的人幫家人申請簽證。</p>\n<h3>② てあげる：替對方做</h3><p>基本結構：<ruby>動作<rt>どうさ</rt></ruby>者は／が＋動詞<mark class=\"study-key\">て形</mark>＋あげる／あげます。動作者可以是我，也可以是第三者；句子把行為當作給對方的幫助，不必然表示「很忙還特地抽空」。</p><p><ruby>私<rt>わたし</rt></ruby>は<ruby>妹<rt>いもうと</rt></ruby>に問題の解き方を<ruby>教<rt>おし</rt></ruby>えてあげます。<br>我教妹妹解題方法。<br><br><ruby>母<rt>はは</rt></ruby>は<ruby>弟<rt>おとうと</rt></ruby>におもちゃを<ruby>買<rt>か</rt></ruby>ってあげます。<br>媽媽買玩具給弟弟。<br><br>王さんは<ruby>彼女<rt>かのじょ</rt></ruby>のためにギターを弾いてあげます。<br>王先生為女朋友彈吉他。<ruby>弾<rt>ひ</rt></ruby>く → 弾いて。<br><br>先生は学生に絵本を貸してあげます。<br>老師借繪本給學生。貸す → 貸して。</p><p>語氣提醒：直接對人說「～てあげます」有時會像在強調自己施恩，尤其對長輩或上司要留意。例如想主動幫忙，可以說「荷物を持ちましょうか」（要我幫您拿行李嗎？）。<mark class=\"study-key\">てあげる</mark>本身不等於更有禮貌。</p>\n<h3>③ てもらう：得到別人的幫助</h3><p>基本結構：<mark class=\"study-key\">受惠者</mark>は＋<mark class=\"study-key\">動作者</mark>に＋動詞て形＋もらう／もらいます。這裡的に標示實際做事的人。常用來說請人幫忙或得到協助，但句型本身不保證事前有請求，也不表示強迫。</p><div class=\"table-scroll\"><table><thead><tr><th>仔細比較</th><th>誰教誰？</th></tr></thead><tbody><tr><td><ruby>私<rt>わたし</rt></ruby>は<ruby>岸部<rt>きしべ</rt></ruby>さんにギターの<ruby>弾<rt>はじ</rt></ruby>き方を<ruby>教<rt>おし</rt></ruby>えます。</td><td>我教岸部先生／小姐彈吉他。</td></tr><tr><td><ruby>私<rt>わたし</rt></ruby>は<ruby>岸部<rt>きしべ</rt></ruby>さんにギターの<ruby>弾<rt>はじ</rt></ruby>き方を<ruby>教<rt>おし</rt></ruby>えてもらいます。</td><td>岸部先生／小姐教我彈吉他；我接受教導。</td></tr></tbody></table></div><p>同樣以「<ruby>私<rt>わたし</rt></ruby>は」開頭，實際教的人卻不同。不要把は前面的人直接當成後面每個動作的執行者。</p><p><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>ってもらいました。<br>朋友幫我買了書。用もらいました對應已發生的「買了」。<br><br><ruby>私<rt>わたし</rt></ruby>は<ruby>弟<rt>おとうと</rt></ruby>に<ruby>部屋<rt>へや</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>してもらいます。<br>我請弟弟幫忙打掃房間。<ruby>掃除<rt>そうじ</rt></ruby>する → <ruby>掃除<rt>そうじ</rt></ruby>して。<br><br><ruby>私<rt>わたし</rt></ruby>は<ruby>旅行<rt>りょこう</rt></ruby>会社の人にホテルを<ruby>予約<rt>よやく</rt></ruby>してもらいます。<br>我請旅行社的人幫忙訂飯店。<ruby>予約<rt>よやく</rt></ruby>する → <ruby>予約<rt>よやく</rt></ruby>して。<br><br><ruby>彼<rt>かれ</rt></ruby>は妻にお弁当を<ruby>作<rt>つく</rt></ruby>ってもらいます。<br>他得到太太幫忙做便當。作る → <ruby>作<rt>つく</rt></ruby>って。<br><br>田村さんは<ruby>林<rt>はやし</rt></ruby>さんに中国語を<ruby>教<rt>おし</rt></ruby>えてもらいます。<br>田村先生／小姐接受林先生／小姐的中文教導。</p>\n<h3>助詞跟著原來的動作走</h3><p><ruby>教<rt>おし</rt></ruby>える：<ruby>妹<rt>いもうと</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>える → <ruby>妹<rt>いもうと</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてあげる。<br>直す：<ruby>妹<rt>いもうと</rt></ruby>の<ruby>靴<rt>くつ</rt></ruby>を直す → <ruby>妹<rt>いもうと</rt></ruby>の<ruby>靴<rt>くつ</rt></ruby>を<ruby>直<rt>なお</rt></ruby>してあげる。<br>不要硬套成「<ruby>妹<rt>いもうと</rt></ruby>に<ruby>靴<rt>くつ</rt></ruby>を直す」。想明確表示為誰做，也可依語境用「<ruby>妹<rt>いもうと</rt></ruby>のために」。但てもらう的「<ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に～てもらう」中，友達に表示幫忙的人，角色不同。</p>\n<h3>變形拆成兩步，就容易了</h3><p>第一步先做<mark class=\"study-key\">て形</mark>，第二步才接授受動詞。<br>教える（第二類）→ <ruby>去<rt>さ</rt></ruby>る加て → <ruby>教<rt>おし</rt></ruby>えて → <ruby>教<rt>おし</rt></ruby>えてもらいます。<br>買う（第一類）→ う變って → <ruby>買<rt>か</rt></ruby>って → <ruby>買<rt>か</rt></ruby>ってくれます。<br>手伝う（第一類）→ う變って → <ruby>手伝<rt>てつだ</rt></ruby>って → <ruby>手伝<rt>てつだ</rt></ruby>ってくれました。<br>予約する（第三類）→ <ruby>予約<rt>よやく</rt></ruby>して → <ruby>予約<rt>よやく</rt></ruby>してもらいます。</p><p><mark class=\"study-key\">て形</mark>本身不表示過去。現在／未來、習慣可用くれます；已發生用くれました。<br><ruby>友達<rt>ともだち</rt></ruby>が<ruby>手伝<rt>てつだ</rt></ruby>ってくれました。＝朋友幫了我。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>手伝<rt>てつだ</rt></ruby>ってもらいました。＝我得到了朋友的幫忙。</p>\n","symbol":"ありがとう","intro":"從「誰幫誰」看懂て形的授受句型。","tag":"てあげる・てくれる・てもらう","concepts":[["先做て形，再接句型","先辨認動詞類別，再接授受動詞；<mark class=\"study-key\">て形</mark>本身不表示過去。","<ruby>買<rt>か</rt></ruby>う → <ruby>買<rt>か</rt></ruby>って → <ruby>買<rt>か</rt></ruby>ってくれました。","買う是第一類：う→って。媽媽買了東西給我，可說母が買ってくれました。過去由最後的くれました表達。"],["我替別人做：てあげる","以做事的人為主題，把行為視為給對方的幫助；也能描述第三者為別人做事。","<ruby>私<rt>わたし</rt></ruby>は<ruby>妹<rt>いもうと</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてあげます。","我教妹妹日文。我做、妹妹受惠。教える是第二類：去る加て→教えて，再接あげます。"],["別人替我方做：てくれる","以幫忙的人為主題，表達我或我方親近者受惠；不是自動升級為敬語。","<ruby>高野<rt>たかの</rt></ruby>さんは<ruby>私<rt>わたし</rt></ruby>に<ruby>英語<rt>えいご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれます。","高野先生／小姐教我英文。高野做、我受惠。語境清楚時，私に常可省略。"],["我得到幫忙：てもらう","<mark class=\"study-key\">受惠者</mark>は＋<mark class=\"study-key\">動作者</mark>に＋動詞て形＋もらう。這個に前面的人，才是實際執行動作的人。","<ruby>私<rt>わたし</rt></ruby>は<ruby>岸部<rt>きしべ</rt></ruby>さんにギターの<ruby>弾<rt>はじ</rt></ruby>き方を<ruby>教<rt>おし</rt></ruby>えてもらいます。","岸部教我彈吉他。若改成私は岸部さんにギターの弾き方を教えます，方向就變成我教岸部。"],["同一件事，換一個角度","くれる從<mark class=\"study-key\">幫忙者</mark>出發；もらう從<mark class=\"study-key\">接受幫助者</mark>出發。兩句的實際動作者不變。","<ruby>友達<rt>ともだち</rt></ruby>が<ruby>手伝<rt>てつだ</rt></ruby>ってくれました。／<ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>手伝<rt>てつだ</rt></ruby>ってもらいました。","兩句都是朋友幫了我。手伝う→手伝って；不能因為後句有私は，就判斷成我幫朋友。"],["受惠者不一定用に","保留原動詞需要的助詞。「誰的鞋」用の，「修甚麼」用を，不能硬套<mark class=\"study-key\">受惠者</mark>に。","あのおじいさんは<ruby>妹<rt>いもうと</rt></ruby>の<ruby>靴<rt>くつ</rt></ruby>を<ruby>直<rt>なお</rt></ruby>してくれます。","那位老先生幫妹妹修鞋。直す→直して。妹是我方親近者，也能成為<mark class=\"study-key\">てくれる</mark>的受惠者。"]],"caution":"<mark class=\"study-key\">てあげる</mark>可能帶有施恩的語感；<mark class=\"study-key\">てくれる</mark>常表達受惠，但不等於必須感謝或更有禮貌。先分清動作者與受惠者，再依動詞選助詞。","quiz":[{"prompt":"「友達が私に日本語を教えてくれました」中，誰教誰？","options":["朋友教我","我教朋友","朋友教自己","沒有人教"],"answer":0,"explanation":"くれる從我方受惠的角度表達：朋友做動作，我得到幫助。","rubyView":{"prompt":"「<ruby>友達<rt>ともだち</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれました」中，誰教誰？","options":["朋友教我","我教朋友","朋友教自己","沒有人教"],"explanation":"くれる從我方受惠的角度表達：朋友做動作，我得到幫助。"}},{"prompt":"「私は岸部さんにギターの弾き方を教えてもらいます」中，誰教誰？","options":["我教岸部","岸部教我","我教自己","無法判斷"],"answer":1,"explanation":"てもらう以接受幫助的我為主題，岸部さんに指出實際教的人。若只有教えます，才是我教岸部。","rubyView":{"prompt":"「<ruby>私<rt>わたし</rt></ruby>は<ruby>岸部<rt>きしべ</rt></ruby>さんにギターの<ruby>弾<rt>はじ</rt></ruby>き方を<ruby>教<rt>おし</rt></ruby>えてもらいます」中，誰教誰？","options":["我教岸部","岸部教我","我教自己","無法判斷"],"explanation":"てもらう以接受幫助的我為主題，岸部さんに指出實際教的人。若只有教えます，才是我教岸部。"}},{"prompt":"「我教妹妹日文」並表達為她做事，應用？","options":["私は妹に日本語を教えてくれました。","妹は私に日本語を教えてもらいましたか。","私は妹に日本語を教えてあげました。","私は妹に日本語を教えるあげました。"],"answer":2,"explanation":"我替別人做事：てあげる。教える→教えて。"},{"prompt":"「手伝う」接くれました，哪個正確？","options":["手伝いくれました","手伝うてくれました","手伝んでくれました","手伝ってくれました"],"answer":3,"explanation":"手伝う是第一類，う→って，然後接くれました。"}],"uploadedOriginal":"<p>[ 單元26 ] 動詞て形＋授受動詞</p><p>學習目標</p><p>①　學習「動詞て形」＋「くれる」「あげる」「もらう」等授受動詞的用法。</p><p>.</p><p>我們在前面的單元中，介紹過日文的授受動詞，各位還記得嗎？</p><p>.</p><p>例：</p><p>私は先生から本をもらいます。（從老師那拿到一本書。）</p><p>先生は私に小説をくれます。（老師給我小說。）</p><p>先生は彼にプレゼントをあげます。（老師給他禮物。）</p><p>.</p><p>所謂的「授受動詞」，即是表示「給予、得到」的動詞。如上述例句，我們先前學到的，是關於「名詞＋授受動詞」的講法，例如給予書、小說、禮物等等具體的東西。但是，授受動詞的另一項重要用法，則是用來連接「動詞」。</p><p>啊？什麼意思？</p><p>.</p><p>例句①：先生は私に日本語を教えます。</p><p>（老師教我日文。）</p><p>.</p><p>將最後的動詞改為て形後，加上「くれる」</p><p>例句②：先生は私に日本語を教えてくれます。</p><p>（老師教我日文。）</p><p>.</p><p>咦？動詞「教」這件事不是「具體的東西」，而是「抽象的東西」，要怎麼給予呢？這二句有什麼地方不一樣呢？第一句的意思為「老師教我日文」；第二句直譯是「老師給我『教日文』這件事」，也是「老師教我日文」的意思。但是不一樣的地方在於，例句②使用了授受動詞「くれる」，「くれる」是「給予」的意思，給予什麼呢？在日本人的想法中，給予了「恩惠」。</p><p>.</p><p>例句①：先生は私に日本語を教えます。</p><p>（單純描述老師教我日文這件事。）</p><p>例句②：先生は私に日本語を教えてくれます。</p><p>（除了描述老師教我日文之外，</p><p>另外還有接受老師的恩惠，表達感謝之意。）</p><p>.</p><p>日本是非常重視禮節的國家，因此如何表示「恩惠」及「感謝」是很重要的。例句①和例句②雖然在意思上幾乎相同，但是在對方聽起來，卻是完全不同的感覺。例句②除了單純描述之外，還多了受到對方恩惠、向對方表達感謝之意，是較為禮貌的說法，因此在口語會話時經常使用。</p><p>.</p><p>簡單來說，當「名詞＋授受動詞」時，意思為給予、得到一項具體的東西，例如：「本をくれます」。當「動詞＋授受動詞」時，由於是「抽象的動作」，因此意思則為給予、得到「恩惠」。</p><p>關於詳細介紹，請繼續往下看。</p><p>.</p><p>.</p><p>動詞て形＋くれる</p><p>.</p><p>「くれる」為「對方給予我….」之意。</p><p>.</p><p>基本用法: 「主詞」は 「對象」に「動詞て形」＋くれる</p><p>.</p><p>可以試著比較下面二句的差別。</p><p>.</p><p>①　先生は私に日本語の文法を説明します。</p><p>②　先生は私に日本語の文法を説明してくれます。</p><p>.</p><p>當我們使用第一句時，只是單純在描述一個事件，不帶有任何感情。但是如果今天我們想向別人表達「老師教我日語文法耶！真是太感謝了！」時，就必須使用第二句的形式，因為第二句中多了「老師給我恩惠」的感覺，適合用來表達感謝之意。</p><p>.</p><p>例：</p><p>母は私に飴を買ってくれます。</p><p>（母親買糖果給我。）</p><p>高野さんは私に英語を教えてくれます。</p><p>（高野先生教我英文。）</p><p>電気屋の人は私に新しいテレビを運んでくれます。</p><p>（電氣行的人搬新的電視來給我。）</p><p>役所の人は私たちに道を案内してくれます。</p><p>（區公所的人告訴我們路怎麼走。）</p><p>.</p><p>あのおじいさんは妹に靴を直してくれます。</p><p>（那位老爺爺替妹妹修鞋子。）</p><p>旅行会社の人は家族に海外旅行のビザを</p><p>申し込んでくれます。</p><p>（旅行社的人替我的家人辦國外旅行的簽證。）</p><p>.</p><p>.</p><p>動詞て形＋あげる</p><p>.</p><p>「あげる」為「我給對方」或是「對方給予第三者」之意。</p><p>.</p><p>基本用法:</p><p>「主詞」は 「對象」に「動詞て形」＋あげる</p><p>.</p><p>例:</p><p>王さんは竹内さんに仕事の方法を教えます。</p><p>↓</p><p>王さんは竹内さんに仕事の方法を教えてあげます。</p><p>（王先生教導竹內先生工作的方法）</p><p>.</p><p>如果「くれる」為「接受恩惠」，那麼「あげる」就是「給予恩惠」的意思。同樣地，第一句話為單純描述某個事件，第二句話則帶有「王先生給予竹内先生恩惠」的感覺，聽起來會是「王先生明明很忙，卻撥出時間來教」、「王先生特地去教」的語氣。</p><p>.</p><p>例：</p><p>私はあなたに宿題の答えを教えてあげます。</p><p>（我告訴你作業的答案。）</p><p>母は弟にオモチャを買ってあげます。</p><p>（母親買玩具給弟弟。）</p><p>王さんは彼女にギターを弾いてあげます。</p><p>（王先生彈吉他給女朋友聽。）</p><p>.</p><p>先生はクラスメートにきれいな絵本を貸してあげます。</p><p>（老師借給班上同學漂亮的繪本。）</p><p>寮の管理員さんは郵便物をみんなのメールボックスに入れてあげます。</p><p>（宿舍管理員將郵件放到大家的信箱當中。）</p><p>.</p><p>.</p><p>動詞て形＋もらう</p><p>.</p><p>「もらう」為「得到…」之意。</p><p>.</p><p>基本用法:  「主詞」は 「對象」に「動詞て形」＋もらう</p><p>（讓某人幫自己做…、某人幫我…）</p><p>.</p><p>例:</p><p>私は岸部さんにギターの弾き方を教えます。</p><p>↓</p><p>私は岸部さんにギターの弾き方を教えてもらいます。</p><p>.</p><p>以上二句例句，雖然差別只有在句尾的「もらう」，但是整句的意思完全不一樣。第一句是「我教岸部先生吉他的演奏方法」，第二句則是「我從岸部先生得到了『教吉他』這件事」，也就是「岸部先生教我吉他」之意。請特別注意這種給予者和被給予者的關係。</p><p>.</p><p>例：</p><p>私は友達に本を買ってもらいます。</p><p>（朋友幫我買了書。）</p><p>私は弟に部屋を掃除してもらいます。</p><p>（弟弟幫我打掃房間。）</p><p>私は旅行会社の人にホテルを予約してもらいます。</p><p>（旅行社的人幫我預約旅館。）</p><p>彼は妻に昼ごはんの弁当を作ってもらいます。</p><p>（他的妻子為他做中午的便當。）</p><p>.</p><p>彼女は彼氏に食事代を払ってもらいます。</p><p>（她的男朋友幫她付吃飯錢。）</p><p>田村さんは林さんに中国語を教えてもらいます。</p><p>（林先生教田村先生中文。）</p><p>あの塾はパートにチラシを配ってもらいます。</p><p>（那間補習班請工讀生發傳單。）</p><p>也就是「工讀生幫補習班發傳單」之意</p>","noteRevision":"修訂版","revisionReason":"已依本次上傳的第26課修訂：釐清受惠方向、助詞與禮貌語感，並調整例句和時態翻譯。頁末保留本次上傳原文供對照。"},{"id":27,"title":"動詞て形＋いる","original":"<h3>學習目標</h3><p class=\"lesson-focus\">區分<mark class=\"study-key\">ている</mark>的三種常見用途：正在進行、結果狀態、<mark class=\"study-key\">反覆習慣</mark>。不要把每個ている都翻成「正在」。</p><h3>基本組成</h3><p>動詞て形＋いる（常體）／います（敬體）。<br><ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>んで→<ruby>読<rt>よ</rt></ruby>んでいる／<ruby>読<rt>よ</rt></ruby>んでいます。<br><ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>いで→<ruby>泳<rt>およ</rt></ruby>いでいる／<ruby>泳<rt>およ</rt></ruby>いでいます。</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">用途</th><th scope=\"col\">例句</th><th scope=\"col\">理解方式</th></tr></thead><tbody><tr><td>進行中的動作</td><td><ruby>今<rt>いま</rt></ruby>、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べています。</td><td>現在正在吃，動作尚在進行。</td></tr><tr><td>變化後的狀態</td><td><ruby>窓<rt>まど</rt></ruby>が<ruby>開<rt>ひら</rt></ruby>いています。</td><td>窗戶已打開，目前開著。</td></tr><tr><td>反覆的習慣</td><td><ruby>毎朝<rt>まいあさ</rt></ruby>、<ruby>散歩<rt>さんぽ</rt></ruby>しています。</td><td>每天早上反覆進行的習慣。</td></tr></tbody></table></div><h3>正在做某事</h3><p><ruby>妹<rt>いもうと</rt></ruby>は<ruby>雑誌<rt>ざっし</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいます。＝妹妹正在看雜誌。<br><ruby>友達<rt>ともだち</rt></ruby>は<ruby>泳<rt>およ</rt></ruby>いでいます。＝朋友正在游泳。<br><ruby>宿題<rt>しゅくだい</rt></ruby>をしています。＝<mark class=\"study-key\">正在做</mark>功課。<br>「今」等時間詞有助判斷語境。</p><h3>結果狀態：以前發生變化，現在仍是這樣</h3><p>結婚する是結婚這個變化；結婚し<mark class=\"study-key\">ている</mark>說明目前已婚。<br>壊れる是壞掉這件事；壊れ<mark class=\"study-key\">ている</mark>說明目前處於壞掉的狀態。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>結婚<rt>けっこん</rt></ruby>しています。＝我已婚。<br>この<ruby>時計<rt>とけい</rt></ruby>は<ruby>壊<rt>こわ</rt></ruby>れています。＝這隻鐘壞了，現在是壞的。<br><ruby>知<rt>し</rt></ruby>っています＝知道；不知道一般說知りません。</p><h3>反覆習慣要看語境</h3><p><ruby>毎日<rt>まいにち</rt></ruby>バスで<ruby>通学<rt>つうがく</rt></ruby>しています。＝每天乘巴士上學。<br>毎朝、<ruby>散歩<rt>さんぽ</rt></ruby>しています。＝每天早上散步。<br>但單獨說「<ruby>散歩<rt>さんぽ</rt></ruby>しています」也可能是現在正在散步，不必一定翻成習慣。</p><h3>與ました的差別，不是事情是否已恢復</h3><p>去年、<ruby>結婚<rt>けっこん</rt></ruby>しました。＝去年結婚了。只是報告結婚事件，不暗示已離婚。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>結婚<rt>けっこん</rt></ruby>しています。＝我現在已婚。焦點是目前狀態。<br><ruby>時計<rt>とけい</rt></ruby>が<ruby>壊<rt>こわ</rt></ruby>れました。＝鐘壞了。這句本身不說後來修好沒有。<br><ruby>時計<rt>とけい</rt></ruby>が<ruby>壊<rt>こわ</rt></ruby>れています。＝鐘目前壞著。強調當下狀態。<br>昨日、そのことを<ruby>知<rt>し</rt></ruby>りました。＝昨天得知那件事。這種說法自然，也不暗示已忘記。</p><h3>怎樣選最容易？</h3><p>想說現在<mark class=\"study-key\">正在做</mark>甚麼，或現在處於甚麼狀態：考慮ている。<br>想報告某件事何時發生：考慮た形／ました。<br>先想你要對方知道哪項資訊，再選句型。</p>","symbol":"いま","intro":"是正在做，還是已經變成那個狀態？","tag":"ている・進行・結果狀態","concepts":[["正在進行的動作","<mark class=\"study-key\">て形＋います</mark>，配合可以持續進行的動作，常表示現在<mark class=\"study-key\">正在做</mark>。","<ruby>今<rt>いま</rt></ruby>、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいます。","現在正在看書。読む→読んで→読んでいます。"],["結果留下的狀態","有些動詞表示一次變化，<mark class=\"study-key\">ている</mark>描述變化後目前<mark class=\"study-key\">留下的狀態</mark>。","<ruby>窓<rt>まど</rt></ruby>が<ruby>開<rt>ひら</rt></ruby>いています。","窗戶開著。不是「正在不停地開窗」。開く→開いて→開いています。"],["已婚與知道","<mark class=\"study-key\">結婚しています</mark>表示目前已婚；<mark class=\"study-key\">知っています</mark>表示目前知道。否定「不知道」常用知りません。","<ruby>私<rt>わたし</rt></ruby>は<ruby>結婚<rt>けっこん</rt></ruby>しています。そのことを<ruby>知<rt>し</rt></ruby>っています。","我已婚。我知道那件事。不能把所有<mark class=\"study-key\">ている</mark>都直譯成「正在」。"],["習慣，還是某次發生？","時間詞與語境可以指出<mark class=\"study-key\">反覆習慣</mark>；ました則描述過去事件。","<ruby>毎朝<rt>まいあさ</rt></ruby>、<ruby>散歩<rt>さんぽ</rt></ruby>しています。<ruby>昨日<rt>きのう</rt></ruby>も<ruby>散歩<rt>さんぽ</rt></ruby>しました。","我每天早上散步，昨天也散步了。單獨散歩しています也可能指現在正在散步。"]],"caution":"「結婚しました」不表示已離婚；「壊れました」也不表示已修好。過去式只報告事件，不保證現在的狀態。","quiz":[{"prompt":"「今、本を読んでいます」最自然的意思是？","options":["現在正在看書","明天一定看書","從未看過書","請你看書"],"answer":0,"explanation":"今與讀書這個持續動作配合，表示正在進行。","rubyView":{"prompt":"「<ruby>今<rt>いま</rt></ruby>、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいます」最自然的意思是？","options":["現在正在看書","明天一定看書","從未看過書","請你看書"],"explanation":"今與讀書這個持續動作配合，表示正在進行。"}},{"prompt":"「窓が開いています」通常表示？","options":["窗戶一直重複開關","窗戶目前開著","窗戶明天才打開","不可以開窗"],"answer":1,"explanation":"開く的ている可表示打開後留下的狀態。","rubyView":{"prompt":"「<ruby>窓<rt>まど</rt></ruby>が<ruby>開<rt>ひら</rt></ruby>いています」通常表示？","options":["窗戶一直重複開關","窗戶目前開著","窗戶明天才打開","不可以開窗"],"explanation":"開く的ている可表示打開後留下的狀態。"}},{"prompt":"「去年、結婚しました」可以確定甚麼？","options":["現在已離婚","現在一定未婚","去年結婚了","將來會結婚"],"answer":2,"explanation":"只交代去年發生結婚這件事，不能推論已離婚。","rubyView":{"prompt":"「<ruby>去年<rt>きょねん</rt></ruby>、<ruby>結婚<rt>けっこん</rt></ruby>しました」可以確定甚麼？","options":["現在已離婚","現在一定未婚","去年結婚了","將來會結婚"],"explanation":"只交代去年發生結婚這件事，不能推論已離婚。"}},{"prompt":"每天早上有散步習慣，哪句最清楚？","options":["毎朝、散歩してください。","毎朝、散歩してはいけません。","毎朝、散歩したことがありません。","毎朝、散歩しています。"],"answer":3,"explanation":"毎朝提供反覆習慣的語境。"}],"uploadedOriginal":"<h3>[ 單元27 ] 動詞て形＋いる</h3><h3>學習目標</h3><h3>①　學會現在進行式的「ている」用法</h3><h3>②　學會表示持續狀態的「ている」用法</h3><p>關於「動詞て形」的慣用句型，本次堂堂邁入第三回。這次我們介紹的句型只有一個:「動詞て形＋いる」。原因之一，是中文當中並沒有相對的概念，因此得花點時間來理解；不過最主要的原因是，雖然之前說過「動詞て形」很重要，不過這個「動詞て形+いる」用法，可以說是「動詞て形」相關句型中最重要的一項。因此，希望各位集中精神，將這一部分徹底理解。</p><p>「動詞て形+いる」主要有二種用法:</p><p>①  現在進行式，相當於英文「～ing」用法。</p><p>②  表示從過去到現在一直持續的狀態。</p><p>第一種現在進行式的用法，對於略懂英文的人來說，可能花三秒鐘就可以完全理解，不過第二種用法，在英文和中文中，似乎都沒有完全對應的文法概念，因此得稍微思考一下才能順利明白。</p><p>我們會使用和前面單元「授受動詞」相同的圖解方法，來說明日文中的「ている」用法，相信在短時間內就能大致理解。不過還是老話一句，即使理解了，還是需要時間去慢慢習慣、熟悉。</p><p>ている（現在進行式）</p><p>「ている」的第一種用法，就是現在進行式。</p><p>所謂的現在進行式，指的是「現在正在做什麼事」，相當於英文的「～ing」</p><p>基本用法: 「動詞て形」＋いる／います</p><p>（正在…）</p><p>圖解說明:（見PDF講義）</p><p>在「現在」這個時間點發生的動作，就是現在進行式。</p><p>例：</p><p>私はご飯を食べます　→　私はご飯を食べています</p><p>（我正在吃飯。）</p><p>私は宿題をします　→　私は宿題をしています</p><p>（我正在寫作業。）</p><p>彼は泳ぎます　　　　 →  彼は泳いでいます</p><p>（他正在游泳。）</p><p>母は怒ります　　　　→   母は怒っています</p><p>（媽媽正在生氣。）</p><p>課長は電話します　 →　 課長は電話しています</p><p>（課長正在打電話。）</p><p>妹は雑誌を読みます　→妹は雑誌を読んでいます</p><p>（妹妹正在看雜誌。）</p><p>ている（狀態的持續）</p><p>從過去一直持續到現在，沒有改變的狀態、習慣。</p><p>例：</p><p>毎朝、散歩しています。</p><p>我（從過去到現在） 每天早上都習慣散步。 持續的狀態</p><p>毎日バスで通学しています。</p><p>我（從以前到現在） 每天都坐公車上學。持續的狀態</p><p>私は結婚しています。</p><p>我（從以前到現在） 都一直是結婚的狀態；我結婚了。</p><p>そのことを知っています。</p><p>我（從以前到現在） 都知道那件事。</p><p>あの花瓶は壊れています。</p><p>那個花瓶（從以前到現在）一直都是破掉的狀態。</p><p>ている(現在進行・持續)和ました(過去式)區別</p><p>圖解說明 動詞過去式「ました」（見PDF講義）</p><p>描述某個動作在過去某個時間點發生、然後結束。</p><p>例：</p><p>①　散歩しています。</p><p>翻成中文是：我有散步（的習慣）</p><p>解說：我從以前到現在，都一直有散步的習慣。</p><p>散歩しました。</p><p>翻成中文是：我之前有去散步</p><p>解說：我之前某個時間點有去散步，但是後來怎麼樣不知道（很有可能已經沒有去散步了）。</p><p>②　結婚しています。</p><p>翻成中文是：我結婚了</p><p>解說：我從以前到現在，都一直是結婚這個狀態。</p><p>結婚しました。</p><p>翻成中文是：我之前結婚了</p><p>解說：我之前某個時間點結婚了，但是後來怎麼樣不知道（很有可能離婚了）。一般講這句話時，日本人很可能會誤會你是結婚後又離婚了。</p><p>③　そのことは知りました。</p><p>翻成中文是：我之前知道那件事</p><p>解說：當下知道了那件事，但是後來怎麼樣不知道（很有可能已經忘記了）。為不自然的日文，中文也不太自然。</p><p>そのことは知っています。</p><p>翻成中文是：我知道那件事</p><p>解說：我從以前到現在，都一直是知道這件事的狀態。</p><p>④　（花瓶が）壊れています。</p><p>翻成中文是：花瓶破掉了</p><p>解說：從之前到現在，這個花瓶一直都是破掉的狀態，還沒被修好。</p><p>（花瓶が）壊れました。</p><p>翻成中文是：花瓶之前破掉了</p><p>解說：當下花瓶破掉了，但是後來怎麼樣不知道</p><p>（很有可能已經被修好了）</p><p>總結：</p><p>過去式「た」：注重描述當下瞬間發生的動作、事情</p><p>「ている」：注重描述一直持續的動作、事情</p><p>情境：</p><p>（花瓶剛掉下去破掉）</p><p>あ！　割れました！（啊！破掉了！）</p><p>（花瓶掉下去破掉之後三天，朋友問起）</p><p>A: あの花瓶、どうなっていますか？</p><p>B: あの花瓶は…割れています…</p><p>（A：那個花瓶怎麼了呢？B：那個花瓶…破掉了…）</p><p>相信即使讀完了文法說明，還是會對於「ている」這個用法有感到模模糊糊的地方吧！這是非常正常的，畢竟中文當中，並沒有相對應的用法，因此較難理解。當各位看完本單元後，可以先將這個文法放一邊，等到以後的文章或是教材中出現「ている」用法時，再去慢慢抓到感覺、慢慢熟悉即可。</p>","noteRevision":"修訂版","revisionReason":"按初學者需要重整動詞說明、例句及易錯概念；上傳原文保留供對照。"},{"id":28,"title":"動詞ない形和其用法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">把動詞變為普通形否定，表達不做、過去沒做、請不要做。</p><h3>先確認類別</h3><p><mark class=\"study-key\">ない形</mark>不能直接用「辭書形＋ない」。第一類要換字尾，第二類要去る，第三類另外記。這裡的ない表達否定，不是助詞。</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">類別</th><th scope=\"col\">變化</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>第一類</td><td>う<ruby>段<rt>だん</rt></ruby>→あ<ruby>段<rt>だん</rt></ruby>＋ない</td><td><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>かない；<ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>まない；<ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>たない</td></tr><tr><td>第一類的う</td><td><mark class=\"study-key\">う→わ</mark>＋ない</td><td><ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>わない；<ruby>会<rt>あ</rt></ruby>う→<ruby>会<rt>あ</rt></ruby>わない</td></tr><tr><td>第二類</td><td><ruby>去<rt>さ</rt></ruby>る＋ない</td><td><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べない；<ruby>見<rt>み</rt></ruby>る→見ない</td></tr><tr><td>第三類</td><td>特別記憶</td><td>する→しない；来る（くる）→<ruby>来<rt>こ</rt></ruby>ない（こない）</td></tr><tr><td><mark class=\"study-key\">ある</mark>的否定</td><td>ない</td><td>お<ruby>金<rt>かね</rt></ruby>がない。沒有錢。</td></tr></tbody></table></div><h3>第一類完整尾音對照</h3><p><mark class=\"study-key\">う→わ</mark>；く→か；ぐ→が；す→さ；つ→た；ぬ→な；ぶ→ば；む→ま；る→ら。<ruby>然<rt>しか</rt></ruby>後<ruby>接<rt>せっ</rt></ruby>ない。<br><ruby>話<rt>はな</rt></ruby>す→<ruby>話<rt>はな</rt></ruby>さない；<ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>がない；<ruby>遊<rt>あそ</rt></ruby>ぶ→<ruby>遊<rt>あそ</rt></ruby>ばない；<ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>らない。<br>同樣是る結尾：<ruby>帰<rt>かえ</rt></ruby>る→帰らない，但第二類食べる→<ruby>食<rt>た</rt></ruby>べない。</p><h3>從不做，到當時沒有做</h3><p>先得到<mark class=\"study-key\">ない形</mark>，再把ない換成なかった。<br><ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>まない→<ruby>読<rt>よ</rt></ruby>まなかった。<br><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べない→<ruby>食<rt>た</rt></ruby>べなかった。<br><mark class=\"study-key\">する→しない</mark>→しなかった。<br><ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>こ</rt></ruby>ない→来なかった（こなかった）。<br>昨日、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>まなかった。＝昨天沒有看書。<br>今日、<ruby>肉<rt>にく</rt></ruby>を<ruby>食<rt>た</rt></ruby>べない。＝今天不吃肉。</p><h3>請不要做：ないでください</h3><p>保留完整<mark class=\"study-key\">ない形</mark>，再加でください。<br><ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>たない→<ruby>待<rt>ま</rt></ruby>たないでください。請不要等。<br><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>かない→<ruby>書<rt>か</rt></ruby>かないでください。請不要寫。<br><ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>らないでください。＝請不要拍照。<br>不是なくてください；本課請求用ないでください。</p><h3>敬體與常體對照</h3><p><ruby>書<rt>か</rt></ruby>きません ↔ <ruby>書<rt>か</rt></ruby>かない。兩者都是非過去否定。<br><ruby>書<rt>か</rt></ruby>きませんでした ↔ <ruby>書<rt>か</rt></ruby>かなかった。兩者都是過去否定。<br>常體常見於親近者之間，也出現在許多句型內；並不是對所有朋友都必須用常體。</p>","symbol":"しない","intro":"先學「不做」，再學「沒有做」和「請別做」。","tag":"ない形・過去否定・請求","concepts":[["第一類：う段換あ段＋ない","依假名同一行變換：く→か、ぐ→が、す→さ、つ→た、ぬ→な、ぶ→ば、む→ま、る→ら。","<ruby>書<rt>か</rt></ruby>く → <ruby>書<rt>か</rt></ruby>かない ／ <ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>まない","不寫／不讀。不是書くない，也不是読みない。"],["字尾う，要變わ","字尾單獨是う時，要換成<mark class=\"study-key\">わ再加ない</mark>，不是換成あ。","<ruby>買<rt>か</rt></ruby>う → <ruby>買<rt>か</rt></ruby>わない ／ <ruby>会<rt>あ</rt></ruby>う → <ruby>会<rt>あ</rt></ruby>わない","不買／不見面。パンを買わない＝不買麵包。"],["第二類與不規則","第二類<mark class=\"study-key\">去る加ない</mark>。<mark class=\"study-key\">する→しない</mark>；来る→来ない，讀くる→こない。ある的否定直接是ない。","<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べない ／ <ruby>来<rt>く</rt></ruby>る → <ruby>来<rt>こ</rt></ruby>ない","不吃／不來。お金がない＝沒有錢，不是あらない。"],["過去沒有做：ない→なかった","先做好<mark class=\"study-key\">ない形</mark>，再把最後ない換成なかった。","<ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>まない → <ruby>読<rt>よ</rt></ruby>まなかった","昨天沒有看書：昨日、本を読まなかった。不是読まないだった。"],["請不要做：ない形＋でください","保留整個ない，再加でください，不能改成なくてください。","<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>らないでください。","請不要拍照。撮る→撮らない→撮らないでください。"]],"caution":"<mark class=\"study-key\">ない形</mark>不是「辭書形原封不動＋ない」；必須先按類別變化。敬體與常體也不是動詞只有兩種形態，這裡是在比較說話方式與句尾形式。","quiz":[{"prompt":"買う的ない形是？","options":["買わない","買あない","買いない","買うない"],"answer":0,"explanation":"第一類字尾う要換わ，再加ない。"},{"prompt":"来ない讀作？","options":["きない","こない","くない","くらない"],"answer":1,"explanation":"来る→来ない，讀音くる→こない。"},{"prompt":"「昨天沒有看書」用常體怎樣說？","options":["昨日、本を読まない。","昨日、本を読まないだった。","昨日、本を読まなかった。","昨日、本を読みなかった。"],"answer":2,"explanation":"読む→読まない→読まなかった，表達過去否定。"},{"prompt":"「請不要吃」是哪句？","options":["食べなくてください。","食べないください。","食べるないでください。","食べないでください。"],"answer":3,"explanation":"食べる去る加ない，再接でください。"}],"uploadedOriginal":"<h3>[ 單元28 ] 動詞ない形和其用法</h3><h3>學習目標</h3><h3>①　學習「動詞ない形」的變化方法</h3><h3>②　了解動詞常體的過去否定用法</h3><h3>③　學習句型「～ないでください」</h3><p>我們在先前關於「動詞」的章節中介紹過，日文的動詞有二種形態：「動詞敬体」和「動詞常体」，就像變形金鋼有車輛和機器人二種形態一樣。「動詞敬体」較為尊敬，因此在對老師、上司或其他地位較高的人說話時，必須使用「動詞ます形（敬体）」；「動詞常体」則是較普通的說法，當我們和朋友、家人、同輩、或是輩份較低者（如學弟妹等）說話時，則使用「動詞普通形（常体）」。就像變形金鋼在平時前是車輛，但是遇到敵人時則會變成機器人一樣。</p><p>在開始學習日文的初級階段，由於語言能力尚未純熟，因此習慣一開始以「動詞敬体（動詞ます形）」為切入點進行學習；使用「動詞ます形」來說話的話，無論說話對象是誰，都不會有不禮貌的情形發生。不過，我們已經將「動詞ます形」的時式用法學得差不多了，各位應該也很習慣「動詞ます形」的存在了吧！話雖如此，我們還是必須學習「活的語言」，也許以「動詞ます形」對長輩說話很恰當，但是當你和朋友、家人等關係較親密的人聊天時，使用「動詞ます形」就會有種說不出來的奇怪感覺。因此，我們除了「ます形」之外，也必須學習「普通形（常体）」的說法。</p><p>我們將學習過的動詞時式，整理如下:</p><div class=\"table-scroll\"><table><tr><th> </th><th>動詞敬体<br>（機器人）</th><th>動詞常体<br>（車輛）</th></tr><tr><td>現在</td><td>かきます</td><td>かく</td></tr><tr><td>現在否定</td><td>かきません</td><td>本回重點</td></tr><tr><td>過去</td><td>かきました</td><td>單元30重點</td></tr><tr><td>過去否定</td><td>かきませんでした</td><td>本回重點</td></tr></table></div><p>我們很早以前學過「動詞原形」，「動詞常体」的現在肯定用法和「動詞原形」相同，不需要重新學習。</p><p>本單元的重點，在於學會「動詞常体」的「否定用法」。</p><p>我們學過「～ません」和「ませんでした」，這次的任務，只是將「～ません」和「ませんでした」改成「常体」，使各位除了面對長輩之外，和家人朋友也能自在地聊天。</p><h3>動詞ない形</h3><p>「動詞否定形」又稱為「動詞ない形」，「ない」為動詞原形在表示否定時會用到的助詞。</p><p>動詞現在否定：</p><h3>「動詞原形」+ 「ない」＝「動詞ない形」</h3><p>動詞分三種，「動詞ない形」的變化方式也分為三種，基本變化方式和「動詞ます形」大同小異。</p><h3>第一類動詞</h3><p>變化方法:</p><p>將動詞字尾發音的u 改成 a 之後，加上「ない」。</p><p>但如果動詞結尾是「う」的話，就必須改成「わ」再加上「ない」。</p><p>例：</p><p>行く  iku 　→　行か    ika 　→　行かない  （不去）</p><p>読む  yomu　→　読ま  yoma　→　読まない  （不讀）</p><p>買う  kau　→　買わ  kawa　→　買わない   （不買）</p><p>待つ  matsu　→　待た  mata　→　待たない（不等）</p><p>帰る  kaeru　→　帰ら  kaera　→帰らない（不回家）</p><p>売る  uru　→　売ら  ura　→　売らない  （不賣）</p><h3>第二類動詞</h3><p>變化方法:</p><p>將動詞字尾的假名「る」去掉，加上「ない」。</p><p>例：</p><p>食べる　→　食べない  （不吃）</p><p>見る　→　見ない  （不看）</p><p>開ける　→　開けない  （不開）</p><p>寝る　→　寝ない  （不睡）</p><p>始める　→　始めない  （不開始）</p><p>忘れる　→　忘れない  （不忘記）</p><h3>不規則動詞</h3><p>する　→　しない　　（不做）</p><p>来る　→　来ない    （不來） 注意發音</p><h3>動詞過去否定</h3><p>學會「動詞ない形」後，「動詞過去否定」的變化方式就顯得相當容易了。</p><p>變化方法: 「動詞ない形」－「い」＋「かった」</p><h3>第一類動詞</h3><p>行く　→　行かない　→　行かなかった　（之前沒有去）</p><p>読む　→　読まない　→　読まなかった  （之前沒有讀）</p><p>買う　→　買わない　→　買わなかった  （之前沒有買）</p><p>待つ　→　待たない　→　待たなかった　（之前沒有等）</p><p>帰る　→　帰らない　→帰らなかった（之前沒有回家）</p><p>売る　→　売らない　→　 売らなかった（之前沒有賣）</p><h3>第二類動詞</h3><p>食べる　→　食べない →  食べなかった（之前沒有吃）</p><p>見る　  →  見ない　   →　見なかった（之前沒有看）</p><p>開ける　→　開けない　→ 開けなかった（之前沒有開）</p><p>寝る　  →  寝ない　   →　寝なかった（之前沒有睡）</p><p>始める　→　始めない　→　始めなかった（之前沒有開始）</p><p>忘れる　→　忘れない　 →　忘れなかった （之前沒有忘記）</p><h3>不規則動詞</h3><p>する　→　しない　→　しなかった　　（之前沒有做）</p><p>来る　→　来ない　→　来なかった　　（之前沒有來）</p><h3>～ないでください</h3><p>再來介紹以「動詞ない形」為基礎的常用句型：</p><h3>「～ないでください」</h3><p>我們先前學過「動詞て形＋ください」，是「請…」之意，同樣地，我們也可以使用「動詞ない形＋で＋ください」這樣的句型，中文就是「請不要…」的意思。</p><p>基本句型: 「動詞ない形」＋「で」＋「ください」</p><p>（請不要…）</p><p>例：</p><p>待つ　  →　待たない　→　待たないでください</p><p>（請不要等）</p><p>書く　  →　書かない　→　書かないでください</p><p>（請不要寫）</p><p>見る　  →　見ない　  →　見ないでください</p><p>（請不要看）</p><p>食べる　→　食べない　→　食べないでください</p><p>（請不要吃）</p><p>する　  →　しない　  →　しないでください</p><p>（請不要做）</p><p>来る　  →　来ない　  →　来ないでください</p><p>（請不要來）</p>","noteRevision":"修訂版","revisionReason":"按初學者需要重整動詞說明、例句及易錯概念；上傳原文保留供對照。","labMode":"nai"},{"id":29,"title":"義務和許可的說法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分清必須做、不做也可以，以及做也沒關係。先從已學的ない形或て形出發。</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">想表達</th><th scope=\"col\">做法</th><th scope=\"col\">行く的例子</th></tr></thead><tbody><tr><td>必須做</td><td>ない→<mark class=\"study-key\">なければなりません</mark></td><td><ruby>行<rt>い</rt></ruby>かなければなりません。必須去。</td></tr><tr><td>不做也可以</td><td>ない→<mark class=\"study-key\">なくてもいいです</mark></td><td><ruby>行<rt>い</rt></ruby>かなくてもいいです。不去也可以。</td></tr><tr><td>做也沒關係</td><td>て形＋もかまいません</td><td><ruby>行<rt>い</rt></ruby>ってもかまいません。去也沒關係。</td></tr><tr><td>不做也沒關係</td><td>ない→<mark class=\"study-key\">なくてもかまいません</mark></td><td><ruby>行<rt>い</rt></ruby>かなくてもかまいません。不去也沒關係。</td></tr><tr><td>不准做（複習）</td><td>て形＋はいけません</td><td><ruby>行<rt>い</rt></ruby>ってはいけません。不可以去。</td></tr></tbody></table></div><h3>義務：不做就不行</h3><p><ruby>行<rt>い</rt></ruby>く→<ruby>行<rt>い</rt></ruby>かない→<ruby>行<rt>い</rt></ruby>かなければなりません。<br><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べない→<ruby>食<rt>た</rt></ruby>べなければなりません。<br>する→しない→しなければなりません。<br><ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>こ</rt></ruby>ない→来なければなりません（こなければ）。<br><ruby>明日<rt>あした</rt></ruby>は<ruby>試験<rt>しけん</rt></ruby>ですから、<ruby>勉強<rt>べんきょう</rt></ruby>しなければなりません。＝明天有考試，所以必須讀書。</p><h3>不必做，不代表禁止做</h3><p><ruby>宿題<rt>しゅくだい</rt></ruby>をしなくてもいいです。＝不做功課也可以。想做也可以，不是命令你不能做。<br><ruby>宿題<rt>しゅくだい</rt></ruby>をしてはいけません。＝不可以做功課。這才是<mark class=\"study-key\">禁止</mark>。<br>題目出現「不用／不必」時，先想到なくてもいい。</p><h3>かまいません：沒有關係</h3><p>ここに<ruby>座<rt>すわ</rt></ruby>ってもかまいません。＝坐這裡也沒關係。<br><ruby>今日<rt>きょう</rt></ruby>は来なくてもかまいません。＝今天不來也沒關係。<br>かまいません有「我不介意」的語感，並非所有情境下都比いいです更有禮貌。</p><h3>問與答，直接把意思說出來</h3><p>A：明日、来なければなりませんか。＝明天必須來嗎？<br>B：はい、来なければなりません。＝是，必須來。<br>或：いいえ、来なくてもいいです。＝不，不來也可以。<br>A：ここに<ruby>座<rt>すわ</rt></ruby>ってもいいですか。＝可以坐這裡嗎？<br>B：はい、どうぞ。＝可以，請。</p>","symbol":"約束","intro":"必須做、不必做、不准做，意思差很遠。","tag":"義務・不必・許可","concepts":[["必須：ない→なければなりません","先寫ない形，再把ない整段換成<mark class=\"study-key\">なければなりません</mark>。可理解為「不做就不行」。","<ruby>行<rt>い</rt></ruby>く → <ruby>行<rt>い</rt></ruby>かない → <ruby>行<rt>い</rt></ruby>かなければなりません。","必須去。明日、学校に行か<mark class=\"study-key\">なければなりません</mark>＝明天必須去學校。"],["不必：ない→なくてもいいです","意思是不做也可以，並不是<mark class=\"study-key\">禁止</mark>去做。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>宿題<rt>しゅくだい</rt></ruby>をしなくてもいいです。","今天不做功課也可以。する→しない→し<mark class=\"study-key\">なくてもいいです</mark>。"],["做也沒關係：てもかまいません","て形＋もかまいません表示可以做；ない換成<mark class=\"study-key\">なくてもかまいません</mark>表示不做也沒關係。","ここに<ruby>座<rt>すわ</rt></ruby>ってもかまいません。","坐在這裡也沒關係。座る→座って。"],["三句放在一起比較","<mark class=\"study-key\">義務</mark>、<mark class=\"study-key\">不必</mark>、禁止，先想中文意思，再選句尾。","<ruby>行<rt>い</rt></ruby>かなければなりません／<ruby>行<rt>い</rt></ruby>かなくてもいいです／<ruby>行<rt>い</rt></ruby>ってはいけません","必須去／不去也可以／不可以去。三者不能互換。"]],"caution":"かまいません也有「我不介意」的語感，並非在任何場合都比いいです更禮貌。回答<mark class=\"study-key\">義務</mark>問句時，直接重述肯定或否定內容最清楚。","quiz":[{"prompt":"「必須去」應該說？","options":["行かなければなりません。","行かなくてもいいです。","行ってはいけません。","行ってもいいです。"],"answer":0,"explanation":"行かない的ない換成なければなりません，表示義務。"},{"prompt":"「しなくてもいいです」表示？","options":["必須做","不做也可以","禁止做","已經做完"],"answer":1,"explanation":"不用做也可以，並非不准做。"},{"prompt":"「座ってもかまいません」表示？","options":["一定要坐","不准坐","坐下也沒關係","從未坐過"],"answer":2,"explanation":"て形＋もかまいません表示允許或不介意。","rubyView":{"prompt":"「<ruby>座<rt>すわ</rt></ruby>ってもかまいません」表示？","options":["一定要坐","不准坐","坐下也沒關係","從未坐過"],"explanation":"て形＋もかまいません表示允許或不介意。"}},{"prompt":"「不可以去」與「不必去」，哪組配對正確？","options":["兩者都是行かないです","兩者都是行かなければなりません","行かなくてもいい／行ってはいけない","行ってはいけません／行かなくてもいいです"],"answer":3,"explanation":"前者是禁止；後者是不做也可以。"}],"uploadedOriginal":"<h3>[ 單元29 ] 義務和許可的說法</h3><h3>學習目標</h3><p>①　學習表示義務的句型「～なければなりません」</p><h3>②　學習表示許可的句型「～なくてもいいです」</h3><p>③　學習表示許可的句型「～てもかまいません」「～なくてもかまいません」</p><p>我們在前一單元學到了「動詞ない形」、也就是「動詞否定形」的用法，在學習下一項動詞變化前，我們打鐵趁熱，趁著各位對於「動詞ない形」記憶猶新的時候，先介紹幾項和「動詞ない形」相關的句型用法。</p><p>首先是表示責任、義務的「～なければなりません」，相當於中文的「必須…、不得不…」，例如「不得不去上學」、「不得不寫作業」、「不得不12點前睡覺」等等。</p><p>其次為表示許可、允許的句型。我們先前學過「～てもいいです」，意思為「可以做什麼什麼事」，例如「見てもいいです（你可以看）」、「使ってもいいです（你可以使用）」。這次加上「動詞ない形」，變成「～なくてもいいです」的形式，多了否定語氣，意思是「不做什麼什麼事也可以」。</p><p>第二項表示許可的句型，是「～てもかまいません」，句型架構和「～てもいいです」大致相同。「かまいません（かまわない）」的原義為「沒有關係」，因此整句意思為「即使做什麼什麼事也沒關係」。還可以加上「動詞ない形」，增加否定的意思，變成「～なくてもかまいません」，中文為「即使不做什麼什麼事也沒關係」。</p><p>簡單說明如上，我們會在後面的篇幅中詳細介紹用法，以及附上例句，讓這些句型更容易理解。這些句型皆屬於「會話句型」，也就是說，我們所學到的，都是在日常生活中能夠立刻使用的文法句型，非常實用，而且學起來也比較不會枯燥乏味。</p><h3>～なければなりません</h3><p>別被這麼一長串假名嚇到，其實它表達的意思很單純，為「必須…、不得不…」的意思，例如「必須上學」、「必須寫作業」等等。</p><p>基本用法:</p><h3>「動詞ない形」－「い」＋「ければなりません」</h3><p>例：</p><h3>学校に行く　学校に行かない</h3><p>→　学校に行かなければなりません</p><p>（不去學校不行。）</p><h3>仕事をする　仕事をしない</h3><p>→　仕事をしなければなりません  （不工作不行。）</p><h3>先生に電話する　先生に電話しない</h3><p>→　先生に電話しなければなりません</p><p>（不打電話給老師不行。）</p><h3>家に帰る　家に帰らない</h3><p>→　家に帰らなければなりません  （不回家不行。）</p><h3>単語を覚える　単語を覚えない</h3><p>→　単語を覚えなければなりません  （不記單字不行。）</p><h3>12時に寝る　12時に寝ない</h3><p>→　12時に寝なければなりません</p><p>（不十二點時睡覺不行。）</p><p>也可以和我們之前學過的「から」一起使用。</p><p>例:</p><h3>仕事をする</h3><p>→　会社に入ったから、仕事をしなければなりません。</p><p>（因為已經進了公司，因此不工作不行。）</p><h3>先生に電話する</h3><p>→　明日用事があるから、</p><p>先生に電話しなければなりません。</p><p>（因為明天有事，因此不打電話給老師不行。）</p><h3>家に帰る</h3><p>→　もう11時だから、家に帰らなければなりません。</p><p>（因為已經十一點了，因此不回家不行。）</p><h3>単語を覚える</h3><p>→　英語のテストがあるから、</p><p>単語を覚えなければなりません。</p><p>（因為有英文考試，因此不記單字不行。）<br>.</p><h3>12時に寝る</h3><p>→　明日は卒業旅行だから、</p><p>12時に寝なければなりません。</p><p>（因為明天是畢業旅行，因此十二點不睡覺不行。）</p><h3>～なくてもいいです</h3><p>「～なくてもいいです」為先前學過的「～てもいいです」句型的變化版本，加上表示否定的「動詞ない形」。</p><p>基本句型:</p><h3>「動詞ない形」－「い」＋「くてもいいです」</h3><p>（不…也可以）</p><p>例：</p><p>読む　  →　読まない　 →　読まなくてもいい</p><p>（不讀也可以。）</p><p>言う　  →　言わない　 →　言わなくてもいい</p><p>（不說也可以。）</p><p>食べる　→　食べない　 →　食べなくてもいい</p><p>（不吃也可以。）</p><p>覚える　→　覚えない　→　覚えなくてもいい</p><p>（不記也可以。）</p><p>する　  →　しない　   →　しなくてもいい</p><p>（不做也可以。）</p><p>来る　  →　来ない　   →　来なくてもいい</p><p>（不來也可以。）</p><h3>～てもかまいません</h3><p>「～てもかまいません」和「～てもいいです」句型的差別，只有在後面的部分。「いいです」是「可以」的意思；「かまいません」→「かまわない」，是「沒關係」之意，因此整句意為「即使…也沒關係」。</p><p>意思和「～てもいいです（…也可以）」很類似，但是感覺起來較為委婉有禮貌。</p><p>基本用法: 「動詞て形」＋「も」＋「かまいません」</p><p>（即使…也沒關係）</p><p>例：</p><p>読む　　→　読んで　→　読んでもかまいません</p><p>（讀了也沒關係。）</p><p>言う　　→　言って　→　言ってもかまいません</p><p>（說了也沒關係。）</p><p>食べる　→　食べて　→　食べてもかまいません</p><p>（吃了也沒關係。）</p><p>覚える　→　覚えて　→　覚えてもかまいません</p><p>（記住也沒關係。）</p><p>する　　→　　して　 →　してもかまいません</p><p>（做了也沒關係。）</p><p>来る　　→　　来て　 →　来てもかまいません</p><p>（來也沒關係。）</p><h3>～なくてもかまいません</h3><h3>「～てもかまいません」＋「動詞ない形」</h3><h3>＝「～なくてもかまいません」多了否定語氣</h3><p>「～てもかまいません」：即使…也沒關係</p><p>「～なくてもかまいません」：即使不…也沒關係</p><p>基本用法:</p><p>「動詞ない形」－「い」＋「くても かまいません」</p><p>例：</p><p>読む　　→　読まない</p><p>→　読まなくてもかまいません　（不讀也沒關係。）</p><p>行く　　→　行かない</p><p>→　行かなくてもかまいません  （不去也沒關係。）</p><p>食べる　→　食べない</p><p>→　食べなくてもかまいません  （不吃也沒關係。）</p><p>覚える　→　覚えない</p><p>→　覚えなくてもかまいません  （不記住也沒關係。）</p><p>する　　→　　しない</p><p>→　しなくてもかまいません    （不做也沒關係。）</p><p>来る　　→　　来ない</p><p>→　　来なくてもかまいません  （不來也沒關係。）</p><h3>問句說法</h3><p>本單元介紹的句型，只要在句尾加上表示疑問的「か」，就能夠直接當成疑問句使用，如下:</p><p>①　～なければなりませんか。</p><p>②　～てもいいですか。～なくてもいいですか。</p><p>③　～てもかまいませんか。～なくてもかまいませんか。</p><p>至於肯定和否定的回答方式，請參考以下例句。肯定句的回答方式很單純，只要重覆疑問句即可，不過否定句的回答方式，就得轉一圈，使用其他句型了。</p><p>例：</p><p>宿題をしなければなりませんか。</p><p>はい、宿題をしなければなりません。</p><p>いいえ、宿題をしなくてもいいです。</p><p>不寫作業不行嗎？</p><p>是的，不寫作業不行。</p><p>不，不寫作業也可以。</p><p>ピーマンを食(た)べなければなりませんか。</p><p>はい、ピーマンを食べなければなりません。</p><p>いいえ、ピーマンを食べなくてもいいです。</p><p>不吃青椒不行嗎？</p><p>是的，不吃青椒不行。</p><p>不，不吃青椒也可以。</p><p>テレビを見てもいいですか。</p><p>はい、テレビを見てもいいですよ。</p><p>いいえ、テレビを見てはいけません。</p><p>可以看電視嗎？</p><p>是的，可以看電視喔。</p><p>不，不行看電視。</p><p>宿題をしなくてもいいですか。</p><p>はい、しなくてもいいです。</p><p>いいえ、宿題をしなければなりません。</p><p>不寫作業也可以嗎？</p><p>是的，不寫作業也可以。</p><p>不，不寫作業不行。</p><p>テレビを見てもかまいませんか。</p><p>はい、テレビを見てもかまいません。</p><p>いいえ、テレビを見てはいけません。</p><p>看電視也沒關係嗎？</p><p>是的，看電視也沒關係。</p><p>不，不行看電視。</p><p>宿題をしなくてもかまいませんか。</p><p>はい、しなくてもかまいません。</p><p>いいえ、宿題をしなければなりません。</p><p>不寫作業也沒關係嗎？</p><p>是的，不寫作業也沒關係。</p><p>不，不寫作業不行。</p>","noteRevision":"修訂版","revisionReason":"按初學者需要重整動詞說明、例句及易錯概念；上傳原文保留供對照。"},{"id":30,"title":"動詞た形とその用法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">從て形學<mark class=\"study-key\">た形</mark>；區分過去事件與有過的經驗。</p><h3>最省力的方法：借用て形</h3><p>て→た；で→だ。先做好て形，再換最後一個假名。<br><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>いて→<ruby>書<rt>か</rt></ruby>いた。<br><ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>んで→<ruby>読<rt>よ</rt></ruby>んだ。<br>不要漏掉で→だ這一組。</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">辭書形字尾／類別</th><th scope=\"col\">た形</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>第一類：う・つ・る</td><td>った</td><td><ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>った；<ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>った；<ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>った</td></tr><tr><td>第一類：む・ぶ・ぬ</td><td>んだ</td><td><ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>んだ；<ruby>遊<rt>あそ</rt></ruby>ぶ→<ruby>遊<rt>あそ</rt></ruby>んだ；<ruby>死<rt>し</rt></ruby>ぬ→<ruby>死<rt>し</rt></ruby>んだ</td></tr><tr><td>第一類：く／ぐ／す</td><td>いた／いだ／した</td><td><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>いた；<ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>いだ；<ruby>話<rt>はな</rt></ruby>す→<ruby>話<rt>はな</rt></ruby>した</td></tr><tr><td>第二類</td><td><ruby>去<rt>さ</rt></ruby>る＋た</td><td><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べた；<ruby>見<rt>み</rt></ruby>る→<ruby>見<rt>み</rt></ruby>た</td></tr><tr><td>第三類</td><td>した／<ruby>来<rt>き</rt></ruby>た</td><td>する→した；<ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>き</rt></ruby>た（きた）</td></tr><tr><td><ruby>行<rt>い</rt></ruby>く</td><td><ruby>行<rt>い</rt></ruby>った</td><td>先想行って，再換為行った</td></tr></tbody></table></div><h3>過去事件：た形與ました</h3><p>昨日、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>た。＝昨天看了電影（常體）。<br>昨日、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。＝昨天看了電影（敬體）。<br>十年前、<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。＝十年前去了日本。<br>一般過去式不限制事情是幾分鐘前或幾年前，重要的是你在報告那件事。</p><h3>過去經驗：た形＋ことがある</h3><p>普通表達：た形＋ことがある。禮貌表達：た形＋ことがあります。<br><ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったことがあります。＝曾經去過日本。<br><ruby>海<rt>うみ</rt></ruby>で<ruby>泳<rt>およ</rt></ruby>いだことがあります。＝曾經在海裡游泳。<br>和服を着たことがあります。＝曾經穿過和服。<br>焦點是「我有這個經驗」，不是距今很久。最近才發生的事情，也可構成經驗。</p><h3>用一個情境區分</h3><p>問：昨日、何をしましたか。昨天做了甚麼？<br>答：<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。看了電影。重點是昨天做的事。<br>問：この<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>たことがありますか。你有看過這部電影嗎？<br>答：はい、<ruby>見<rt>み</rt></ruby>たことがあります。是，有看過。重點是是否有過這個經驗。</p><h3>與能力句型對照</h3><p><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すことができます。＝會說日文。前面是辭書形。<br><ruby>日本語<rt>にほんご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>したことがあります。＝曾經用日文說話。前面是<mark class=\"study-key\">た形</mark>。<br>能力不等於經驗，て形也不等於<mark class=\"study-key\">た形</mark>。先想意思，再決定要哪一種變化。</p>","symbol":"経験","intro":"懂て形，就能借同一套規則學た形。","tag":"た形・過去・經驗","concepts":[["第一步：把て／で換成た／だ","先用熟悉的て形，再換最後一個假名。<mark class=\"study-key\">濁音</mark>要一起保留。","<ruby>書<rt>か</rt></ruby>いて → <ruby>書<rt>か</rt></ruby>いた ／ <ruby>読<rt>よ</rt></ruby>んで → <ruby>読<rt>よ</rt></ruby>んだ","寫了／讀了。不是読んた，也不是把所有辭書形直接加た。"],["各類動詞，一次對照","第一類沿用字尾分組；第二類<mark class=\"study-key\">去る加た</mark>；<mark class=\"study-key\">する→した</mark>；来る→来た（きた）。","<ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>って→<ruby>買<rt>か</rt></ruby>った ／ <ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べて→<ruby>食<rt>た</rt></ruby>べた","買了／吃了。例外行く仍須記：行く→行って→行った。"],["描述過去發生的一件事","<mark class=\"study-key\">た形</mark>與ました都可描述過去事件，禮貌程度不同，不是時間遠近不同。","<ruby>昨日<rt>きのう</rt></ruby>、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>た。／<ruby>昨日<rt>きのう</rt></ruby>、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。","兩句都是昨天看了電影。十年前的事情同樣可以用<mark class=\"study-key\">た形</mark>或ました。"],["說自己有過的經驗","<mark class=\"study-key\">た形＋ことがあります</mark>，焦點是人生或某段期間中有沒有這個經驗。","<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったことがあります。","曾經去過日本。重點是「有這個經驗」，不是一定很久以前。"],["不要與能力句型混淆","<mark class=\"study-key\">辭書形＋ことができます</mark>是能做；<mark class=\"study-key\">た形＋ことがあります</mark>是做過。","<ruby>泳<rt>およ</rt></ruby>ぐことができます。／<ruby>海<rt>うみ</rt></ruby>で<ruby>泳<rt>およ</rt></ruby>いだことがあります。","我會游泳。／我曾在海裡游泳。會做和做過，是不同的資訊。"]],"caution":"經驗句與一般過去句的區別是敘述焦點，不是遠近；昨天才有的經驗仍然是經驗。動詞<mark class=\"study-key\">た形</mark>也有其他用途，本課先掌握過去事件與經驗。","quiz":[{"prompt":"「読んで」換成た形是？","options":["読んだ","読んた","読みた","読った"],"answer":0,"explanation":"で要換成だ，濁音保留。","rubyView":{"prompt":"「<ruby>読<rt>よ</rt></ruby>んで」換成た形是？","options":["読んだ","読んた","読みた","読った"],"explanation":"で要換成だ，濁音保留。"}},{"prompt":"行く的た形是？","options":["行いた","行った","行きた","行んだ"],"answer":1,"explanation":"行く是例外：行って→行った。"},{"prompt":"要表達「曾經去過日本」的經驗，哪句正確？","options":["日本に行くことができます。","日本に行くことがありますでした。","日本に行ったことがあります。","日本に行きますことがあります。"],"answer":2,"explanation":"た形＋ことがあります表達有過的經驗。"},{"prompt":"「た形」與「たことがある」主要差別是？","options":["一個只能說昨天，一個只能說十年前","一個是能力，一個是許可","兩者分別表示未來與現在","一般過去事件與是否有過的經驗"],"answer":3,"explanation":"差別在敘述焦點，不是距今遠近。"}],"uploadedOriginal":"<h3>[ 單元30 ] 動詞た形とその用法</h3><h3>學習目標</h3><h3>①　學會「動詞た形」的變化方法</h3><p>②  學會表示經驗的句型「動詞た形＋ことがある」</p><p>這一單元，我們要再介紹一項新的動詞變化。等等，我彷彿可以聽到各位慘叫的聲音了，</p><p>各位心裡一定想：到底要學動詞變化學到什麼時候啊！</p><p>這裡有二個好消息要告訴各位。</p><p>首先，我們先將學習過的動詞時式，整理如下:</p><div class=\"table-scroll\"><table><tr><th>書く（かく）</th><th>動詞敬体<br>（機器人）</th><th>動詞常体<br>（車輛）</th></tr><tr><td>現在</td><td>かきます</td><td>かく</td></tr><tr><td>現在否定</td><td>かきません</td><td>かかない</td></tr><tr><td>過去</td><td>かきました</td><td>本回重點</td></tr><tr><td>過去否定</td><td>かきませんでした</td><td>かかなかった</td></tr></table></div><p>如上表所述，關於和動詞時式相關的動詞變化，只剩下「過去式」了，學習完這個之後，基本的動詞變化就暫時告一段落，短時間內不會再遇到其他動詞變化，這是第一個好消息。第二個好消息是，本單元要學的「動詞た形」，變化方式和之前學過的「動詞て形」完全相同，只要將「て」直接換成「た」即可，非常輕鬆。</p><p>另外，我們也會一併介紹表示經驗的「動詞た形＋ことがある」句型。我們學過表示能力的「～ことができる」句型、以及名詞化的「こと」，因此對於這個句型應該很快就能上手。「動詞た形＋ことがある」主要功能為敘述過去經驗，相當於中文的「我曾經…」，更多說明及例句請參考以下講解。</p><h3>動詞た形</h3><p>「動詞た形」主要用法和「～ました」相同，表示「過去式」、也就是過去某個時間點所發生的事情和動作。動詞變化方法，和「動詞て形」完全相同，將「動詞て形」的「て」代換成「た」即可。</p><p>變化方法: 　「動詞て形」－「て」＋「た」</p><p>注意：原本在「動詞て形」中會變成濁音「で」的字，在「動詞た形」中也要變成濁音的形式「だ」。</p><p>例：「泳ぐ→泳いで→泳いだ」</p><h3>第一類動詞</h3><p>例：</p><p>す　　　→　した</p><p>く・ぐ　→　いた・いだ</p><p>う・つ・る　→　った</p><p>ぶ・む・ぬ　→　んだ</p><p>例：</p><p>貸す　→　貸して　→　貸した</p><p>刺す　→　刺して　→　刺した</p><p>書く　→　書いて　→　書いた</p><p>泳ぐ　→　泳いで　→　泳いだ</p><p>言う　→　言って　→　言った</p><p>待つ　→　待って　→　待った</p><p>帰る　→　帰って　→　帰った</p><p>飛ぶ　→　飛んで　→　飛んだ</p><p>読む　→　読んで　→　読んだ</p><h3>第二類動詞</h3><p>例：</p><p>食べる　→　食べた</p><p>着る　  →　着た</p><p>忘れる　→　忘れた</p><p>寝る　  →　寝た</p><p>開ける　→　開けた</p><p>見る　  →　見た</p><h3>不規則動詞</h3><p>する　→　した</p><p>勉強する　→　勉強した</p><p>買物する　→　買物した</p><p>来る　→　来た（注意發音）</p><p>補充：動詞「行く」為例外，「た形」為「行った」</p><h3>～ことがある</h3><p>「動詞た形＋ことがある」的主要功能為表示過去經驗，照字面直接翻譯的話，「動詞た形」為「過去式」、「ことがある」是「有這樣的事」，因此整句話直譯就是: 「過去有這樣的事」，也就是「曾經做過什麼事」的意思。</p><p>基本用法:</p><h3>「動詞た形」＋こと　が　ある／あります</h3><p>（曾經…）</p><p>例：</p><p>私は日本に行ったことがあります。</p><p>（我曾經去過日本。）</p><p>私は市立プールで泳いだことがあります。</p><p>（我曾經去市立游泳池游過泳。）</p><p>私は塾で日本語を習ったことがあります。</p><p>（我曾經在補習班學過日文。）</p><p>私はパンダを見たことがあります。</p><p>（我曾經看過貓熊。）</p><p>私は懐石料理を食べたことがあります。</p><p>（我曾經吃過懷石料理。）</p><p>私は徹夜でテストの勉強をしたことがあります。</p><p>（我曾經熬夜讀書準備考試。）</p><p>私はこの場所に来たことがあります。</p><p>（我曾經來過這個地方。）</p><h3>「動詞た形＋ことがある」「動詞た形」的區別</h3><p>本單元介紹的二個用法，都是表示「過去做過的事」，那麼究竟該如何區別這二種句型用法呢？請看以下解說：</p><p>「動詞た形」:</p><h3>代表短時間內做過的事</h3><p>「動詞た形＋ことがある」:</p><h3>代表做過的事距今已經有段時間了</h3><p>用中文的語感來想，就會很容易理解：</p><p>「動詞た形」: 「…了」</p><p>「動詞た形＋ことがある」:「曾經…」</p><p>彼女は学校に行きました。</p><p>（她去學校了。）  可能十分鐘前才出門</p><p>彼女は学校に行ったことがあります。</p><p>（她曾經去過學校。）</p><h3>可能讀過小學，但是之後因故失學，沒有再去學校</h3><p>私は映画を見ました。</p><p>（我去看了電影。）  可能是上週才看。</p><p>私は映画を見たことがあります。</p><p>（我曾經看過電影。）</p><h3>可能很久之前看過，但是很久沒有看了</h3>","noteRevision":"修訂版","revisionReason":"按初學者需要重整動詞說明、例句及易錯概念；上傳原文保留供對照。","labMode":"ta"},{"id":31,"title":"先後順序的說法","symbol":"とき","intro":"把「何時、之前、之後」說清楚。","tag":"とき・前に・てから・後で","concepts":[["とき：某個時候","動詞<mark class=\"study-key\">普通形＋とき</mark>；名詞＋<mark class=\"study-key\">のとき</mark>；な形容詞＋なとき；い形容詞直接接。とき後的に有時可以省略。","<ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>っているとき、<ruby>電話<rt>でんわ</rt></ruby>が<ruby>鳴<rt>な</rt></ruby>りました。","洗澡時電話響了。入っている說明響電話時正在洗澡；とき不只表示兩個動作同時進行。"],["前に：先做後句","<mark class=\"study-key\">辭書形＋前に</mark>；名詞＋の前に。前に前面的動作<mark class=\"study-key\">比較晚發生</mark>，即使整句說的是過去，也用辭書形。","<ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みました。","睡前看了書。先讀書，再睡覺；不是寝た前に。形容詞不能一律直接套這個公式。"],["てから：完成A後再B","動詞<mark class=\"study-key\">て形＋から</mark>，明確把前面的完成當作後面的起點。","<ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>ってから、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。","洗完手再吃飯。洗う→洗って→洗ってから。單純て形也可表示順序，但不只這一種功能。"],["た後で：A之後B","<mark class=\"study-key\">た形＋後で</mark>；名詞＋<mark class=\"study-key\">の後で</mark>。た形表示相對於後句已完成，不等於整件事已在過去發生。","<ruby>明日<rt>あした</rt></ruby>、<ruby>宿題<rt>しゅくだい</rt></ruby>をした後で、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ます。","明天做完功課後看電影。雖然整句講明天，した仍正確。"]],"caution":"とき前的辭書形／た形涉及相對時間：日本に行くとき常指去之前或途中，行ったとき常指到達後或那次去的場合。不要把てから與後で硬分成只能強調前句／後句。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">把「何時、之前、之後」說清楚。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">意思</th><th scope=\"col\">接法</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>在……時</td><td><ruby>普通<rt>ふつう</rt></ruby>形＋とき</td><td><ruby>忙<rt>いそが</rt></ruby>しいとき／<ruby>静<rt>しず</rt></ruby>かなとき／<ruby>学生<rt>がくせい</rt></ruby>のとき</td></tr><tr><td>之前</td><td>辭書形＋<ruby>前<rt>まえ</rt></ruby>に</td><td><ruby>食<rt>た</rt></ruby>べる<ruby>前<rt>まえ</rt></ruby>に</td></tr><tr><td>先……再……</td><td>て形＋から</td><td><ruby>食<rt>た</rt></ruby>べてから</td></tr><tr><td>之後</td><td>た形＋<ruby>後<rt>あと</rt></ruby>で</td><td><ruby>食<rt>た</rt></ruby>べた後で</td></tr></tbody></table></div><h3>とき：某個時候</h3><p>動詞<mark class=\"study-key\">普通形＋とき</mark>；名詞＋<mark class=\"study-key\">のとき</mark>；な形容詞＋なとき；い形容詞直接接。とき後的に有時可以省略。</p><p lang=\"ja\"><ruby>風呂<rt>ふろ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>っているとき、<ruby>電話<rt>でんわ</rt></ruby>が<ruby>鳴<rt>な</rt></ruby>りました。</p><p>洗澡時電話響了。入っている說明響電話時正在洗澡；とき不只表示兩個動作同時進行。</p><h3>前に：先做後句</h3><p>辭書形＋<ruby>前<rt>まえ</rt></ruby>に；名詞＋の前に。前に前面的動作<mark class=\"study-key\">比較晚發生</mark>，即使整句說的是過去，也用辭書形。</p><p lang=\"ja\"><ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みました。</p><p>睡前看了書。先讀書，再睡覺；不是寝た前に。形容詞不能一律直接套這個公式。</p><h3>てから：完成A後再B</h3><p>動詞<mark class=\"study-key\">て形＋から</mark>，明確把前面的完成當作後面的起點。</p><p lang=\"ja\"><ruby>手<rt>て</rt></ruby>を<ruby>洗<rt>あら</rt></ruby>ってから、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。</p><p>洗完手再吃飯。洗う→<ruby>洗<rt>あら</rt></ruby>って→<ruby>洗<rt>あら</rt></ruby>ってから。單純て形也可表示順序，但不只這一種功能。</p><h3>た後で：A之後B</h3><p>た形＋<ruby>後<rt>あと</rt></ruby>で；名詞＋<mark class=\"study-key\">の後で</mark>。た形表示相對於後句已完成，不等於整件事已在過去發生。</p><p lang=\"ja\"><ruby>明日<rt>あした</rt></ruby>、<ruby>宿題<rt>しゅくだい</rt></ruby>をした後で、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ます。</p><p>明天做完功課後看電影。雖然整句講明天，した仍正確。</p><h3>再看幾個例子</h3><p><ruby>朝<rt>あさ</rt></ruby><ruby>起<rt>お</rt></ruby>きて、<ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べて、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。＝起床、吃早餐，再去學校。<br><ruby>旅行<rt>りょこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に、ホテルを<ruby>予約<rt>よやく</rt></ruby>します。＝旅行前訂飯店。<br><ruby>食事<rt>しょくじ</rt></ruby>の後で、お<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。＝飯後喝茶。<br><ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くとき、<ruby>香港<rt>ほんこん</rt></ruby>の<ruby>空港<rt>くうこう</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。＝去日本時，在香港機場買了書。</p><h3>容易混淆的地方</h3><p>とき前的辭書形／た形涉及相對時間：日本に行くとき常指去之前或途中，行ったとき常指到達後或那次去的場合。不要把てから與後で硬分成只能強調前句／後句。</p>","uploadedOriginal":"<p>[ 單元31 ] 先後順序的說法</p><p>學習目標</p><p>①  學習表示「…的時候」的句型「～ときに」</p><p>②  學習表示「在…之前」的句型「～前に」</p><p>③  學習表示「先…再…」的「て形」「～てから」句型</p><p>④  學習表示「在…之後」的句型「～た後で」</p><p>本單元要介紹的是日文中「動作先後順序」的說法，具體來說，就是中文的「…的時候」、「在…之前…」、「在…之後」等等句型，用於表示二個動作間的時間先後關係。</p><p>例如：</p><p>「ご飯を食べる前に、手を洗う（吃飯前先洗手）」</p><p>「日本語を勉強する前に、日本文化に興味を持たなければなりません（學日文之前，得先對日本文化有興趣）」</p><p>等等，這些句型在日常生活中常用，特別是經常用在敘述事情發展、以及給予建議的時候。</p><p>我們在本單元要學習的有四項句型，分別為「…的時候」、「…之前」、「…之後」、「先…再…」的句型用法。其中會用到我們學過的「動詞て形」和「動詞た形」，因此如果對於這二項動詞變化尚不熟練的話，請再多加練習，我們往後將會繼續用到這些常用的動詞變化。</p><p>其中，「～てから」、「～前に」、「～後で」三者的用法較相似，因此在後半的篇幅中，也將介紹如何區別這幾個相似用法、以及如何依照不同的場合來使用不同句型，請試著體會其中些微不同的語感。</p><p>～ときに</p><p>「～ときに」的漢字寫做「～時に」，意思為「在…的時候」，表示在某動作進行的同時、發生另一項動作。</p><p>例如：「在洗澡的時候，電話響了。」</p><p>文法方面，由於「～ときに」的「とき」屬於名詞，因此和接續名詞的方法完全相同。</p><p>基本用法: 動詞原形／た形／ている＋ときに</p><p>名詞＋のときに</p><p>な形容詞＋なときに</p><p>い形容詞＋ときに</p><p>（在…的時候）</p><p>例：</p><p>風呂に入っているときに、電話が鳴りました。</p><p>（在洗澡的時候，電話響了。）</p><p>スーパーで買物するときに、</p><p>大学の先生に会いました。</p><p>（在超市買東西的時候，遇到了大學老師。）</p><p>部屋を掃除しているときに、</p><p>昔の写真を見付けました。</p><p>（在打掃房間的時候，找到了以前的照片。）</p><p>夜寝ているときに、</p><p>母は急に大声で私を呼びました。</p><p>（晚上睡覺的時候，媽媽突然大聲叫我。）</p><p>パソコンを使うときに、画面がフリーズしました。</p><p>（在用電腦的時候，畫面當機了。）</p><p>面接するときに、スーツを着なければなりません。</p><p>（在面試的時候，必須穿著西裝。）</p><p>必要なときに、私に連絡してください。</p><p>（有需要的時候，請聯絡我。）</p><p>動詞て形</p><p>我們之前學過，「動詞て形」可以用來接續二個句子或是動詞。</p><p>例如: 歯を磨いて、朝ごはんを食べます。</p><p>（刷完牙、吃早飯。）</p><p>其實這就是最基本的、表示時間先後順序的用法。試想一下，當我們聽到「刷完牙、吃早飯」這樣的中文句子時，下意識就會覺得是「先刷完牙、再吃早飯」，「刷牙」在先、「吃早飯」在後吧！日文也相同，如果只是單純接續二個句子，那麼聽者會自然而然認為，先講的時間較早、而後講的時間較晚。這就是最基本的表示時間先後的用法。</p><p>基本用法:  A  動詞て形、B。</p><p>（先A，再B。）</p><p>例：</p><p>朝起きて、ご飯を食べて、学校に行きます。</p><p>（早上起來，吃飯，去學校。）</p><p>家に帰って、テレビを見て、宿題をします。</p><p>（回到家，看電視，寫作業。）</p><p>スーパーに行って、</p><p>晩ご飯の食材を買って、果物を買いました。</p><p>（去了超市、買了晚餐的食材、買了水果。）</p><p>電源を入れて、パソコンを起動して、</p><p>インターネットに接続します。</p><p>（按下開關、啟動電腦、連上網路。）</p><p>雨が降って、風が吹いて、桜の花が落ちます。</p><p>（下雨、刮風、櫻花掉落一地。）</p><p>～前に</p><p>「～前に」句型，顧名思義，相當於中文的「在…之前」，表示在進行某動作之前、先做某項動作。和「動詞て形」不同，這個句型很明確表示出時間先後順序的關係，而且整句話的重點在後半句，例如「ご飯を食べる前に、手を洗います。（吃飯前，先洗手。）」，整句話想強調的在於後句「手を洗います」 。</p><p>文法接續方式和「～ときに」大致相同。</p><p>基本句型: 　A ＋前に、B。</p><p>（在A之前，先B。）</p><p>基本用法: 動詞原形＋前に</p><p>名詞＋の前に</p><p>い形容詞＋前に</p><p>な形容詞＋な前に</p><p>例：</p><p>教室に入る前に、先生に挨拶します。</p><p>（進教室之前，先向老師打招呼。）</p><p>夜寝る前に、風呂に入ります。</p><p>（晚上睡覺前，先洗澡。）</p><p>日本に留学する前に、日本語をマスターします。</p><p>（去日本留學之前，先學好日文。）</p><p>料理を作る前に、</p><p>ちゃんと包丁を洗わなければなりません。</p><p>（在做菜之前，必須先將菜刀好好洗乾淨。）</p><p>ホテルの予約の前に、宿泊の日を決めてください。</p><p>（預約旅館之前，請先決定住宿日期。）</p><p>試験を申し込む前に、</p><p>受験願書を買わなければなりません。</p><p>（報名考試之前，必須先買申請表。）</p><p>～てから</p><p>剛才介紹過，「動詞て形」能夠表示先後順序，而現在這個「動詞て形＋から」用法，則相當於「動詞て形」的加強語氣，表示順序的語感更為強烈，相當於中文「先…再…」。</p><p>「～てから」和「～前に」的不同之處:</p><p>「～前に」：重點在後半句。</p><p>例：寝る前に、宿題をします。（睡覺前，先寫作業）</p><p>「～てから」：表示動作連續性，重點在前半句。</p><p>例：手を洗ってから、ご飯を食べます。（先洗手，再吃飯）</p><p>基本句型: 　A　てから、B。</p><p>（先A，再B。）</p><p>基本用法: 動詞て形＋から、（句子）。</p><p>例：</p><p>シャワーを浴びてから、テレビを見ます。</p><p>（先沖完澡，再看電視。）</p><p>よく考えてから、返事をします。</p><p>（先好好考慮，再給予回答。）</p><p>医者に診てもらってから、家族に知らせます。</p><p>（先給醫生看過，再通知家人。）</p><p>昼ごはんを食べてから、アルバイトに行きます。</p><p>（先吃完午飯，再前去打工。）</p><p>私は買物するとき、実物を見てから買います。</p><p>（我買東西時，都是先看過實物再買。）</p><p>～た後(あと)で</p><p>「～た後で」句型，會用到我們之前學過的「動詞過去式（動詞た形）」，照字面解釋，就是「在…之後」之意。</p><p>「～た後で」和「～前に」是互相對應的句型，一個表示「在…之前」、一個表示「在…之後」。</p><p>基本用法: 「動詞た形」＋後(あと)で、～。</p><p>（在…之後）</p><p>例：</p><p>宿題をした後で、友達と遊びに行きました。</p><p>（寫完作業後，和朋友去玩了。）</p><p>テレビを見た後で、風呂に入りました。</p><p>（看完電視後，去洗了澡。）</p><p>クラスメートに質問した後で、彼の反応を見ます。</p><p>（問完同學之後，看看他的反應。）</p><p>本屋でビジネス書を買った後で、</p><p>本棚を買いに行きました。</p><p>（在書店買了商業書籍後，去買了書架。）</p><p>野球の練習をした後で、みんなで食事に行きました。</p><p>（練習完棒球之後，大家一起去吃了飯。）</p><p>三項句型的比較</p><p>例句：在睡覺前，先寫作業</p><p>「～前に」</p><p>寝る前に、「宿題をします」。</p><p>（睡覺前去寫作業。）</p><p>重點、話者想強調的是在後半句。</p><p>「～た後で」</p><p>宿題をした後で、「寝ます」。</p><p>（寫完作業之後去睡覺。）</p><p>重點、話者想強調的是在後半句。</p><p>「～てから」</p><p>「宿題をしてから」、寝ます。</p><p>（先寫完作業，再去睡覺。）</p><p>重點、話者想強調的是在前半句。</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「昨天睡前看了書」應填：＿＿前に、本を読みました。","options":["寝る","寝た","寝て","寝ます"],"answer":0,"explanation":"前に前面用辭書形；整句過去由読みました表達。"},{"prompt":"手を洗ってから、ご飯を食べます。哪件事先？","options":["吃飯","洗手","睡覺","沒有順序"],"answer":1,"explanation":"てから明確表示洗完手後再吃飯。"},{"prompt":"「明天做完功課後出門」哪句正確？","options":["明日、宿題をする後で出掛けます。","明日、宿題をして後で出掛けます。","明日、宿題をした後で出掛けます。","明日、宿題をします後で出掛けます。"],"answer":2,"explanation":"後で前用た形，表示相對於出門已完成，不表示整句必須是過去。"},{"prompt":"「有空的時候」應說？","options":["暇のとき","暇だとき","暇でとき","暇なとき"],"answer":3,"explanation":"暇是な形容詞，修飾名詞とき時用暇なとき。"}]},{"id":32,"title":"表示同時的說法","symbol":"ながら","intro":"分清同時做兩件事，與保持原來的狀態。","tag":"ながら・たまま","concepts":[["ながら：一邊做，一邊做","ます形去ます＋<mark class=\"study-key\">ながら</mark>。兩個動作通常由<mark class=\"study-key\">同一人</mark>進行，後句是這次敘述的主要動作。","<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きながら、<ruby>勉強<rt>べんきょう</rt></ruby>します。","一邊聽音樂，一邊讀書。聞きます→聞き＋<mark class=\"study-key\">ながら</mark>。讀書是主動作。"],["主次由想表達的內容決定","不是某件事天生只能當主動作；換前後句，重心便不同。","ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べながら、テレビを<ruby>見<rt>み</rt></ruby>ます。","一邊吃飯，一邊看電視。這句自然，以看電視為敘述重點；並非只能說テレビを見<mark class=\"study-key\">ながら</mark>、ご飯を食べます。"],["たまま：結果狀態保持不變","<mark class=\"study-key\">た形＋まま</mark>，前面的動作完成後，其<mark class=\"study-key\">狀態一直保留</mark>。不是兩個動作持續同時進行。","<ruby>靴<rt>くつ</rt></ruby>を<ruby>履<rt>は</rt></ruby>いたまま、<ruby>部屋<rt>へや</rt></ruby>に<ruby>入<rt>はい</rt></ruby>りました。","穿著鞋進房間。履く→履いた，保持穿著鞋的狀態。"],["まま不一定是意外","常用於忘記改變的狀態，也能用於有意保留。否定可用<mark class=\"study-key\">ない形＋まま</mark>。","<ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けたままにしてください。","請讓窗戶保持打開。這是刻意的要求，不是意外。"]],"caution":"<mark class=\"study-key\">ながら</mark>的兩個動作通常同一主體；たまま強調狀態未變。不要把まま一律翻成「突然／直接」，也不要把た形一律解成整句的過去。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分清同時做兩件事，與保持原來的狀態。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">句型</th><th scope=\"col\">接法</th><th scope=\"col\">焦點</th></tr></thead><tbody><tr><td><mark class=\"study-key\">ながら</mark></td><td>ます去ます＋ながら</td><td><mark class=\"study-key\">同一人</mark>同時做兩件事</td></tr><tr><td>たまま</td><td>た形＋まま</td><td>完成後的狀態不變</td></tr><tr><td>ないまま</td><td>ない形＋まま</td><td>沒有做某事，仍然……</td></tr></tbody></table></div><h3>ながら：一邊做，一邊做</h3><p>ます形去ます＋ながら。兩個動作通常由<mark class=\"study-key\">同一人</mark>進行，後句是這次敘述的主要動作。</p><p lang=\"ja\"><ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きながら、<ruby>勉強<rt>べんきょう</rt></ruby>します。</p><p>一邊聽音樂，一邊讀書。<ruby>聞<rt>き</rt></ruby>きます→<ruby>聞<rt>き</rt></ruby>き＋ながら。讀書是主動作。</p><h3>主次由想表達的內容決定</h3><p>不是某件事天生只能當主動作；換前後句，重心便不同。</p><p lang=\"ja\">ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べながら、テレビを<ruby>見<rt>み</rt></ruby>ます。</p><p>一邊吃飯，一邊看電視。這句自然，以看電視為敘述重點；並非只能說テレビを見<mark class=\"study-key\">ながら</mark>、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。</p><h3>たまま：結果狀態保持不變</h3><p><mark class=\"study-key\">た形＋まま</mark>，前面的動作完成後，其<mark class=\"study-key\">狀態一直保留</mark>。不是兩個動作持續同時進行。</p><p lang=\"ja\"><ruby>靴<rt>くつ</rt></ruby>を<ruby>履<rt>は</rt></ruby>いたまま、<ruby>部屋<rt>へや</rt></ruby>に<ruby>入<rt>はい</rt></ruby>りました。</p><p>穿著鞋進房間。履く→履いた，保持穿著鞋的狀態。</p><h3>まま不一定是意外</h3><p>常用於忘記改變的狀態，也能用於有意保留。否定可用<mark class=\"study-key\">ない形＋まま</mark>。</p><p lang=\"ja\"><ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けたままにしてください。</p><p>請讓窗戶保持打開。這是刻意的要求，不是意外。</p><h3>再看幾個例子</h3><p><ruby>彼<rt>かれ</rt></ruby>は<ruby>働<rt>はたら</rt></ruby>きながら、<ruby>大学<rt>だいがく</rt></ruby>に<ruby>通<rt>かよ</rt></ruby>っています。＝他一邊工作，一邊上大學。<br>テレビをつけたまま、<ruby>寝<rt>ね</rt></ruby>てしまいました。＝電視開著就睡著了。<br><ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べないまま、<ruby>出掛<rt>でか</rt></ruby>けました。＝沒吃早餐就出門了。</p><h3>容易混淆的地方</h3><p><mark class=\"study-key\">ながら</mark>的兩個動作通常同一主體；たまま強調狀態未變。不要把まま一律翻成「突然／直接」，也不要把た形一律解成整句的過去。</p>","uploadedOriginal":"<p>[ 單元32 ] 表示同時的說法</p><p>學習目標</p><p>①　學習表示「一邊…一邊…」的「～ながら、～」句型</p><p>②　學習表示「…，直接…」「～たまま、～」</p><p>這次我們要學習的內容，和前一單元有些類似，不過因為篇幅過長，因此分成二個單元介紹，這樣各位學習起來也較省力（笑）。</p><p>上一單元介紹的是「時間先後順序」的說法，而本單元將介紹「同時…」的說法。解釋成「同時…」有點不太精確，我們將介紹二個句型: 「～ながら」和「～たまま」。</p><p>「～ながら」相當於中文的「一邊…一邊…」，表示同時進行二項動作，例如：「テレビを見ながら、ご飯を食べます（一邊看電視一邊吃飯）」、「音楽を聞きながら、宿題をします（一邊聽音樂一邊寫作業）」。「～たまま」則相當於「就直接…」之意，用來描述發生意料之外的情況，例如：「スーツを着たまま、寝ました（穿著西裝，就直接睡著了）」、「靴を履いたまま、リビングに入りました（穿著鞋子，就直接進來客廳裡了）」等等例句。</p><p>本單元的句型用法，也會用到之前介紹過的動詞變化，包含「動詞ます形」和「動詞た形」。嘿，我們說過動詞變化很重要吧，就是指這一類的情況；有很多很多很多日常生活的會話句型，都和動詞變化息息相關、鎖得緊緊的，如果不熟悉動詞變化，那麼之後可能只說得出斷斷續續、單字片語程度的日文，而無法流暢地進行溝通。各位也許會見到許多日語學習者，明明擁有非常豐富的字彙量，但是說話時卻只能說出單字、而無法將所有單字串起來形成完整流暢的句子，這就是因為不熟悉文法所造成的。特別是日文動詞變化的文法，相當重要。</p><p>ながら</p><p>「～ながら」為表示二項動作同時進行的句型，相當於中文的「一邊…一邊…」。這裡需要特別注意的是，必須將二個動作中「最主要的動作」，接在「ながら」之後。</p><p>例如「テレビを見る」和「ご飯を食べる」，由於是「吃飯順便看電視」而不是「看電視順便吃飯」，「テレビを見る」是順便動作，「ご飯を食べる」為主要動作，因此必須寫成「テレビを見ながら、ご飯を食べる」，而不能寫成「ご飯を食べながら、テレビを見ます」。</p><p>基本用法: 「動詞ます形」－「ます」＋ながら、～。</p><p>基本句型: 　A　ながら、B。</p><p>（一邊A，一邊B）</p><p>B為主要動作，A為順便的動作</p><p>例：</p><p>テレビを見る。　ご飯を食べる。</p><p>テレビを見ながら、ご飯を食べます。</p><p>（一邊看電視，一邊吃飯。）</p><p>歩く。　食べる。</p><p>歩きながら、アイスクリームを食べます。</p><p>（一邊走路，一邊吃冰淇淋。）</p><p>話す。運転する。</p><p>友達と話しながら、車を運転します。</p><p>（一邊和朋友講話，一邊開車。）</p><p>抱える。　飛び込む。</p><p>彼は大きい荷物を抱えながら、電車に飛び込みました。</p><p>（他一邊抱著很大的行李，一邊衝進電車裡。）</p><p>買物する。　考える。</p><p>母は買物しながら、今晩のレシピを考えています。</p><p>（母親一邊買東西，一邊思考著今晚的菜單。）</p><p>仕事する。　通う。</p><p>彼は仕事しながら、大学の夜間部に通っています。</p><p>（他一邊工作，一邊在大學夜間部唸書。）</p><p>～たまま</p><p>「～たまま」句型，表示持續前面動作的情況下、進行後面的動作，相當於中文的「…，就直接…」。「まま」原意為「一直、照樣」，由於前面是已經做過的動作，因此必須使用表示過去式的「動詞た形」。</p><p>基本用法: 「動詞た形」＋まま、～。</p><p>基本句型: 　Aたまま、B。</p><p>（A，就直接B。）</p><p>另外，這個句型較常用在描述「意想不到」的事情上。</p><p>例:</p><p>○　スーツを着たまま、寝ました。</p><p>（穿著西裝就直接睡覺了。）</p><p>？　パジャマを着たまま、寝ました。</p><p>（穿著睡衣就直接睡覺了。） 意思不自然</p><p>例：</p><p>テレビを付けたまま、ソファで寝ました。</p><p>（開著電視，就直接在沙發上睡著了。）</p><p>靴を履いたまま、部屋に入りました。</p><p>（穿著鞋子，就直接進了房間。）</p><p>ドアを開けたまま、外に出掛けました。</p><p>（門開著，就直接出去了。）</p><p>車を店の前に止めたまま、店に食事に行きました。</p><p>（將車子停在店門口，就直接去店裡吃東西了。）</p><p>彼は家出をしたまま、何の連絡もありませんでした。</p><p>（他離家出走後，就一直沒有任何消息。）</p><p>彼は「さようなら」と言って東京に行ったまま、</p><p>二度と帰りませんでした。</p><p>（他說了一句「再見」後去了東京，就再也沒有回來過了。）</p><p>彼女はランドセルをかけたまま、マラソンを走りました。</p><p>（她背著書包，就直接去跑馬拉松了。）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「一邊聽音樂」應說？","options":["音楽を聞きながら","音楽を聞くながら","音楽を聞いてながら","音楽を聞いたながら"],"answer":0,"explanation":"聞きます去掉ます，再加ながら。"},{"prompt":"「音楽を聞きながら、勉強します」主要動作是？","options":["聽音樂","讀書","兩人分工","保持鞋子穿著"],"answer":1,"explanation":"ながら後的勉強します是本句的主要動作。","rubyView":{"prompt":"「<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きながら、<ruby>勉強<rt>べんきょう</rt></ruby>します」主要動作是？","options":["聽音樂","讀書","兩人分工","保持鞋子穿著"],"explanation":"ながら後的勉強します是本句的主要動作。"}},{"prompt":"靴を履いたまま、部屋に入りました。意思是？","options":["先脫鞋再進房間","在房間內穿鞋","穿著鞋進房間","一邊穿鞋一邊跑步"],"answer":2,"explanation":"まま表示穿鞋後的狀態沒有改變。"},{"prompt":"關於まま，哪項正確？","options":["只能說意外","一定表示生氣","只接現在式","也能表示刻意保持狀態"],"answer":3,"explanation":"窓を開けたままにしてください就是刻意保持開窗狀態。"}]},{"id":33,"title":"列舉的說法","symbol":"たり","intro":"用たり、とか、やら、し，列舉活動、事物和理由。","tag":"たり・とか・やら・し","concepts":[["たり：舉出幾個代表性動作","動詞た形＋り，常用「～<mark class=\"study-key\">たり</mark>、～<mark class=\"study-key\">たり</mark>する」。不是完整清單，也不表示動作的先後次序。","<ruby>休<rt>やす</rt></ruby>みの日は、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだり、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>たりします。","放假會看書、看電影等等。読む→読んだ→読んだり；見る→見た→見<mark class=\"study-key\">たり</mark>。不是一定要譯成「一下子」。"],["たり的時態：看句末","雖然接た形，整句不一定是過去。用します說習慣或將來，用しました說過去；後面要接其他內容時，也可用し<mark class=\"study-key\">たり</mark>して……。","<ruby>昨日<rt>きのう</rt></ruby>は<ruby>掃除<rt>そうじ</rt></ruby>したり、<ruby>洗濯<rt>せんたく</rt></ruby>したりしました。","昨天做了打掃、洗衣等事情。「行っ<mark class=\"study-key\">たり</mark>来たりする」則是來回走動，表示交替反覆。"],["とか：輕鬆地舉例","會話常用「名詞＋<mark class=\"study-key\">とか</mark>」或「動詞普通形＋<mark class=\"study-key\">とか</mark>」，表示「……之類」。初學先用完整句收尾；口語也會以とか結尾，留下未說盡的語氣。","<ruby>週末<rt>しゅうまつ</rt></ruby>は、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>るとか、<ruby>散歩<rt>さんぽ</rt></ruby>するとかして、ゆっくり<ruby>過<rt>す</rt></ruby>ごします。","週末會看看電影、散步之類，悠閒地度過。名詞例：りんご<mark class=\"study-key\">とか</mark>バナナとかを買います（買蘋果、香蕉之類）。"],["やら：事情很多、感受交雜","「～<mark class=\"study-key\">やら</mark>～<mark class=\"study-key\">やら</mark>」列出幾項，常帶有事情繁多、忙亂或感受交雜的語氣。不是とか的「正式版本」，不能只為了更正式而互換。先記名詞、動詞辭書形、い形容詞直接接やら。","<ruby>引っ越<rt>ひっこ</rt></ruby>しの<ruby>前<rt>まえ</rt></ruby>は、<ruby>掃除<rt>そうじ</rt></ruby>やら<ruby>荷造<rt>にづく</rt></ruby>りやらで<ruby>忙<rt>いそが</rt></ruby>しいです。","搬家前忙著打掃、收拾行李等等。うれしい<mark class=\"study-key\">やら</mark>寂しいやらです＝既開心又寂寞。本項可先作延伸認識。"],["し：並列特點或理由","動詞、い形容詞普通形＋し；名詞、な形容詞肯定非過去用<mark class=\"study-key\">だし</mark>。也能接ます／です等禮貌形。常暗示還有其他<mark class=\"study-key\">理由</mark>，不一定是強烈主張或不滿。","この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いし、おいしいし、よく<ruby>行<rt>い</rt></ruby>きます。","這家店既便宜又好吃，所以常去。静か<mark class=\"study-key\">だし</mark>、便利だし……＝既安靜又方便。不要把名詞直接接し，例如バナナし。"]],"caution":"<mark class=\"study-key\">たり</mark>列舉活動；<mark class=\"study-key\">とか</mark>舉例；やら常帶繁多或交雜的感覺；し並列特點、理由。たり句型中的する也會變成して／した等形式，不是每句最後都原樣寫する。","original":"<h2>列舉的說法</h2><p class=\"lesson-focus\">用たり、<mark class=\"study-key\">とか</mark>、やら、し，列舉活動、事物和理由。</p><h3>たり：舉出幾個代表性動作</h3><p>動詞た形＋り，常用「～<mark class=\"study-key\">たり</mark>、～<mark class=\"study-key\">たり</mark>する」。不是完整清單，也不表示動作的先後次序。</p><p lang=\"ja\"><ruby>休<rt>やす</rt></ruby>みの日は、<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだり、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>たりします。</p><p>放假會看書、看電影等等。<ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>んだ→<ruby>読<rt>よ</rt></ruby>んだり；<ruby>見<rt>み</rt></ruby>る→<ruby>見<rt>み</rt></ruby>た→<ruby>見<rt>み</rt></ruby>たり。不是一定要譯成「一下子」。</p><h3>たり的時態：看句末</h3><p>雖然接た形，整句不一定是過去。用します說習慣或將來，用しました說過去；後面要接其他內容時，也可用し<mark class=\"study-key\">たり</mark>して……。</p><p lang=\"ja\"><ruby>昨日<rt>きのう</rt></ruby>は<ruby>掃除<rt>そうじ</rt></ruby>したり、<ruby>洗濯<rt>せんたく</rt></ruby>したりしました。</p><p>昨天做了打掃、洗衣等事情。「<ruby>行<rt>い</rt></ruby>ったり<ruby>来<rt>き</rt></ruby>たりする」則是來回走動，表示交替反覆。</p><h3>とか：輕鬆地舉例</h3><p>會話常用「名詞＋<mark class=\"study-key\">とか</mark>」或「動詞普通形＋<mark class=\"study-key\">とか</mark>」，表示「……之類」。初學先用完整句收尾；口語也會以とか結尾，留下未說盡的語氣。</p><p lang=\"ja\"><ruby>週末<rt>しゅうまつ</rt></ruby>は、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>るとか、<ruby>散歩<rt>さんぽ</rt></ruby>するとかして、ゆっくり<ruby>過<rt>す</rt></ruby>ごします。</p><p>週末會看看電影、散步之類，悠閒地度過。名詞例：りんご<mark class=\"study-key\">とか</mark>バナナ<mark class=\"study-key\">とか</mark>を買います（買蘋果、香蕉之類）。</p><h3>やら：事情很多、感受交雜</h3><p>「～やら～やら」列<ruby>出<rt>で</rt></ruby>幾項，常帶有事情繁多、忙亂或感受交雜的語氣。不是とか的「正式版本」，不能只為了更正式而互換。先記名詞、動詞辭書形、い形容詞直接接やら。</p><p lang=\"ja\"><ruby>引っ越<rt>ひっこ</rt></ruby>しの<ruby>前<rt>まえ</rt></ruby>は、<ruby>掃除<rt>そうじ</rt></ruby>やら<ruby>荷造<rt>にづく</rt></ruby>りやらで<ruby>忙<rt>いそが</rt></ruby>しいです。</p><p>搬家前忙著打掃、收拾行李等等。うれしいやら<ruby>寂<rt>さび</rt></ruby>しいやらです＝既開心又寂寞。本項可先作延伸認識。</p><h3>し：並列特點或理由</h3><p>動詞、い形容詞普通形＋し；名詞、な形容詞肯定非過去用だし。也能接ます／です等禮貌形。常暗示還有其他理由，不一定是強烈主張或不滿。</p><p lang=\"ja\">この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いし、おいしいし、よく<ruby>行<rt>い</rt></ruby>きます。</p><p>這家店既便宜又好吃，所以常去。<ruby>静<rt>しず</rt></ruby>かだし、<ruby>便利<rt>べんり</rt></ruby>だし……＝既安靜又方便。不要把名詞直接接し，例如バナナし。</p><h3>容易混淆的地方</h3><p>たり列舉活動；とか舉例；やら常帶繁多或交雜的感覺；し並列特點、理由。たり句型中的する也會變成して／した等形式，不是每句最後都原樣寫する。</p>","uploadedOriginal":"<p>[ 單元33 ] 列舉的說法</p><p>學習目標</p><p>①　學習表示列舉的句型「～たり」</p><p>②　學習表示列舉的句型「～とか」「～やら」</p><p>③　學習表示列舉的句型「～し」</p><p>我們在很前面很前面的單元中，介紹過「と、か、や、など」這些助詞，各位還記得嗎？這些助詞的功能是「列舉事物」，簡單來說，就是將許多名詞接在一句話當中，例：「猫と犬と兎」、「定食かうどんかそば」、「自転車やバイクや車など」等等用法。</p><p>但是先前介紹的這些助詞，功能有限，一般只用於連接名詞，而無法連接形容詞、動詞、句子。本單元要介紹的同樣是用於「列舉事物」的句型用法，只是更為進階、更為生活化，包括「たり」「とか」「やら」「し」四項文法，接續方式也更自由，可以廣泛連接名詞、形容詞、動詞、甚至是連接整個句子。</p><p>其中「たり」「とか」「し」三項句型用法較相似，需特別注意，我們也將介紹每個句型的使用方法和使用時機。由於在會話中出現頻率相當高，因此請各位務必確實了解、熟練本單元介紹的文法句型。</p><p>たり</p><p>「たり」是日文中最常用於表示「列舉」的句型之一，和先前學過的「か」、「や、など」不同的是，「たり」的功能更為強大，可以接續動詞或整個句子。列舉的意思，就是從許多發生的動作或事情中，隨便抽取一二項出來講，例如「我週日有看電視、打掃房間、出去玩」，週日做了許多事，但是來不及全部講出來，因此舉了以上三件事來代表，這就是列舉用法。</p><p>另外，「たり」的使用範圍很廣，口語溝通或者文章寫作都可以使用，也就是說，「たり」既是口頭用語，也是書面用語。</p><p>「たり」為「動詞た形」加上「り」，可以將複數的「たり」連在一起用，但是最後記得一定要加上「する」，這是日語說話的習慣，加上去整句才算完整，詳見下頁說明。</p><p>基本用法: 「動詞た形」＋り、「動詞た形」＋り＋する／します。</p><p>（一下…、一下…）</p><p>例：</p><p>私は日曜日にテレビを見たり、</p><p>部屋を掃除したり、遊んだりしました。</p><p>（我在星期日時一下子看電視、一下子打掃房間、一下子到處玩。）</p><p>彼は行ったり来たりして、とても焦っています。</p><p>（他走來走去，非常地焦急。）</p><p>林さんが授業中に寝たり話したり、</p><p>お菓子を食べたりしているから、先生は怒っています。</p><p>（林同學在上課時一下子睡覺、一下子講話、一下子吃零食，因此老師生氣了。）</p><p>弟は溜め息をついたり、頭を掻いたりして、</p><p>とても悩んでいます。</p><p>（弟弟一下子嘆氣、一下子抓頭、非常煩惱。）</p><p>母は今日スーパーに行ったり、郵便局に行ったり、</p><p>電気屋に行ったりして、かなり忙しかったです。</p><p>（母親今天一下子去超市、一下子去郵局、一下子去電器行，非常忙碌。）</p><p>妹は一日中インターネットをしたり、</p><p>チャットしたり、オンラインゲームをしたりして、</p><p>家でぶらぶらしていました。</p><p>（妹妹一下子上網、一下子閒聊、一下子打線上遊戲，</p><p>一整天都在家裡閒晃。）</p><p>とか</p><p>「とか」同樣也具有列舉的意思，從許多動作或事情中、選出幾項代表性的事物進行介紹，功能大致上和「たり」相同。不過「とか」屬於較通俗的用法，因此一般使用在口語會話中，在文章或正式場合中則較不使用。</p><p>不過也因為「とか」這個用法非常口語、非常通俗，因此，在「とか」之前可以接續許多詞種，包括名詞、形容詞、動詞等等，而且不用多做變化，直接加上去就可以了。</p><p>在一句話中也可以連用好幾個「とか」。不過，「とか」不能當作句子的句尾，在「とか」之後，必須加上另一個句子，感覺會較自然。</p><p>基本用法: 名詞／形容詞／動詞＋とか、～。</p><p>（…啊、…啊什麼的）</p><p>例：</p><p>バナナとか、リンゴとか、レモンとか、</p><p>好きな果物を選んでください。</p><p>（香蕉啊、蘋果啊、檸檬啊什麼的，請選你喜歡的水果。）</p><p>医者とか、弁護士とか、企業家とか、</p><p>あなたは将来何になりたい？</p><p>（醫生啊、律師啊、企業家啊什麼的，你將來想當什麼？）</p><p>韓国に行くとか、日本に行くとか、</p><p>今年は沢山の国を旅行したいです。</p><p>（韓國啊、日本啊什麼的，今年我想去許多國家旅行。）</p><p>電車に乗るとか、飛行機に乗るとか、</p><p>台北から高雄まで行く方法はいろいろあるでしょう。</p><p>（坐電車啊、坐飛機啊什麼的，從台北到高雄有許多方法吧。）</p><p>写真を撮ったとか、おみやげを買ったとか、美味しい物を食べたとか、今回の海外旅行がとても楽しかったです。</p><p>（拍照啊、買紀念品啊、吃美食啊什麼的，這次的海外旅行非常愉快。）</p><p>やら</p><p>「やら」這個用法，簡單來說，就是「とか」的正式版本。「やら」的功能及文法用法和「とか」大致相同，區別在於，「とか」為口頭用語、「やら」是書面用語，「とか」用於口語會話時、而「やら」則多用於文章或正式場合時。如果將原本使用「とか」的句子以「やら」替換，那麼就會像是寫作文章、或是在正式場合和人講話的感覺。</p><p>另外，「やら」之前的動詞一般會使用動詞原形，這點也必須注意。</p><p>基本用法: 名詞／形容詞／動詞＋やら</p><p>（…之類的）</p><p>例：</p><p>バナナやら、リンゴやら、レモンやら、</p><p>好きな果物を選んでください。</p><p>（香蕉、蘋果、檸檬之類的，請選你喜歡的水果。）</p><p>医者やら、弁護士やら、企業家やら、</p><p>あなたは将来何になりたい？</p><p>（醫生、律師、企業家之類的，你將來想成為什麼？）</p><p>韓国に行くやら、日本に行くやら、</p><p>今年は沢山の国を旅行したいです。</p><p>（韓國、日本之類的，今年想去許多國家旅行。）</p><p>電車に乗るやら、飛行機に乗るやら、</p><p>台北から高雄まで行く方法はいろいろあるでしょう。</p><p>（電車、飛機之類的，從台北到高雄有很多方法吧。）</p><p>写真を撮るやら、おみやげを買うやら、美味しい物を食べるやら、今回の海外旅行でしたいことがいっぱいあります。</p><p>（拍照、買紀念品、吃美食之類的，我想在這次的國外旅行中做許多事。）</p><p>し</p><p>「し」同樣具有列舉的功能，不過和前面幾項用法最不同的地方，在於「し」不僅只是描述事情動作，而且還帶有強烈表達自己主張的感覺。</p><p>因此，「し」多用於表達自己的意見、主張和不滿等等，而較少用來單純列舉事物。多和助詞「も（也）、から（因此）」連用，因為這二個助詞也有加強語氣的意思。</p><p>例：</p><p>？　バナナし、リンゴし、レモンし、好きな果物を選んでください。</p><p>○　バナナも食べたし、リンゴも食べたし、レモンも食べたし、もう何も食べたくない。</p><p>（已經吃了香蕉、蘋果、檸檬，不想再吃任何東西了。）</p><p>基本用法: 名詞／な形容詞＋だし</p><p>い形容詞／動詞常体＋し</p><p>（既…、又…）</p><p>例：</p><p>彼は日本語の先生だし、日本語通訳だし、</p><p>この仕事をうまくやってくれるでしょう。</p><p>（他既是日文老師、又是日文口譯，想必一定能夠順利做好這個工作吧。）</p><p>この公園はきれいだし、静かだし、</p><p>今度からここで勉強しましょうよ。</p><p>（這座公園既漂亮、又安靜，下次就來這裡唸書吧。）</p><p>この店の料理は美味しいし、安いし、</p><p>かなり量があるし、皆さんにオススメです。</p><p>（這家店的料理既美味、便宜、量又多，推薦給大家。）</p><p>宿題もしたし、予習もしたし、</p><p>目覚まし時計もかけたから、そろそろ寝ましょう。</p><p>（作業寫了、預習了、也設定鬧鐘了，差不多該睡了。）</p><p>日本にも行ったし、アメリカとヨーロッパにも行ったから、もう満足しました。</p><p>（既去過了日本、也去過了美國和歐洲，我已經心滿意足了。）</p><p>今日は休みだし、親がいないし、コンビニもまだやっているから、友達と家でホームパーティーを開きましょう。</p><p>（今天放假、爸媽也不在、便利商店也還在營業，所以和朋友一起在家開派對吧。）</p><p>謝ったし、お金も弁償したし、反省文も書いたから、今回は許してあげる。</p><p>（既然都道歉了、也賠錢了、也寫下了反省書，所以這次就原諒你。）</p>","noteRevision":"修訂版","revisionReason":"依最新上傳原筆記精簡修訂：整理四種列舉方式，修正やら的語氣及接續說明。頁末可查看上傳原文。","quiz":[{"prompt":"読む變成たり的形式是？","options":["読んだり","読みたり","読んでり","読むたり"],"answer":0,"explanation":"先做た形読んだ，再加り。"},{"prompt":"買蘋果、香蕉之類，哪一句自然？","options":["りんごし、バナナしを買います。","りんごとかバナナとかを買います。","りんごたりバナナたり買います。","りんごだしバナナを買います。"],"answer":1,"explanation":"名詞後可直接接とか，表示舉例。"},{"prompt":"「這裡方便，而且安靜」填入：ここは便利＿＿、静かです。","options":["し","のし","だし","なり"],"answer":2,"explanation":"な形容詞肯定普通形便利だ＋し。"},{"prompt":"關於「掃除やら荷造りやらで忙しい」，哪個理解最合適？","options":["やら只是とか的正式版本","只做了打掃和收拾行李兩件事","一定只能寫在文章中","忙著打掃、收拾行李等許多事情"],"answer":3,"explanation":"やら列出幾項，這裡帶有事情繁多、忙不過來的感覺。","rubyView":{"prompt":"關於「<ruby>掃除<rt>そうじ</rt></ruby>やら<ruby>荷造<rt>にづく</rt></ruby>りやらで<ruby>忙<rt>いそが</rt></ruby>しい」，哪個理解最合適？","options":["やら只是とか的正式版本","只做了打掃和收拾行李兩件事","一定只能寫在文章中","忙著打掃、收拾行李等許多事情"],"explanation":"やら列出幾項，這裡帶有事情繁多、忙不過來的感覺。"}}]},{"id":34,"title":"する・なる","symbol":"なる","intro":"分清「變成怎樣」和「把它變成怎樣」。","tag":"くなる・になる・くする・にする","concepts":[["なる：描述變化結果","名詞／な形容詞＋<mark class=\"study-key\">になる</mark>；い形容詞去い＋<mark class=\"study-key\">くなる</mark>。","<ruby>部屋<rt>へや</rt></ruby>がきれいになりました。","房間變乾淨了。句子聚焦結果，可能因為有人打掃；なる不保證沒有外力。"],["する：使對象改變","對象を＋名詞／な形容詞<mark class=\"study-key\">にする</mark>；い形容詞去い＋<mark class=\"study-key\">くする</mark>。","<ruby>部屋<rt>へや</rt></ruby>をきれいにしました。","把房間弄乾淨了。強調某人做事使房間改變。"],["名詞：成為與製成","教師<mark class=\"study-key\">になる</mark>表示成為老師；原稿を本<mark class=\"study-key\">にする</mark>表示把稿件製成書。に後接なる或する，視角不同。","<ruby>私<rt>わたし</rt></ruby>は<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>教師<rt>きょうし</rt></ruby>になりたいです。","我想成為日文老師。なる→なります→なりたい。"],["形容詞：記住く／に","高い→高く、静か→静かに。いい使用<mark class=\"study-key\">よく</mark>。","<ruby>音<rt>おと</rt></ruby>を<ruby>小<rt>ちい</rt></ruby>さくしてください。","請把聲音調小。小さい→小さく＋する→してください。"]],"caution":"なる不是「只能自然變化」，する也不是看到を就必然使用。要看是描述結果，還是使某對象改變。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分清「變成怎樣」和「把它變成怎樣」。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">詞類</th><th scope=\"col\">變成……</th><th scope=\"col\">使……變成……</th></tr></thead><tbody><tr><td>名詞</td><td><ruby>教師<rt>きょうし</rt></ruby>になる</td><td><ruby>原稿<rt>げんこう</rt></ruby>を<ruby>本<rt>ほん</rt></ruby>にする</td></tr><tr><td>い形容詞</td><td><ruby>暖<rt>あたた</rt></ruby>かくなる</td><td><ruby>部屋<rt>へや</rt></ruby>を<ruby>暖<rt>あたた</rt></ruby>かくする</td></tr><tr><td>な形容詞</td><td><ruby>静<rt>しず</rt></ruby>かになる</td><td><ruby>教室<rt>きょうしつ</rt></ruby>を<ruby>静<rt>しず</rt></ruby>かにする</td></tr><tr><td>いい</td><td><mark class=\"study-key\">よく</mark>なる</td><td><mark class=\"study-key\">よく</mark>する</td></tr></tbody></table></div><h3>なる：描述變化結果</h3><p>名詞／な形容詞＋<mark class=\"study-key\">になる</mark>；い形容詞去い＋<mark class=\"study-key\">くなる</mark>。</p><p lang=\"ja\"><ruby>部屋<rt>へや</rt></ruby>がきれいになりました。</p><p>房間變乾淨了。句子聚焦結果，可能因為有人打掃；なる不保證沒有外力。</p><h3>する：使對象改變</h3><p>對象を＋名詞／な形容詞<mark class=\"study-key\">にする</mark>；い形容詞去い＋<mark class=\"study-key\">くする</mark>。</p><p lang=\"ja\"><ruby>部屋<rt>へや</rt></ruby>をきれいにしました。</p><p>把房間弄乾淨了。強調某人做事使房間改變。</p><h3>名詞：成為與製成</h3><p>教師<mark class=\"study-key\">になる</mark>表示成為老師；原稿を本<mark class=\"study-key\">にする</mark>表示把稿件製成書。に後接なる或する，視角不同。</p><p lang=\"ja\"><ruby>私<rt>わたし</rt></ruby>は<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>教師<rt>きょうし</rt></ruby>になりたいです。</p><p>我想成為日文老師。なる→なります→なりたい。</p><h3>形容詞：記住く／に</h3><p><ruby>高<rt>たか</rt></ruby>い→<ruby>高<rt>たか</rt></ruby>く、<ruby>静<rt>しず</rt></ruby>か→<ruby>静<rt>しず</rt></ruby>かに。いい使用よく。</p><p lang=\"ja\"><ruby>音<rt>おと</rt></ruby>を<ruby>小<rt>ちい</rt></ruby>さくしてください。</p><p>請把聲音調小。<ruby>小<rt>ちい</rt></ruby>さい→<ruby>小<rt>ちい</rt></ruby>さく＋する→してください。</p><h3>再看幾個例子</h3><p><ruby>春<rt>はる</rt></ruby>になりました。＝春天到了。<br><ruby>水<rt>みず</rt></ruby>が<ruby>熱<rt>あつ</rt></ruby>くなりました。＝水變熱了。<br><ruby>水<rt>みず</rt></ruby>を<ruby>熱<rt>あつ</rt></ruby>くしました。＝把水加熱了。<br><ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>はカレーにします。＝午餐選咖哩；名詞<mark class=\"study-key\">にする</mark>也可表示選擇。</p><h3>容易混淆的地方</h3><p>なる不是「只能自然變化」，する也不是看到を就必然使用。要看是描述結果，還是使某對象改變。</p>","uploadedOriginal":"<p>[ 單元34 ] する・なる</p><p>學習目標</p><p>①　了解「する」「なる」的意思</p><p>②　學會「名詞＋する・なる」的用法</p><p>③  學會「形容詞＋する・なる」的用法</p><p>本單元的主角為「する」和「なる」二個單字。</p><p>「才二個單字，幾行就解決了，為什麼還要另外闢一個單元介紹！？」</p><p>我們彷彿可以聽到各位心裡的吶喊和疑惑，為什麼要花一個單元的時間介紹「する」「なる」這二個動詞呢？其實，這二個動詞可沒有外表看起來那麼單純喔！單獨這二個字的意思很好懂，但是它們就像口香糖一樣，可以「黏」在名詞、形容詞、動詞等等詞類的後面，賦予整句話不同的意思，這一類特殊用法，在學習時可就必須特別注意了。</p><p>「する」這個動詞，大概已經在例句中出現過三百遍了，屬於不規則動詞，中文是「做」的意思，可以接在漢字之後，形成新的動詞，例如：「勉強する」「仕事する」等等。而「なる」這個動詞，則是「成為…」的意思，可以用在「医者になる」「歌手になる」等等的例句當中。以上為該字本身的意思，但是當「する」「なる」和名詞、形容詞等等一起連用時，那麼情況可就大不相同了。</p><p>「する」「なる」若是和名詞、形容詞等其他詞類結合時，會由「做、成為」等具體意思，變成「使…變成…、自然成為…」等抽象的意思。呃，做個簡單易懂的比喻，當東尼．史塔克單獨一人時，只是普通的人類，但是穿上鋼鐵裝後，會變成能夠飛天遁地的鋼鐵人。我們發誓這是我們所能想到最好的比喻了。</p><p>「＋名詞」：歌手になる　歌手にする</p><p>「＋形容詞」：美味しくなる　美味しくする</p><p>「する」「なる」還可以接副詞和動詞等等，本單元由於篇幅關係，只挑了最實用的名詞和形容詞介紹，不過其實意思都相同，只要了解「する」「なる」在接續名詞、形容詞時的意思和用法，往後遇上其他詞類時，也能很迅速地理解。</p><p>する・なる</p><p>「する」</p><p>不規則動詞，相當於中文「做…」的意思。</p><p>前面多接助詞「を」。</p><p>基本用法: ～をする／します。</p><p>例：</p><p>宿題をする。　（寫作業。）</p><p>仕事をする。    （工作。）</p><p>料理をする。   （做菜。）</p><p>買物をする。   （買東西。）</p><p>復習をする。  （複習。）</p><p>也可以直接將「する」接在漢字之後，形成新的動詞。</p><p>例：</p><p>勉強する。  （學習。）</p><p>登校する。   （上學。）</p><p>仕事する。    （工作。）</p><p>購入する。  （買入。）</p><p>展示する。    （展示。）</p><p>「なる」</p><p>第一類動詞，相當於中文「成為…」的意思。</p><p>前面多接助詞「に」。</p><p>基本用法: ～になる／なります。</p><p>例：</p><p>教師になる。      （成為老師。）</p><p>漫画家になる。     （成為漫畫家。）</p><p>宇宙飛行士になる。（成為太空人。）</p><p>有名な人になる。  （成為有名的人。）</p><p>お金持ちになる。   （成為有錢人。）</p><p>名詞＋する・なる</p><p>「なる」</p><p>「名詞＋なる」的基本用法和「なる」相似，相當於中文「變成…、成為…」</p><p>基本用法:  ～　は　（名詞）　に　なる。</p><p>例：</p><p>私は大統領になる。</p><p>（我要成為總統。）</p><p>彼は日本語教師になる。</p><p>（他將成為日文老師。）</p><p>彼女は物理の博士になる。</p><p>（她將成為物理博士。）</p><p>村上さんはノーベル賞の作家になる。</p><p>（村上先生將成為諾貝爾獎的作家。）</p><p>国中さんは有名な俳優になる。</p><p>（國中小姐將成為有名的演員。）</p><p>「する」</p><p>「名詞＋する」的意思為「將…變成…」，指經由外力，使某樣東西變成另一樣東西。</p><p>基本用法:  ～は A（対象）を  B（名詞） に する。</p><p>（以外力將A變成B。）</p><p>在原始用法「をする」的中間，加入「（名詞）に」，表示變化後的狀態。</p><p>例：</p><p>私は書いた原稿を本にする。</p><p>（我將寫完的原稿製成書。）</p><p>彼女はあの野良犬をペットにする。</p><p>（她將那隻流浪狗當作寵物。）</p><p>農人たちは取った稲を白い米にする。</p><p>（農人們將割下的稻子製成白米。）</p><p>母はこの古い布を雑巾にする。</p><p>（母親將舊布製成抹布。）</p><p>私はノートパソコンをテレビにする。</p><p>（我將筆電當作電視。）</p><p>あのバカは二本の鉛筆を箸にして、ご飯を食べる。</p><p>（那個笨蛋將二根鉛筆當作筷子來吃飯。）</p><p>形容詞＋する・なる</p><p>「形容詞＋なる」的意思為「自然變成…」，表示該物體不經由外力、自然而然地變成某個狀態。</p><p>基本用法：い形容詞－「い」＋「くなる」</p><p>な形容詞＋　に　なる</p><p>例：</p><p>水が熱くなる。（水變熱。）</p><p>背が高くなる。（身高變高。）</p><p>眠くなる。（變得想睡。）</p><p>氷山が小さくなる。（冰山變小。）</p><p>部屋がきれいになる。（房間變乾淨了。）</p><p>病人が元気になる。（病人變得有精神。）</p><p>周りが静かになる。（周圍變安靜。）</p><p>日本語が上手になる。（日文變得拿手。）</p><p>「形容詞＋する」的意思則為「使…變成…」，表示經由外力，使某物體變成某個狀態。</p><p>基本用法：</p><p>（対象）を（い形容詞）－「い」＋「くする」</p><p>（対象）を（な形容詞）に　する</p><p>例：</p><p>水を熱くする。      （使水變熱、煮熱水。）</p><p>音量を大きくする。 （將音量調大。）</p><p>料理を美味しくする。（將料理變得好吃。）</p><p>白い紙を黒くする。  （將白紙染黑。）</p><p>部屋をきれいにする。（將房間變乾淨、打掃乾淨。）</p><p>クラスを静かにする。（讓全班安靜。）</p><p>彼女を幸せにする。（讓她幸福。）</p><p>日本語を上手にする。（讓日文能力變好。）</p><p>簡單整理</p><p>＋なる：指該物不受外力影響，自然而然變成某種狀態。</p><p>「自然變成…／自然成為…」</p><p>＋する：指使用外力，讓該物由原本的狀態變成某種狀態。</p><p>「使…變成…／使…成為…」</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「天氣變暖」應填：暖か＿＿なりました。","options":["く","に","な","いに"],"answer":0,"explanation":"い形容詞去い加く，再接なる。"},{"prompt":"「把房間打掃乾淨」應說？","options":["部屋がきれいになる","部屋をきれいにする","部屋をきれいくする","部屋がきれいする"],"answer":1,"explanation":"使對象改變，用部屋を＋きれいにする。"},{"prompt":"「房間變乾淨了」能否是有人打掃的結果？","options":["不可能","只能因為下雨","可以，なる聚焦變化結果","只有無人時才可用"],"answer":2,"explanation":"なる不排除人為原因，只是不在這個結構中直接描述施動者。"},{"prompt":"いい接なる的形式是？","options":["いいになる","いくなる","いいくなる","よくなる"],"answer":3,"explanation":"いい的相關變化使用よい的詞幹：よくなる。"}]},{"id":35,"title":"日文的常體說法","symbol":"ふつう","intro":"掌握普通形的四種基本形式，選擇合適的說話方式。","tag":"敬體・常體・普通形","concepts":[["敬體與常體","<mark class=\"study-key\">敬體</mark>常以です／ます收尾；<mark class=\"study-key\">常體</mark>使用だ、動詞普通形等。選擇看關係、場合與文章風格，不是只看年齡。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。／<ruby>今日<rt>きょう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>く。","今天去學校。前者<mark class=\"study-key\">敬體</mark>，後者常體。敬體不等於尊敬語的全部；常體也不等於粗魯。"],["名詞與な形容詞","非過去肯定だ；否定<mark class=\"study-key\">ではない</mark>；過去<mark class=\"study-key\">だった</mark>；過去否定ではなかった。","<ruby>学生<rt>がくせい</rt></ruby>だ。<ruby>学生<rt>がくせい</rt></ruby>ではない。<ruby>学生<rt>がくせい</rt></ruby>だった。<ruby>学生<rt>がくせい</rt></ruby>ではなかった。","是學生、不是學生、當時是學生、當時不是學生。静か也用同一套句尾。"],["い形容詞不用だ","高い、高くない、高かった、<mark class=\"study-key\">高くなかった</mark>。いい則是いい／よくない／よかった／よくなかった。","<ruby>昨日<rt>きのう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>かった。<ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>くない。","昨天冷，今天不冷。不能寫寒いだ或寒い<mark class=\"study-key\">だった</mark>。"],["動詞普通形四格","行く／行かない／行った／行かなかった，分別對應行きます／行きません／行きました／行きませんでした。","<ruby>昨日<rt>きのう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>った。でも、<ruby>宿題<rt>しゅくだい</rt></ruby>をしなかった。","昨天去了學校，但沒有做功課。否定過去是ない→なかった。"]],"caution":"<mark class=\"study-key\">普通形</mark>也會出現在<mark class=\"study-key\">敬體</mark>句子裡，如「明日行くと思います」。不能只把ます刪掉，也不能給所有詞尾加だ。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">掌握<mark class=\"study-key\">普通形</mark>的四種基本形式，選擇合適的說話方式。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">種類</th><th scope=\"col\">非過去肯定</th><th scope=\"col\">非過去否定</th><th scope=\"col\">過去肯定</th><th scope=\"col\">過去否定</th></tr></thead><tbody><tr><td>名詞</td><td><ruby>学生<rt>がくせい</rt></ruby>だ</td><td><ruby>学生<rt>がくせい</rt></ruby>ではない</td><td><ruby>学生<rt>がくせい</rt></ruby>だった</td><td><ruby>学生<rt>がくせい</rt></ruby>ではなかった</td></tr><tr><td>な形容詞</td><td><ruby>静<rt>しず</rt></ruby>かだ</td><td><ruby>静<rt>しず</rt></ruby>かではない</td><td><ruby>静<rt>しず</rt></ruby>かだった</td><td><ruby>静<rt>しず</rt></ruby>かではなかった</td></tr><tr><td>い形容詞</td><td><ruby>高<rt>たか</rt></ruby>い</td><td><ruby>高<rt>たか</rt></ruby>くない</td><td><ruby>高<rt>たか</rt></ruby>かった</td><td><ruby>高<rt>たか</rt></ruby>くなかった</td></tr><tr><td>動詞</td><td><ruby>行<rt>い</rt></ruby>く</td><td><ruby>行<rt>い</rt></ruby>かない</td><td><ruby>行<rt>い</rt></ruby>った</td><td><ruby>行<rt>い</rt></ruby>かなかった</td></tr></tbody></table></div><h3>敬體與常體</h3><p>敬體常以です／ます<ruby>收<rt>おさむ</rt></ruby>尾；常體使用だ、動詞普通形等。選擇看關係、場合與文章風格，不是只看年齡。</p><p lang=\"ja\"><ruby>今日<rt>きょう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。／<ruby>今日<rt>きょう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>く。</p><p>今天去學校。前者<mark class=\"study-key\">敬體</mark>，後者<mark class=\"study-key\">常體</mark>。敬體不等於尊敬語的全部；常體也不等於粗魯。</p><h3>名詞與な形容詞</h3><p>非過去肯定だ；否定<mark class=\"study-key\">ではない</mark>；過去だった；過去否定ではなかった。</p><p lang=\"ja\"><ruby>学生<rt>がくせい</rt></ruby>だ。<ruby>学生<rt>がくせい</rt></ruby>ではない。<ruby>学生<rt>がくせい</rt></ruby>だった。<ruby>学生<rt>がくせい</rt></ruby>ではなかった。</p><p>是學生、不是學生、當時是學生、當時不是學生。静か也用同一套句尾。</p><h3>い形容詞不用だ</h3><p><ruby>高<rt>たか</rt></ruby>い、<ruby>高<rt>たか</rt></ruby>くない、<ruby>高<rt>たか</rt></ruby>かった、<ruby>高<rt>たか</rt></ruby>くなかった。いい則是いい／よくない／よかった／よくなかった。</p><p lang=\"ja\"><ruby>昨日<rt>きのう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>かった。<ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>くない。</p><p>昨天冷，今天不冷。不能寫寒いだ或寒い<mark class=\"study-key\">だった</mark>。</p><h3>動詞普通形四格</h3><p><ruby>行<rt>い</rt></ruby>く／<ruby>行<rt>い</rt></ruby>かない／<ruby>行<rt>い</rt></ruby>った／行かなかった，分別對應行きます／<ruby>行<rt>い</rt></ruby>きません／<ruby>行<rt>い</rt></ruby>きました／<ruby>行<rt>い</rt></ruby>きませんでした。</p><p lang=\"ja\"><ruby>昨日<rt>きのう</rt></ruby>は<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>った。でも、<ruby>宿題<rt>しゅくだい</rt></ruby>をしなかった。</p><p>昨天去了學校，但沒有做功課。否定過去是ない→なかった。</p><h3>再看幾個例子</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>教師<rt>きょうし</rt></ruby>だから、人の<ruby>前<rt>まえ</rt></ruby>で<ruby>話<rt>はな</rt></ruby>すことが<ruby>多<rt>おお</rt></ruby>い。＝因為我是老師，所以常在人前說話。<br><ruby>今日<rt>きょう</rt></ruby>は<ruby>暇<rt>ひま</rt></ruby>？＝今天有空嗎？親近者會話中，名詞／な形容詞的だ常省略。<br>常體問句可用語調提問，不必一律加だか。</p><h3>容易混淆的地方</h3><p>普通形也會出現在敬體句子裡，如「<ruby>明日<rt>あした</rt></ruby><ruby>行<rt>い</rt></ruby>くと<ruby>思<rt>おも</rt></ruby>います」。不能只把ます刪掉，也不能給所有詞尾加だ。</p>","uploadedOriginal":"<p>[單元35] 日文的常體說法</p><p>學習目標</p><p>①　學習日文敬體和常體的轉換</p><p>②　習慣日文常體的說法</p><p>本單元開始，我們將正式介紹日文的「常体用法」。</p><p>我們之前也有大致提過，日文依照說話對象的不同，將使用方法分為「日文敬体」和「日文常体」。</p><p>日文敬体：使用「です、ます」的形式。</p><p>用於對長輩、地位較高者說話時。</p><p>例：学生です。美味しいです。静かです。書きます。</p><p>日文常体：不使用「です、ます」。</p><p>用於對平輩、家人朋友、晚輩說話時。</p><p>例：学生だ。おいしい。静かだ。書く。</p><p>簡單來說，「日文敬体」就是「尊敬」之意，用於需要表示敬意的人，通常是你的師長、公司上司、或是客戶。另外，「日文常体」就是「平常」之意，用於平時講話的時候，包括家人朋友、後生晚輩、學校同學、甚至是貓狗等寵物。聰明的各位一定知道，在日常生活中，其實「日文常体」用到的頻率，會大於「日文敬体」。不過，為什麼我們卻從「日文敬体」，也就是「です、ます」的形式開始學習？</p><p>無論你用的是哪一種教科書，在學習日文的初期，一定都是先學「日文敬体」，也就是大家熟悉的「～です～ます」。為什麼呢？為什麼我們要先學「日文敬体」而不是「日文常体」呢？</p><p>這是因為，在學習日文的初期，由於語言能力尚未熟練，因此在和日本人說話時，難免會因為文法或字彙能力的不足，而造成無法順利溝通、或是招致誤解的情況發生。由於「日文敬体」可以表示敬意，因此如果使用「日文敬体」來說話的話，即使無法順利交談或是有誤會產生，也不會導致失禮。也就是說，我們先學「禮貌性的說法」、再學「通俗性的說法」，先學「日文敬体」、再學「日文常体」，這是符合實際會話情況的學習模式。</p><p>舉例來說，如果有外國人向你問路，「ㄟ，車站怎麼走？」和「不好意思，請問如何去車站？」，哪一種說話方式會聽起來比較舒服呢？</p><p>關於「日文敬体」和「日文常体」學習順序的論文洋洋灑灑一大堆，不過簡單說來，大致上就是出於此一目的而會先學「日文敬体」。</p><p>在前三十四單元中，我們已經將「日文敬体」學到一定程度了，因此，我們要再更進一步，學習「日常生活」中使用的「日文常体」。儘管對師長們使用「日文敬体」十分得體，但是如果對熟識的朋友、或是家人使用「日文敬体」，反而會顯得相當怪異，就像叫自己的雙親「父親大人」「母親大人」一樣。因此，為了使用最生活化、最正確的日文，我們必須對於「日文常体」的用法相當熟悉才行。</p><p>本單元分成名詞、形容詞、動詞三個項目，將其「敬体」和「常体」的形式分別整理成表格。</p><p>名詞</p><div class=\"table-scroll\"><table><tbody><tr><td>敬体<br>（学生）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>学生です。</td><td>学生でした。</td></tr><tr><td>否定</td><td>学生では<br>ありません。</td><td>学生では<br>ありませんでした。</td></tr></tbody></table></div><div class=\"table-scroll\"><table><tbody><tr><td>常体<br>（学生）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>学生だ。</td><td>学生だった。</td></tr><tr><td>否定</td><td>学生ではない。</td><td>学生ではなかった。</td></tr></tbody></table></div><p>現在肯定：学生です → 学生だ</p><p>（現在是學生）</p><p>現在否定：学生ではありません → 学生ではない</p><p>（現在不是學生）</p><p>過去肯定：学生でした → 学生だった</p><p>（以前是學生）</p><p>過去否定：</p><p>学生ではありませんでした → 学生ではなかった</p><p>（以前不是學生）</p><p>文法分析：ありません＋でした</p><p>＝「ない」＋「だった」→　なかった</p><p>い形容詞</p><div class=\"table-scroll\"><table><tbody><tr><td>敬体<br>（大きい）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>大きいです。</td><td>大きかったです。</td></tr><tr><td>否定</td><td>大きく<br>ありません。</td><td>大きく<br>ありませんでした。</td></tr></tbody></table></div><div class=\"table-scroll\"><table><tbody><tr><td>常体<br>（大きい）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>大きい。</td><td>大きかった。</td></tr><tr><td>否定</td><td>大きくない。</td><td>大きくなかった。</td></tr></tbody></table></div><p>現在肯定：大きいです　→　大きい</p><p>（現在很大）</p><p>現在否定：大きくありません　→　大きくない</p><p>（現在不大）</p><p>過去肯定：大きかったです　→　大きかった</p><p>（以前很大）</p><p>過去否定：</p><p>大きくありませんでした　→　大きくなかった</p><p>（以前不大）</p><p>な形容詞</p><p>變化方式和名詞完全相同。</p><div class=\"table-scroll\"><table><tbody><tr><td>敬体<br>（有名）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>有名です。</td><td>有名でした。</td></tr><tr><td>否定</td><td>有名では<br>ありません。</td><td>有名では<br>ありませんでした。</td></tr></tbody></table></div><div class=\"table-scroll\"><table><tbody><tr><td>常体<br>（有名）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>有名だ。</td><td>有名だった。</td></tr><tr><td>否定</td><td>有名ではない。</td><td>有名ではなかった。</td></tr></tbody></table></div><p>現在肯定：有名です→有名だ</p><p>（現在很有名）</p><p>現在否定：有名ではありません→有名ではない</p><p>（現在不有名）</p><p>過去肯定：有名でした→有名だった</p><p>（以前很有名）</p><p>過去否定：</p><p>有名ではありませんでした→有名ではなかった</p><p>（以前不有名）</p><p>動詞</p><p>「動詞常体」的形式和變化方式，我們在之前的單元中詳細介紹過，相信各位應該不陌生才是。</p><div class=\"table-scroll\"><table><tbody><tr><td>敬体<br>（行く）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>行きます。</td><td>行きました。</td></tr><tr><td>否定</td><td>行きません。</td><td>行きませんでした。</td></tr></tbody></table></div><div class=\"table-scroll\"><table><tbody><tr><td>常体<br>（行く）</td><td>現在</td><td>過去</td></tr><tr><td>肯定</td><td>行く。</td><td>行った。</td></tr><tr><td>否定</td><td>行かない。</td><td>行かなかった。</td></tr></tbody></table></div><p>現在肯定：</p><p>行きます（動詞ます形）　→　行く（動詞原形）</p><p>（現在要去）</p><p>現在否定：行きません　→　行かない（動詞ない形）</p><p>（現在不去）</p><p>過去肯定：行きました　→　行った（動詞た形）</p><p>（之前有去）</p><p>過去否定：行きませんでした　→　行かなかった</p><p>（之前沒有去）</p><p>文法分析：否定の「ません」＋過去の「でした」</p><p>＝  否定の「動詞ない形」＋過去の「かった」</p><p>→　「～なかった」</p><p>因此，從本回開始，我們文法教材中的例句，將會同時包含以「動詞敬体」和以「動詞常体」書寫的例句。之前的單元中，為了方便理解，我們都儘量使用「動詞敬体」來造句，不過，為了讓各位也能熟悉「動詞常体」的說法，我們往後在編寫例句時，也會一併使用「動詞常体」來寫。</p><p>例：（第一句為「敬体」、第二句為「常体」）</p><p>私は先生ですから、人の前で話すことが得意です。</p><p>私は先生だから、人の前で話すことが得意だ。</p><p>（因為我是老師，所以擅長在人前談話。）<br>.</p><p>私は学校に行きました。</p><p>でも、宿題をしませんでした。</p><p>私は学校に行った。でも、宿題をしなかった。</p><p>（我去了學校。但是，沒有寫作業。）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"食べませんでした的普通形是？","options":["食べなかった","食べないだった","食べません","食べただ"],"answer":0,"explanation":"食べない的ない變なかった。"},{"prompt":"「昨天很安靜」的常體是？","options":["昨日は静かかった。","昨日は静かだった。","昨日は静かだ。","昨日は静かいだった。"],"answer":1,"explanation":"な形容詞過去肯定用だった。"},{"prompt":"下列哪個正確？","options":["寒いだ","寒いだった","寒かった","寒いでした"],"answer":2,"explanation":"い形容詞去い加かった。"},{"prompt":"「明日行くと思います」是哪種情況？","options":["不可能出現普通形","整句只能是粗魯用語","行く必須改成行きます","內部用普通形，句末用敬體"],"answer":3,"explanation":"許多句型要求普通形接續，而整句仍可用ます表達禮貌。","rubyView":{"prompt":"「<ruby>明日<rt>あした</rt></ruby><ruby>行<rt>い</rt></ruby>くと<ruby>思<rt>おも</rt></ruby>います」是哪種情況？","options":["不可能出現普通形","整句只能是粗魯用語","行く必須改成行きます","內部用普通形，句末用敬體"],"explanation":"許多句型要求普通形接續，而整句仍可用ます表達禮貌。"}}]},{"id":36,"title":"表示引用的「と」","symbol":"と思う","intro":"轉述別人的話，也說出自己的想法。","tag":"と言う・と思う・引用","concepts":[["と標示引用內容","<mark class=\"study-key\">引用內容</mark>＋と＋言う／答える等，と放在被引用的話後面。日文也使用引號「」。","先生は「<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです」と言いました。","老師說：「明天放假。」直接引用可保留原來的です，不必改成<mark class=\"study-key\">普通形</mark>。"],["と思う：表達想法","通常用<mark class=\"study-key\">普通形</mark>＋<mark class=\"study-key\">と思う</mark>／思います。名詞、な形容詞非過去肯定的だ要保留。","この<ruby>町<rt>まち</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かだと<ruby>思<rt>おも</rt></ruby>います。","我覺得這個城鎮很安靜。不是静か<mark class=\"study-key\">と思います</mark>。"],["別人的想法看資訊來源","轉述已知想法常用<mark class=\"study-key\">と思っています</mark>或說明消息來源，不是禁止用第三人稱。","<ruby>田中<rt>たなか</rt></ruby>さんは、この<ruby>方法<rt>ほうほう</rt></ruby>がいいと<ruby>思<rt>おも</rt></ruby>っています。","田中認為這個方法好。說話者應有得知其想法的語境。"],["省略與間
