t>はっぴき</rt></ruby>、<ruby>九匹<rt>きゅうひき</rt></ruby>、<ruby>十匹<rt>じゅっぴき</rt></ruby>。<ruby>何匹<rt>なんびき</rt></ruby>。<br>貓、狗等常用匹；鳥常用羽，大型動物常用頭，但並非按某種動物的大小硬性切分。</p><h3>人（にん）：人數</h3><p><ruby>一人<rt>ひとり</rt></ruby>、<ruby>二人<rt>ふたり</rt></ruby>、<ruby>三人<rt>さんにん</rt></ruby>、<ruby>四人<rt>よにん</rt></ruby>、<ruby>五人<rt>ごにん</rt></ruby>。<br><ruby>六人<rt>ろくにん</rt></ruby>、<ruby>七人<rt>ななにん</rt></ruby>、<ruby>八人<rt>はちにん</rt></ruby>、<ruby>九人<rt>きゅうにん</rt></ruby>、<ruby>十人<rt>じゅうにん</rt></ruby>。<ruby>何人<rt>なんにん</rt></ruby>。</p><h3>其他常見量詞</h3><p>冊：書本；台：車輛、機器；歳：年齡；着：衣服；回：次數；足：成雙鞋襪；軒：房屋；階：樓層；番：次序。</p><h3>兩種基本語序</h3><p><ruby>机<rt>つくえ</rt></ruby>の上にペンが二<ruby>本<rt>ほん</rt></ruby>あります。＝桌上有兩枝筆。<br><ruby>机<rt>つくえ</rt></ruby>の上に二<ruby>本<rt>ほん</rt></ruby>のペンがあります。＝桌上有兩枝筆。<br>りんごを三個買いました。＝買了三個蘋果。<br>ペンは何<ruby>本<rt>ほん</rt></ruby>ありますか。＝有幾枝筆？<br>先熟練「名詞＋助詞＋<mark class=\"study-key\">數量</mark>」及「<mark class=\"study-key\">數量</mark>＋の＋名詞」；不要把所有其他語序都視為絕對錯誤。</p>","symbol":"数える","intro":"看物件的種類，選擇合適的數法。","tag":"個・つ・本・枚・匹・人","concepts":[["形狀與對象","個：小型物件；本：<mark class=\"study-key\">細長物</mark>；枚：<mark class=\"study-key\">扁平物</mark>；匹：中小型動物；人：人數。つ也可數一般物件或抽象項目。","ペンが二<ruby>本<rt>ほん</rt></ruby>あります。<ruby>写真<rt>しゃしん</rt></ruby>が三<ruby>枚<rt>まい</rt></ruby>あります。","有兩枝筆、三張照片。「本」不是用來數書本。"],["特別讀音要一起記","一本<mark class=\"study-key\">いっぽん</mark>、三本<mark class=\"study-key\">さんぼん</mark>、六本ろっぽん；一匹いっぴき、三匹さんびき；一人ひとり、二人ふたり、四人よにん。","<ruby>猫<rt>ねこ</rt></ruby>が三<ruby>匹<rt>ひき</rt></ruby>います。","有三隻貓。三匹讀作さんびき。"],["數量可以放在哪裡","常用「名詞が＋<mark class=\"study-key\">數量</mark>＋あります／います」，或「<mark class=\"study-key\">數量</mark>の名詞が＋あります／います」。","りんごが<ruby>二<rt>ふた</rt></ruby>つあります。<ruby>二<rt>ふた</rt></ruby>つのりんごがあります。","兩句都可表示有兩個蘋果。二つ讀作ふたつ。"]],"caution":"補充：傳統數法有十（とお），雖然沒有つ字尾。個並非只限口語；單位詞要配合物件與慣用法，不是單靠大小或形狀就能判定所有例子。","quiz":[{"prompt":"數三張照片應用？","options":["三本","三匹","三枚","三人"],"answer":2,"explanation":"照片是扁平物，使用枚。"},{"prompt":"三枝筆的「三本」讀作？","options":["さんほん","みっぽん","さんぽん","さんぼん"],"answer":3,"explanation":"三本讀さんぼん，注意濁音ぼ。"},{"prompt":"二人的讀音是？","options":["ふたり","ににん","ふたにん","にひと"],"answer":0,"explanation":"一人ひとり、二人ふたり屬特別讀音。"},{"prompt":"哪句符合本課「名詞が＋數量＋存在動詞」的句型？","options":["猫三匹がいます。","猫が三匹います。","三匹が猫います。","猫のが三匹います。"],"answer":1,"explanation":"先用猫が指出事物，再用三匹補充數量，動物用います。"}],"uploadedOriginal":"<h3>[ 單元15 ] 日文中的單位詞</h3><h3>學習目標</h3><h3>①　學習日文中常用的數量詞</h3><p>經常聽到學習中文的外國人說，中文當中的「數量單位」太複雜了、無從學起，例如「一張桌子、一把椅子、一隻狗、一頭牛、一匹馬、一條蛇、一尾魚」等等，以「張」、「把」、「隻」等等的字來計算特定東西的數量，這些字，我們稱之為「數量單位詞」。也許各位沒有注意到，不過中文的數量單位詞其實非常多樣且複雜，像是描述「動物」就有好幾種計算單位（如上）。</p><p>日文和中文相似，也有所謂的「數量單位詞」，種類也相當繁多。那麼身為外國人的我們，該如何學習呢？一個一個背嗎？不，有更好的方法。</p><p>我們對每位學習中文的外國人，都給了相同的建議。雖然中文的單位詞很多，但是口語中常用的就那幾個，記住那些少數常用的就好，待行有餘力後，再慢慢學習其他的單位詞。像是中文當中，常用「個」「隻」，你可以將「一張桌子」「一把椅子」說成「一個桌子」「一個椅子」，說「一隻狗」「一隻牛」「一隻馬」「一隻蛇」「一隻魚」，雖然意思有時並不精準，但是大家聽得懂。這是中文學習者的救星。同樣地，在學習日文時，我們只要先學習那些常用的數量單位詞就可以了。</p><p>這一單元中，我們將介紹六種常用的數量單位詞、以及相關句型用法。</p><p>單位詞1:個(こ)</p><p>中文最常使用的單位詞，應該要算是「個」了吧。一個人、一個蛋糕、一個盤子、一個叉子。日文中，也有「個」這個單位詞，用途同樣非常廣泛，在口語會話時，可以代替許多其他單位詞。</p><p>用途:廣泛用於計算非扁平、非細長狀的小型物體。</p><p>例：文房具（消しゴム・クリップなど）、</p><p>果物（りんご・オレンジ・メロン・苺など）、</p><p>円い物（石・卵・飴・コインなど）、</p><p>飾り物（宝石・ピアス・リングなど）、</p><p>台風、星、箱等々。</p><p>唸法和數字唸法相似:</p><p>一個：いっこ  二個：にこ  三個：さんこ 四個：よんこ</p><p>五個：ごこ　 六個：ろっこ 七個：ななこ</p><p>八個：はっこ　九個：きゅうこ　十個：じゅっこ</p><p>疑問詞:何個（なんこ）</p><p>單位詞2:つ</p><p>「つ」是日文傳統的數量單位詞，也可以廣泛用於計算形狀非扁平、非細長狀的物體。不過，「つ」和剛才介紹的「個」有幾個地方不同。</p><p>①「個」較偏向口語會話用法，而「つ」也可用在正式場合和文章書信中。</p><p>②「つ」可以用於計算「抽象事物」。</p><p>③「つ」只能進行個位數計算，也就是只能從一算到九，無法進行十位數以上的計算。</p><p>用途:廣泛用於計算形狀非扁平、非細長狀的物體，以及抽象事物。</p><p>例：</p><p>（這裡僅列出「抽象事物」的部份）</p><p>可能性・謎・選択・影・足跡・年齢・願い　等々。</p><p>唸法方面，使用日本古語唸法，和數字唸法完全不同，無規則可循，需直接記起來。</p><p>一つ：ひとつ　二つ：ふたつ　三つ：みっつ</p><p>四つ：よっつ　五つ：いつつ　六つ：むっつ</p><p>七つ：ななつ　八つ：やっつ　九つ：ここのつ</p><p>單位詞3:本</p><p>日文單位詞「本」，用於計算「細細長長」的東西上，和中文的「本」不同。只要是形狀呈現細長狀的東西，幾乎都可以用「本」來計算。</p><p>用途:用於形狀呈現細長狀的物體。</p><p>例：鉛筆・傘・野菜・紐・剣・樹木・ビール・橋・タワー・高層ビル・トンネル等々。</p><p>促音後面多為半濁音，其他唸法較沒有規則可循，需多加練習。</p><p>一本：いっぽん　二本：にほん　三本：さんぼん</p><p>四本：よんほん　　五本：ごほん　六本：ろっぽん　七本：ななほん</p><p>八本：はっぽん　　九本：きゅうほん　十本：じゅっぽん</p><p>單位詞4:枚</p><p>日文單位詞「枚（まい）」，用於計算「扁平狀」的東西，和中文的「枚」相似，不過用途更廣，只要是扁平狀的物體，幾乎都可以用「枚」來計算。</p><p>用途: 用於形狀呈現扁平狀的物體。</p><p>例：看板・黒板・屋根・床・畳・窓・皿・CD・紙類・写真・布・服・着物・布団・カーテン・絵画等々。</p><p>唸法很單純，為「數字唸法」加上「枚（まい）」。</p><p>一枚：いちまい　二枚：にまい　三枚：さんまい</p><p>四枚：よんまい　五枚：ごまい　六枚：ろくまい</p><p>七枚：ななまい　八枚：はちまい</p><p>九枚：きゅうまい　十枚：じゅうまい</p><p>單位詞5:匹</p><p>日文單位詞「匹（ひき）」，可以用於計算除了鳥類之外的所有中小型動物。一般來說，比山羊小的動物用「匹」計算，而比山羊大的動物（如馬、象、恐龍等），會以「頭（とう）」來計算，而鳥類則用「羽（わ）」。由於「匹」是其中使用頻率最高的，因此本單元只介紹「匹」這項用法。另外，山羊本身也多用「匹」計算。</p><p>用途: 用於中小型動物。</p><p>例：鼠・蛇・羊・猿・犬・豚・猫・ハムスター等々。</p><p>一匹：いっぴき　二匹：にひき　 三匹：さんびき</p><p>四匹：よんひき　五匹：ごひき　 六匹：ろっぴき　七匹：ななひき</p><p>八匹：はっぴき　九匹：きゅうひき　十匹：じゅっぴき</p><p>單位詞6:人</p><p>日文單位詞「人（にん）」，顧名思義，用來計算人數。</p><p>用途: 用以計算人數。</p><p>唸法方面，「一人」「二人」「四人」的唸法較特別，其餘和數字唸法相同。</p><p>一人：ひとり　二人：ふたり　三人：さんにん</p><p>四人：よにん　五人：ごにん　六人：ろくにん</p><p>七人：ななにん　　八人：はちにん</p><p>九人：きゅうにん　十人：じゅうにん</p><h3>其他單位詞</h3><p>其他還有許多常用的單位詞，但用法較單純，不容易混淆，簡單條列如下:</p><p>番（ばん）:計算順序。</p><p>台（だい）:計算交通工具及電器用品。</p><p>歳（さい）:計算年齡。</p><p>着（ちゃく）:計算衣服。</p><p>回（かい）:計算頻率。</p><p>足（そく）:計算鞋子跟襪子。</p><p>軒（けん）:計算房屋。</p><p>階（かい）:計算樓層。</p><h3>句型</h3><p>我們使用之前學習過表示「在什麼地方有什麼東西」的「存在句型」。將「數量單位詞」放在助詞「が」的後面，即為表示數量單位的句型。</p><p>基本用法：</p><p>（場所）に（東西） が 　います／あります。</p><p>（場所）に（東西）が （数量単位）　います／あります。</p><p>例：</p><p>机の上に ペンが 二本 あります。（桌上有二枝筆。）</p><p>冷蔵庫に オレンジが 三つ あります。</p><p>（冰箱裡有三顆橘子。）</p><p>貯金箱に コインが 四十個 あります。</p><p>（存錢筒裡有四十枚硬幣。）</p><p>引き出しに ハムスターが 一匹 います。</p><p>（抽屜裡有一隻倉鼠。）</p><p>或是以「の」連接數量單位和東西:</p><p>基本用法②：</p><p>（場所地點）に（東西） が 　います／あります。</p><h3>↓</h3><p>（場所）に（数量単位）の（東西）がいます／あります。</p><p>例：</p><p>机の上に 二本 の ペンが あります。</p><p>（桌上有二枝鉛筆。）</p><p>冷蔵庫に 三つ の オレンジが あります。</p><p>（冰箱裡有三顆橘子。）</p><p>貯金箱に 四十個 の コインが あります。</p><p>（存錢筒裡有四十枚硬幣。）</p><p>引き出しに 一匹 の ハムスターが います。</p><p>（抽屜裡有一隻倉鼠。）</p><p>以上二句都可以。初學者常常會依照中文的習慣，寫成「（東西）（数量単位）が います／あります」，例如「りんご3個があります」，這是錯誤寫法，需特別小心。</p><p>若要詢問有多少數量時，則使用以下問句:</p><p>基本用法：</p><p>（東西）は （数量単位）いますか／ありますか。</p><p>例：今年の台風は 何個 ありました か。</p><p>（今年有幾個颱風呢？）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":16,"title":"希望的說法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用たい表達想做甚麼，用<mark class=\"study-key\">をください</mark>提出索取或點餐請求。</p><h3>ます去掉ます＋たい</h3><p><ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>ります→<ruby>帰<rt>かえ</rt></ruby>りたい。＝想回去。<br><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べます→<ruby>食<rt>た</rt></ruby>べたい。＝想吃。<br>する→します→したい；<ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>き</rt></ruby>ます→<ruby>来<rt>き</rt></ruby>たい（きたい）。<br><ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたいです。＝我想去日本。</p><h3>たい的四種形式</h3><p><ruby>食<rt>た</rt></ruby>べたいです：想吃。<ruby>食<rt>た</rt></ruby>べたくないです：不想吃。<br><ruby>食<rt>た</rt></ruby>べたかったです：當時想吃。<ruby>食<rt>た</rt></ruby>べたくなかったです：當時不想吃。<br>也可用食べたくありません／<ruby>食<rt>た</rt></ruby>べたくありませんでした。<br>たい的變化像い形容詞，不說食べたいでした。</p><h3>自己與他人的願望</h3><p>直接陳述自己的<mark class=\"study-key\">願望</mark>常用たい；問對方可說何を食べ<mark class=\"study-key\">たいです</mark>か。<br>轉述別人的願望：<ruby>彼<rt>かれ</rt></ruby>は<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたいと<ruby>言<rt>い</rt></ruby>っています。＝他說想去日本。<br>描述表現出的願望：<ruby>子<rt>こ</rt></ruby>どもが遊びたがっています。＝孩子表現出想玩的樣子。<br>たがる不是對所有他人一律替換的規則；願望的資訊來源和語境很重要。</p><h3>物品＋をください</h3><p><ruby>水<rt>みず</rt></ruby>をください。＝請給我水。<br>これ<mark class=\"study-key\">をください</mark>。＝請給我這個。<br>レシートをください。＝請給我收據。<br>たい表達願望，をください是向人請求。ください來自くださる的形式，不是直接把くれる按一般規則變形。</p>","symbol":"したい","intro":"說出心裡想做的事，也學會點餐。","tag":"たい・變化・ください","concepts":[["想做甚麼","動詞ます形<mark class=\"study-key\">去掉ます</mark>，再接<mark class=\"study-key\">たいです</mark>，表達自己的願望。","<ruby>京都<rt>きょうと</rt></ruby>に<ruby>行<rt>い</rt></ruby>きたいです。","我想去京都。行きます→行きたい。"],["願望也有否定和過去","たい的變化類似い形容詞：<mark class=\"study-key\">たくありません</mark>、<mark class=\"study-key\">たかったです</mark>、たくありませんでした。","<ruby>昨日<rt>きのう</rt></ruby>は<ruby>出掛<rt>でか</rt></ruby>けたくありませんでした。","昨天不想出門。"],["請給我……","點餐或買東西時，可以用「名詞＋<mark class=\"study-key\">をください</mark>」。","お<ruby>茶<rt>ちゃ</rt></ruby>をください。","請給我茶。これは何ですか之後，也可指著說「これ<mark class=\"study-key\">をください</mark>」。"]],"caution":"たい也可在問句中詢問對方的<mark class=\"study-key\">願望</mark>。描述別人的<mark class=\"study-key\">願望</mark>要看語境與資訊來源，不能只把主詞改成他／她。ください來自くださる，並非くれる的直接變化。","quiz":[{"prompt":"「我想去日本」的正確說法是？","options":["日本に行くたいです。","日本に行きますたいです。","日本に行ったいです。","日本に行きたいです。"],"answer":3,"explanation":"行きます去掉ます，再接たいです。"},{"prompt":"「昨天不想吃」應用哪句？","options":["昨日は食べたくありませんでした。","昨日は食べたいです。","昨日は食べたいでした。","昨日は食べたくます。"],"answer":0,"explanation":"たい的過去否定可用たくありませんでした。"},{"prompt":"點餐時想禮貌地說「請給我水」，可以說？","options":["水がたいです。","水をください。","水にください。","水をたいでした。"],"answer":1,"explanation":"名詞をください，是本課的請求物品句型。"},{"prompt":"買います改為「想買」是？","options":["買うたい","買いたいました","買いたい","買いますたい"],"answer":2,"explanation":"把ます去掉，留下買い，再接たい。"}],"uploadedOriginal":"<h3>[ 單元16 ] 希望的說法</h3><h3>學習目標</h3><h3>①　學會表示自身希望的「動詞＋たい」用法</h3><h3>②　學會「動詞＋たい」的現在及過去式用法</h3><h3>③　學會「名詞＋をください」用法</h3><p>本單元的主題為「日文中希望的說法」，簡單來說，就是我們日常生活中常用的「我想要~~」句型，例如「我想吃飯」「我想看電視」「我不想早起」等等，用以表示說話者個人的希望或期望。日文當中，這種「想要~」的希望用法，則是以動詞變化的方式來表現，因此我們先複習一下先前學過的「動詞ます形」，如此在學習本單元時會更得心應手。既然是動詞變化，不可免俗地，也有所謂的現在式及過去式用法，因此我們也會以圖解的方式，解說現在和過去式。最後，則會介紹一個使用頻率非常高的句型「名詞＋をください」，翻成中文是「請給我~」，經常用在購買東西或是點餐時。在許多購物及點餐的句型中，「をください」是最簡潔、實用且禮貌的說法。</p><p>從本單元開始，會介紹較多日文動詞的語尾變化，這在日文的意思表達上佔了很重要的角色。我們推薦以「羅馬拼音」的方式來理解這些變化，不但較容易上手，和傳統教學方法相比、也可以更快活用於會話中。因此，在繼續學習之前，請先確保你已經記住了假名的羅馬拼音。</p><p>本單元有三項學習重點:</p><p>① 學會表示自身希望的「動詞＋たい」用法。</p><p>② 學會「動詞＋たい」的現在及過去式用法。</p><p>③ 學會「名詞＋をください」用法。</p><p>我們將依序進行介紹。</p><h3>動詞＋たい</h3><p>日中當中，以「動詞＋たい」來表示說話者的希望、期望，相當於中文的「我想~~」。日文會以動詞的不同形態來代表不同意義，就像我們先前介紹過的、以「動詞ます形」表示尊敬之意一樣。</p><p>「動詞＋たい」的變化方法，和「動詞ます形」的變化方法完全相同。如有疑惑處，可以回去參考先前的說明。</p><p>「動詞＋たい」:</p><p>將「動詞ます形」去掉「ます」後加上「たい」。</p><p>例：</p><p>（Ⅰ）帰る　→　帰ります　→　帰りたい</p><p>（Ⅰ）買う　→　買います　→　買いたい</p><p>（Ⅰ）遊ぶ　→　遊びます　→　遊びたい</p><p>（Ⅱ）始める　→　始めます　→　始めたい</p><p>（Ⅱ）忘れる　→　忘れます　→　忘れたい</p><p>（Ⅱ）続ける　→　続けます　→　続けたい</p><p>句型用法:  私  は （動詞たい） です</p><p>例：</p><p>私は 実家に 帰りたい です。（我想回老家。）</p><p>私は マイカーを 買いたい です。</p><p>（我想買一台自己的車。）</p><p>私は 親友と 遊びたい です。</p><p>（我想和好朋友一起玩。）</p><p>私は 討論を 始めたい です。</p><p>（我想開始進行討論。）</p><p>私は あの記憶を 忘れたい です。</p><p>（我想忘掉那時的記憶。）</p><p>私は 学業を 続けたい です。</p><p>（我想持續課業。）</p><p>這裡要注意的是，表示「個人希望」的「たい」，主詞一般會用「第一人稱（我）」，</p><p>例如，你可以說「私は家に帰りたいです。（我想回家）」，但是不能說成「彼は実家に帰りたいです。（他想回老家）」為什麼呢？因為日本人很注重禮貌，認為去猜測對方心中所希望的事情非常失禮，因此「たい」這個表示希望的用法，一般只用在自己（第一人稱）身上。</p><p>那麼，如果要敘述他人的希望、期望，那要怎麼說呢？</p><p>敘述他人希望 :</p><p>動詞＋「たい」　→　動詞＋「たがる」</p><p>只要將原本的「たい」改為動詞「たがる」就可以了。</p><p>「たがる」為Ⅰ類動詞，「ます形」為「たがります」。</p><p>例：</p><p>彼は 実家に 帰りたがります。</p><p>（他想回老家。）</p><p>彼女は マイカーを 買いたがります。</p><p>（她想買一台自己的車。）</p><p>あの子どもは 親友と 遊びたがります。</p><p>（那個小孩想和好朋友玩。）</p><p>先生は 討論を 始めたがります。</p><p>（老師想開始進行討論。）</p><p>お爺さんは 昔の記憶を 忘れたがります。</p><p>（爺爺想忘記以前的事。）</p><p>弟は 学業を 続けたがります。</p><p>（弟弟想持續課業。）</p><p>關於「たがります」的詳細定義及用法區別，我們會在之後談到，目前大家只需知道「たがります」用在第一人稱以外的情況就可以了。</p><h3>たい現在式和過去式</h3><p>不會吧，才剛學完了形容詞和動詞的現在過去式，現在又要學新的！我們幾乎可以聽見各位心中如此吶喊。先別緊張，有沒有覺得「たい」和「い形容詞」很像，字尾都是「い」？</p><p>沒錯，「たい」的動詞變化，和「い形容詞」一模一樣！</p><p>將「たい」當成另類的「い形容詞」就沒問題了。</p><p>彙整成表格形式如下：</p><div class=\"table-scroll\"><table><tr><th></th><th>現在</th><th>過去</th></tr><tr><td>肯定</td><td>～たいです。</td><td>～たかったです。</td></tr><tr><td>否定</td><td>～たく<br>ありません。</td><td>～たく<br>ありませんでした。</td></tr></table></div><p>例：私は世界一周をしたいです。</p><p>（我想環遊世界。）</p><p>私は世界一周をしたかったです。</p><p>（我曾經想環遊世界。）  過去式</p><p>私は世界一周をしたくありません。</p><p>（我不想環遊世界。）  現在否定</p><p>私は世界一周をしたくありませんでした。</p><p>（我之前不想環遊世界。） 過去否定</p><p>私はもっと頑張りたいです。</p><p>（我想更努力一些。）</p><p>私はもっと頑張りたかったです。</p><p>（我曾經想更努力一些。）  過去式</p><p>私は頑張りたくありません。</p><p>（我不想努力。）  現在否定</p><p>私は頑張りたくありませんでした。</p><p>（我之前不想努力。）  過去否定</p><h3>名詞＋をください</h3><p>出國旅行時，我們使用最頻繁的會話，應該就是「請給我～～」這個句型了，無論是買東西、點餐、入住旅館時，都會用到。然而，我們上面介紹的「たい」句型，主要功能為單純敘述自己的個人希望，因此，若是我們向對方直接使用「～たい」，難免會顯得不夠禮貌。這時最推薦使用的一項萬用句型，就是「名詞＋をください」這個用法。</p><p>句型:（名詞）をください</p><h3>等同中文的「請給我…」</h3><p>其中的「ください」，是我們之前學過的動詞「くれる」的變化形態，同樣是「給我」的意思。</p><p>例：</p><p>刺身 を ください。</p><p>（點餐時） 請給我生魚片。</p><p>レシート を ください。</p><p>（買完東西時） 請給我發票。</p><p>これ を ください。</p><p>（不會唸菜單，用手指） 請給我這個。</p><p>このリング を ください。</p><p>（挑選物品時） 請給我這個戒指。</p><p>広い部屋 を ください。</p><p>（在旅館） 請給我大的房間。</p><p>明日の食券 を ください。</p><p>（在旅館） 請給我明天的餐卷。</p><p>おつり を ください。</p><p>（要對方找錢時） 請給我找的錢。</p><p>チケット を ください。</p><p>（車站買票時） 請給我車票。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":17,"title":"能力的說法和名詞化","original":"<h3>學習目標</h3><p class=\"lesson-focus\">區分「能做到」和「明白」，並用こと把動作當成一件事。</p><h3>名詞ができます：能做／會</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>日本語<rt>にほんご</rt></ruby>ができます。＝我會日文。<br><ruby>料理<rt>りょうり</rt></ruby>ができます。＝會做菜。<br>できる是第二類動詞；できません＝不會／不能。</p><h3>名詞がわかります：明白／理解</h3><p><ruby>日本語<rt>にほんご</rt></ruby>がわかります。＝懂日文。<br>先生の説明がよくわかります。＝很明白老師的解釋。<br>わかりました常用於回應「明白了」。理解某項內容，不等於能實際執行某個動作。</p><h3>辭書形＋ことができます</h3><p><ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>ぐことができます。＝會游泳。<br><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すことができます。＝會說日文。<br><ruby>難<rt>むずか</rt></ruby>しい<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むことができます。＝能讀艱深的書。<br>こと把前面的動作當作一件事；不寫泳ぎますことができます。</p><h3>程度說法</h3><p>よくわかります＝很明白；だいたいわかります＝大致明白。<br><ruby>少<rt>すこ</rt></ruby>しできます＝會一點；<mark class=\"study-key\">あまり</mark>できません＝不太會；<ruby>全然<rt>ぜんぜん</rt></ruby>できません＝完全不會。<br>程度詞沒有固定百分比。よく也可表示「經常」，要看搭配和語境。</p><h3>問與答</h3><p><ruby>日本語<rt>にほんご</rt></ruby>がわかりますか。＝懂日文嗎？<br><ruby>少<rt>すこ</rt></ruby>しわかります。ゆっくり<ruby>話<rt>はな</rt></ruby>してください。＝懂一點，請慢慢說。<br>何ができますか。＝會做甚麼？<br>ギターを<ruby>弾<rt>ひ</rt></ruby>くことができます。＝會彈吉他。</p>","symbol":"できる","intro":"把「會做」和「明白」分清楚。","tag":"能力・こと・程度","concepts":[["できます與分かります","<mark class=\"study-key\">できます</mark>表示能做；<mark class=\"study-key\">分かります</mark>表示理解或明白。先配合名詞學習。","<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>少<rt>すこ</rt></ruby>し<ruby>分<rt>わ</rt></ruby>かります。","懂一點日文。少し表示程度不高。"],["把動作當成一件事","動詞辭書形＋<mark class=\"study-key\">ことができます</mark>。こと讓前面的動作可以作為<mark class=\"study-key\">名詞使用</mark>。","<ruby>私<rt>わたし</rt></ruby>は<ruby>泳<rt>およ</rt></ruby>ぐことができます。","我會游泳。用泳ぐ，不是泳ぎます。"],["說出程度","よく、だいたい、少し等可補充程度；本課的<mark class=\"study-key\">あまり</mark>、<mark class=\"study-key\">全然</mark>搭配否定。","<ruby>日本語<rt>にほんご</rt></ruby>があまり<ruby>分<rt>わ</rt></ruby>かりません。","不太懂日文。<mark class=\"study-key\">全然</mark>分かりません則是完全不懂。"]],"caution":"副詞的程度沒有固定百分比。こと在這裡是作名詞化用途的名詞，不是助詞；「會做」也不一定等於「很擅長」。","quiz":[{"prompt":"「我會游泳」應該說？","options":["泳ぐことができます。","泳ぎますことができます。","泳ぐができます。","泳ぐことをできます。"],"answer":0,"explanation":"能力句型是動詞辭書形＋ことができます。"},{"prompt":"「分かります」主要表達哪個意思？","options":["把物品送出","理解、明白","想做某事","邀請同行"],"answer":1,"explanation":"分かります表達理解或明白；できます表達能做。","rubyView":{"prompt":"「<ruby>分<rt>わ</rt></ruby>かります」主要表達哪個意思？","options":["把物品送出","理解、明白","想做某事","邀請同行"],"explanation":"分かります表達理解或明白；できます表達能做。"}},{"prompt":"想說不太懂日文：日本語があまり＿＿。","options":["分かります","分かりました","分かりません","分かりましょう"],"answer":2,"explanation":"本課的あまり配合否定：あまり分かりません。"},{"prompt":"「本を読むこと」中的こと有甚麼功能？","options":["令動詞變成過去","表示一定能做到","表示否定","把讀書這個動作名詞化"],"answer":3,"explanation":"讀書變成「讀書這件事」，便可放到需要名詞的位置。","rubyView":{"prompt":"「<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むこと」中的こと有甚麼功能？","options":["令動詞變成過去","表示一定能做到","表示否定","把讀書這個動作名詞化"],"explanation":"讀書變成「讀書這件事」，便可放到需要名詞的位置。"}}],"uploadedOriginal":"<h3>[ 單元17 ] 能力的說法和名詞化</h3><h3>學習目標</h3><p>①　學會表示能力的「名詞＋ができます」「名詞＋が分かります」</p><h3>②　學會使用「こと」將動詞名詞化</h3><h3>③　學會程度副詞「よく」「だいたい」「少し」</h3><p>本單元我們將介紹日文中關於「能力」的說法，什麼意思呢？就是像「我會騎自行車」、「我會游泳」、「我了解書籍內容」這些表示「個人能力」的句型。這個句型，在日文中可以用動詞「できます」和「分かります」來表達。</p><p>乍看之下，似乎沒什麼特別的，只要曉得基本句型，就可以應用自如了。但是，我們將經由這二種表示能力的動詞及其句型，來學習另外二項更重要的日文用法：「動詞名詞化」，以及用在「能力句型」上的「程度副詞」。這二項將是我們本單元學習的重點。</p><p>我們將分三階段介紹。首先，先介紹表示能力的「名詞＋ができます」和「名詞＋が分かります」；其次，介紹「動詞名詞化＋ができます」的「こと」用法；最後，補充數個用來形容「能力」的程度副詞，像是「よく」、「だいたい」、「少し」等等。</p><h3>できます</h3><p>最常用來表示能力的句型，就是「名詞＋ができます」。</p><p>「できます」為Ⅱ類動詞「できる」的動詞ます形，意思是「會…、能夠…」。助詞「が」一般習慣接在「できる」等表示能力的動詞之前，算是一種慣用法。</p><p>句型:（人称）は　（名詞）　が　できます。</p><p>（某人會…、某人能夠…）</p><p>這裡必須特別注意，在「～ができます」之前，只能填入「名詞」。至於如何使用動詞，我們稍後會再進行介紹。</p><p>例：</p><p>私 は 日本語 が できます。（我會日文。）</p><p>彼 は 中国語と英語 が できます。</p><p>（他會中文和英文。）</p><p>彼女 は ボーリング が できます。</p><p>（她會打保齡球。）</p><p>私の友達 は 野球とサッカー が できます。</p><p>（我的朋友會棒球和足球。）</p><p>学校の先生 は 数学 が できます。</p><p>（學校老師會數學。）</p><p>大学の先輩 は 商売 が できます。</p><p>（大學的學長會做生意。）</p><p>母 は 日本料理 が できます。</p><p>（母親會做日本料理。）</p><p>父 は 台湾料理 が できます。</p><p>（父親會做台灣料理。）</p><p>部長 は 仕事 が できます。</p><p>（部長會工作、部長工作能力很強。）</p><h3>わかります</h3><p>第二項介紹的句型為「名詞＋がわかります」。「わかります」是Ⅰ動詞「分かる」的「ます形」，意思為「知道、明白」，經常用在回答對方指示的時候，</p><p>例如：</p><p>「来週テストがありますよ！（下週有考試喔！）」</p><p>「はい、わかりました！（好，我知道了！）」</p><p>在「～がわかります」之前，一般常接「名詞」。</p><p>句型:（人称）は　（名詞）　が　わかります。</p><p>（某人了解…、某人知道…）</p><p>例：</p><p>私は 日本語が わかります。</p><p>（我了解日文／我會日文。）</p><p>彼は 中国語と英語が わかります。</p><p>（他了解中文和英文／他會中文和英文。）</p><p>彼女は 明日の天気が わかります。</p><p>（她知道明天的天氣。）</p><p>先生は テストの解答が わかります。</p><p>（老師知道考試的答案。）</p><p>みんなは 運動会の予定が わかります。</p><p>（大家知道運動會的規劃。）</p><p>母は 料理の方法が わかります。</p><p>（母親知道做菜的方法。）</p><p>弟は 父の性格が わかります。</p><p>（弟弟很了解父親的個性。）</p><p>先生は 学生の気持ちが わかります。</p><p>（老師很了解學生的心情。）</p><p>ニュースで 道の状況が わかります。</p><p>（利用新聞了解道路狀況。）</p><p>インターネットで 新幹線の時刻表が わかります。</p><p>（利用網路了解新幹線的時刻表。）</p><h3>動詞＋できます</h3><p>我們先前說過，「～ができます」之前只能接名詞，但是現實情況中，有許多時候也會用到動詞，例如「我會打棒球」「我會游泳」等等。那麼，「動詞」要如何和「できます」一起使用呢？</p><p>既然「できます」前面只能接名詞，那我們直接「將動詞名詞化」不就好了嗎？這時，扮演將動詞名詞化角色的，就是助詞「こと」。</p><p>使用句型如下:</p><p>（名詞）が　できます。</p><p>（動詞原形＋こと）が　できます。</p><p>這裡必須注意的是，「こと」之前必須接「動詞原形」。</p><p>我們先前練習過「動詞原形」和「動詞ます形」的轉換，對於「動詞原形」，大家應該不陌生才是。</p><p>「こと」這個字，本來為名詞，漢字寫作「事」，是「事情」的意思，例如「このこと（這件事情）、大きいこと（大事情）」等等用法。在這裡則具有「名詞化」的功能，例如:「泳ぐ」為動詞，但是加上「こと」，變成「泳ぐこと」後，就可以當作名詞來使用。</p><p>「動詞」加上「こと」的用法，例如:「私は泳ぐことができます」，可以理解成「我會做游泳這件事情」，如此可以幫助快速記憶。</p><p>例：</p><p>私は 泳ぐ ことが できます。（我會游泳。）</p><p>私は 料理を 作ることが できます。（我會做菜。）</p><p>私は 歌を 歌うことが できます。（我會唱歌。）</p><p>小林さんは 中国語を 話すことが できます。</p><p>（小林先生會說中文。）</p><p>先生は 難しい本を 読むことが できます。</p><p>（老師會讀艱深的書。）</p><p>彼女は 飛行機を 運転することが できます。</p><p>（她會開飛機。）</p><p>あの人は 木に 登ることが できます。</p><p>（那個人會爬樹。）</p><h3>表示能力的程度副詞</h3><p>其實，「～ができます」這個句型，翻譯成中文就是「我會…」。有時我們說話時，語意難免會不夠清楚，以學習日文為例，從事日文口譯的專家，可以說「私は日本語ができます」，只學完五十音的人，也可以說「私は日本語ができます」，意思同樣是「我會日文」，但是程度卻天差地遠。</p><p>因此，為了更精確地表示能力高低，我們可以用「程度副詞」。</p><p>表示「能力高低」的程度副詞，常見的有以下幾種:</p><p>「よく」    : 程度約90％。中文為「很會…」。</p><p>「だいたい」: 程度約70％。中文為「還算會…」。</p><p>「まあまあ」: 程度約50％。中文為「算是會…」。</p><p>「すこし」  : 程度約30％。中文為「稍微會…」。</p><p>「あまり」 : 程度約10％。中文為「不太會…」。後面會接否定語句。</p><p>「全然」 ：程度約為0％。中文為「完全不會…」。後面會接否定語句。</p><p>句型:</p><p>（人称）は　（名詞）　が　（程度副詞）できます。</p><p>（人称）は　（動詞原形＋こと）　が　（程度副詞）できます。</p><p>例：</p><p>私は 日本語が できます。（我會日文。）</p><p>私は 日本語が よくできます。（我很會日文。）</p><p>私は 日本語が だいたいできます。（我還算會日文。）</p><p>私は 日本語が まあまあできます。（我算是會日文。）</p><p>私は 日本語が すこしできます。（我稍微會日文。）</p><p>私は 日本語が あまりできません。（我不太會日文。）</p><p>私は 日本語が 全然できません。（我完全不會日文。）</p><p>私は 日本料理を 作ることが できます。</p><p>（我會做日本料理。）</p><p>私は 日本料理を 作ることが よくできます。</p><p>（我很會做日本料理。）</p><p>私は 日本料理を 作ることが だいたいできます。</p><p>（我還算會作日本料理。）</p><p>私は 日本料理を 作ることが まあまあできます。</p><p>（我算是會作日本料理。）</p><p>私は 日本料理を 作ることが すこしできます。</p><p>（我稍微會作日本料理。）</p><p>私は 日本料理を 作ることが あまりできません。</p><p>（我不太會作日本料理。）</p><p>私は 日本料理を 作ることが 全然できません。</p><p>（我完全不會作日本料理。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":18,"title":"喜好和程度副詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用<ruby>好<rt>す</rt></ruby>き／<mark class=\"study-key\">嫌い</mark>表達喜好，以程度詞補充程度。</p><h3>名詞が好き／嫌いです</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>寿司<rt>すし</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。＝我喜歡壽司。<br><ruby>私<rt>わたし</rt></ruby>はピーマンが<ruby>嫌<rt>きら</rt></ruby>いです。＝我討厭青椒。<br>好き和嫌い都是な形容詞；修飾名詞時用好きな料理、<ruby>嫌<rt>きら</rt></ruby>いな食べ物。</p><h3>很喜歡與最喜歡</h3><p><mark class=\"study-key\">とても</mark>／すごく<ruby>好<rt>す</rt></ruby>きです＝很喜歡。<br><ruby>非常<rt>ひじょう</rt></ruby>に<ruby>好<rt>す</rt></ruby>きです＝非常喜歡；かなり<ruby>好<rt>す</rt></ruby>きです＝相當喜歡。<br><ruby>猫<rt>ねこ</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>好<rt>す</rt></ruby>きです。＝最喜歡貓。一番表示比較中的第一，不是「100%喜歡」。<br>這些程度詞沒有固定的百分比或一律適用的強弱次序。</p><h3>否定程度</h3><p><ruby>刺身<rt>さしみ</rt></ruby>があまり<ruby>好<rt>す</rt></ruby>きではありません。＝不太喜歡生魚片。<br><ruby>納豆<rt>なっとう</rt></ruby>が<ruby>全然<rt>ぜんぜん</rt></ruby><ruby>好<rt>す</rt></ruby>きではありません。＝完全不喜歡納豆。<br>本課以あまり／全然＋否定為基本用法；口語也可能見到全然大丈夫等肯定搭配。</p><h3>不討厭，不等於喜歡</h3><p><ruby>嫌<rt>きら</rt></ruby>いではありません。＝不討厭。<br><ruby>好<rt>す</rt></ruby>きではありません。＝不喜歡。<br>選詞要看真正想表達的感受，不要只按程度高低機械替換。</p>","symbol":"好き","intro":"喜歡多少，由你自己來表達。","tag":"喜好・程度副詞","concepts":[["喜歡與討厭","私は＋名詞が＋<mark class=\"study-key\">好き</mark>／<mark class=\"study-key\">嫌い</mark>です。好き與嫌い都是な形容詞。","<ruby>私<rt>わたし</rt></ruby>は<ruby>猫<rt>ねこ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きです。","我喜歡貓。留意不是用を。"],["很喜歡，或最喜歡","<mark class=\"study-key\">とても</mark>、すごく等表示強烈程度；<mark class=\"study-key\">一番</mark>表示在某個範圍中排名第一。","<ruby>果物<rt>くだもの</rt></ruby>では、いちごが<ruby>一番<rt>いちばん</rt></ruby><ruby>好<rt>す</rt></ruby>きです。","在水果之中，我最喜歡士多啤梨。"],["不太喜歡與完全不喜歡","<mark class=\"study-key\">あまり</mark>／<mark class=\"study-key\">全然</mark>＋好きではありません，分別表示不太喜歡／完全不喜歡。","<ruby>私<rt>わたし</rt></ruby>は<ruby>納豆<rt>なっとう</rt></ruby>があまり<ruby>好<rt>す</rt></ruby>きではありません。","我不太喜歡納豆。這不是「有一點喜歡」的直譯。"]],"caution":"<mark class=\"study-key\">一番</mark>是比較中的「最」，不是固定100％；其他副詞也沒有精確百分比。先掌握本課<mark class=\"study-key\">全然</mark>＋否定的搭配，口語中另有全然＋肯定的用法。","quiz":[{"prompt":"我喜歡貓：私は猫＿＿好きです。","options":["を","が","で","に"],"answer":1,"explanation":"喜好的基本句型是名詞が好きです。"},{"prompt":"「我不太喜歡魚」應該說？","options":["魚があまり好きです。","魚が全然好きです。","魚があまり好きではありません。","魚が一番好きです。"],"answer":2,"explanation":"あまり＋否定表示不太……。"},{"prompt":"「果物では、りんごが一番好きです。」表示？","options":["我完全不喜歡蘋果","我只吃蘋果","我覺得蘋果最貴","水果之中，我最喜歡蘋果"],"answer":3,"explanation":"一番在這裡表示喜好排名第一，不是食用習慣或價錢。","rubyView":{"prompt":"「<ruby>果物<rt>くだもの</rt></ruby>では、りんごが<ruby>一番<rt>いちばん</rt></ruby><ruby>好<rt>す</rt></ruby>きです。」表示？","options":["我完全不喜歡蘋果","我只吃蘋果","我覺得蘋果最貴","水果之中，我最喜歡蘋果"],"explanation":"一番在這裡表示喜好排名第一，不是食用習慣或價錢。"}},{"prompt":"關於好き和嫌い，哪個正確？","options":["兩者都是な形容詞","兩者都是動詞","嫌い一定是い形容詞","好き是助詞"],"answer":0,"explanation":"兩者都是な形容詞；不能看到嫌い的い就判作い形容詞。"}],"uploadedOriginal":"<h3>[ 單元18 ] 喜好和程度副詞</h3><h3>學習目標</h3><h3>①　學會喜好的說法「好き」「嫌い」</h3><h3>②　學會使用程度副詞</h3><p>還記得我們之前學過的形容詞和形容詞句型嗎？我們將利用之前學過的二個形容詞「好き（喜歡）」以及「嫌い（討厭）」，配合形容詞句型，介紹如何以日文表達「個人喜好」。所謂的個人喜好，就是「我喜歡什麼」、「我討厭什麼」等等的說法。</p><p>至於為什麼要學習喜歡和討厭的講法呢？首先，喜歡和討厭是構成個人情緒的基本部分，你一定有一些喜歡和討厭的東西，而且經常在日常會話中出現，例如「我喜歡賴床」和「我討厭吃青椒」等等，使用頻率不低。其次，也是最主要的功能，就是經由這個句型，能夠讓你學會所謂的「程度副詞」。</p><p>什麼是「程度副詞」？我們在上一回大致提過，「程度副詞」就是表達程度的副詞。好吧，你一定認為這是廢話，那麼讓我們舉個實例來解說吧。</p><p>A: 我討厭吃青椒！</p><p>B: 討厭到什麼程度？</p><p>A: 相當討厭。不，應該說非常討厭！</p><p>句中「相當討厭」的「相當」，以及「非常討厭」的「非常」，都是用來表示「討厭」程度有多大的副詞，這些詞就是「程度副詞」。不明白也沒關係，稍後你就會明白是怎麼回事了。</p><p>這一單元有二項學習重點:</p><p>① 學會喜好的說法。</p><p>② 學會使用程度副詞。</p><p>我們將依序介紹。</p><h3>喜歡和討厭</h3><p>我們會用到以下二個形容詞。</p><p>「好き」：な形容詞。等於中文的「喜歡」。</p><p>「嫌い」：な形容詞。等於中文的「討厭」。</p><p>我們之前學習過的形容詞句型如下:</p><p>形容詞句型 ：名詞　は　形容詞　です。</p><p>然而，在表示個人喜好時，會使用下面這項句型:</p><p>句型 ：　私　は　名詞　が　好き／嫌い　です。</p><p>（我喜歡／討厭…）</p><p>例：私は寿司が好きです。     （我喜歡壽司。）</p><p>私は日本料理が好きです。（我喜歡日本料理。）</p><p>私はゲームが好きです。   （我喜歡遊戲。）</p><p>私は魚が嫌いです。     （我討厭魚。）</p><p>私は冬が嫌いです。      （我討厭冬天。）</p><p>私はピーマンが嫌いです。  （我討厭青椒。）</p><p>句型演變過程如下:</p><h3>「名詞　は　形容詞　です」＋「私は」</h3><h3>↓</h3><p>「私　は　名詞　は　形容詞　です。」</p><p>出現二個「は」，會變成其他不同意思。</p><h3>↓</h3><p>「私　は　名詞　が　形容詞　です。」</p><p>將第二個「は」改成「が」，用以表示喜好。</p><h3>程度副詞</h3><p>以下介紹幾個常用的程度副詞:</p><p>「一番」: 最～。程度為100％。</p><p>「すごく」「非常に」: 非常～。程度約90％。</p><p>「とても」「かなり」: 很～。程度約80％。</p><p>程度副詞的用法:</p><p>私　は　名詞　が　程度副詞＋好き／嫌い　です。</p><p>例：</p><p>私 は 懐石料理 が 一番 好きです。</p><p>（我最喜歡懷石料理。）</p><p>私 は 懐石料理 が すごく 好きです。</p><p>（我超喜歡懷石料理。）</p><p>私 は 懐石料理 が 非常に 好きです。</p><p>（我非常喜歡懷石料理。）</p><p>私 は 懐石料理 が とても 好きです。</p><p>（我相當喜歡懷石料理。）</p><p>私 は 懐石料理 が かなり 好きです。</p><p>（我很喜歡懷石料理。）</p><p>也可以將上句中「好き」換成「嫌い」，程度仍然不變，意思變成「最討厭」、「非常討厭」、以及「很討厭」。</p><p>以上介紹的，都是程度很高的副詞（100％～80％），那麼有沒有程度低的副詞呢？</p><p>「あまり」：不太～。程度約30％。</p><p>「全然」：完全不～。程度為0％。</p><p>各位有沒有注意到，「あまり（不太）、全然(ぜんぜん)（完全不）」</p><p>中文都有一個「不」字？因此這二個副詞的用法，也和其他的用法不太一樣，句尾的形容詞必須變成否定形態。</p><p>「あまり」「全然」的句型用法:</p><p>私　は　名詞　が　程度副詞　好き／嫌いではありません。</p><p>例：</p><p>私は刺身があまり好きではありません。</p><p>（我不太喜歡生魚片。）</p><p>私は茶碗蒸しがあまり嫌いではありません。</p><p>（我不太討厭蒸蛋。）</p><p>私は納豆が全然好きではありません。</p><p>（我完全不喜歡納豆。）</p><p>私は味噌汁が全然嫌いではありません。</p><p>（我完全不討厭味噌湯。）</p><p>情境会話例：</p><p>A：ケンは彼女のこと、どう思います？</p><p>（Ken，你覺得她如何？）</p><p>B：うん…あまり嫌いではありませんが…</p><p>（嗯…是不太討厭啦…）</p><p>A：じゃ、好きってことですね。（那麼，就是喜歡囉！）</p><p>B：いや、好きでもありません…（不，也不算是喜歡…）</p><p>A：全然好きではありませんか。（完全不喜歡嗎？）</p><p>B：ううん、少し好き……かな？</p><p>（也不是，是有一點喜歡…吧…）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":19,"title":"動詞+名詞和「こと」的名詞化","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用動詞修飾名詞，並用こと把動作作為話題或句子的成分。</p><h3>普通形直接接名詞</h3><p><ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>む人＝看書的人。<br><ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいる人＝正在看書的人。<br><ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだ人＝看過／讀了書的人。<br><ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>まない人＝不看書的人。<br>中間<mark class=\"study-key\">不加の</mark>，也不直接用読みます人。</p><h3>不同詞類的接法</h3><p>おいしい<ruby>料理<rt>りょうり</rt></ruby>：い形容詞直接接。<br><ruby>静<rt>しず</rt></ruby>かな<ruby>部屋<rt>へや</rt></ruby>：な形容詞加な。<br><ruby>私<rt>わたし</rt></ruby>の<ruby>本<rt>ほん</rt></ruby>：名詞以の連接。<br><ruby>昨日<rt>きのう</rt></ruby><ruby>買<rt>か</rt></ruby>った<ruby>本<rt>ほん</rt></ruby>：動詞<mark class=\"study-key\">普通形</mark>直接接。</p><h3>趣味は……ことです</h3><p><ruby>私<rt>わたし</rt></ruby>の<ruby>趣味<rt>しゅみ</rt></ruby>は<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むことです。＝我的興趣是看書。<br><ruby>私<rt>わたし</rt></ruby>の<ruby>得意<rt>とくい</rt></ruby>なことはギターを<ruby>弾<rt>ひ</rt></ruby>くことです。＝我擅長的事是彈吉他。<br>こと把前面整個動作當作一件事，不寫本を読むです。</p><h3>人的「のこと」</h3><p><ruby>私<rt>わたし</rt></ruby>は王さんが<ruby>好<rt>す</rt></ruby>きです。／<ruby>私<rt>わたし</rt></ruby>は王さんのことが<ruby>好<rt>す</rt></ruby>きです。都自然，意思都是喜歡王先生／小姐。<br>這裡<mark class=\"study-key\">のこと</mark>表示談到這個人，不是把名詞再名詞化，也不保證喜歡對方「所有的一切」。<br><ruby>彼<rt>かれ</rt></ruby>のことをどう<ruby>思<rt>おも</rt></ruby>いますか。＝你覺得他怎麼樣？</p>","symbol":"趣味","intro":"用一段動作描述名詞，介紹你的興趣。","tag":"修飾名詞・こと","concepts":[["動詞直接修飾名詞","<mark class=\"study-key\">普通形</mark>動詞<mark class=\"study-key\">直接接名詞</mark>，不加の，也不用ます形。","<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>む人","看書的人。不是「読みます人」或「読むの人」。"],["興趣是一件事","私の趣味は＋動詞<mark class=\"study-key\">辭書形＋こと</mark>です。把「做某事」放到名詞的位置。","<ruby>私<rt>わたし</rt></ruby>の<ruby>趣味<rt>しゅみ</rt></ruby>は<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ることです。","我的興趣是拍照。"],["喜歡的事與喜歡的人","<mark class=\"study-key\">好きなこと</mark>表示喜歡的事情；人名＋<mark class=\"study-key\">のこと</mark>可用於表達對那個人的喜好。","<ruby>私<rt>わたし</rt></ruby>の<ruby>好<rt>す</rt></ruby>きなことは<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>くことです。","我喜歡的事情是聽音樂。"]],"caution":"「私は王さんが好きです」和「王さん<mark class=\"study-key\">のこと</mark>が好きです」都可以，不應把前者一概標成錯誤。修飾名詞時也能用過去或否定等<mark class=\"study-key\">普通形</mark>，不只辭書形。","quiz":[{"prompt":"「讀書的人」哪個正確？","options":["本を読みます人","本を読むの人","本を読む人","本を読むな人"],"answer":2,"explanation":"普通形動詞直接修飾名詞，不加の或な。"},{"prompt":"我的興趣是拍照：私の趣味は写真を＿＿。","options":["撮りますです","撮るです","撮るのことです","撮ることです"],"answer":3,"explanation":"把拍照名詞化：写真を撮ること，再接です。"},{"prompt":"「美味的料理」哪個正確？","options":["おいしい料理","おいしいの料理","おいしいな料理","おいしいです料理"],"answer":0,"explanation":"い形容詞直接修飾名詞，不加の。"},{"prompt":"哪個可以表示「我喜歡的事情」？","options":["私の好きこと","私の好きなこと","私の好きですこと","私の好きのこと"],"answer":1,"explanation":"好き是な形容詞，修飾名詞こと時加な。"}],"uploadedOriginal":"<p>[ 單元19 ] 動詞+名詞和「こと」的名詞化</p><h3>學習目標</h3><h3>①　學會「動詞＋名詞」的用法</h3><h3>②　學會使用「こと」名詞化的其他句型</h3><p>本單元介紹二項日語學習者經常會忽略或犯錯的用法。這次主題其實都是我們先前學習過的東西，大家應該有些熟悉，本單元的目的，主要是補充說明先前不足的部分。一項是「動詞＋名詞」的用法，另一項則是使用「こと」名詞化的其他句型。</p><p>什麼是「動詞＋名詞」的用法呢？以中文為例，「看書的學生」、「跑步的人」、「拿著菜單的店員」這些看起來平常到不行的句子，其實都是所謂「動詞＋名詞」的組合。「看、跑步、拿」是動詞，「學生、人、店員」則是名詞，中間用「的」連接。這種用法似乎非常普通，沒有特別拿出來說明的必要，但是在日文中，若是我們要說「看書的學生」這樣的句子，那麼方法可是和中文有些出入的。日文中，並不需要加上「的」，動詞和名詞可以直接連接，成為「本を読む学生（看書＋學生）」「走る人（跑步＋人）」的形式。</p><p>另外，我們先前介紹過能力句型「～名詞+ができる」「動詞＋ことができる」，當前方為動詞時，要加上「こと」將前面的動詞名詞化，才能接後面的「ができる」。</p><p>然而，具有名詞化功能的「こと」也會出現在其他常用句型和會話當中，例如「あなたのことが好きです（我喜歡你）」、「私の趣味は音楽を聞くことです（我的興趣是聽音樂）」等等。因此，這一回也會針對「こと」的其他使用時機及使用習慣進行說明。</p><p>這二項用法，是以中文為母語的人士經常誤用的文法，因此在進行日常會話時，也請特別注意。</p><h3>動詞+名詞</h3><p>日文動詞，若是放在名詞前面、用來修飾名詞時，中間不用加上任何假名。</p><p>另外，名詞前方只能使用「動詞普通形（常体）」，「動詞ます形」無法直接放在名詞之前。</p><p>中文基本構造 :  動詞 + 的 + 名詞</p><p>例: 吃飯的人。   上課的老師。   睡覺的貓。</p><p>洗澡的大象。</p><p>日文基本構造 :  動詞 + 名詞</p><p>例: ご飯を食べる人。　授業をする教師。</p><p>寝る猫。　シャワーを浴びる象。</p><p>我們再提醒一下，這裡要特別注意：</p><p>「動詞ます形」無法直接拿來接續名詞，只能使用「動詞普通形（常体）」，舉例如下:</p><p>例：現在肯定用法</p><p>？　ご飯を食べます人。　授業をします教師。</p><p>○  ご飯を食べる人。 　授業をする教師。</p><p>例: 現在進行式（以後會介紹）</p><p>？　ご飯を食べています人。授業をしています教師。</p><p>○  ご飯を食べている人。  授業をしている教師。</p><p>例: 過去式（以後會介紹）</p><p>？　ご飯を食べました人。　授業をしました教師。</p><p>○  ご飯を食べた人。      授業をした教師。</p><p>例: 現在否定用法（以後會介紹）</p><p>？　ご飯を食べません人。　授業をしません教師。</p><p>○  ご飯を食べない人。    授業をしない教師。</p><p>另外，い形容詞接名詞時，中間也不能加「の」，在口語會話時，中文母語者經常會犯這種錯誤。</p><p>例：　○　白いご飯　　　　？　白いのご飯</p><p>○　おいしい料理　 ？　おいしいの料理</p><p>○　広い部屋　　　　？　広いの部屋</p><h3>こと用法</h3><h3>名詞句的情況</h3><p>我們在文法教材的單元2，介紹過三種日文的基本句型:名詞句、形容詞句、動詞句。本回我們就要使用到名詞句的觀念。</p><p>名詞句定義:  A（名詞）は　B（名詞）です。</p><p>「A」和「B」都必須是名詞，那麼萬一「A」或「B」不是名詞的情況呢？這時就可以使用「こと」加以名詞化，使之符合基本句型的構成方式。</p><p>常用句型1:</p><p>私の趣味は（名詞）です。</p><p>私の趣味は（動詞原形＋こと）です。</p><p>（我的興趣是…）</p><p>中文例: 我的興趣是看電影（這件事）。</p><p>「興趣」和「看電影」都為名詞，因此屬於名詞句。</p><p>日文例: ○　 私の趣味は映画です。</p><p>？　 私の趣味は映画を見るです。</p><p>○　 私の趣味は映画を見ることです。</p><p>（使用「こと」名詞化）</p><p>例：</p><p>私の趣味は料理を作ることです。</p><p>（我的興趣是做菜。）</p><p>私の趣味は本を読むことです。</p><p>（我的興趣是看書。）</p><p>私の趣味は野球をすることです。</p><p>（我的興趣是打棒球。）</p><p>常用句型2:</p><p>私の好きなことは（名詞）です。</p><p>私の好きなことは（動詞原形＋こと）です。</p><p>（我喜歡／討厭的事是…）</p><p>中文例: 我喜歡的(事情）是聽音樂(這件事情）。</p><p>「喜歡的事情」和「聽音樂(這件事）」都屬於名詞，因此屬於名詞句。</p><p>由於是名詞句的關係，前後必須皆為名詞，因此形容詞「好き」需加上「こと」名詞化。後方若為「動詞」，也必須加上「こと」名詞化。</p><p>日文例:</p><p>？　私の好きは音楽です。</p><p>○　私の好きなことは音楽です。</p><p>？　私の好きなことは音楽を聞くです。</p><p>○　私の好きなことは音楽を聞くことです。</p><p>也可以將上句中的「好(す)き」代替為其他形容詞。</p><p>例：私の嫌いなことは バスケットをする ことです。</p><p>(我討厭的事是打籃球。）</p><p>私の嫌いなことは 部屋を掃除する ことです。</p><p>(我討厭的事是打掃房間。）</p><p>私の得意なことはギターを弾く ことです。</p><p>(我擅長的事是彈吉他。）</p><p>私の苦手なことは 料理を作る ことです。</p><p>(我不擅長的事是做菜。）</p><h3>對於某人表示喜好時</h3><p>當我們要對於某人表示判斷、表達自己的喜好時，也會習慣在人名的後面加上「こと」。這裡和名詞化沒有關係，而是表示「關於對方全部的事」。特別常用於和某人告白時。</p><p>常用句型：　（人名）のことが　好き／嫌い　です。</p><p>(我喜歡／討厭某人）</p><p>例：</p><p>？　 私は王さんが好きです。</p><p>○ 　私は王さんのことが好きです。</p><p>理由為，當我們說「喜歡」某個人時，在日本人的想法中，我們並不是只喜歡「那個人本身」，而是喜歡「所有和那個人相關的事」，因此較少使用「王さんが好き」，而多使用「王さんのことが好き」這樣的說法。</p><p>「こと」的原意即為「事情」之意，漢字寫作「事(こと)」。</p><p>例：</p><p>私は彼女のことが好きです。</p><p>(我喜歡她。）</p><p>私はあの人のことが嫌いです。</p><p>(我討厭那個人。）</p><p>私は部長のことが嫌いです。</p><p>(我討厭部長。）</p><p>私はおばあちゃんのことが好きです。</p><p>(我喜歡外婆。）</p><p>宮沢さんは課長のことを、どう思いますか？</p><p>(宮澤小姐，妳覺得課長人怎麼樣呢？）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":20,"title":"關於疑問詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用疑問詞提問，分清「哪裡」和「某個地方」、「甚麼」和「甚麼也不」。</p><h3>常見疑問詞</h3><p><mark class=\"study-key\">どれ</mark>：哪個；<mark class=\"study-key\">どこ</mark>：哪裡；どの＋名詞：哪個……；誰（だれ）：誰。<br>いくら：多少錢；いくつ：幾個；いつ：何時；何：甚麼。<br>何<ruby>時<rt>じ</rt></ruby>（なんじ）、何曜日（なんようび）、何歳（なんさい）、何月何日（なんがつなんにち）。<br>何を讀なにを；何ですか常讀なんですか。不能把何一律讀なん。</p><h3>問已知主題，或問是哪一個</h3><p><ruby>駅<rt>えき</rt></ruby>はどこですか。＝車站在哪裡？<br>どこが<ruby>静<rt>しず</rt></ruby>かですか。＝哪裡安靜？<br><ruby>誰<rt>だれ</rt></ruby>が<ruby>来<rt>き</rt></ruby>ますか。＝誰會來？田中さんが来ます。＝田中會來。<br>疑問詞作主語<ruby>時<rt>じ</rt></ruby><ruby>常用<rt>じょうよう</rt></ruby>が；這不是「名詞用は、形容詞用が」的規則，也不能涵蓋は／が所有用法。</p><h3>疑問詞＋か：某個、不特定</h3><p>どこかに<ruby>行<rt>い</rt></ruby>きましたか。＝有去甚麼地方嗎？<br>何か<ruby>買<rt>か</rt></ruby>いますか。＝要買點甚麼嗎？<br>何かを買います也可以；か不是取代を，會話常省略這裡的を。<br><ruby>誰<rt>だれ</rt></ruby>かいますか。＝有人嗎？</p><h3>疑問詞＋も＋否定</h3><p>何も<ruby>買<rt>か</rt></ruby>いません。＝甚麼也不買。<br><ruby>誰<rt>だれ</rt></ruby>もいません。＝沒有人。<br>どこにも<ruby>行<rt>い</rt></ruby>きません。＝哪裡也不去。<br>這些形式也能用於一般敘述，不只用來回答問題。</p><h3>辨認問法</h3><p>どこに<ruby>行<rt>い</rt></ruby>きましたか：詢問去哪裡。<br>どこかに<ruby>行<rt>い</rt></ruby>きましたか：詢問有沒有去某處。<br>是非問句也可以沒有疑問詞：<ruby>学生<rt>がくせい</rt></ruby>ですか。＝是學生嗎？</p>","symbol":"問い","intro":"問到你想知道的資訊。","tag":"疑問詞・か・も","concepts":[["先選對疑問詞","誰問人；<mark class=\"study-key\">どこ</mark>問地方；<mark class=\"study-key\">どれ</mark>問選項；どの後接名詞；いくら問價錢；いくつ問數量。","この<ruby>本<rt>ほん</rt></ruby>はいくらですか。","這本書多少錢？"],["未知的對象用が","詢問「誰／哪個」是符合條件的對象時，可用<mark class=\"study-key\">疑問詞＋が</mark>。","どの<ruby>花<rt>はな</rt></ruby>が<ruby>好<rt>す</rt></ruby>きですか。","你喜歡哪朵花？回答可說：この花が好きです。"],["か與も改變意思","<mark class=\"study-key\">疑問詞＋か</mark>可表示不確定的某人／某物／某處；<mark class=\"study-key\">疑問詞＋も</mark>搭配否定，可表示全部都不。","何か<ruby>買<rt>か</rt></ruby>いますか。いいえ、何も<ruby>買<rt>か</rt></ruby>いません。","要買點甚麼嗎？不，甚麼都不買。"]],"caution":"不是每個問句都需要疑問詞，例如「学生ですか」。何か的か也不會在所有情況取代を；例如「何かを食べます」也可以。は／が的焦點提示只是入門理解方法。","quiz":[{"prompt":"詢問價錢：このかばんは＿＿ですか。","options":["どこ","だれ","いつ","いくら"],"answer":3,"explanation":"いくら用來問價錢。"},{"prompt":"「哪一本書」要用？","options":["どの本","どれ本","どこ本","だれ本"],"answer":0,"explanation":"どの後面接名詞；どれ可以單獨用。"},{"prompt":"「何か買いますか。」最合適的意思是？","options":["甚麼也不買嗎？","要買點甚麼嗎？","這是誰買的？","買了多少錢？"],"answer":1,"explanation":"何か表示某些東西／點甚麼，整句問有沒有購買的意向。","rubyView":{"prompt":"「何か<ruby>買<rt>か</rt></ruby>いますか。」最合適的意思是？","options":["甚麼也不買嗎？","要買點甚麼嗎？","這是誰買的？","買了多少錢？"],"explanation":"何か表示某些東西／點甚麼，整句問有沒有購買的意向。"}},{"prompt":"「房間裡誰也不在」應該說？","options":["部屋にだれかいます。","部屋にだれもいます。","部屋にだれもいません。","部屋にだれがあります。"],"answer":2,"explanation":"だれも＋否定，表示誰也沒有；人使用います／いません。"}],"uploadedOriginal":"<h3>[ 單元20 ] 關於疑問詞</h3><h3>學習目標</h3><h3>①　學會常見的日文疑問詞</h3><h3>②　了解疑問詞的基本句型及用法</h3><p>③　學會「疑問詞＋も」「疑問詞＋か」的表現方式</p><p>本單元的主題為介紹及複習日文當中的「疑問詞」。什麼是疑問詞呢？疑問詞就是在問句中表達疑問的詞彙，例如:「你在哪裡？」「水果多少錢？」中的「哪裡」和「多少錢」即屬於疑問詞。我們先前學過的「こそあど」系統，其中的「ど」(どれ、どこ、どの人）就是所謂的疑問詞，因為這些詞彙大多出現在問句當中。</p><p>我們在詢問對方任何事情時，當中一定會包含疑問詞，特別是和外國人溝通或出國旅遊時，無論是請教姓名或是詢問搭車方法，都會用到。因此，疑問詞是日常會話中絕對不可缺少的要素之一，學習疑問詞的相關句型用法也很重要。</p><p>本單元分三階段進行介紹。首先，介紹該如何正確地使用疑問詞和句型，當中也會稍微提及助詞「は」「が」的區分法；其次，複習之前學過的疑問詞、以及學習常用的新疑問詞；最後，介紹疑問詞的進階用法「疑問詞＋も」和「疑問詞＋か」的表現方式，讓會話時更能精準傳達自己的意思。</p><h3>疑問詞句型</h3><p>疑問詞的基本句型之一，為我們所熟悉的「～は～ですか」句型。</p><p>句型一:（対象物）は（疑問詞）ですか。</p><p>例：</p><p>私のかばん は どれ ですか。(我的包包是哪個？）</p><p>台北駅 は どこ ですか。(台北車站在哪裡？）</p><p>今日 は 何曜日 ですか。(今天星期幾？）</p><p>依照一般使用習慣，若對象物不是名詞、而是形容詞的話，常用另外一個句型。</p><p>句型二:（疑問詞）が（形容詞）ですか。</p><p>例：</p><p>どれ が きれい ですか。(哪個比較漂亮呢？）</p><p>どこ が 賑やか ですか。(哪裡比較熱鬧呢？）</p><p>何曜日 が 暇 ですか。(星期幾有空呢？）</p><p>那麼，如何回答這些問句呢？</p><p>原則上，最適當的方式為「重覆該問句作為回答」。</p><p>如下所示:</p><p>例：A：私のかばんはどれですか。  (我的包包是哪一個？）</p><p>B：あなたのかばんはこれです。 (你的包包是這個。）</p><p>A：台北駅はどこですか。  (台北車站在哪裡？）</p><p>B：台北駅はあそこです。  (台北車站在那裡。）</p><p>A：どこが賑やかですか。　(哪裡比較熱鬧呢？）</p><p>B：夜市が賑やかです。  (夜市很熱鬧。）</p><p>A：何曜日が暇ですか。  (星期幾有空呢？）</p><p>B：日曜日が暇です。    (星期日有空。）</p><h3>「は」和「が」</h3><p>這裡稍微提一下日文中難解的習題:助詞「は」和「が」的區別方法。</p><p>上述二句型中的疑問詞位置，也隨著「は」和「が」而有所不同，那麼要如何分辨呢？在這裡和大家提示一項大重點，這項重點日後也會經常用到:</p><p>使用「は」的時候，句子的重點在「は」後面。</p><p>使用「が」的時候，句子的重點在「が」前面。</p><h3>由於在問句中，疑問詞是整句重點，因此，</h3><p>疑問詞放在「は」後面，例：「夜市はどこですか。」</p><p>疑問詞放在「が」前面，例：「どこが賑やかですか。」</p><h3>常見的疑問詞</h3><h3>①　どれ</h3><p>「これ」「それ」「あれ」的疑問詞，表示東西，相當於中文的「哪個？」。</p><h3>②　どこ</h3><p>「ここ」「そこ」「あそこ」的疑問詞，表示地點，相當於中文的「哪裡？」。</p><h3>③　どの</h3><p>後接名詞，表示「哪一樣東西？」</p><h3>④　誰</h3><p>用於詢問對方身份，相當於中文的「誰？」</p><h3>⑤　いくら</h3><p>用於詢問價錢，相當於中文的「多少錢？」</p><h3>⑥　いくつ</h3><p>用於東西數量，相當於中文的「幾個？」</p><p>⑦　何  (何歳　何曜日　何時　何月何日）</p><p>「何（なに）」是非常便於使用的疑問詞，很多時候都可以用，意思相當於中文的「幾、什麼」。當作疑問詞使用時，多發音為「なん」。</p><p>用法之一，為當作「これ」「それ」「あれ」的疑問詞。</p><p>例：</p><p>？　これはどれですか。(這是哪個？）</p><p>○　これは何ですか。(這是什麼？）</p><p>用法之二，和其他字結合，形成疑問詞。</p><p>例：</p><h3>何＋歳＝何歳</h3><h3>何＋曜日＝何曜日</h3><h3>何＋時＝何時</h3><h3>何＋月・日＝何月何日</h3><h3>「疑問詞＋も／疑問詞＋か」</h3><p>接下來，介紹較為進階的用法。這項用法主要出現在疑問詞和動詞一起用的情況。</p><p>首先，這是我們之前學過的句型。</p><p>肯定句:</p><p>私は高雄に行きました。</p><p>私はオレンジを買います。</p><p>若是要改成疑問句，就會將前面的部分替換成疑問詞。</p><p>疑問句:</p><p>どこに行きましたか。</p><p>何を買いますか。</p><p>相信大家對於上面的疑問句構成，都沒有太大的問題。</p><p>不過我們可以在疑問詞後面，加上助詞「か」，形成另外一種問句。</p><p>疑問句:</p><p>どこ か に行きましたか。</p><p>何 か 買いますか。（這時「か」會取代「を」）</p><p>助詞「か」常用在問句語尾，代表「不確定」之意；若是用於句中，整句的意思就會由「どこに行きましたか。(你去了哪裡？）」變成「どこかに行きましたか。(你有沒有去哪裡？）」。好吧，那麼這二種疑問句到底差在哪邊呢？</p><p>答案是「回答方法」。</p><p>以下是傳統問句，我們回答時只要照實回答就可以了。</p><p>昨日、どこに行きましたか。      (昨天去哪裡了？）</p><p>昨日、コンサートに行きました。  (昨天去聽音樂會。）</p><p>但是，如果改成這種問句的話，回答時，就要用「はい」或「いいえ」。請以中文的邏輯去想，很容易就可以了解。</p><p>昨日、どこかに行きましたか。     (昨天有去哪裡嗎？）</p><p>①　はい、コンサートに行きました。</p><p>(嗯，我去聽音樂會。）</p><p>②　いいえ、どこも行きませんでした。</p><p>(不，我哪裡都沒去。）</p><p>今日、何か買いますか。     (今天有要買什麼嗎？）</p><p>①　はい、オレンジを買います。  (嗯，我買柳丁。）</p><p>②　いいえ、何も買いません。    (不，我什麼都不買。）</p><p>在「いいえ」的回答中，我們看到一個沒有學過的文法：</p><p>句型:（疑問詞）＋も＋動詞否定形</p><p>我們學過「も」這個助詞，是中文「也」的意思。因此，這個句型直譯後，就是「什麼也不什麼」之意，例如：「我什麼也不買」、「我什麼地方也不去」，主要功能為強調自己的想法，常用在問句的回答中。</p><p>例：<br>どこも行きません。(哪裡也不去。）</p><p>何も買いません。  (什麼也不買。）</p><p>だれもいません。  (誰也不在。）</p><p>何も食べません。  (什麼也不吃。）</p><p>どれも要りません。(什麼也不要。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":21,"title":"原因理由的說法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用から／<mark class=\"study-key\">ので</mark>連接原因與結果，並詢問理由。</p><h3>原因＋から、結果</h3><p>名詞／な形容詞：<mark class=\"study-key\">だから</mark>；い形容詞／動詞普通形：直接加から。<br><ruby>雨<rt>あめ</rt></ruby>だから、<ruby>家<rt>いえ</rt></ruby>にいます。＝因為下雨，所以留在家。<br><ruby>寒<rt>さむ</rt></ruby>いから、<ruby>窓<rt>まど</rt></ruby>を<ruby>閉<rt>し</rt></ruby>めます。＝因為冷，所以關窗。<br>也可接禮貌形：<ruby>雨<rt>あめ</rt></ruby>ですから／<ruby>寒<rt>さむ</rt></ruby>いですから／<ruby>行<rt>い</rt></ruby>きますから。</p><h3>原因＋ので、結果</h3><p>名詞／な形容詞：<mark class=\"study-key\">なので</mark>；い形容詞／動詞普通形：直接加ので。<br><ruby>明日<rt>あした</rt></ruby>は<ruby>試験<rt>しけん</rt></ruby>なので、<ruby>勉強<rt>べんきょう</rt></ruby>します。＝因為明天有考試，所以讀書。<br><ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れたので、<ruby>遅刻<rt>ちこく</rt></ruby>しました。＝因為電車誤點，所以遲到了。<br>禮貌形也可接：ですので／ますので。</p><h3>怎樣選？</h3><p><mark class=\"study-key\">から</mark>常明確提出理由或判斷；<mark class=\"study-key\">ので</mark>常把理由作背景，說明時可能較柔和。<br>兩者有重疊。から不等於失禮，ので也不保證客觀；語氣取決於整句、場合與關係。</p><h3>分成兩句</h3><p><ruby>今日<rt>きょう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです。<mark class=\"study-key\">だから</mark>、<ruby>家<rt>いえ</rt></ruby>にいます。＝今天放假，所以留在家。<br>句首<mark class=\"study-key\">なので</mark>常見於會話；正式文章可用そのため等。不要把だから／なので套成固定的主觀／客觀二分。</p><h3>詢問原因</h3><p><mark class=\"study-key\">どうして</mark>：日常常用。なぜ：常見於書面，也用於會話。なんで：較口語。<br>どうして<ruby>遅<rt>おく</rt></ruby>れたんですか。＝為甚麼遲到？<br>「何で」也可能問手段，例如「何で<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きますか」。想明確問原因可用どうして；問交通方式可說何に乗って行きますか。</p>","symbol":"理由","intro":"把「因為」說清楚，讓下一句更自然。","tag":"から・ので・為甚麼","concepts":[["から：先說理由，再說結果","<mark class=\"study-key\">原因</mark>＋<mark class=\"study-key\">から</mark>、結果。名詞和な形容詞的普通形接だから；い形容詞和動詞直接接から。","<ruby>雨<rt>あめ</rt></ruby>だから、<ruby>家<rt>いえ</rt></ruby>にいます。","因為下雨，所以留在家裡。寒い<mark class=\"study-key\">から</mark>＝因為很冷；行くから＝因為要去。"],["ので：把理由作為背景","名詞／な形容詞＋<mark class=\"study-key\">なので</mark>；い形容詞／動詞普通形＋<mark class=\"study-key\">ので</mark>。也可接禮貌形，如ですので、ますので。","<ruby>明日<rt>あした</rt></ruby>は<ruby>試験<rt>しけん</rt></ruby>なので、<ruby>今日<rt>きょう</rt></ruby>は<ruby>勉強<rt>べんきょう</rt></ruby>します。","因為明天有考試，所以今天讀書。<mark class=\"study-key\">ので</mark>常使解釋較柔和，但不代表一定客觀。"],["分開成兩句，也可以","<mark class=\"study-key\">だから</mark>可放在第二句開頭，表示所以。<mark class=\"study-key\">どうして</mark>、なぜ、なんで可詢問原因。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです。だから、<ruby>出掛<rt>でか</rt></ruby>けます。","今天放假，所以出門。<mark class=\"study-key\">どうして</mark>出掛けますか＝為甚麼出門？"]],"caution":"<mark class=\"study-key\">から</mark>不等於失禮，<mark class=\"study-key\">ので</mark>也不保證客觀，禮貌還要看語境與語氣。「何で」可能問原因或手段，初學時可用どうして明確問原因。句首なので常見於口語，正式文章可用そのため等表達。","quiz":[{"prompt":"「因為明天放假」：明日は休み＿＿、出掛けます。","options":["だから","からだ","なのでだ","をから"],"answer":0,"explanation":"休み是名詞，普通形接だから。"},{"prompt":"「因為安靜」接ので，哪個正確？","options":["静かので","静かなので","静かのので","静かだので"],"answer":1,"explanation":"な形容詞接ので時使用な：静かなので。"},{"prompt":"哪個詞可明確詢問「為甚麼」？","options":["どこ","いくら","どうして","だれ"],"answer":2,"explanation":"どうして在這裡詢問理由。"},{"prompt":"「雨です。だから、家にいます。」的關係是？","options":["比較","選擇","列舉","原因與結果"],"answer":3,"explanation":"下雨是原因，留在家裡是結果。","rubyView":{"prompt":"「<ruby>雨<rt>あめ</rt></ruby>です。だから、<ruby>家<rt>いえ</rt></ruby>にいます。」的關係是？","options":["比較","選擇","列舉","原因與結果"],"explanation":"下雨是原因，留在家裡是結果。"}}],"uploadedOriginal":"<h3>[ 單元21 ] 原因理由的說法</h3><h3>學習目標</h3><h3>①　了解表示原因理由的「から」「ので」用法</h3><h3>②　學習連接詞「だから」「なので」</h3><h3>③　學習如何連接二個句子</h3><p>④　了解詢問原因的疑問詞「どうして」「なぜ」「なんで」用法</p><p>本回要介紹的是日文中「原因理由」的說法，也就是中文的「因為…所以…」句型，用來說明事情發生的原因、或是狀態變化的理由，例如因為電車誤點所以遲到、因為吃太多所以變胖了等等，在日常會話中的使用頻率相當高。日文中表示原因理由的助詞主要有「から」和「ので」二項，這二個助詞都可以表示「因為…所以…」之意，文法和字義幾乎完全相同，唯一略為不同的地方是使用時機，有些情況下使用「から」比較自然、有些情況下使用「ので」又比較自然。由於並沒有明確的使用規則，因此對於日文初學者來說，如何區別「から」和「ので」的使用時機，可說是令人傷腦筋的課題之一。本單元除了介紹「から」和「ので」的意思外，也會一併介紹簡單易懂的使用區別方法。</p><p>另外，我們也會介紹「連接詞」，什麼是「連接詞」呢？別想得太難，如同字面上的意思，「連接詞」就是「連接句子和句子」的字。我們在目前為止的單元中所介紹的文法，僅止於「單一句子」，意思是我們可以利用這些文法「造出一個正確的句子」，但是在本單元，我們要學的是「如何利用連接詞將二個句子連結起來」。例如「餐廳很難吃」和「不去」這二項單獨句子，我們可以用「因為（だから）」連接起來，變成「因為餐廳很難吃，所以不去。」這樣意思完整的句子。</p><p>特別是在口語會話時，連接詞扮演相當重要的角色，如果沒有適當地使用連接詞連結句子，所有的話聽起來將會斷斷續續的、很難表達出完整的意思。你可以說「餐廳很難吃。不去。」，也可以說成「因為餐廳很難吃，所以不去。」雖然意思都通，但是如果你是說話者，你會比較願意讓對方聽到哪一句話呢？</p><p>最後我們會介紹關於原因理由的「疑問詞」，這些疑問詞，相信大家或多或少都有在日劇、電影或動畫中聽過，而我們在先前的單元中，也介紹過關於日文疑問詞的說法、大家應該不陌生，因此本單元的重點會放在如何區分「どうして」、「なぜ」、「なんで」三個常見疑問詞的使用方式。</p><h3>から</h3><p>「から」：</p><p>接在句尾，表示原因理由，相當於中文的「因為所以」，多用以表示個人的主觀判斷。「から」之後的句子，通常以描述個人主張或判斷的句子為主。</p><p>這裡使用「から」或「ですから」都可以，「から」用於和平輩朋友說話時、而「ですから」則用在和上司長輩說話的時候。</p><p>基本句型: （原因理由）から、（表示結果的句子）</p><p>接續方法:  名詞・な形容詞＋だから・ですから</p><h3>い形容詞＋から・ですから</h3><h3>動詞＋から</h3><p>例：</p><h3>あの喫茶店は静かですから、</h3><h3>あそこでテストの勉強をしましょう！</h3><p>(因為那間咖啡廳很安靜，所以我們在那唸書準備考試吧。）</p><h3>彼は小学校の先生ですから、</h3><p>子どもの親からのプレッシャーが大きいでしょう。</p><p>（因為他是小學老師，所以來自學生家長的壓力一定很大吧。）</p><p>今夜は蒸し暑いから、明日は雨が降るでしょう。</p><p>（因為今晚很悶熱，所以明天應該會下雨吧。）</p><h3>中村さんは昨日夜十時まで仕事をしましたから、</h3><p>今日は来ませんよね。</p><p>（因為中村先生昨晚工作到十點，所以今天不會來吧。）</p><h3>ので</h3><p>「ので」：</p><p>接在句尾，表示原因理由，相當於中文的「因為所以」。和「から」相近，不過一般多用於表示「客觀推測」的結果。「ので」之後的句子，通常以描述客觀的事實或客觀推測為主。</p><p>基本句型:（原因理由）ので、（表示結果的句子）</p><p>接續方法:  名詞・な形容詞＋なので・ですので</p><h3>い形容詞＋ので・ですので</h3><h3>動詞＋ので</h3><p>例：</p><h3>あの喫茶店が静かなので、</h3><p>あそこで勉強する人が多いでしょう。</p><p>（因為那間咖啡廳很安靜，所以會有很多人在那裡唸書吧。）</p><h3>彼は小学校の先生なので、</h3><p>毎日4時ちょうどに家に帰ります。</p><p>（因為他是小學老師，所以每天準時四點回家。）</p><p>今夜は蒸し暑いので、蚊が多くなりました。</p><p>（因為今晚很悶熱，所以蚊子變多了。）</p><h3>中村さんは昨日夜十時まで仕事をしましたので、</h3><p>残業代がたくさんもらえるでしょう。</p><p>（因為中村先生昨晚工作到十點，所以應該可以領到很多加班費吧。）</p><h3>から和ので的區別</h3><p>主要有二項不同之處:</p><p>①「から」較為主觀，「ので」較為客觀。</p><h3>②由於「から」較主觀，因此感覺較直接不客氣，</h3><p>由於「ので」較客觀，因此感覺起來較委婉客氣。</p><p>舉例來說，同樣的一句話，使用「から」和使用「ので」的感覺會截然不同。以下是實際發生在日商公司內部的對話：</p><p>情境一:</p><p>上司：どうして今日遅刻した？</p><p>（為什麼今天遲到？）</p><p>部下：えっと…電車が遅れたから遅刻しました。</p><p>（那個…因為電車誤點，所以遲到了。）</p><p>上司：バカ！言い訳するな！</p><p>（笨蛋！少給我找藉口！）</p><p>由於「から」帶有理直氣壯、較為主觀不客氣的語氣，聽起來像是「因為電車就晚來嘛，又不是我的錯」，因此給人感覺較不客氣、像是找藉口，所以部下被上司罵了一頓。</p><p>情境二:</p><p>上司：どうして今日遅刻した？</p><p>（為什麼今天遲到？）</p><p>部下：えっと…電車が遅れたので、遅刻しました…</p><p>（那個…因為電車誤點，所以遲到了。）</p><p>上司：そっか…今度早く家を出ろ。</p><p>（這樣啊…下次早點出門。）</p><p>相較之下，「ので」較為客觀、委婉客氣，聽起來是「因為電車晚來，實在找不到其他辦法…」，沒有自己的強烈主張在裡面，給人感覺十分委婉客氣，因此該部下只被上司形式上唸了幾句而已。</p><h3>だから</h3><p>「だから」為日文的連接詞，意思為「所以…」，主要用於連接二個句子，表示互相的因果關係。字義大致和「から」相同，可以想成將「から」單獨抽出來，成為一個獨立的用法。</p><p>基本句型:（原因句）。 だから、（結果句）</p><p>例：</p><p>私は風邪をひきました。</p><p>だから、明日学校に行きたくありません。</p><p>（我感冒了。所以，明天不想去學校。）</p><p>新しいゲームソフトを買いました。</p><p>だから、古いソフトを売りました。</p><p>（我買了新遊戲軟體。所以，就將舊的賣掉了。）</p><p>飛行機が2時間遅れました。</p><p>だから、それで怒っている人が多いでしょう。</p><p>（飛機誤點二小時。所以，會有很多人感到生氣吧。）</p><h3>なので</h3><p>「なので」意思同樣為「所以…」，用於連接二個句子，表示互相的因果關係。字義大致和「ので」相同，可以想成將「ので」單獨抽出來，成為一個獨立的用法。</p><p>基本句型:（原因句）。 なので、（結果句）</p><p>例：</p><p>私は風邪をひきました。</p><p>なので、映画館に行きませんでした。</p><p>（我感冒了。所以，沒有去電影院。）</p><p>新しいゲームソフトを買いました。</p><p>なので、バイト代が全部なくなりました。</p><p>（我買了新遊戲軟體。所以，打工的錢全部沒了。）</p><p>飛行機が2時間遅れました。</p><p>なので、到着時間も遅くなります。</p><p>（飛機誤點二個小時。所以，會比較晚到。）</p><p>對應關係：</p><p>から　→　だから　：表示主觀判斷</p><p>ので　→　なので　：表示客觀推測</p><h3>疑問詞</h3><p>常用於詢問原因理由的疑問詞有三個，皆為「為什麼？」之意:</p><h3>①　どうして【1】</h3><h3>②　なぜ【1】</h3><h3>③　なんで【1】</h3><p>例：</p><p>どうしてキリンは首が長いですか？</p><p>（為什麼長頸鹿的脖子那麼長呢？）</p><p>なぜ大体のお店は試食を置きますか？</p><p>（為什麼大部分的店家都設置試吃區呢？）</p><p>なんで今日私の家に来ましたか？</p><p>（為什麼你今天會來我家？）</p><h3>區別方法</h3><p>①　どうして：多使用於日常會話口語中。口語。</p><p>②　なぜ：多使用於文書或正式場合中。文書語。</p><p>③　なんで：為較通俗的說法，一般只用於口語會話時。</p><p>例：</p><p>どうして台湾の夏はこんなに暑いんですか。</p><p>（為什麼台灣的夏天這麼熱呢？） →日常會話時</p><p>なぜ台湾の夏はこんなに暑いんですか。</p><p>（為什麼台灣的夏天這麼熱呢？）→文章、演講時</p><p>なんで台湾のの夏はこんなに暑いんですか。</p><p>（為什麼台灣的夏天這麼熱呢？）→私底下閒聊抱怨時</p><p>另外，由於「なんで」的漢字寫做「何で」，很容易和表示方法手段的「何で」混淆，因此當作原因理由時，習慣唸成「何で」，當作方法手段時，習慣唸成「何で」，請特別注意讀音。</p><p>例：</p><p>なんでこんな時間に学校にいないのですか？</p><p>（為什麼你這個時間不在學校？）</p><p>何で学校に行くのですか？</p><p>（你坐什麼交通工具通學？）</p><p>註：這裡的「～んですか／～のですか」為加強語氣用法，後面單元39會提及。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":22,"title":"日文的連接詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">按句子關係選擇連接詞，不只反覆使用「然後」。</p><h3>それで：因而、所以</h3><p><ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>止<rt>と</rt></ruby>まりました。<mark class=\"study-key\">それで</mark>、<ruby>遅刻<rt>ちこく</rt></ruby>しました。＝電車停駛，因此遲到了。<br><mark class=\"study-key\">それで</mark>、どうしましたか。也可承接故事，問「然後怎麼樣了？」。</p><h3>そして：接著、而且</h3><p><ruby>台<rt>たい</rt></ruby><ruby>南<rt>みなみ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。<mark class=\"study-key\">そして</mark>、おいしいものを<ruby>食<rt>た</rt></ruby>べました。＝去了台南，然後吃了好吃的東西。<br>也可用來並列最後一項：日本、韓国、そして台湾。</p><h3>それに：另外、而且</h3><p>この<ruby>店<rt>みせ</rt></ruby>はおいしいです。<mark class=\"study-key\">それに</mark>、<ruby>安<rt>やす</rt></ruby>いです。＝這家店好吃，而且便宜。<br>用來補充同方向的理由或資訊。</p><h3>それから：之後、還有</h3><p><ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。<mark class=\"study-key\">それから</mark>、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。＝吃早餐後去了學校。<br>あ、<mark class=\"study-key\">それから</mark>、<ruby>本<rt>ほん</rt></ruby>も<ruby>持<rt>も</rt></ruby>ってきてください。＝啊，還有，請把書也帶來。<br>和そして的差別不是隔了幾分鐘；それから較明確帶出之後的階段，也可追加話題。</p><h3>整理步驟</h3><p><mark class=\"study-key\">まず</mark>、<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>きます。次に、<ruby>答<rt>こた</rt></ruby>えを<ruby>書<rt>か</rt></ruby>きます。最後に、確認します。<br>先寫名字，再寫答案，最後檢查。<br>按需要使用まず／次に／最後に，不必固定把所有連接詞都用一次。</p>","symbol":"その先","intro":"接下來、而且、因此，各有自己的位置。","tag":"それで・そして・それに・それから","concepts":[["それで：承接結果","前句交代原因，後句說實際造成的結果。","<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>止<rt>と</rt></ruby>まりました。それで、<ruby>遅刻<rt>ちこく</rt></ruby>しました。","電車停駛，因此遲到了。這裡重點是因果關係。"],["そして與それから","<mark class=\"study-key\">そして</mark>可連接敘述或並列資訊；<mark class=\"study-key\">それから</mark>常標示接下來的步驟，也可追加話題。","<ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。それから、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","吃了早餐，之後去學校。不是按照兩件事隔了幾分鐘來選詞。"],["それに：再補充一點","加入另一項同方向的資訊。整理步驟時也可用<mark class=\"study-key\">まず</mark>、<mark class=\"study-key\">次に</mark>、最後に。","この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いです。それに、おいしいです。","這家店便宜，而且好吃。"]],"caution":"<mark class=\"study-key\">そして</mark>與<mark class=\"study-key\">それから</mark>有重疊，不宜定成「短時間／長時間」的規則。首先、其次、最後等詞也不必每次全部用齊。","quiz":[{"prompt":"想追加「而且很好吃」：この店は安いです。＿＿、おいしいです。","options":["それに","しかし","なのに","でも"],"answer":0,"explanation":"それに補充同方向的優點。"},{"prompt":"電車停駛，因此遲到。最合適的因果連接詞是？","options":["それから","それで","しかし","でも"],"answer":1,"explanation":"それで承接前面的原因，交代結果。"},{"prompt":"「最後に」是甚麼意思？","options":["首先","其次","最後","但是"],"answer":2,"explanation":"最後に用於最後一步或最後一項。"},{"prompt":"關於そして與それから，哪個理解較合適？","options":["只按相隔分鐘數決定","そして只能用於一分鐘內","それから一定隔了幾天","用法有重疊，それから常突出先後順序"],"answer":3,"explanation":"兩者不是按時間長短硬性區分。"}],"uploadedOriginal":"<h3>[ 單元22 ] 日文的連接詞</h3><h3>學習目標</h3><p>①　介紹日文中常見的連接詞「それで」「そして」「それに」「それから」</p><h3>②　學習各連接詞的使用時機</h3><h3>③　了解各連接詞在會話中的使用順序</h3><p>介紹一篇我弟弟八歲時寫的作文:</p><p>我早上起來，然後刷牙，然後吃早餐，然後去學校，然後考試，然後回家，然後考不好被打，然後吃飯，然後睡覺。</p><p>好吧，這是一篇流水帳到不行的作文，先不論內容，各位一定注意到有個字詞重覆率非常高:「然後」。其實，我們在說話時，也會時常下意識地使用「然後」來連接我們想講的話: 「我去那家店啊，然後…」等等，別小看這個「然後」，它是我們上一單元所提過的「連接詞」，功能為連接二個句子、使句子聽起來更為流暢，是日常會話時不可或缺的字之一。</p><p>既然它是使用頻率如此高的字詞，那麼想當然，在日文中一定也會常常用到囉？沒錯，不過「然後」這個詞在日文中，分成好幾種不同的說法。就像中文有「然後、之後、再者、而且、另外」等等相似的用法，日文中當然也會依照使用時機和場合的不同、而分成好幾種不同的說法。</p><p>這就是本單元的主題：介紹日文中常見的連接詞，特別是和「然後」相關的用法。也許到目前為止，你一次只能講一句日文，講完後不知該如何切入下一句，然而（這也是連接詞！），當你學會本單元的內容後，就會發現「連接詞」像是潤滑劑一般，能讓會話接連不斷、顯得更為流暢！</p><p>當然，如果我們一直使用「然後」「然後」「然後」的話，說起話來就會像是我弟弟的作文一般乏味，因此，我們也將介紹如何在會話中有順序地使用不同的連接詞、讓對話聽起來更有組織。聽起來大致會像是這樣：「首先…，其次…，接下來…，最後…」，有條有理、對方也會很容易理解，特別是在演講或發表時，這種用法將會扮演重要的角色。</p><h3>連接詞</h3><p>それで  :</p><p>表示由於前面的原因，而造成後面的結果，相當於中文的「因此」。</p><p>例：</p><p>天気がよくありません。</p><p>それで、海に行くのをやめました。</p><p>（天氣不好。因此，不去海邊了。）</p><p>道に迷いました。それで、</p><p>交番に道を尋ねに行きました。</p><p>（迷路了。因此，去了派出所問路。）</p><p>リビングのソファで寝ました。</p><p>それで、風邪をひきました。</p><p>（在客廳的沙發上睡著了。因此，感冒了。）</p><p>それで、これからどうします？</p><p>（然後呢？將來該怎麼做？）</p><p>それで、どうした？</p><p>（然後呢？怎麼樣？）</p><p>ふーん、それで？</p><p>（嗯～，然後呢？）</p><p>そして　:</p><p>最常使用的連接詞之一，基本功能為單純連接句子，相當於中文的「然後」。也可以用於一次列舉多項事物。</p><p>例：</p><h3>スーパーで野菜、にんじん、タマネギ、</h3><p>そしてジャガイモを買いました。</p><p>（在超市買了蔬菜、紅蘿蔔、洋葱，然後買了馬鈴薯。）</p><p>日本、ヨーロッパ、そしてアメリカを旅行しました。</p><p>（日本、歐洲、然後也去了美國旅行。）</p><p>台南に遊びに行きました。</p><p>そして、美味しいものをたくさん食べました。</p><p>（去台南玩了一趟。然後，吃了很多好吃的東西。）</p><p>友達は朝九時に家に来ました。</p><p>そして、夜六時にみんな帰りました。</p><p>（朋友在早上九點來家裡。然後，大家晚上六點回家了。）</p><p>彼は運動場で倒れました。</p><p>そして、3分後救急車が来ました。</p><p>（他倒在運動場上。然後，三分鐘後救護車來了。）</p><p>それに　:</p><p>主要用於補充說明時，相當於中文的「另外、還有」</p><p>例：</p><p>最近、雨の日が多いです。</p><p>それに、台風も２個来ました。</p><p>（最近常常下雨。另外，還來了二個颱風。）</p><p>この店の料理は美味しいです。</p><p>それに、値段もとても安いです。</p><p>（這家店的料理很好吃。另外，價格也非常便宜。）</p><p>宿題をしました。</p><p>それに、明日の授業の予習もしました。</p><p>（寫了作業。另外，也預習了明天的上課內容。）</p><p>昨日財布を無くしました。</p><p>それに、傘も電車に忘れました。</p><p>（昨天將錢包弄丟了。另外，雨傘也忘在電車上。）</p><p>それから:</p><p>意思和「そして」相近，不同的地方在於，「そして」給人感覺經過時間較短、「それから」給人感覺時間較長。</p><p>相當於中文的「之後…」。另外，也可用於「追加說明」。</p><p>例：</p><p>昨日はテレビを見ました。</p><p>それから、テストの勉強をしました。</p><p>（昨天看了電視。之後，唸書準備考試。）</p><p>2月に日本を旅行しました。</p><p>それから、韓国にも行きました。</p><p>（二月時去了日本旅行。之後，也去了韓國。）</p><p>駅の前に新しいコンビニができました。</p><p>それから、駅の後ろにもコンビニができました。</p><p>（車站前面開了新便利商店。之後，車站後面也開了一家便利商店。）</p><p>話はここまでです。あ、それから…</p><p>（話就講到這裡。啊，還有…）</p><p>日本の神社に参拝しましたよ。</p><p>あ、それから、御守も買いました。</p><p>（我去參拜過日本的神社了喔。啊，還有，也買了御守。）</p><h3>會話中使用的連接詞</h3><p>如果在會話時，想要有組織、有條理說出一段短文的話，可以試試下面以五個連接詞所構成的架構。不但能夠防止離題，還可以避免一直重覆使用「然後」「然後」「そして」「そして」的窘境。</p><p>我們使用以下五個連接詞:</p><p>「まず」　「次に」　「そして」　「それから」　「最後に」</p><p>まず: 首先</p><p>次に: 其次</p><p>そして: 然後</p><p>それから: 之後</p><p>最後に: 最後</p><p>例：</p><p>私は先月台湾を旅行しました。</p><p>まず、台北のお寺と夜市に行きました。</p><p>次に、桃園で飛行機を見に行きました。</p><p>そして、台中で有名な湖のとなりのホテルに泊まりました。</p><p>それから、南投の有名な牧場に遊びに行きました。</p><p>最後に、南投から台北に帰りました。</p><p>我上個月去台灣旅行。</p><h3>首先，去了台北的廟宇和夜市，</h3><h3>其次，去桃園看飛機起降，</h3><h3>然後，住在台中有名的湖旁邊的湖畔旅館，</h3><h3>之後，去了南投有名的牧場，</h3><p>最後，從南投回到了台北。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":23,"title":"日文中的轉折語氣","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分辨一般轉折、意外與<mark class=\"study-key\">批評</mark>，選擇合適語氣。</p><h3>が／けれども／けど：雖然……但是……</h3><p>この<ruby>店<rt>みせ</rt></ruby>は<ruby>高<rt>たか</rt></ruby>いですが、おいしいです。＝這家店雖貴，但好吃。<br>この<ruby>店<rt>みせ</rt></ruby>は<ruby>高<rt>たか</rt></ruby>いけど、おいしいです。＝這家店貴，但好吃。<br>名詞／な形容詞普通形接だが／だ<mark class=\"study-key\">けど</mark>；い形容詞和動詞普通形直接接が／けど。<br>也能接です／ます等禮貌形。が不只出現在文章；けど較口語。</p><h3>のに：和預期不同</h3><p>名詞／な形容詞＋<mark class=\"study-key\">なのに</mark>；い形容詞／動詞普通形＋<mark class=\"study-key\">のに</mark>。<br><ruby>日曜日<rt>にちようび</rt></ruby>なのに、<ruby>仕事<rt>しごと</rt></ruby>があります。＝明明是星期日，卻要工作。<br>お<ruby>金<rt>かね</rt></ruby>を<ruby>振り込<rt>ふりこ</rt></ruby>んだのに、<ruby>商品<rt>しょうひん</rt></ruby>が来ません。＝明明匯款了，商品卻沒送來。<br>常表達意外、遺憾或不滿，不是單純比較音量大小。</p><h3>くせに：帶批評的轉折</h3><p>名詞＋の<mark class=\"study-key\">くせに</mark>；な形容詞＋な<mark class=\"study-key\">くせに</mark>；い形容詞／動詞普通形＋くせに。<br><ruby>知<rt>し</rt></ruby>っているくせに、<ruby>教<rt>おし</rt></ruby>えてくれません。＝明明知道，卻不告訴我。<br>容易冒犯對方；通常圍繞同一個被批評的對象，不宜把每個のに都換成くせに。</p><h3>分成兩句的轉折</h3><p><ruby>勉強<rt>べんきょう</rt></ruby>しました。でも、<ruby>分<rt>わ</rt></ruby>かりません。＝讀過了，但不明白。<br>しかし常見於較正式的說明；ですが也能承接前句。<br>この<ruby>絵<rt>え</rt></ruby>はきれいです。<mark class=\"study-key\">なのに</mark>、<ruby>誰<rt>だれ</rt></ruby>も<ruby>買<rt>か</rt></ruby>いません。＝這幅畫很漂亮，卻沒人買。<br>這些詞不是固定的「語氣力度排行榜」，要看說話目的和情境。</p>","symbol":"けれど","intro":"表達轉折，也留意語氣的重量。","tag":"が・けど・のに・くせに","concepts":[["が／けど：雖然……但是……","連接兩個有<mark class=\"study-key\">對比</mark>的內容。<mark class=\"study-key\">けど</mark>常用於口語，が也能用於禮貌會話。","このかばんは<ruby>小<rt>ちい</rt></ruby>さいですが、<ruby>便利<rt>べんり</rt></ruby>です。","這個袋雖然小，但很方便。小さい<mark class=\"study-key\">けど</mark>、便利です也可以。"],["のに：結果和預期不同","動詞／い形容詞普通形＋<mark class=\"study-key\">のに</mark>；名詞／な形容詞＋<mark class=\"study-key\">なのに</mark>。常表達意外或遺憾。","<ruby>日曜日<rt>にちようび</rt></ruby>なのに、<ruby>仕事<rt>しごと</rt></ruby>があります。","明明是星期日，卻要工作。"],["くせに及獨立連接詞","<mark class=\"study-key\">くせに</mark>常帶<mark class=\"study-key\">批評</mark>，別隨意用來評論對方。兩句之間可用でも、しかし、なのに等。","<ruby>勉強<rt>べんきょう</rt></ruby>しました。でも、<ruby>分<rt>わ</rt></ruby>かりません。","讀過了，但是不明白。名詞接の<mark class=\"study-key\">くせに</mark>；な形容詞接なくせに。"]],"caution":"這些詞不能當作固定的「力度排行榜」。原文「お金を振り込んだ<mark class=\"study-key\">くせに</mark>、商品がまったく来ません」前後對象不同，較自然是「お金を振り込んだ<mark class=\"study-key\">のに</mark>、商品が来ません」。","quiz":[{"prompt":"明明是星期日，卻要工作：日曜日＿＿、仕事があります。","options":["なのに","のに","だのに","をのに"],"answer":0,"explanation":"名詞在のに前接な：日曜日なのに。"},{"prompt":"哪個通常帶有較強的批評、不滿？","options":["そして","くせに","それから","まず"],"answer":1,"explanation":"くせに常帶批評，對人使用要留意語氣。"},{"prompt":"「小さいですが、便利です」表示？","options":["因為小所以方便","既不小也不方便","雖然小但方便","小或方便"],"answer":2,"explanation":"が在這裡連接對比的內容。","rubyView":{"prompt":"「<ruby>小<rt>ちい</rt></ruby>さいですが、<ruby>便利<rt>べんり</rt></ruby>です」表示？","options":["因為小所以方便","既不小也不方便","雖然小但方便","小或方便"],"explanation":"が在這裡連接對比的內容。"}},{"prompt":"い形容詞「高い」接けど，哪個正確？","options":["高いだけど","高いなけど","高くけど","高いけど"],"answer":3,"explanation":"い形容詞普通形直接接けど。","rubyView":{"prompt":"い形容詞「<ruby>高<rt>たか</rt></ruby>い」接けど，哪個正確？","options":["高いだけど","高いなけど","高くけど","高いけど"],"explanation":"い形容詞普通形直接接けど。"}}],"uploadedOriginal":"<h3>[ 單元23 ] 日文中的轉折語氣學習目標</h3><h3>學習目標</h3><h3>①　了解表示轉折語氣的</h3><p>「が」「けど」「のに」「くせに」用法。</p><p>②　學習連接詞「ですが」「でも」「しかし」「なのに」</p><p>我們在單元21介紹過日文原因理由的說法、以及「から」和「ので」二項助詞。「因為…所以…」這樣的句型，稱為「順接用法」，所謂的「順接用法」，指的是按照「原因→結果」的順序所描述的句型。「因為今天下雨，所以遠足取消」，「今天下雨」是原因，「遠足取消」是結果，因此這是一句「順接用法」。</p><p>有「順接用法」，那麼當然就會有「逆接用法」。「逆接用法」為按照「動作 → 意料之外的結果」順序所描述的句型，我們可以換個比較容易理解的中文說法:「轉折語氣」。簡單來說，轉折語氣就是「雖然…但是…」這樣的句型，前面是動作、後面是出乎意料之外的結果。例如:「雖然颱風來了，但還是有人去海邊」，「颱風來了」是發生的動作，「有人去海邊」是意料之外的結果，因此這種句型稱為「逆接用法（轉折語氣）」。</p><p>我們本單元的主題，就是要學會日文中的「轉折語氣」說法。簡單整理如下:</p><p>「順接用法（正常語氣）」:</p><p>「原因 → 結果」 → 「因為…所以…」</p><p>「逆接用法（轉折語氣）」:</p><p>「動作 → 意料之外的結果」 → 「雖然…但是…」</p><p>日文中表示「雖然…但是…」句型的助詞，常見的有「が」、「けど」、「のに」、「くせに」四個，我們將介紹其使用方法和使用時機。</p><p>另外，既然有表示「原因理由」的連接詞（如だから、なので），那麼當然也會有表示「雖然…但是…」的連接詞、用以連結二個句子。我們也會一併介紹「ですが」、「でも」、「しかし」、「なのに」四個表示轉折語氣的連接詞。</p><h3>助詞×４</h3><p>「逆接用法（轉折語氣）」的基本句型如下:</p><p>基本句型:</p><p>（動作）＋「が／けれども／のに／くせに」、（意料之外的結果）</p><p>（雖然…但是…）</p><p>經常使用於轉折語氣的助詞，主要有以下四個:</p><h3>「が」</h3><p>表示輕微的轉折語氣，相當於中文的「雖然…但是…」，主要用於文章或正式場合中，為書面用語。</p><p>文法:</p><h3>名詞・な形容詞＋だが／ですが</h3><h3>い形容詞＋が／ですが</h3><h3>動詞＋が</h3><p>例：</p><p>この店は高いですが、全然美味しくありません。</p><p>（雖然這間餐廳很貴，但是一點都不好吃。）</p><p>明日からは夏休みですが、宿題がいっぱいあります。</p><p>（雖然明天開始是暑假，但是有很多作業。）</p><p>パソコンを買いましたが、キーボードがありません。</p><p>（雖然買了電腦，但是卻沒有鍵盤。）</p><p>彼女はかわいいですが、わがままな人です。</p><p>（雖然她很可愛，但是卻很任性。）</p><p>北川さんはたくさん食べますが、全然太りません。</p><p>（雖然北川小姐吃很多，但是完全不會變胖。）</p><p>テレビを付けましたが、画面がなかなか出ません。</p><p>（雖然開了電視，但是卻一直沒有畫面。）</p><p>補充：這裡使用「が」和「ですが」都可以。「が」多用於和平輩朋友說話時、而「ですが」則用在和上司長輩說話的時候。</p><h3>「けれども」</h3><p>和「が」相同，表示輕微的轉折語氣，相當於中文的「雖然…但是…」。主要用於口語會話中，為口頭用語。在日常會話中，也會使用「けれど」或「けど」的形式。</p><p>文法:</p><h3>名詞・な形容詞＋だけれども／ですけれども</h3><h3>い形容詞＋けれども／ですけれども</h3><h3>動詞＋けれども</h3><p>例：</p><p>この店は高いけれども、全然美味しくありません。</p><p>（雖然這間餐廳很貴，但是一點都不好吃。）</p><p>あの歌手は有名だけれども、歌が下手です。</p><p>（雖然那位歌手很有名，但是卻很不會唱歌。）</p><p>明日からは夏休みだけれども、宿題がいっぱいあります。</p><p>（雖然從明天開始是暑假，但是有很多作業。）</p><h3>パソコンを買いましたけれども、</h3><p>キーボードがありません。</p><p>（雖然買了電腦，但是卻沒有鍵盤。）</p><p>彼女はかわいいけれども、わがままな人です。</p><p>（雖然她很可愛，但是卻很任性。）</p><h3>北川さんはたくさん食べましたけれども、</h3><p>全然太りません。</p><p>（雖然北川小姐吃了很多，但是卻完全不會胖。）</p><p>テレビを付けましたけれども、画面がなかなか出ません。</p><p>（雖然開了電視，但是卻沒有畫面。）</p><h3>「のに」</h3><p>表示較強烈的轉折語氣，相當於中文的「明明…但是…」。</p><p>文法:</p><h3>名詞・な形容詞＋なのに</h3><h3>い形容詞・動詞＋のに</h3><p>例：</p><p>夏なのに、陽明山で雪が降りました。</p><p>（明明是夏天，但是陽明山卻下雪了。）</p><p>もう25歳なのに、両親からお小遣いをもらいます。</p><p>（明明已經二十五歲了，但卻還是和父母親領零用錢。）</p><p>あの店の弁当は美味しいのに、40元もかかりません。</p><p>（那間店的便當明明很好吃，但是卻花不到四十元。）</p><p>この絵はきれいなのに、誰も買いません。</p><p>（這幅畫明明很漂亮，但是卻沒有人買。）</p><p>もう朝なのに、なかなか起きることができません。</p><p>（明明已經是早上，但是卻怎麼樣都起不來。）</p><p>目覚まし時計をかけたのに、なかなか鳴りません。</p><p>（明明已經設定了鬧鐘，但是卻一直沒有響。）</p><h3>「くせに」</h3><p>最強烈的轉折語氣，帶有強烈不滿、抱怨的感覺，相當於中文的「明明是…但是卻…」。主要會用在抱怨、批評的時候。</p><p>文法接續方式和名詞相同:</p><h3>名詞＋のくせに</h3><h3>な形容詞＋なくせに</h3><h3>い形容詞・動詞＋くせに</h3><p>例：</p><p>給料をたくさんもらうくせに、全然仕事をしません。</p><p>（明明領了很多薪水，但是卻完全不工作。）</p><p>お金を振り込んだくせに、商品がまったく来ません。</p><p>（明明將錢匯過去了，但是商品卻完全沒有送來。）</p><h3>日本語先生のくせに、</h3><p>日本語で自己紹介することもできません。</p><p>（明明是日文老師，但是卻連用日文自我介紹都不會。）</p><h3>お金持ちのくせに、</h3><p>さんざん値切りました。</p><p>（明明是有錢人，但是卻不斷地殺價。）</p><p>この車はとんでもなく高いくせに、すぐ故障します。</p><p>（這輛車明明貴得要死，但是卻動不動就故障。）</p><p>ここの公務員は暇なくせに、ひたすら文句を言います。</p><p>（這裡的公務員明明很閒，但是卻一直抱怨東抱怨西。）</p><h3>連接詞×４</h3><p>以上介紹的助詞，和連接詞的對應關係如下:</p><p>「が」→「ですが」</p><p>介於『が』和『のに』之間  →「でも」「しかし」</p><p>「のに」→「なのに」</p><p>基本句型:</p><p>（發生的動作）。連接詞、（意料之外的結果）。</p><h3>「ですが」</h3><p>表示輕微的轉折語氣，相當於中文的「但是…」，主要用於文章或正式場合中，為書面用語。</p><p>例：</p><p>この店は高いです。ですが、</p><p>全然美味しくありません。</p><p>（這間餐廳很貴。但是，卻一點都不好吃。）</p><h3>「でも」</h3><p>表示略為強烈的轉折語氣，相當於中文的「但是…」，主要用於會話中，為口頭用語。</p><p>例：</p><p>明日からは夏休みです。</p><p>でも、宿題がいっぱいあります。</p><p>（明天開始是暑假。但是，卻有很多作業。）</p><h3>「しかし」</h3><p>和「でも」相同，但主要用於文章和正式場合中，為書面用語。語氣比「ですが」更強一些。</p><p>例：</p><p>テレビを付けました。しかし、画面がなかなか出ません。</p><p>（開了電視。然而，畫面卻一直出不來。）</p><h3>「なのに」</h3><p>表示較強烈的轉折語氣，相當於中文的「明明…但是…」。</p><p>例：この絵がきれいです。なのに、誰も買いません。</p><p>（這幅畫很漂亮。但是，卻沒有人買。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":24,"title":"動詞て形","original":"<h3>學習目標</h3><p class=\"lesson-focus\">① 認識て形的作用。② 按三類動詞分組變化。③ 用て形<ruby>連接<rt>れんせつ</rt></ruby><ruby>動作<rt>どうさ</rt></ruby>。④ 連接名詞與形容詞。</p><h3>先理解，再背變化</h3><p>て形是一種<mark class=\"study-key\">接續形式</mark>，可以接其他動作或句型。它本身不是「過去式」，也不只能翻成「然後」。<br><ruby>食<rt>た</rt></ruby>べる（吃）→ <ruby>食<rt>た</rt></ruby>べて（て形）→ 食べてください（請吃）。<br>本課先掌握變法，下一課再學請求、許可和禁止。</p><h3>做題時，照這三步走</h3><p>第一步：找出辭書形。看到飲みます時，先想到飲む。<br>第二步：確認第一類、第二類或第三類。遇到不確定的詞，查詞典確認類別。<br>第三步：依類別換字尾，保留前面的部分。不要直接把所有ます換成て。</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">類別／辭書形字尾</th><th scope=\"col\">變化</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>第一類：う・つ・る</td><td>→ って</td><td><ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>って；<ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>って；<ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>って</td></tr><tr><td>第一類：む・ぶ・ぬ</td><td>→ <mark class=\"study-key\">んで</mark></td><td><ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>んで；<ruby>遊<rt>あそ</rt></ruby>ぶ→<ruby>遊<rt>あそ</rt></ruby>んで；<ruby>死<rt>し</rt></ruby>ぬ→<ruby>死<rt>し</rt></ruby>んで</td></tr><tr><td>第一類：く</td><td>→ いて</td><td><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>いて</td></tr><tr><td>第一類：ぐ</td><td>→ いで</td><td><ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>いで</td></tr><tr><td>第一類：す</td><td>→ して</td><td><ruby>話<rt>はな</rt></ruby>す→<ruby>話<rt>はな</rt></ruby>して</td></tr><tr><td>第二類</td><td><ruby>去<rt>さ</rt></ruby>る＋て</td><td><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べて；<ruby>見<rt>み</rt></ruby>る→<ruby>見<rt>み</rt></ruby>て</td></tr><tr><td>第三類</td><td>另外記憶</td><td>する→して；来る（くる）→<ruby>来<rt>き</rt></ruby>て（きて）</td></tr><tr><td><ruby>常用<rt>じょうよう</rt></ruby><ruby>例外<rt>れいがい</rt></ruby>：<ruby>行<rt>い</rt></ruby>く</td><td>→ <ruby>行<rt>い</rt></ruby>って</td><td>行く（いく）→<ruby>行<rt>い</rt></ruby>って（いって）</td></tr></tbody></table></div><h3>示範一：讀書</h3><p>読む（よむ）是第一類，末尾是む。<br>把む換成<mark class=\"study-key\">んで</mark>：読＋んで＝<ruby>読<rt>よ</rt></ruby>んで（よんで）。<br><ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでください。＝請看書。<br>錯誤提醒：読みて不是這個動詞的標準て形。</p><h3>示範二：兩個る，不同做法</h3><p>食べる是第二類：<ruby>食<rt>た</rt></ruby>べ＋て＝<ruby>食<rt>た</rt></ruby>べて。<br>帰る是第一類：<ruby>帰<rt>き</rt></ruby>＋って＝<ruby>帰<rt>かえ</rt></ruby>って。<br>不能看到る就一律去掉る加て。把動詞的類別與單字一起記，會比臨時猜更可靠。</p><h3>示範三：く、ぐ與例外</h3><p><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>いて；<ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>いで。ぐ有濁音，變形後的で也保留濁音。<br>行く是常用例外：<mark class=\"study-key\">行って</mark>，不是行いて。<br><ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いてください。＝請寫名字。<br>プールで<ruby>泳<rt>およ</rt></ruby>いでいます。＝正在泳池游泳。</p><h3>把兩件事接成一句</h3><p><ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。<br>→ <ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べて、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。＝吃早餐後去學校。<br><ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べて、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。＝吃了早餐後去了學校。<br>前面的食べて相同，句末行きます／行きました交代主要時態。<br>多個動作也可以：<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>って、<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>って、<ruby>読<rt>よ</rt></ruby>みました。＝買了書，回家後讀了。</p><h3>名詞與形容詞的連接</h3><p>名詞／な形容詞後面加で：<br><ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>で、<ruby>妹<rt>いもうと</rt></ruby>も<ruby>学生<rt>がくせい</rt></ruby>です。＝我是學生，妹妹也是學生。<br>この<ruby>部屋<rt>へや</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かで、きれいです。＝這個房間安靜又乾淨。<br>い形容詞去最後い，再加くて：<br>この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>くて、おいしいです。＝這家店便宜又好吃。<br>いい的接續是<mark class=\"study-key\">よくて</mark>，不是いいくて。</p><h3>一分鐘重溫</h3><p>う・つ・る→って；む・ぶ・ぬ→<mark class=\"study-key\">んで</mark>；<mark class=\"study-key\">く→いて</mark>；ぐ→いで；す→して。<br>第二類去る加て；する→して；<ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>き</rt></ruby>て；<ruby>行<rt>い</rt></ruby>く→<ruby>行<rt>い</rt></ruby>って。<br>不用一次背完全部單字。先用買う、<ruby>読<rt>よ</rt></ruby>む、<ruby>書<rt>か</rt></ruby>く、<ruby>食<rt>た</rt></ruby>べる、する、<ruby>行<rt>い</rt></ruby>く<ruby>練習<rt>れんしゅう</rt></ruby>。</p>","symbol":"つなぐ","intro":"先分三類，再看字尾；一次只做一步。","tag":"て形・分組・連接","concepts":[["先知道：て形不是過去式","て形是一個<mark class=\"study-key\">接續形式</mark>。後面加甚麼，就能表達請求、許可、正在做等不同意思。","<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べて → <ruby>食<rt>た</rt></ruby>べてください。","吃 → て形 → 請吃。不是「吃了」。先變形，再接句型。"],["第一步：確認動詞類別","先找する／来る，再看是不是已學過的一段動詞。不要只因字尾是る，就當成第二類。","<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べて ／ <ruby>帰<rt>かえ</rt></ruby>る → <ruby>帰<rt>かえ</rt></ruby>って","食べる是第二類，<mark class=\"study-key\">去る加て</mark>。帰る是第一類，る要變って。"],["第一類①：う・つ・る → って","只換最後一個假名，前面保留。把這三個尾音當一組記。","<ruby>買<rt>か</rt></ruby>う → <ruby>買<rt>か</rt></ruby>って ／ <ruby>待<rt>ま</rt></ruby>つ → <ruby>待<rt>ま</rt></ruby>って ／ <ruby>帰<rt>かえ</rt></ruby>る → <ruby>帰<rt>かえ</rt></ruby>って","私はパンを買って、家に帰ります。＝我買麵包後回家。小っ是停頓，不是大つ。"],["第一類②：む・ぶ・ぬ → んで","這一組結尾是<mark class=\"study-key\">んで</mark>，不是んて。先記熟常用的読む與遊ぶ。","<ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>んで ／ <ruby>遊<rt>あそ</rt></ruby>ぶ → <ruby>遊<rt>あそ</rt></ruby>んで ／ <ruby>死<rt>し</rt></ruby>ぬ → <ruby>死<rt>し</rt></ruby>んで","本を読<mark class=\"study-key\">んで</mark>ください。＝請看書。三個字尾一起換成んで。"],["第一類③：く→いて、ぐ→いで、す→して","く和ぐ是一對：原來有濁音的ぐ，變形後也用濁音で。す則換成して。","<ruby>書<rt>か</rt></ruby>く → <ruby>書<rt>か</rt></ruby>いて ／ <ruby>泳<rt>およ</rt></ruby>ぐ → <ruby>泳<rt>およ</rt></ruby>いで ／ <ruby>話<rt>はな</rt></ruby>す → <ruby>話<rt>はな</rt></ruby>して","名前を書いてください。＝請寫名字。唯一要另外記的常用例外：行く→<mark class=\"study-key\">行って</mark>。"],["第二類與第三類：很短的規則","第二類<mark class=\"study-key\">去る加て</mark>。第三類<mark class=\"study-key\">する→して</mark>；来る→来て，讀音是くる→きて。","<ruby>見<rt>み</rt></ruby>る → <ruby>見<rt>み</rt></ruby>て ／ <ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べて ／ する → して","写真を見てください。＝請看照片。ここに来てください。＝請到這裡來。"],["把兩件事接成一句","前面的動詞用て形，最後的動詞決定句子的主要時態與禮貌程度。","<ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べて、<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","吃了早餐後去了學校。食べて不改，句末行きました告訴你是在說過去。"],["名詞、形容詞也可以連接","名詞／な形容詞＋で；い形容詞去い＋くて。いい要變<mark class=\"study-key\">よくて</mark>。","この<ruby>店<rt>みせ</rt></ruby>は<ruby>安<rt>やす</rt></ruby>くて、おいしいです。","這家店便宜又好吃。静かで、きれいです＝安靜又乾淨漂亮。"]],"caution":"不要一律把ます換成て：飲みます→飲みて不對，要從飲む得到飲<mark class=\"study-key\">んで</mark>。先確認類別，再套用字尾分組。て形也不只有「然後」一種用途。","quiz":[{"prompt":"「買う」的て形是？","options":["買って","買いて","買うて","買んで"],"answer":0,"explanation":"第一類う・つ・る→って，所以買う→買って。","rubyView":{"prompt":"「<ruby>買<rt>か</rt></ruby>う」的て形是？","options":["買って","買いて","買うて","買んで"],"explanation":"第一類う・つ・る→って，所以買う→買って。"}},{"prompt":"「読む」的て形是？","options":["読みて","読んで","読って","読いて"],"answer":1,"explanation":"第一類む・ぶ・ぬ→んで。讀書：本を読んでください。","rubyView":{"prompt":"「<ruby>読<rt>よ</rt></ruby>む」的て形是？","options":["読みて","読んで","読って","読いて"],"explanation":"第一類む・ぶ・ぬ→んで。讀書：本を読んでください。"}},{"prompt":"哪一組兩個變化都正確？","options":["帰る→帰て；食べる→食べって","帰る→帰いて；食べる→食べて","帰る→帰って；食べる→食べて","帰る→帰て；食べる→食べんで"],"answer":2,"explanation":"帰る是第一類，所以る→って；食べる是第二類，去る加て。"},{"prompt":"「行く」的て形是哪個？","options":["行いて","行きて","行んで","行って"],"answer":3,"explanation":"行く是常用例外，特別記行って；不是照く→いて。","rubyView":{"prompt":"「<ruby>行<rt>い</rt></ruby>く」的て形是哪個？","options":["行いて","行きて","行んで","行って"],"explanation":"行く是常用例外，特別記行って；不是照く→いて。"}}],"uploadedOriginal":"<h3>[ 單元24 ] 動詞て形</h3><h3>學習目標</h3><h3>①　學習「動詞て形」的變化方法</h3><h3>②　學習「動詞て形」的基本使用方法</h3><p>鏘鏘鏘鏘，本單元開始，將堂堂進入日文動詞變化的關鍵點:「動詞て形」。噢，我們彷彿可以聽見許多人的哀號，若你之前曾經立志學好日文、後來又無法持續下去的話，那麼以「動詞て形」為首的動詞變化，可能是將你擊沈的其中一枚巨大飛彈。各位聽過日文學習的80/20法則嗎？日文有三塊大石頭，分別是五十音、動詞變化和日文敬語。有80％想學日文的人，在五十音時就宣告放棄，只有20％的人成功記熟五十音；這些20％的人，又有80％在日文動詞變化（特別是動詞て形之後）時投降，只有20％的人努力克服了這個關卡；然後這些20％的人，又有80％在日文敬語的學習上遲遲無法前進，只有其中20％能夠學有所成。</p><p>先不論商業和正式場合，其實如果日文敬語講得不好，那麼在日常會話中並不會帶來特別大的困擾，但是「五十音」和「動詞變化」就不是那麼回事了。「五十音」相當於英文的字母，學不好五十音而想學好日文，就像車子沒有輪胎一樣不切實際，其重要性不言而喻。然後，以「動詞て形」為首的動詞變化，則會大大影響口語會話的流暢度，有些人的日文聽起來非常流暢，有些人卻聽起來斷斷續續、講不出一個完整句子，其原因除了發音之外，文法熟悉度也是重要關鍵，而文法熟悉度中，動詞變化的熟習程度又至關緊要。如果五十音是車子的輪胎，那麼動詞變化就是油門和煞車，車子能夠動起來，靠得是輪胎，但是車子能開多快、開多穩，靠的則是油門和煞車。</p><p>本單元中，我們的重點，就是教會各位「動詞て形」的變化和基本使用方法。</p><p>「動詞て形」有什麼功用呢？簡單來說，它就像是萬能膠，能夠將日文中的許多句子、許多動詞黏在一起，使其變成一個完整的語句。我們在學校英文課中學過，動詞和動詞不能放在一起，例如「People eat drink」這句話基本上是錯的，必須改成「People eat, and drink」，像這樣，英文中會用「and」連接動詞和動詞。</p><p>換成日文的話，「私はご飯を食べるコーラを飲む。」這句話也是錯的，因為「食べる」和「飲む」二個動詞不能在同一句話中，會打架。但是用「動詞て形」黏起來就沒有問題了：「私はご飯を食べて、コーラを飲む。」</p><p>因此，某種程度上來說，「て形」和英文「and」的功能很像，專門當作萬能膠，連接複數的動詞或句子。這就是「て形」的基本用法，講完了。是不是沒有想像中的困難？</p><p>那麼，為什麼「動詞て形」等動詞變化會讓80％的人宣告放棄呢？有二個原因，第一，動詞變化的規則有些多；第二，也是最主要的原因：老師教的方法太複雜。正因為動詞變化對於中文母語者來說不好理解，因此教授方法更顯得重要。要教得很複雜、或是教得淺顯易懂，要將簡單的東西教得很複雜、或是將複雜的東西教得簡單，全憑日文老師的功力和技巧。老師的教學方式，會大大影響到學習者的學習意願和效率，有些人學習順暢、沒遭遇什麼理解上的困難，但是有些人卻痛苦到快要升天。這不是因為後者比較笨，只是因為使用不一樣的學習教材和學習方法罷了。</p><p>關於「動詞て形」等動詞變化，我們參考了許許多多的書籍和日語教師的經驗方法，包括觀摩東吳大學和台灣大學的課程（站長是這二所學校的學生），最後整理出淺顯易懂、容易記憶，同時文法上精準無比的學習方法。</p><p>請跟著我們一起學習。</p><h3>動詞て形</h3><p>還記得我們之前學過，動詞分為三類:第一類、第二類和不規則嗎？這次我們也是依照相同的分類，進行動詞變化。同樣地，只有第一類動詞需要動點腦筋，第二類和不規則的變化方式都相當簡單。</p><p>另外，記得我們當初在介紹日文動詞時，就要各位一併記住「動詞原形」和「動詞ます形」嗎？就是為了現在！</p><p>在學習日文動詞變化（無論哪一種都一樣）時，使用動詞原形是最輕鬆簡單、方便記憶的方式！</p><p>我們介紹如何將「動詞原形」變化為「動詞て形」。</p><p>第一類動詞（最難，但是有方法可以記憶）</p><h3>字尾為「す」的動詞</h3><p>て形變化方法：將最後的字母發音由u換成i，加上「て」</p><p>例：</p><p>貸す　kasu　→　　貸して  kasite</p><p>指す　sasu　→　　指して  sasite</p><p>無くす  nakusu  →　　無くして  nakusite</p><p>刺す　sasu　→　　刺して  sasite</p><p>出す　dasu　→　　出して  dasite</p><p>戻す　modosu　→　　戻して  modosite</p><h3>字尾為「く・ぐ」的動詞</h3><p>基本上相同，將最後字母發音由「u」換成「i」，加上「て」但是由於實在太難唸了，例如「書く」→「書きて」、「聞く」→「聞きて」，大家可以唸唸看「書きて、聞きて」，還真不好唸，因此稍微偷懶一下，將「～きて」改唸為「</p><p>～いて」，唸唸看「書いて、聞いて」，是不是比較好唸啦？</p><p>て形變化方法：將假名「く、ぐ」，改為「いて、いで」</p><p>例：</p><p>書く　→　書いて</p><p>引く　→　引いて</p><p>描く　→　描いて</p><p>響く　→　響いて</p><p>続く　→　続いて</p><p>嗅ぐ　→　嗅いで</p><p>凌ぐ　→　凌いで</p><p>泳ぐ　→　泳いで</p><p>仰ぐ　→　仰いで</p><h3>字尾為「う・つ・る」的動詞</h3><p>仔細看，在「う、つ、る」三個假名中，都可以看到小小的假名「つ」:</p><p>因此，「う、つ、る」變成「て形」的方法，就是加上促音「っ」後、再加上「て」，這樣是不是比較容易記憶呢？</p><p>て形變化方法：將假名「う、つ、る」，改為「って」。</p><p>例：</p><p>吸う　→　吸って</p><p>買う　→　買って</p><p>言う　→　言って</p><p>打つ　→　打って</p><p>待つ　→　待って</p><p>立つ　→　立って</p><p>切る　→　切って</p><p>帰る　→　帰って</p><p>送る　→　送って</p><p>売る　→　売って</p><h3>字尾為「ぶ・ぬ・む」的動詞</h3><p>最後是假名「ぶ、ぬ、む」。這三個假名的「て形」比較難記憶，但還是有方法。</p><p>請大聲唸出「ぶ、ぬ、む」這三個假名的發音，然後用手摸摸自己喉嚨的地方，有沒有發現當我們發音時，喉嚨會強烈振動？這個振動的部分是聲帶，我們在發出某些有聲假名（像是ぶ、ぬ、む）的音時，聲帶會強烈振動；發出某些無聲假名（像是か、す、し）時，聲帶的振動就不會那麼強烈。其中，聲帶振動最為強烈且持續的，就是鼻音「ん」，當我們發出「ん」時，喉嚨聲帶的部分會產生強烈且持續的振動。</p><p>我們可以利用這個性質來記憶て形。<br>「ぶ、ぬ、む」和「ん」相同，發音時聲帶會強烈振動，因此它們的て形:</p><p>て形變化方法：將「ぶ、ぬ、む」改為「んで」。</p><p>例：</p><p>飛ぶ　→　飛んで</p><p>運ぶ　→　運んで</p><p>遊ぶ　→　遊んで</p><p>読む　→　読んで</p><p>住む　→　住んで</p><p>噛む　→　噛んで</p><p>死ぬ　→　死んで</p><p>補充：動詞「行く」為例外，「て形」為「行って」</p><h3>第二類動詞</h3><p>て形變化方法: 將動詞字尾的「る」直接換成「て」。</p><p>例：</p><p>食べる　→　食べて</p><p>見る　  →　見て</p><p>開ける　→　開けて</p><p>寝る　  →　寝て</p><p>始める　→　始めて</p><p>集める　→　集めて</p><p>忘れる  →  忘れて</p><h3>不規則動詞</h3><h3>不規則動詞只有二個，直接記起來吧！</h3><p>する　→　して</p><p>来る　→　来て</p><h3>て形用法</h3><p>「動詞て形」的最主要用法，就是連接句子和句子、以及連接動詞和動詞。</p><p>簡單來說，就是將複數句子合成一個句子。</p><p>基本用法:（句子一）。（句子二）。</p><h3>↓</h3><p>（句子一）＋て、（句子二）。</p><p>例：</p><p>（描述晚上做了什麼事時）</p><p>私はご飯を食べる。私はテレビを見る。</p><p>私は宿題をする。</p><h3>↓</h3><p>？　私はご飯を食べるテレビを見る宿題をする。</p><p>○　私はご飯を食べて、テレビを見て、宿題をする。</p><p>（我吃飯、看電視、寫作業。）</p><p>（描述如何搭車上學時）</p><p>例：私は歩く。私は電車に乗る。私はバスに乗る。</p><h3>↓</h3><p>私は歩いて、電車に乗って、バスに乗る。</p><p>（我先走路、之後搭電車、再坐公車。）</p><p>基本用法二:  動詞て形＋動詞て形＋動詞。</p><p>當我們一次使用多個動詞時，也可以使用て形，將所有動詞都串在一起，直接變成一句話。</p><p>例：</p><p>私は本屋で本を買う。本を開く。本を読む。</p><p>私は本屋で本を買って、開いて、読む。</p><p>（我在書店買書、打開、閱讀。）</p><p>私はパソコンで字を打つ。インターネットする。印刷する。</p><p>私はパソコンで字を打って、インターネットして、</p><p>印刷する。（我用電腦打字、上網、列印。）</p><p>註：列印也可以說成「プリントアウトする」</p><h3>名詞和形容詞的て形</h3><p>那麼，當我們想一次講很多名詞、或很多形容詞時，該怎麼辦呢？其實，名詞和形容詞也有て形，功能相同，只是規則簡單多了。</p><p>名詞・な形容詞の「て形」：「名詞・な形容詞」＋で</p><p>例：</p><p>私はサラリーマンです。私は父親です。</p><p>私はサラリーマンで、父親です。</p><p>（我是上班族，也是父親。）</p><p>彼女は英語の先生です。</p><p>彼女は動物園のボランティアです。</p><p>彼女は英語の先生で、動物園のボランティアです。</p><p>（她是英文老師，也是動物園的義工。）</p><p>基隆の夜市は有名です。基隆の夜市は賑やかです。</p><p>基隆の夜市は有名で、賑やかです。</p><p>（基隆夜市很有名，也很熱鬧。）</p><p>あの公園はきれいです。あの公園は静かです。</p><p>あの公園は有名です。</p><p>あの公園はきれいで、静かで、有名です。</p><p>（那座公園很漂亮、安靜、又有名。）</p><p>い形容詞の「て形」：「い形容詞」－「い」＋「くて」</p><p>例：</p><p>大きい　→　大きくて</p><p>小さい　→　小さくて</p><p>広い　→　広くて</p><p>狭い　→　狭くて</p><p>例：</p><p>あの日本料理店は広いです。美味しいです。安いです。</p><p>あの日本料理店は広くて、美味しくて、安(やす)いです。</p><p>（那間日本料理店既寬廣、好吃、又便宜。）</p><p>私の部屋は狭いです。暗いです。きたないです。</p><p>私の部屋は狭くて、暗くて、きたないです。</p><p>（我的房間既小、又暗、又髒。）</p>","noteRevision":"修訂版","revisionReason":"按初學者需要重整動詞說明、例句及易錯概念；上傳原文保留供對照。","verbExamples":[{"word":"買う","reading":"かう","group":"第一類","teRule":"う→って","te":"買って","teReading":"かって","naiRule":"う→わ＋ない","nai":"買わない","naiReading":"かわない","ta":"買った","taReading":"かった","sentence":"パンを買って、帰ります。","translation":"買了麵包後回家。","naiSentence":"今日はパンを買わない。","naiTranslation":"今天不買麵包。う先換成わ：買わない。","taSentence":"昨日、パンを買った。","taTranslation":"昨天買了麵包。買って→買った。"},{"word":"待つ","reading":"まつ","group":"第一類","teRule":"つ→って","te":"待って","teReading":"まって","naiRule":"つ→た＋ない","nai":"待たない","naiReading":"またない","ta":"待った","taReading":"まった","sentence":"ここで待ってください。","translation":"請在這裡等。","naiSentence":"ここでは待たない。","naiTranslation":"不在這裡等。つ換成た，再加ない。","taSentence":"駅で友達を待った。","taTranslation":"在車站等了朋友。待って→待った。"},{"word":"帰る","reading":"かえる","group":"第一類","teRule":"る→って","te":"帰って","teReading":"かえって","naiRule":"る→ら＋ない","nai":"帰らない","naiReading":"かえらない","ta":"帰った","taReading":"かえった","sentence":"家に帰って、休みます。","translation":"回家後休息。","naiSentence":"今日は家に帰らない。","naiTranslation":"今天不回家。帰る是第一類，不是第二類。","taSentence":"昨日は早く家に帰った。","taTranslation":"昨天早早回家了。帰って→帰った。"},{"word":"読む","reading":"よむ","group":"第一類","teRule":"む→んで","te":"読んで","teReading":"よんで","naiRule":"む→ま＋ない","nai":"読まない","naiReading":"よまない","ta":"読んだ","taReading":"よんだ","sentence":"本を読んでください。","translation":"請看書。","naiSentence":"今日は本を読まない。","naiTranslation":"今天不看書。む換成ま，再加ない。","taSentence":"昨日、本を読んだ。","taTranslation":"昨天看了書。読んで→読んだ，で要換だ。"},{"word":"遊ぶ","reading":"あそぶ","group":"第一類","teRule":"ぶ→んで","te":"遊んで","teReading":"あそんで","naiRule":"ぶ→ば＋ない","nai":"遊ばない","naiReading":"あそばない","ta":"遊んだ","taReading":"あそんだ","sentence":"公園で遊んでいます。","translation":"正在公園玩。","naiSentence":"今日は外で遊ばない。","naiTranslation":"今天不在外面玩。ぶ換成ば，再加ない。","taSentence":"昨日、公園で遊んだ。","taTranslation":"昨天在公園玩了。遊んで→遊んだ。"},{"word":"死ぬ","reading":"しぬ","group":"第一類","teRule":"ぬ→んで","te":"死んで","teReading":"しんで","naiRule":"ぬ→な＋ない","nai":"死なない","naiReading":"しなない","ta":"死んだ","taReading":"しんだ","sentence":"虫が死んでいます。","translation":"蟲死了，目前是死亡狀態。","naiSentence":"この虫はまだ死なない。","naiTranslation":"這隻蟲還不會死。ぬ換成な，再加ない：死なない。","taSentence":"虫が死んだ。","taTranslation":"蟲死了。死んで→死んだ。"},{"word":"書く","reading":"かく","group":"第一類","teRule":"く→いて","te":"書いて","teReading":"かいて","naiRule":"く→か＋ない","nai":"書かない","naiReading":"かかない","ta":"書いた","taReading":"かいた","sentence":"名前を書いてください。","translation":"請寫名字。","naiSentence":"ここに名前を書かないでください。","naiTranslation":"請不要在這裡寫名字。書かない再接でください。","taSentence":"手紙を書いた。","taTranslation":"寫了信。書いて→書いた。"},{"word":"泳ぐ","reading":"およぐ","group":"第一類","teRule":"ぐ→いで","te":"泳いで","teReading":"およいで","naiRule":"ぐ→が＋ない","nai":"泳がない","naiReading":"およがない","ta":"泳いだ","taReading":"およいだ","sentence":"プールで泳いでいます。","translation":"正在泳池游泳。","naiSentence":"冬は海で泳がない。","naiTranslation":"冬天不在海裡游泳。ぐ換成が，再加ない。","taSentence":"海で泳いだことがあります。","taTranslation":"曾經在海裡游泳。泳いで→泳いだ，再接經驗句型。"},{"word":"話す","reading":"はなす","group":"第一類","teRule":"す→して","te":"話して","teReading":"はなして","naiRule":"す→さ＋ない","nai":"話さない","naiReading":"はなさない","ta":"話した","taReading":"はなした","sentence":"ゆっくり話してください。","translation":"請慢慢說。","naiSentence":"授業中は話さないでください。","naiTranslation":"上課時請不要說話。話さない再接でください。","taSentence":"友達と話した。","taTranslation":"和朋友談了話。話して→話した。"},{"word":"行く","reading":"いく","group":"第一類・例外","teRule":"例外：行く→行って","te":"行って","teReading":"いって","naiRule":"く→か＋ない","nai":"行かない","naiReading":"いかない","ta":"行った","taReading":"いった","sentence":"学校に行って、勉強します。","translation":"去學校讀書。","naiSentence":"明日は学校に行かない。","naiTranslation":"明天不去學校。ない形按く→か的規則，沒有て形的例外。","taSentence":"日本に行ったことがあります。","taTranslation":"曾經去過日本。行く→行って→行った，例外要保留。"},{"word":"食べる","reading":"たべる","group":"第二類","teRule":"去る＋て","te":"食べて","teReading":"たべて","naiRule":"去る＋ない","nai":"食べない","naiReading":"たべない","ta":"食べた","taReading":"たべた","sentence":"朝ご飯を食べて、出掛けます。","translation":"吃早餐後出門。","naiSentence":"今日は肉を食べない。","naiTranslation":"今天不吃肉。第二類去る，再加ない。","taSentence":"朝ご飯を食べた。","taTranslation":"吃了早餐。食べて→食べた。"},{"word":"見る","reading":"みる","group":"第二類","teRule":"去る＋て","te":"見て","teReading":"みて","naiRule":"去る＋ない","nai":"見ない","naiReading":"みない","ta":"見た","taReading":"みた","sentence":"写真を見てください。","translation":"請看照片。","naiSentence":"夜はテレビを見ない。","naiTranslation":"晚上不看電視。第二類去る，再加ない。","taSentence":"昨日、映画を見た。","taTranslation":"昨天看了電影。見て→見た。"},{"word":"する","reading":"する","group":"第三類","teRule":"特別記憶：する→して","te":"して","teReading":"して","naiRule":"特別記憶：する→しない","nai":"しない","naiReading":"しない","ta":"した","taReading":"した","sentence":"宿題をしてください。","translation":"請做功課。","naiSentence":"今日はゲームをしない。","naiTranslation":"今天不玩遊戲。する變成しない。","taSentence":"昨日、宿題をした。","taTranslation":"昨天做了功課。して→した。"},{"word":"来る","reading":"くる","group":"第三類","teRule":"特別記憶：くる→きて","te":"来て","teReading":"きて","naiRule":"特別記憶：くる→こない","nai":"来ない","naiReading":"こない","ta":"来た","taReading":"きた","sentence":"ここに来てください。","translation":"請到這裡來。","naiSentence":"明日、友達は来ない。","naiTranslation":"朋友明天不來。来ない讀作こない。","taSentence":"友達が家に来た。","taTranslation":"朋友來了家裡。来た讀きた。"},{"word":"ある","reading":"ある","group":"第一類・否定例外","teRule":"る→って","te":"あって","teReading":"あって","naiRule":"例外：ある→ない","nai":"ない","naiReading":"ない","ta":"あった","taReading":"あった","sentence":"時間があって、うれしいです。","translation":"有空閒時間，很開心。","naiSentence":"お金がない。","naiTranslation":"沒有錢。ある的否定直接是ない，不是あらない。","taSentence":"昨日は時間があった。","taTranslation":"昨天有時間。あって→あった。"}],"labMode":"te"},{"id":25,"title":"動詞て形相關句型","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用て形表達請求、<mark class=\"study-key\">許可</mark>和<mark class=\"study-key\">禁止</mark>，並分清「請你做」與「我可以做嗎」。</p><h3>先變て形，再接句尾</h3><p>本課三種句型共用同一個て形：<br><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>いて；<ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>って；<ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べて；<ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>いで。<br>後面再加<mark class=\"study-key\">ください</mark>、<mark class=\"study-key\">もいいです</mark>、はいけません。</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">意思</th><th scope=\"col\">組成</th><th scope=\"col\">例句</th></tr></thead><tbody><tr><td>請做</td><td>て形＋ください</td><td><ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>いてください。請寫名字。</td></tr><tr><td>允許做</td><td>て形＋もいいです</td><td>ここに<ruby>座<rt>すわ</rt></ruby>ってもいいです。可以坐這裡。</td></tr><tr><td>詢問<mark class=\"study-key\">許可</mark></td><td>て形＋もいいですか</td><td><ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもいいですか。可以拍照嗎？</td></tr><tr><td><mark class=\"study-key\">禁止</mark>做</td><td>て形＋はいけません</td><td>ここで<ruby>泳<rt>およ</rt></ruby>いではいけません。這裡不可以游泳。</td></tr></tbody></table></div><h3>請求：てください</h3><p><ruby>少<rt>すこ</rt></ruby>し<ruby>待<rt>ま</rt></ruby>ってください。＝請等一下。<br>この<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>見<rt>み</rt></ruby>てください。＝請看這張照片。<br>ここに<ruby>来<rt>き</rt></ruby>てください。＝請到這裡來。来て讀きて。<br>不要寫成待つてください或書きてください。</p><h3>許可：てもいいですか</h3><p>A：この<ruby>本<rt>ほん</rt></ruby>を<ruby>借<rt>か</rt></ruby>りてもいいですか。＝我可以借這本書嗎？<br>B：はい、どうぞ。＝可以，請。<br>或：はい、<ruby>借<rt>か</rt></ruby>りてもいいですよ。＝可以借啊。<br>這是詢問我能否做，不是在請對方借書。</p><h3>禁止：てはいけません</h3><p>ここで<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってはいけません。＝這裡不可以拍照。<br>この<ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んではいけません。＝這些水不能喝。<br><ruby>飲<rt>の</rt></ruby>む→飲んで，因此接出來是飲んでは，不是飲んては。<br>這個句型有明確禁止的語氣。日常婉拒時，未必要使用這麼強的表達。</p><h3>請求式問句與否定問句</h3><p><ruby>待<rt>ま</rt></ruby>ってくれますか。＝你可以等一下嗎？這是詢問對方是否願意做。<br><ruby>待<rt>ま</rt></ruby>ってもいいですか。＝我可以等嗎？這是詢問許可。<br><ruby>吸<rt>す</rt></ruby>ってはいけませんか。＝不可以吸煙嗎？<br>回答時直接說「<ruby>吸<rt>す</rt></ruby>ってはいけません」或「<ruby>吸<rt>す</rt></ruby>ってもいいです」，比只說はい／いいえ更清楚。</p>","symbol":"お願い","intro":"同一個て形，加上不同結尾就有不同用途。","tag":"請求・許可・禁止","concepts":[["請你做：て形＋ください","先把動詞變成て形，再接<mark class=\"study-key\">ください</mark>。不需要再多加一個て。","<ruby>待<rt>ま</rt></ruby>つ → <ruby>待<rt>ま</rt></ruby>って → <ruby>待<rt>ま</rt></ruby>ってください。","請等一下。書く→書いて<mark class=\"study-key\">ください</mark>＝請寫；不是書きてください。"],["可以做嗎：て形＋もいいですか","加<mark class=\"study-key\">もいいです</mark>表達允許，加か就變成詢問<mark class=\"study-key\">許可</mark>。","<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもいいですか。","我可以拍照嗎？撮る是第一類：撮る→撮って。"],["不可以做：て形＋はいけません","表示<mark class=\"study-key\">禁止</mark>，語氣比較強，適合規則或明確<mark class=\"study-key\">禁止</mark>。濁音で要保留。","ここで<ruby>泳<rt>およ</rt></ruby>いではいけません。","這裡不可以游泳。泳ぐ→泳いで，再加<mark class=\"study-key\">はいけません</mark>。"]],"caution":"て<mark class=\"study-key\">ください</mark>是請求，て<mark class=\"study-key\">もいいです</mark>是許可，不要混淆。日常婉拒未必要用強烈的てはいけません；本課先理解句型的意思。","quiz":[{"prompt":"「請寫名字」：名前を＿＿ください。","options":["書いて","書く","書きます","書きて"],"answer":0,"explanation":"書く是第一類，く→いて，再加ください。"},{"prompt":"「写真を撮ってもいいですか」是在？","options":["命令對方拍照","詢問自己可否拍照","表示自己不會拍照","表示曾經拍照"],"answer":1,"explanation":"てもいいですか用於詢問許可。","rubyView":{"prompt":"「<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもいいですか」是在？","options":["命令對方拍照","詢問自己可否拍照","表示自己不會拍照","表示曾經拍照"],"explanation":"てもいいですか用於詢問許可。"}},{"prompt":"禁止在這裡游泳，哪句正確？","options":["ここで泳いでもいいです。","ここで泳いでください。","ここで泳いではいけません。","ここで泳ぎます。"],"answer":2,"explanation":"泳ぐ→泳いで，再接はいけません，表示禁止。"},{"prompt":"「待ってください」的原形是？","options":["待てる","待う","待る","待つ"],"answer":3,"explanation":"待つ是第一類，つ→って。","rubyView":{"prompt":"「<ruby>待<rt>ま</rt></ruby>ってください」的原形是？","options":["待てる","待う","待る","待つ"],"explanation":"待つ是第一類，つ→って。"}}],"uploadedOriginal":"<h3>[ 單元25 ] 動詞て形相關句型</h3><h3>學習目標</h3><h3>①　學習句型「～てください」</h3><h3>②　學習許可句型「～てもいいです」</h3><h3>③　學習禁止句型「～てはいけません」</h3><h3>④　學習相關疑問詞和問句</h3><p>我們在上一單元，學習了日文動詞變化的重要部分「て形」，也介紹了「て形」的基本用法─接續複數的句子和動詞。如果你能大致理解這些內容、看得懂我們在說什麼，那麼代表你已經通過了最初關卡，再來只是時間問題，需要時間慢慢去熟悉、熟練動詞變化，一直到變成反射動作為止。什麼是反射動作，就像是你一聽到「おはよう」就知道是「早安」一樣（相信我們，不會花很多時間）。</p><p>但是，「動詞て形」的功用遠不止如此。如果只有單純接續功能，那麼充其量不過是英文中「and」的代替品，實在很難說服大家這是學習日文動詞變化時非常重要的部分。「動詞て形」之所以重要，是因為它除了接續句子的功能外，還有「萬能膠」的功用。「動詞て形」能夠組成很多很多的日文實用句型、慣用句，換句話說，許許多多的日文句型中，都可以看到「動詞て形」的身影，例如「ちょっと待って！」這句話是不是很耳熟呢？</p><p>事實上，在進行日常會話時，幾乎每講二句話就會用到「て形」的相關用法，因此，如果想流暢地進行溝通，除了學會「動詞て形」的變化方法外，還得學習以「動詞て形」為基礎的各種相關句型。</p><p>我們會用二單元的篇幅，分二次來介紹「動詞て形」的相關慣用句型和用法。本單元介紹三項句型，分別為表示請求、允許、拒絕的句型、以及相關的問句用法。如果你已經理解了上一單元內容，那麼相信一定能夠對接下來的內容駕輕就熟。</p><h3>～てください</h3><h3>「～てください」是日文中的請求用法，</h3><p>相當於中文的「請…」。</p><p>「ください」亦可寫成漢字「下さい」。</p><p>基本句型:  動詞て形＋ください</p><p>（請…）</p><p>例：</p><p>待つ　　→　待って　→　待ってください（請等）</p><p>書く　　→　書いて　→　書いてください（請寫）</p><p>見る　　→　見て　　→　見てください（請看）</p><p>食べる　→　食べて　→　食べてください（請吃）</p><p>する　　→　して　　→　してください（請做）</p><p>来る　　→　来て　　→　来てください（請來）</p><h3>～てもいいです</h3><p>「～てもいいです」是日文中表示許可的用法，相當於中文的「可以…」。</p><h3>「～てもいいです」＝</h3><h3>「動詞て形」＋「も」＋「いいです」</h3><h3>動作      +   也　+   可以</h3><p>日文直譯為「做～動作也可以」之意，也就是「可以…」的意思。</p><p>一般常以對話的形式出現:</p><p>Q： ～ てもいいですか？（我可以～嗎？）</p><p>A： はい、～てもいいですよ。（是的，～也可以喔！）</p><p>問句使用疑問助詞「か」，為「我可以…嗎？」之意，回答句則使用表示語氣的助詞「よ」，為「OK，你可以…喔！」的意思。</p><p>例：</p><p>A：この本、借りてもいいですか。</p><p>B：はい、借りてもいいですよ。</p><p>（A：我可以借這本書嗎？）</p><p>（B：嗯，可以借啊。）</p><p>A：このパソコン、使ってもいいですか。</p><p>B：はい、使ってもいいですよ。</p><p>（A：我可以用這台電腦嗎？）</p><p>（B：嗯，可以用啊。）</p><p>A：冷蔵庫のケーキ、食べてもいいですか。</p><p>B：はい、食べてもいいですよ。</p><p>（A：我可以吃冰箱裡的蛋糕嗎？）</p><p>（B：嗯，可以吃啊。）</p><p>以上介紹的是肯定句，也就是允許對方的情況，那麼如果是否定、也就是想拒絕對方的時候，又該怎麼說呢？</p><h3>～てはいけません</h3><p>「～てはいけません」是日文中表示禁止的用法，相當於中文的「不行…」。</p><p>基本句型: 「動詞て形」＋は＋いけません。</p><p>（不行…）</p><p>「～てはいけません」可以使用在對話中，表示拒絕對方，也可以用於一般句子中，表示禁止對方進行某動作。</p><p>基本對話形式 :</p><p>A：～てもいいですか。（我可以～嗎？）</p><p>B：いいえ、～てはいけません。（不行，不可以～。）</p><p>例：</p><p>A：この本、借りてもいいですか。</p><p>B：いいえ、借りてはいけません。</p><p>（A：我可以借這本書嗎？）</p><p>（B：不，不行借。）</p><p>A：このパソコン、使ってもいいですか。</p><p>B：いいえ、使ってはいけません。</p><p>（A：我可以使用這台電腦嗎？）</p><p>（B：不，你不行使用。）</p><p>A：冷蔵庫のケーキ、食べてもいいですか。</p><p>B：いいえ、食べてはいけません。</p><p>（A：我可以吃冰箱裡的蛋糕嗎？）</p><p>（B：不，不行吃。）</p><p>タバコを吸ってはいけません。</p><p>（不行抽菸。）</p><p>法律を破ってはいけません。</p><p>（不行違反法律。）</p><p>台風の時に、海辺で遊んではいけません。</p><p>（颱風來的時候，不能到海邊玩。）</p><p>ご飯を食べる時に、テレビを見てはいけません。</p><p>（吃飯時，不能看電視。）</p><p>夜中にギターを弾いてはいけません。</p><p>（半夜不行彈吉他。）</p><h3>相關問句用法</h3><p>我們學了「～てください（請你…）」的句型，那麼如果換成問句，該怎麼說呢？</p><p>句型:   ～てくれますか。</p><p>（可以請你…嗎？）</p><p>關於這項文法，我們之後會再學到，現在先暫時當作慣用句記起來吧！</p><p>實際使用時，「～てくれますか」由於是詢問句的關係，因此聽起來會比「～てください」這種直接進行請求的請求句更為委婉、有禮貌一些。</p><p>例：</p><p>待ってください　　待ってくれますか。</p><p>書いてください　　書いてくれますか。</p><p>見てください　　　見てくれますか。</p><p>食べてください　　食べてくれますか。</p><p>另外，我們剛才介紹過的「～てもいいですか」問句，也有其他種回答方式。</p><p>Q：～てもいいですか。（可以…嗎？）</p><p>A：</p><p>①　はい、～てもいいですよ。（嗯，可以…。）</p><p>②　はい、どうぞ。（嗯，請。）</p><p>③　いいですよ。（可以啊。）</p><p>④　いいえ、～てはいけません。（不，不行…。）</p><p>⑤　だめです。（不行。）</p><p>也可以直接使用拒絕的句型，來當作疑問句。</p><p>Q：～てはいけませんか。（不可以…嗎？）</p><p>A：はい、～てはいけません。（是的，不可以…。）</p><p>いいえ、～てもいいですよ。（不，可以…喔。）</p><p>例：</p><p>A：タバコを吸ってはいけませんか。</p><p>（不可以抽菸嗎？）</p><p>B：はい、吸ってはいけません。</p><p>（是的，不可以抽菸。）</p><p>いいえ、吸ってもいいですよ。</p><p>（不，可以抽菸。）</p>","noteRevision":"修訂版","revisionReason":"按初學者需要重整動詞說明、例句及易錯概念；上傳原文保留供對照。"},{"id":26,"title":"動詞て形＋授受動詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">學會「動詞<mark class=\"study-key\">て形</mark>＋くれる／あげる／もらう」，分清楚<ruby>誰<rt>だれ</rt></ruby>做動作、誰得到幫助，並能用不同角度描述同一件事。</p>\n<h3>由「給東西」到「替人做事」</h3><p>先生は私に小説をくれます。＝老師給我小說。<br>先生は私に日本語を教えてくれます。＝老師教我日文（從我得到幫助的角度說）。<br>前者給的是物品；後者把「教日文」這個行為當作受到的幫助。</p><p>先生は私に日本語を教えます。也是自然的中性敘述。加上<mark class=\"study-key\">てくれる</mark>，便突出了我方受惠的角度，常伴隨感謝；但不是自動變成敬語，也不是每次感謝都必須用這個句型。</p>\n<h3>先看懂：誰做？誰受惠？</h3><div class=\"table-scroll\"><table><thead><tr><th>句型</th><th>例句</th><th>動作者 → 受惠者</th></tr></thead><tbody><tr><td><mark class=\"study-key\">てあげる</mark></td><td><ruby>
