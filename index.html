接轉述","句尾只有と時，省略了甚麼要依上下文判断，不能只靠第一／第三人稱決定。","<ruby>母<rt>はは</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>ると<ruby>言<rt>い</rt></ruby>っていました。","媽媽說會早點回家。と也能間接轉述；並非只有逐字引用。"]],"caution":"「<mark class=\"study-key\">と思う</mark>」與「と言う」不要混淆：前者是認為，後者是說。直接引用可保留敬體，間接轉述通常使用<mark class=\"study-key\">普通形</mark>並調整人稱和時間。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">轉述別人的話，也說出自己的想法。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">功能</th><th scope=\"col\">結構</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>想法</td><td><ruby>普通<rt>ふつう</rt></ruby>形＋と<ruby>思<rt>おも</rt></ruby>う</td><td><ruby>高<rt>たか</rt></ruby>いと<ruby>思<rt>おも</rt></ruby>う／<ruby>学生<rt>がくせい</rt></ruby>だと<ruby>思<rt>おも</rt></ruby>う</td></tr><tr><td>說話</td><td><ruby>引用<rt>いんよう</rt></ruby>內容＋と<ruby>言<rt>い</rt></ruby>う</td><td>「ありがとう」と<ruby>言<rt>い</rt></ruby>う</td></tr><tr><td>說話對象</td><td>人に＋<ruby>引用<rt>いんよう</rt></ruby>＋と<ruby>言<rt>い</rt></ruby>う</td><td><ruby>友達<rt>ともだち</rt></ruby>に「ありがとう」と<ruby>言<rt>い</rt></ruby>う</td></tr></tbody></table></div><h3>と標示引用內容</h3><p><ruby>引用<rt>いんよう</rt></ruby>內容＋と＋<ruby>言<rt>い</rt></ruby>う／答える等，と放在被引用的話後面。日文也使用引號「」。</p><p lang=\"ja\"><ruby>先生<rt>せんせい</rt></ruby>は「<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです」と<ruby>言<rt>い</rt></ruby>いました。</p><p>老師說：「明天放假。」直接引用可保留原來的です，不必改成<mark class=\"study-key\">普通形</mark>。</p><h3>と思う：表達想法</h3><p>通常用<mark class=\"study-key\">普通形</mark>＋<mark class=\"study-key\">と思う</mark>／<ruby>思<rt>おも</rt></ruby>います。名詞、な形容詞非過去肯定的だ要保留。</p><p lang=\"ja\">この<ruby>町<rt>まち</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かだと<ruby>思<rt>おも</rt></ruby>います。</p><p>我覺得這個城鎮很安靜。不是静か<mark class=\"study-key\">と思います</mark>。</p><h3>別人的想法看資訊來源</h3><p>轉述已知想法常用<mark class=\"study-key\">と思っています</mark>或說明消息來源，不是禁止用第三人稱。</p><p lang=\"ja\"><ruby>田中<rt>たなか</rt></ruby>さんは、この<ruby>方法<rt>ほうほう</rt></ruby>がいいと<ruby>思<rt>おも</rt></ruby>っています。</p><p>田中認為這個方法好。說話者應有得知其想法的語境。</p><h3>省略與間接轉述</h3><p>句尾只有と時，省略了甚麼要依上下文判斷，不能只靠第一／第三人稱決定。</p><p lang=\"ja\"><ruby>母<rt>はは</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>ると<ruby>言<rt>い</rt></ruby>っていました。</p><p>媽媽說會早點回家。と也能間接轉述；並非只有逐字引用。</p><h3>再看幾個例子</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に「ありがとう」と<ruby>言<rt>い</rt></ruby>いました。＝我對朋友說謝謝。<br><ruby>弟<rt>おとうと</rt></ruby>はもう<ruby>帰<rt>かえ</rt></ruby>ったと<ruby>思<rt>おも</rt></ruby>います。＝我想弟弟已經回家了。<br>「そんなことは<ruby>知<rt>し</rt></ruby>らない」と<ruby>答<rt>こた</rt></ruby>えました。＝回答說不知道那件事；不必然是「我才不理你」。</p><h3>容易混淆的地方</h3><p>「と<ruby>思<rt>おも</rt></ruby>う」與「と<ruby>言<rt>い</rt></ruby>う」不要混淆：前者是認為，後者是說。直接引用可保留敬體，間接轉述通常使用<mark class=\"study-key\">普通形</mark>並調整人稱和時間。</p>","uploadedOriginal":"<p>[單元36] 表示引用的「と」</p><p>學習目標</p><p>①　學習表示引用的助詞「と」</p><p>②　了解助詞「と」的相關用法</p><p>③　學習和引用助詞「と」連用的動詞</p><p>本單元的主題，是學習表示「引用」的助詞「と」。</p><p>「と」這個助詞，相信大家並不陌生才是，我們曾經在之前的單元中，介紹過助詞「と」的基本用法:</p><p>「と」：</p><p>用來列舉事物、或是表示連帶關係，相當於中文的「和」。</p><p>例：犬と猫と兎とハムスター。（狗、貓、兔子和倉鼠。）</p><p>私は友達と遊びました。（我和朋友去玩。）</p><p>在本單元中，我們要介紹助詞「と」另一種重要的用法:「引用」。什麼是引用？簡單來說，就是中文當中的「引號」，我想一定有人愈聽愈模糊了，請參照以下的例句:</p><p>老師說: 「明天要記得帶抹布喔！」，但是全班還是有二十人忘了帶。</p><p>他說: 「我不幹了！」，然後頭也不回地離開。</p><p>那人道: 「看劍！」，接著斜斜刺出一劍。（取自金庸小說）</p><p>「」← 這個就是引號。中文當中，經常使用引號來表示某人在當時說過的話。特別是在文章中，為了區別哪些話是作者說的、哪些話是引用自別人的，因此會時常使用引號來表示，這就是「引用」，意思是「引用別人的話」。</p><p>你也許會說: 「這有什麼好學的？」（ ← 這也是引用）</p><p>大家有所不知，中文標點符號很多很方便，但是在日文當中，特別是傳統的日文當中，只有逗號和句號二種標點符號。由於沒有引號這麼方便的東西，因此一篇日文文章中，實在很難看出哪些話是作者寫的、哪些話又是引用的。不過，日本人發明了一種很方便的方法來取代「引號」的作用，那就是本單元的主題：「と」。</p><p>老媽說：「快寫功課」，然後去買菜。</p><p>翻成日文就是 :</p><p>母は早く宿題しなさいと言って、それから買物に行った。</p><p>母は「早く宿題しなさい」と言って、それから買物に行った。</p><p>也就是說，在助詞「と」前面的那一段話，相當於被引號包起來，表示那是「別人說的話」。而如同上述例句，「と」的後面習慣會加上「言う」這個動詞，關於這種連用方法，我們在後面的篇幅中也會進行介紹。</p><p>本單元也會介紹三項「と」的相關實用句型：</p><p>・表示說話的「～と言う」</p><p>・表示個人想法的「～と思う」</p><p>・口語中的省略用法「～と」</p><p>我們直接進入正題吧！</p><p>引用のと</p><p>助詞「と」的功能之一為表示「引用的範圍」，用來表示某人說過的某些話，相當於中文標點符號「引號」的功能。</p><p>基本句型:（引用句）＋  と。</p><p>但是，如果只有一個助詞「と」的話，那是構不成一整句日文的，就像只有引號也無法構成一句完整的中文一樣。因此，除了「と」之外，我們還必須一併使用動詞。</p><p>常和引用的「と」合併使用的動詞，都是和「說話、思考」相關的動詞。</p><p>例：</p><p>思う（認為～） 考える（思考） 言う（說話）</p><p>話す（談話）    判断する（判斷）</p><p>關於這些動詞在句中的實際使用情況，請參照下列例句。</p><p>例：</p><p>私はこのレストランが高いと思う。</p><p>（我覺得這間餐廳很貴。）</p><p>私は彼女が一番綺麗だと思う。</p><p>（我覺得她是最漂亮的。）</p><p>私はあのチームが優勝すると思う。</p><p>（我覺得那一隊會獲得優勝。）</p><p>私は彼が黒幕だと思う。</p><p>（我覺得他是幕後黑手。）</p><p>母はうるさいなと言った。</p><p>（媽媽說很吵。）<br>．<br>註：這裡的「な」是語氣詞，相當於中文「～啊、～呢」<br>．</p><p>先生はカンニングしないでくださいと言った。</p><p>（老師說：「請大家不要作弊」。）</p><p>でも、生徒はそんなことは知らないと答えた。</p><p>（但是，學生回答：「我才不理你咧」。）</p><p>和「と」相關的重要句型</p><p>有些以助詞「と」為基礎的句型非常重要，在會話中也會頻繁出現，因此我們單獨挑出來介紹一下。</p><p>①  ～と思う。 （我認為～）</p><p>②  ～と言う。 （說～）</p><p>③  ～と。     （口語省略用法）</p><p>～と思(おも)う</p><p>「と思う」為助詞「と」加上「思う（認為）」這個動詞所組成的句型。相當於中文的「我認為、我覺得」。</p><p>在使用時必須特別特別注意的地方是，「と思う」前面，只能使用「常体」，嘿，這就是我們之前先介紹「動詞常体」的原因啦！</p><p>這裡要注意的地方有二項。第一，「と」的前面一定要接「常体」的句子；第二，由於「認為…、覺得…」是較為主觀的說法，因此使用「第一人稱」當作主詞較為自然，像「私は～と思う」這樣是比較自然的句型，「彼は～と思う」、「先生は～と思う」這樣就有點奇怪了，好像你是別人肚子裡的迴蟲，知道對方在想什麼一樣（原諒我們用這麼通俗的比喻…）</p><p>基本句型:</p><p>（動詞常体・い形容詞）＋  と思う。</p><p>（名詞・な形容詞）＋ だ  ＋ と思う。</p><p>（我認為…、我覺得…）</p><p>例：</p><p>私はこのドラマが面白いと思う。</p><p>（我覺得這部連續劇很有趣。）</p><p>私は私の両親が偉いと思う。</p><p>（我覺得我的父母很偉大。）</p><p>私は学生食堂がまずいと思う。</p><p>（我覺得學生餐廳很難吃。）</p><p>私は基隆港は景色がいいと思う。</p><p>（我覺得基隆港景色很好。）</p><p>私は弟がもう帰ったと思う。</p><p>（我覺得弟弟已經回家了。）</p><p>私は妹がテレビゲームをしていると思う。</p><p>（我覺得妹妹在玩電視遊樂器。）</p><p>～と言(い)う</p><p>「と言う」為助詞「と」加上「言う（說）」這個動詞所組成的句型。相當於中文的「說…」。</p><p>和「と思う」不同，「と言う」的前面可以接任何句子，不論是「常体」或「敬体」都可以，因為「と言う」只是忠實引用對方說的話而已，因此無論對方是用什麼方式講話，都可以直接照實引用。另外，「と言う」的主詞可以使用任何人稱，「你我他」都可以。</p><p>基本句型:</p><p>主詞　は　（句子）　＋　と言う。</p><p>（說…）</p><p>主詞　は　（対象）　に　　（句子）　＋　と言う。</p><p>（對…說…）</p><p>例：</p><p>私はうるさいと言った。</p><p>（我說：「吵死了」）</p><p>私は弟にうるさいと言った。</p><p>（我對弟弟說：「吵死了」）</p><p>私はうるさいと、弟に言った。</p><p>（我對弟弟說：「吵死了」）對象也可以放在「と」後方</p><p>あなたはもうカンニングしないと言ったよね。</p><p>（你不是說過再也不作弊了嗎？）</p><p>彼は誕生日おめでとうと言った。</p><p>（他說：「生日快樂」）</p><p>彼は中居さんに誕生日おめでとうと言った。</p><p>（他對中居先生說：「生日快樂」）</p><p>彼女はこの公園が静かですねと言った。</p><p>（她說：「這座公園很安靜呢」）</p><p>彼女はびっくりした！、と言った。</p><p>（她說：「嚇了一跳！」）</p><p>小西さんはもうあなたに会いませんと言った。</p><p>（小西小姐說再也不想見到你了。）</p><p>母は早く寝なさいと言った。</p><p>（媽媽說要早點睡覺。）</p><p>～と</p><p>有時你可能會看到助詞「と」單獨出現在句尾，其實這是一種省略用法，用以表示「と思う」或是「と言う」的意思。</p><p>「と思う、と言う」→　「と」</p><p>例: 私はうるさいなと。</p><p>部長は明日会社に来いと。</p><p>但是，什麼時候「と」是表示「と思う」的意思、什麼時候「と」又是表示「と言う」的意思，該如何區別呢？</p><p>前面主詞是第一人稱「我」的時候</p><p>→　大部分是表示「と思う」的意思</p><p>前面主詞非第一人稱「我」的時候</p><p>→  大部分是表示「と言う」的意思</p><p>例:</p><p>私はうるさいなと（思う）。</p><p>（我覺得好吵。）</p><p>部長は明日会社に来いと（言った）。</p><p>（部長說明天要來公司）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「我覺得他是學生」應說？","options":["彼は学生だと思います。","彼は学生なと思います。","彼は学生のと思います。","彼は学生をと思います。"],"answer":0,"explanation":"名詞普通形非過去肯定是学生だ，再加と。"},{"prompt":"直接引用「明日は休みです」時，です可以保留嗎？","options":["不可以","可以，直接保留原話","只能改成ます","必須改成の"],"answer":1,"explanation":"直接引用可保留原話的敬體。","rubyView":{"prompt":"直接引用「<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです」時，です可以保留嗎？","options":["不可以","可以，直接保留原話","只能改成ます","必須改成の"],"explanation":"直接引用可保留原話的敬體。"}},{"prompt":"と思います表示甚麼？","options":["請給我","聽得見","我認為／我覺得","一定命令"],"answer":2,"explanation":"思う是想、認為；言う才是說。"},{"prompt":"只有句末的と時，如何判斷省略內容？","options":["第一人稱一定是說","第三人稱一定是想","完全不用語境","根據前後對話判斷"],"answer":3,"explanation":"人稱不能單獨決定省略的是言う、思う或其他內容。"}]},{"id":37,"title":"動詞可能形用法","symbol":"できる","intro":"按動詞類別，逐步說出「能夠做」。","tag":"可能形・える・られる","concepts":[["第一類：う段→え段＋る","先確認是<mark class=\"study-key\">第一類</mark>，再把最後假名換為同一行<mark class=\"study-key\">え段</mark>，然後加る。","<ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>め → <ruby>読<rt>よ</rt></ruby>める → <ruby>読<rt>よ</rt></ruby>めます。","能讀。書く→書ける；話す→話せる；買う→買える；帰る→帰れる。"],["第二類：去る＋られる","食べる、見る等<mark class=\"study-key\">第二類</mark>動詞先去る，再加<mark class=\"study-key\">られる</mark>。","<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べ＋られる → <ruby>食<rt>た</rt></ruby>べられる。","能吃。標準學習形式保留ら；口語可能聽到食べれる，考試練習先用食べ<mark class=\"study-key\">られる</mark>。"],["第三類與不能做","<mark class=\"study-key\">する→できる</mark>；<mark class=\"study-key\">来る→来られる</mark>（こられる）。可能形之後按第二類規則變否定、過去等。","<ruby>来<rt>く</rt></ruby>る → <ruby>来<rt>こ</rt></ruby>られる → <ruby>来<rt>こ</rt></ruby>られない。","來→能來→不能來。読む→読める→読めない＝不能讀。"],["能力也受條件影響","<mark class=\"study-key\">可能形</mark>不只說學會的能力，也說<mark class=\"study-key\">條件允許</mark>。動作對象常用が，也可能用を，不能一律判錯。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>時間<rt>じかん</rt></ruby>があるので、<ruby>映画<rt>えいが</rt></ruby>を見に<ruby>行<rt>い</rt></ruby>けます。","今天有時間，所以能去看電影。行く→行ける，不是行かれる來表達本課的標準<mark class=\"study-key\">可能形</mark>。"],["與ことができる對照","辭書形＋ことができる和<mark class=\"study-key\">可能形</mark>常可表達相近能力；不必再用<mark class=\"study-key\">可能形</mark>＋ことができる重複表達。","<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すことができます。／<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せます。","兩句都是會說日文。先用話す，再選話すことができる或話せる。"],["見える／聞こえる：感官所及","這是兩個獨立動詞，不是把見る／聞く按規則變出的<mark class=\"study-key\">可能形</mark>。常表示景物進入視野、聲音傳入耳中，或視力、聽力可感知。","<ruby>窓<rt>まど</rt></ruby>から<ruby>海<rt>うみ</rt></ruby>が<ruby>見<rt>み</rt></ruby>えます。／<ruby>隣<rt>となり</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>から<ruby>音楽<rt>おんがく</rt></ruby>が<ruby>聞<rt>き</rt></ruby>こえます。","從窗戶看得見海。／聽到隔壁房間傳來音樂。<mark class=\"study-key\">見られる</mark>／聞ける則常談能否觀看、收聽的機會或條件。"],["用一組例子分清楚","不要只靠「有沒有自己決定」判斷。先問：是在說自然感知到，還是在說有機會、有條件去觀看或收聽？","このサイトで<ruby>映画<rt>えいが</rt></ruby>が<ruby>見<rt>み</rt></ruby>られます。／このアプリでラジオが<ruby>聞<rt>き</rt></ruby>けます。","這個網站可以看電影。／這個應用程式可以聽電台。聲音太小而聽不清楚，則說「声が小さくて、よく聞こえません」。"]],"caution":"<mark class=\"study-key\">可能形</mark>表示能力或<mark class=\"study-key\">條件允許</mark>，不等於「准許」。口語會聽到食べれる、来れる等省略ら的形式；初學及正式書寫先掌握食べられる、来られる。見える／聞こえる與見られる／聞ける有語境差異，不宜當成完全同義。","original":"<h2>動詞可能形用法</h2><p class=\"lesson-focus\">按動詞類別，逐步說出「能夠做」。</p><h3>第一類：う段→え段＋る</h3><p>先確認是<mark class=\"study-key\">第一類</mark>，再把最後假名換為同一行<mark class=\"study-key\">え段</mark>，然後加る。</p><p lang=\"ja\"><ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>め → <ruby>読<rt>よ</rt></ruby>める → <ruby>読<rt>よ</rt></ruby>めます。</p><p>能讀。<ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>ける；<ruby>話<rt>はな</rt></ruby>す→<ruby>話<rt>はな</rt></ruby>せる；<ruby>買<rt>か</rt></ruby>う→<ruby>買<rt>か</rt></ruby>える；<ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>れる。</p><h3>第二類：去る＋られる</h3><p><ruby>食<rt>た</rt></ruby>べる、見る等<mark class=\"study-key\">第二類</mark>動詞先去る，再加<mark class=\"study-key\">られる</mark>。</p><p lang=\"ja\"><ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べ＋られる → <ruby>食<rt>た</rt></ruby>べられる。</p><p>能吃。標準學習形式保留ら；口語可能聽到食べれる，考試練習先用食べ<mark class=\"study-key\">られる</mark>。</p><h3>第三類與不能做</h3><p><mark class=\"study-key\">する→できる</mark>；<ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>きた</rt></ruby>られる（こられる）。可能形之後按第二類規則變否定、過去等。</p><p lang=\"ja\"><ruby>来<rt>く</rt></ruby>る → <ruby>来<rt>こ</rt></ruby>られる → <ruby>来<rt>こ</rt></ruby>られない。</p><p>來→能來→不能來。<ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>める→<ruby>読<rt>よ</rt></ruby>めない＝不能讀。</p><h3>能力也受條件影響</h3><p><mark class=\"study-key\">可能形</mark>不只說學會的能力，也說<mark class=\"study-key\">條件允許</mark>。動作對象常用が，也可能用を，不能一律判錯。</p><p lang=\"ja\"><ruby>今日<rt>きょう</rt></ruby>は<ruby>時間<rt>じかん</rt></ruby>があるので、<ruby>映画<rt>えいが</rt></ruby>を見に<ruby>行<rt>い</rt></ruby>けます。</p><p>今天有時間，所以能去看電影。<ruby>行<rt>い</rt></ruby>く→行ける，不是行かれる來表達本課的標準<mark class=\"study-key\">可能形</mark>。</p><h3>與ことができる對照</h3><p>辭書形＋ことができる和<mark class=\"study-key\">可能形</mark>常可表達相近能力；不必再用<mark class=\"study-key\">可能形</mark>＋ことができる重複表達。</p><p lang=\"ja\"><ruby>日本語<rt>にほんご</rt></ruby>を<ruby>話<rt>はな</rt></ruby>すことができます。／<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せます。</p><p>兩句都是會說日文。先用話す，再選話すことができる或話せる。</p><h3>見える／聞こえる：感官所及</h3><p>這是兩個獨立動詞，不是把見る／聞く按規則變出的<mark class=\"study-key\">可能形</mark>。常表示景物進入視野、聲音傳入耳中，或視力、聽力可感知。</p><p lang=\"ja\"><ruby>窓<rt>まど</rt></ruby>から<ruby>海<rt>うみ</rt></ruby>が<ruby>見<rt>み</rt></ruby>えます。／<ruby>隣<rt>となり</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>から<ruby>音楽<rt>おんがく</rt></ruby>が<ruby>聞<rt>き</rt></ruby>こえます。</p><p>從窗戶看得見海。／聽到隔壁房間傳來音樂。<ruby>見<rt>み</rt></ruby>られる／<ruby>聞<rt>き</rt></ruby>ける<ruby>則<rt>のり</rt></ruby><ruby>常談<rt>じょうだん</rt></ruby><ruby>能否<rt>のうひ</rt></ruby>觀看、收聽的機會或條件。</p><h3>用一組例子分清楚</h3><p>不要只靠「有沒有自己決定」判斷。先問：是在說自然感知到，還是在說有機會、有條件去觀看或收聽？</p><p lang=\"ja\">このサイトで<ruby>映画<rt>えいが</rt></ruby>が<ruby>見<rt>み</rt></ruby>られます。／このアプリでラジオが<ruby>聞<rt>き</rt></ruby>けます。</p><p>這個網站可以看電影。／這個應用程式可以聽電台。聲音太小而聽不清楚，則說「声が小さくて、よく<ruby>聞<rt>き</rt></ruby>こえません」。</p><h3>第一類：對照最後一個假名</h3><p>う→える、く→ける、ぐ→げる、す→せる、つ→てる、ぬ→ねる、ぶ→べる、む→める、る→れる。先判斷動詞類別：帰る是第一類，變帰れる；食べる是第二類，變食べられる。</p><h3>把「能」變成「不能」</h3><p><ruby>読<rt>よ</rt></ruby>める→<ruby>読<rt>よ</rt></ruby>めない／<ruby>読<rt>よ</rt></ruby>めません；<ruby>食<rt>た</rt></ruby>べられる→<ruby>食<rt>た</rt></ruby>べられない／<ruby>食<rt>た</rt></ruby>べられません；できる→できない／できません。過去：<ruby>読<rt>よ</rt></ruby>めた／<ruby>読<rt>よ</rt></ruby>めました。</p><h3>助詞不要全部換成が</h3><p>動作對象常用が，也可依語境用を：<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せます。方向的に、動作場所的で等仍保留：<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>けます；ここで<ruby>勉強<rt>べんきょう</rt></ruby>できます。</p><h3>容易混淆的地方</h3><p>可能形表示能力或條件允許，不等於「准許」。口語會聽到食べれる、来れる等省略ら的形式；初學及正式書寫先掌握食べられる、<ruby>来<rt>きた</rt></ruby>られる。<ruby>見<rt>み</rt></ruby>える／聞こえる與見られる／聞ける有語境差異，不宜當成完全同義。</p>","uploadedOriginal":"<p>[單元37] 動詞可能形用法</p><p>學習目標</p><p>①　學習日文動詞的「可能形」用法</p><p>②　學習「可能形」的相關用法和句型</p><p>本單元的學習重點為日文動詞的「可能形」。沒錯，我們又要學習動詞變化了。所謂的「可能形」用法，為表示「能夠做什麼事」的用法，相當於中文的「會…、能夠…」，</p><p>例如「見る→見られる（能看到）」、「食べる→食べられる（能夠吃）」、「会う→会える（能夠見面）」等等。</p><p>不是說短時間內不會再碰到動詞變化了嗎！</p><p>彷彿可以聽到各位怒吼的聲音，不過請先聽我們解釋一下吧。其實本來「動詞可能形」這個動詞變化，是預計放在更之後的單元再進行介紹的，想說先介紹一些生活中常用的文法和例句，等到數量累積到一定程度之後，再回來介紹動詞變化，學習起來會較有效率、也會比較輕鬆。</p><p>但是，當我們在編寫文法相關教學文章時，特別是在構思文法例句時，發現無論如何注意，總會不小心用到這個「可能形」。由於我們的文法教學已經進入了中級程度，因此像「私は学生です」這種幼稚園句型，相信大家都熟到不行了，繼續使用這種例句，對各位日語能力的提升並不會有幫助。但是，如果想造出稍微深一點的例句，又無可避免地會使用到「會…、能夠…」等等的「可能形」用法。</p><p>例：</p><p>（もらう）</p><p>その本を取ってもらえますか。</p><p>（可以幫我拿那本書嗎？）</p><p>（から・だから）</p><p>おなかが痛いから、学校に行けない。</p><p>おなかが痛い。だから、学校に行けない。</p><p>（肚子痛所以不能去學校。）</p><p>因此，為了我們之後教材例句的多樣性、也為了提升各位的日文能力，我們將在本單元介紹日文動詞「可能形」的變化方式和使用方法、以及說明類似句型用法的比較。</p><p>可能形用法</p><p>所謂日文動詞的「可能形用法」，意思是「能夠做什麼事」，相當於中文的「會…、能夠…」。</p><p>動詞可能形的變化方式</p><p>第一類動詞</p><p>將動詞羅馬拼音字尾發音的「u」改成「e」 之後，加上「る」。</p><p>例：</p><p>書く　kaku →　書け kake　→　書ける</p><p>泳ぐ　oyogu →　泳げ　oyoge  →　泳げる</p><p>言う　iu →　言え　ie  →　言える</p><p>待つ　matsu  →　待て　mate  →　待てる</p><p>読む　yomu  →　読め　yome  →　読める</p><p>第二類動詞</p><p>直接去掉動詞字尾的「る」，加上「られる」。</p><p>例：</p><p>食べる　→　食べられる</p><p>着る　  →　着られる</p><p>忘れる　→　忘れられる</p><p>寝る　  →　寝られる</p><p>開ける　→　開けられる</p><p>見る　  →　見られる</p><p>不規則動詞</p><p>沒有規則，只能直接記起來。</p><p>する　→　できる</p><p>勉強する　→　勉強できる</p><p>来る　→　来られる （注意發音）</p><p>基本句型 :</p><p>～は（可能形）。</p><p>～は～を／が（可能形）。</p><p>（會～、能夠～）</p><p>例：</p><p>私は走れる。</p><p>（我會跑步。） 動詞原形為「走る」</p><p>私は走れない。</p><p>（我不會跑步。） 動詞原形為「走る」</p><p>彼は泳げる。</p><p>（他會游泳。） 動詞原形為「泳ぐ」</p><p>彼女は飛行機に乗れない。</p><p>（她無法坐飛機。） 動詞原形為「乗る」</p><p>弟は朝起きられない。</p><p>（弟弟早上起不來。） 動詞原形為「起きる」</p><p>妹は料理できない。</p><p>（妹妹不會做菜。） 動詞原形為「する」</p><p>祖父はインターネットが使える。</p><p>（祖父會用網路。） 動詞原形為「使う」</p><p>祖母は自分で海外旅行ができる。</p><p>（祖母能夠自己去國外旅行。） 動詞原形為「する」</p><p>木村さんは一戸建てが買える。</p><p>（木村先生能夠買透天屋。） 動詞原形為「買う」</p><p>朱さんは1000個の新しい英単語が覚えられる。</p><p>（朱先生能夠記得1000個新英文單字。）動詞原形為「覚える」</p><p>学校の地下室ではシャワーが浴びられる。</p><p>（學校地下室能夠淋浴。） 動詞原形為「浴びる」</p><p>一般句型中，動詞前方會使用助詞「を」，但是如果後方是「可能形」的話，那麼也可以使用助詞「が」。一般的情況下，使用「が」的頻率較高。</p><p>例：</p><p>私は納豆を食べます。　私は納豆が食べられます。</p><p>私はパソコンを使います。私はパソコンが使えます。</p><p>私は仕事をします。　私は仕事ができます。</p><p>另外，在口語會話中，會將第二類動詞「可能形（～られる）」中的「ら」省略，變成「～れる」的形式。雖然在學術界，這是不符合傳統文法的日語（又稱「ら抜き言葉」），不過現在日本約有80％的人都這樣使用，反倒是很少人在說話時使用「～られる」這樣的可能形說法。但是，在文章或正式場合中，仍然會使用「～られる」，不可以省略「ら」，請特別注意。</p><p>例：</p><p>私は納豆が食べられます。→私は納豆が食べれます。</p><p>私は勉強会に来られます。</p><p>→私は勉強会に来れます。</p><p>私は朝起きられません。→私は朝起きれません。</p><p>特殊可能形用法</p><p>除了以上介紹的動詞可能形之外，還有二種特別的可能形用法：</p><p>見える    （看得見）</p><p>聞こえる  （聽得見）</p><p>以上二種可能形用法，和我們剛才介紹過的可能形變化方法不同。</p><p>普通的可能形變化方法為:</p><p>見る　→　見られる （可以看見）</p><p>聞く　→　聞ける   （可以聽見）</p><p>「見る」「聞く」這二個動詞較特別，有二種可能形用法：</p><p>見る　:　見られる（可以看見）  見える  （看得見）</p><p>聞く　:　聞ける  （可以聽見）  聞こえる（聽得見）</p><p>二者的差別在於 :</p><p>見える :</p><p>中文為「看得見」，表示某物體或景物不受任何阻隔、自然而然地進入視野當中。</p><p>例：</p><p>この窓から富士山が見える。</p><p>（從這扇窗戶看得見富士山。）</p><p>頭をあげると、太陽が見える。</p><p>（抬起頭就看得見太陽。）</p><p>学校では沢山の学生が見える。</p><p>（學校看得見許多學生。）</p><p>動物園ではいろいろな動物が見える。</p><p>（動物園看得見各種動物。）</p><p>阿里山では綺麗な朝日が見える。</p><p>（在阿里山看得見漂亮的日出。）</p><p>目が見える／目が見えない</p><p>（眼睛看得見／看不見）</p><p>見られる :</p><p>中文為「可以看見」，表示經由自己的個人判斷，選擇去觀看特定的東西。</p><p>例：</p><p>あのホテルの屋上に行けば、富士山が見られる。</p><p>（到那棟旅館的頂樓，就能看見富士山。）</p><p>学校では午後１時に飛行機が見られる。</p><p>（在學校，下午一點能看見飛機。）</p><p>動物園でパンダが見られる。</p><p>（在動物園能看見貓熊。）</p><p>阿里山なら、綺麗な朝日が見られる。</p><p>（如果是阿里山，那麼就能看到漂亮的日出。）</p><p>あの映画館で「AVATAR」という映画が見られる。</p><p>（在那間電影院裡可以看阿凡達這部電影。）</p><p>聞こえる:</p><p>中文為「聽得見」，表示某物體或景物不受任何阻隔、自然而然地進入耳朵中。</p><p>聞ける:</p><p>中文為「可以聽見」，表示經由自己的個人判斷，去聽特定的聲音。</p><p>例：</p><p>朝ニワトリの鳴き声が聞こえる。</p><p>（早上聽得見公雞叫。）</p><p>テレビを付けると、アナウンサーの声が聞ける。</p><p>（轉開電視後，就可以聽到主播的聲音。）</p><p>夜中に隣の人が喧嘩する声が聞こえる。</p><p>（半夜聽得到隔壁鄰居吵架的聲音。）</p><p>スマホを持っていると、沢山の音楽が聞ける。</p><p>（有智慧型手機的話，就能夠聽很多音樂。）</p><p>すみません、声が小さくてよく聞こえない。</p><p>（不好意思，聲音太小了、聽不太清楚）</p><p>インターネットで有名大学の授業が聞ける。</p><p>（可以在網路上收聽著名大學開設的課程）</p>","noteRevision":"修訂版","revisionReason":"依最新上傳原筆記精簡修訂：保留可能形變化，刪除無來源的比例說法，釐清見える／聞こえる與可能形的差異。頁末可查看上傳原文。","quiz":[{"prompt":"第一類書く的可能形是？","options":["書ける","書きる","書くれる","書かられる"],"answer":0,"explanation":"く換え段け，再加る。","rubyView":{"prompt":"第一類<ruby>書<rt>か</rt></ruby>く的可能形是？","options":["書ける","書きる","書くれる","書かられる"],"explanation":"く換え段け，再加る。"}},{"prompt":"第二類食べる的標準可能形是？","options":["食べるられる","食べられる","食べよう","食べば"],"answer":1,"explanation":"去る後加られる：食べ＋られる。","rubyView":{"prompt":"第二類<ruby>食<rt>た</rt></ruby>べる的標準可能形是？","options":["食べるられる","食べられる","食べよう","食べば"],"explanation":"去る後加られる：食べ＋られる。"}},{"prompt":"来られる的讀音是？","options":["きられる","くられる","こられる","こいられる"],"answer":2,"explanation":"来る的可能形来られる讀こられる。","rubyView":{"prompt":"<ruby>来<rt>きた</rt></ruby>られる的讀音是？","options":["きられる","くられる","こられる","こいられる"],"explanation":"来る的可能形来られる讀こられる。"}},{"prompt":"聲音太小，自然聽不清楚，哪一句最合適？","options":["声が小さくて、よく聞きません。","声が小さくて、よく見えません。","声が小さくて、よく聞くことです。","声が小さくて、よく聞こえません。"],"answer":3,"explanation":"這裡說聲音是否傳入耳中、能否聽清楚，用聞こえる的否定聞こえません。"}]},{"id":38,"title":"假設用法「と」「ば」「なら」「たら」","symbol":"もし","intro":"按條件和結果的關係，選擇「如果」。","tag":"と・ば・なら・たら","concepts":[["と：規律或自然結果","<mark class=\"study-key\">普通形非過去＋と</mark>，常說規律、機器操作、習慣或發現。一般條件用法的後句不直接接請求、命令、邀請。","このボタンを<ruby>押<rt>お</rt></ruby>すと、ドアが<ruby>開<rt>ひら</rt></ruby>きます。","按這個按鈕，門就會開。著重按鈕和結果的固定關係。"],["ば：提出成立條件","第一類う段→<mark class=\"study-key\">え段＋ば</mark>；第二類<mark class=\"study-key\">去る＋れば</mark>；する→すれば；来る→来れば（くれば）。","<ruby>時間<rt>じかん</rt></ruby>があれば、<ruby>行<rt>い</rt></ruby>きます。","有時間就去。ば不只用於諺語或固定句型；後句限制也要看前句是動作還是狀態。"],["なら：以資訊為前提","<mark class=\"study-key\">普通形＋なら</mark>；名詞／な形容詞肯定非過去直接接なら。常承接對方說法再提出建議，不規定後句必須後發生。","<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くなら、<ruby>出発<rt>しゅっぱつ</rt></ruby><ruby>前<rt>まえ</rt></ruby>にホテルを<ruby>予約<rt>よやく</rt></ruby>したほうがいいです。","如果要去日本，出發前先訂飯店比較好。訂飯店發生在去日本之前。"],["たら：條件成立後","<mark class=\"study-key\">た形＋ら</mark>，能表示假設或「做完之後」。不代表條件在說話當下已經發生。","<ruby>明日<rt>あした</rt></ruby>、<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>ったら、<ruby>家<rt>いえ</rt></ruby>にいます。","如果明天下雨，就留在家。降ったら是未來的假設，不是已下過雨。"],["形容詞和名詞也能假設","い形容詞：安ければ／安かったら。名詞／な形容詞：学生なら／学生だったら、暇なら／暇だったら。","<ruby>安<rt>やす</rt></ruby>かったら、<ruby>買<rt>か</rt></ruby>いたいです。","如果便宜，我想買。たら可接願望；不把所有假設都換成と。"]],"caution":"不要把なら記成「一定未發生」、たら記成「一定已發生」，也不要把たら當作把たなら隨意唸快的縮寫。先看前後事件的關係；四者不能任意互換。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">按條件和結果的關係，選擇「如果」。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">條件</th><th scope=\"col\">典型用途</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>と</td><td>規律／自然結果</td><td><ruby>春<rt>はる</rt></ruby>になると、<ruby>暖<rt>あたた</rt></ruby>かくなる</td></tr><tr><td>ば</td><td><mark class=\"study-key\">成立條件</mark></td><td><ruby>安<rt>やす</rt></ruby>ければ、<ruby>買<rt>か</rt></ruby>う</td></tr><tr><td>なら</td><td>以資訊<mark class=\"study-key\">為前提</mark></td><td><ruby>行<rt>い</rt></ruby>くなら、<ruby>教<rt>おし</rt></ruby>えて</td></tr><tr><td>たら</td><td>假設／完成之後</td><td><ruby>着<rt>つ</rt></ruby>いたら、<ruby>電話<rt>でんわ</rt></ruby>してください</td></tr></tbody></table></div><h3>と：規律或自然結果</h3><p><mark class=\"study-key\">普通形非過去＋と</mark>，常說規律、機器操作、習慣或發現。一般條件用法的後句不直接接請求、命令、邀請。</p><p lang=\"ja\">このボタンを<ruby>押<rt>お</rt></ruby>すと、ドアが<ruby>開<rt>ひら</rt></ruby>きます。</p><p>按這個按鈕，門就會開。著重按鈕和結果的固定關係。</p><h3>ば：提出成立條件</h3><p>第一類う段→え<ruby>段<rt>だん</rt></ruby>＋ば；第二類<mark class=\"study-key\">去る＋れば</mark>；する→すれば；<ruby>来<rt>く</rt></ruby>る→来れば（くれば）。</p><p lang=\"ja\"><ruby>時間<rt>じかん</rt></ruby>があれば、<ruby>行<rt>い</rt></ruby>きます。</p><p>有時間就去。ば不只用於諺語或固定句型；後句限制也要看前句是動作還是狀態。</p><h3>なら：以資訊為前提</h3><p><ruby>普通<rt>ふつう</rt></ruby>形＋なら；名詞／な形容詞肯定非過去直接接なら。常承接對方說法再提出建議，不規定後句必須後發生。</p><p lang=\"ja\"><ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くなら、<ruby>出発<rt>しゅっぱつ</rt></ruby><ruby>前<rt>まえ</rt></ruby>にホテルを<ruby>予約<rt>よやく</rt></ruby>したほうがいいです。</p><p>如果要去日本，出發前先訂飯店比較好。訂飯店發生在去日本之前。</p><h3>たら：條件成立後</h3><p><mark class=\"study-key\">た形＋ら</mark>，能表示假設或「做完之後」。不代表條件在說話當下已經發生。</p><p lang=\"ja\"><ruby>明日<rt>あした</rt></ruby>、<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>ったら、<ruby>家<rt>いえ</rt></ruby>にいます。</p><p>如果明天下雨，就留在家。降ったら是未來的假設，不是已下過雨。</p><h3>形容詞和名詞也能假設</h3><p>い形容詞：<ruby>安<rt>やす</rt></ruby>ければ／<ruby>安<rt>やす</rt></ruby>かったら。名詞／な形容詞：<ruby>学生<rt>がくせい</rt></ruby>なら／<ruby>学生<rt>がくせい</rt></ruby>だったら、<ruby>暇<rt>ひま</rt></ruby>なら／<ruby>暇<rt>ひま</rt></ruby>だったら。</p><p lang=\"ja\"><ruby>安<rt>やす</rt></ruby>かったら、<ruby>買<rt>か</rt></ruby>いたいです。</p><p>如果便宜，我想買。たら<ruby>可<rt>か</rt></ruby><ruby>接<rt>せっ</rt></ruby>願望；不把所有假設都換成と。</p><h3>條件形式補充</h3><p>と：名詞／な形容詞肯定非過去用だと（休みだと、<ruby>静<rt>しず</rt></ruby>かだと）；い形容詞直接接と（寒いと）。<br>ば：ない→なければ（<ruby>行<rt>い</rt></ruby>かない→<ruby>行<rt>い</rt></ruby>かなければ）；い形容詞去い＋ければ（安い→<ruby>安<rt>やす</rt></ruby>ければ）；名詞／な形容詞常用なら或であれば。<br>たら：ない→なかったら（<ruby>行<rt>い</rt></ruby>かなかったら）；名詞／な形容詞用だったら（休みだったら、<ruby>暇<rt>ひま</rt></ruby>だったら）。</p><h3>再看幾個例子</h3><p><ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ったら、<ruby>電話<rt>でんわ</rt></ruby>してください。＝回到家後請打電話。<br><ruby>分<rt>わ</rt></ruby>からなければ、先生に聞いてください。＝不明白的話，請問老師。<br><ruby>忙<rt>いそが</rt></ruby>しくなければ、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きませんか。＝不忙的話，要一起去嗎？<br>なら也可接過去資訊：もう<ruby>食<rt>た</rt></ruby>べたなら、片付けましょう。＝如果已吃完，就收拾吧。</p><h3>容易混淆的地方</h3><p>不要把なら記成「一定未發生」、たら記成「一定已發生」，也不要把たら當作把たなら隨意唸快的縮寫。先看前後事件的關係；四者不能任意互換。</p><p class=\"grammar-reference\">文法核對參考：<a href=\"https://www.kyozai.jpf.go.jp/kyozai/material/BTS00108/ja/render.do\" target=\"_blank\" rel=\"noopener noreferrer\">國際交流基金・たら（日文） ↗</a></p>","uploadedOriginal":"<p>[單元38] 假設用法「と」「ば」「なら」「たら」</p><p>學習目標</p><p>① 學習日文中的假設用法「と」「ば」「なら」「たら」</p><p>② 學習日文中的假設用法「と」「ば」「なら」「たら」</p><p>由於本單元的學習目標實在是太重要了，因此我們連續唸二遍。</p><p>本單元的重點為介紹日文中的「假設用法」，所謂的「假設用法」，就是中文的「…的話，就…」句型，假設前面的情況發生，就會產生後面的情況，例如「明天天氣好的話，就去健行」、「如果你去日本的話，幫我買御守回來」等等。</p><p>看起來很簡單，對不對？錯！在中文當中，如果我們要表示假設的語氣，只要使用「…的話，就…」這個句型就萬事OK了，「…的話，就…」可以用在任何情境、任何會話場合。但是在日文當中，所謂的假設語氣，就沒有這麼容易了，表示假設語氣的文法句型，主要有「と」「ば」「なら」「たら」四種，每一種的使用方法和使用時機都不盡相同，而這也是本單元要介紹的重點。一般情況下，我們都會儘可能將文法解說地簡單易懂，同時將文法種類減少、方便學習者學習，因此像是這麼複雜的文法（以四種句型來表達一種意思），我們原則上都會忽略、或是乾脆直接扔進垃圾桶不談，不過，唯獨本單元的假設語氣，不能這麼做。</p><p>會話中假設語氣的使用機會很多，而偏偏「と」「ば」「なら」「たら」這四種文法，四種都很實用，不能避之不談。其實對於大多數日語學習者（甚至是中高級程度的人）來說，區分「と」「ば」「なら」「たら」是很困難的工作，這些文法意思很像、使用頻率都很高，而且很容易錯、用錯了意思又完全不同，算是很棘手的部分。既然無法省略不談，我們就只能做簡化的工作，讓這些東西變得比較好理解。</p><p>研究「と」「ば」「なら」「たら」的學術論文，可能疊起來比台北101還要高，非常非常之多，在此僅介紹我們的學習方式、以及從過去教學經驗中所得來的有效區別方法。如果各位有更易懂的解說方式，請務必通知我們！我們將廣納各位的意見，完善我們的文法教材！</p><p>と</p><p>表示假設語氣的「と」。</p><p>主要用法：前面的動作發生後，就100％會發生後面的動作。</p><p>常用來表示定理、自然現象等等。</p><p>相當於中文「…的話、就…」。</p><p>基本用法:  動詞原形・否定形＋と、～。</p><p>例：</p><p>コインを入れると、缶ビールが出る。</p><p>（投入硬幣的話，罐裝啤酒就會掉下來。）</p><p>相手の電話番号を入力すると、</p><p>相手と連絡が取れる。</p><p>（輸入對方的電話號碼後，就能和對方取得連絡。）</p><p>まっすぐ行くと、交番が見える。</p><p>（直直走的話，就會看見派出所。）</p><p>金を払うと、商品を送ってくる。</p><p>（付了錢的話，商品就會送來。）</p><p>夜中にギターを弾くと、近所迷惑になる。</p><p>（半夜彈吉他的話，會造成鄰居的困擾。）</p><p>１に１を足すと、２になる。</p><p>（1加1會等於2。）</p><p>１０を２で割ると、５になる。</p><p>（10除以2會等於5。）</p><p>台風が来ると、すごく雨が降ります。</p><p>（颱風來的話，就會下大雨。）</p><p>秋になると、楓が赤くなる。</p><p>（到秋天的話，楓葉就會變紅。）</p><p>３月中旬になると、桜の花が開(かい)花(か)する。</p><p>（到了3月中旬的話，櫻花就會開花。）</p><p>ば</p><p>主要用於慣用語、諺語、慣用句型、或是接續特定動詞，用法較為固定。有時也可以用來表示必然的結果，某些句子中可以和「と」相通。</p><p>基本用法:  動詞ば形、～。</p><p>動詞ば形變化方式</p><p>第一類動詞</p><p>將「可能形」去掉「る」加上「ば」。</p><p>第二類動詞</p><p>去掉「る」加上「れば」</p><p>第三類動詞</p><p>する　→　すれば</p><p>来る　→　来れば （注意發音）</p><p>例：</p><p>平日は学校に行かなければならない。</p><p>（平日不去學校不行）  慣用句型</p><p>研究すればするほど、面白くなる。</p><p>（愈是研究愈覺得有趣。）  慣用句型</p><p>住めば都。</p><p>（比喻習慣的話，哪裡都是好地方。）  諺語</p><p>喉元過ぎれば熱さを忘れる。</p><p>（比喻享樂時就會忘了以前的艱辛。）  諺語</p><p>麝あれば香し。</p><p>（比喻有實力的人終能得到世人認同。） 諺語</p><p>この仕事はやればできると思う。</p><p>（我覺得這份工作只要努力就能完成。） 接特定動詞</p><p>先生に聞けば分かる。</p><p>（只要問老師就會了解。）  接特定動詞</p><p>学生はちゃんと宿題をすればいい。</p><p>（學生的話，只要乖乖寫作業就好。）  接特定動詞</p><p>毎日日本語を話せばうまくなれる。</p><p>（每天說日語的話，就會進步。）  表示必然結果</p><p>スーパーに行けば、果物が買える。</p><p>（去超市的話，就買得到水果。）  表示必然結果</p><p>母は私の顔を見れば、「就職しろ」と言う。</p><p>（母親一看到我的臉，就叫我去找工作。） 表示必然結果</p><p>先生が来れば、</p><p>彼女も勝手にサボることができないでしょう。</p><p>（老師來的話，她也不能隨便翹課了吧。） 表示必然結果</p><p>明日が晴れれば、予定通りに遠足に行く。</p><p>（明天放晴的話，就按照原定計劃去遠足。）</p><p>表示必然結果</p><p>なら</p><p>主要用法: 假設前面的動作尚未進行，而給予後面的建議和意見。</p><p>「（尚未發生的動作）…的話、就…」。</p><p>基本用法: 動詞原形・否定形・名詞 + なら</p><p>由於是表示尚未發生的動作，因此「なら」的前方多使用動詞原形。</p><p>例：</p><p>車に乗るなら、酒を飲むな。</p><p>（如果要開車的話，就別喝酒。）</p><p>タバコを吸うなら、中に入らないでください。</p><p>（如果要抽煙的話，就別進去。）</p><p>学校に行くなら、宿題を持って行ってください。</p><p>（如果要去學校，記得帶作業去。）</p><p>クレジットカードを選ぶなら、</p><p>利息の低いのを選んだ方がいい。</p><p>（如果要選擇信用卡的話，最好選利息低的。）</p><p>スーパーに行くなら、メロンを買ってきてください</p><p>（如果要去超市的話，記得買哈密瓜回來。）。</p><p>大学に入るなら、下宿の準備をしなければならない。</p><p>（如果要進大學的話，得先做好外宿的準備。）</p><p>家に帰るなら、掃除をしてから帰ってください。</p><p>（如果要回家的話，要先掃完地才能回去。）</p><p>レストランの情報なら、インターネットで調べられる。</p><p>（如果是餐廳資訊的話，在網路上可以查得到。）</p><p>お茶なら、阿里山ウーロン茶がお薦めですよ。</p><p>（如果是茶的話，我推薦阿里山烏龍茶。）</p><p>彼はゲームのことなら、何でも分かる。</p><p>（如果是關於遊戲的話，他什麼都知道。）</p><p>たら</p><p>「たら」是「動詞た形＋なら」的省略，將「たなら」唸快點就會變成「たら」。其實，「たら」的功能和「なら」相似，但是由於前方接的是「動詞た形」，為動詞過去式、表示過去發生的動作，因此整句是「前面動作已經發生的話，就…」之意。</p><p>主要功能:</p><p>表示如果前面的動作發生，就會產生後方的結果。</p><p>「（已經發生的動作）…的話，就…」</p><p>基本用法: 動詞た形＋ら、～。</p><p>例：</p><p>酒を飲んだら、車に乗るな。</p><p>（喝了酒的話，就別開車。）</p><p>タバコを吸ったら、吸い殻をゴミ箱に捨ててください。</p><p>（抽完煙之後，要將煙蒂丟到垃圾桶裡。）</p><p>学校に行ったら、先生に休みのことを伝えてください。</p><p>（到了學校之後，記得跟老師說要請假的事。）</p><p>クレジットカードを選んだら、</p><p>ちゃんと申し込み書を出してください。</p><p>（選好信用卡後，要記得將申請書寄出去。）</p><p>スーパーに行ったら、</p><p>メロンの値段を確認してくれますか。</p><p>（到了超市之後，可以幫我確認一下哈密瓜的價格嗎？）</p><p>大学に入ったら、</p><p>いろいろなサークルに入ってみたいと思う。</p><p>（進大學之後，我想參加各式各樣的社團。）</p><p>家に帰ったら、まず宿題をしなさい。</p><p>（回到家之後，先去寫作業。）</p><p>レストランの情報だったら、</p><p>インターネットで調べられる。</p><p>（如果是餐廳資訊的話，在網路上可以找得到。）</p><p>お茶だったら、阿里山ウーロン茶がお薦めですよ。</p><p>（如果是茶的話，我推薦阿里山烏龍茶。）</p><p>彼はゲームのことだったら、何でも分かる。</p><p>（如果是關於遊戲的話，他什麼都知道。）</p><p>「なら」と「たら」の区別</p><p>「なら」：表示前面的動作尚未進行，多用於表示建議。</p><p>「たら」：表示前面的動作已經完成。</p><p>例：</p><p>乗るなら飲むな、飲んだら乗るな！</p><p>（開車不喝酒，喝酒不開車。）</p><p>ハワイに行くなら、日焼け止めを忘れないでください。</p><p>（如果要去夏威夷的話，別忘了帶防曬乳。）</p><p>ハワイに行ったら、</p><p>そこの有名なおみやげを買ってくれる？</p><p>（如果到了夏威夷，可以幫我買那裡的名產嗎？）</p><p>但是，如果是接「形容詞」「名詞」的情況，那麼意思並不會有太大差別。</p><p>例:</p><p>料理がおいしいなら、毎日食べる。</p><p>料理がおいしかったら、毎日食べる。</p><p>（如果料理好吃的話，就會每天吃。）</p><p>私が総統なら、中学校の学力試験を廃止する。</p><p>私が総統だったら、中学校の学力試験を廃止する。</p><p>（如果我是總統的話，就會廢除國中的學力測驗。）</p><p>本場の台湾料理なら、</p><p>ここのレストランがオススメです。</p><p>本場の台湾料理だったら、</p><p>ここのレストランがオススメです。</p><p>（如果要吃道地的台灣料理，我推薦這裡的餐廳。）</p><p>若真要說有什麼不同的話，</p><p>なら：感覺較正式。</p><p>たら：感覺較口語。</p><p>其實，在日常會話中，使用「たら」的頻率較高，如果不知道該用「なら」還是「たら」時，選擇「たら」的命中率會比較高。</p><p>事實上，許多日籍的日文老師，也是建議學生多使用「たら」，因為「たら」最為口語化、使用範圍也較廣，比較不容易出錯。不過，我們還是得了解這二者在文法意義上的差異，畢竟二者表達的意思仍然有些不同，特別是動詞的部分，必須多加留心注意。</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「按鈕一按，門就開」最典型的連接是？","options":["と","ながら","まま","だけ"],"answer":0,"explanation":"操作與固定結果，典型使用と。"},{"prompt":"「明日、雨が降ったら」是否代表雨已下了？","options":["代表已經下了","不，這是明天的假設","只表示昨天","不能用於明天"],"answer":1,"explanation":"たら中的た形不使整句自動變成過去。","rubyView":{"prompt":"「<ruby>明日<rt>あした</rt></ruby>、<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>ったら」是否代表雨已下了？","options":["代表已經下了","不，這是明天的假設","只表示昨天","不能用於明天"],"explanation":"たら中的た形不使整句自動變成過去。"}},{"prompt":"「要去日本的話，先訂飯店」哪個符合前提式建議？","options":["日本に行くと、予約してください。","日本に行っているながら、予約します。","日本に行くなら、先にホテルを予約してください。","日本に行くまま、予約してください。"],"answer":2,"explanation":"なら可把去日本當作前提，建議先做訂房這件事。"},{"prompt":"食べる的ば形是？","options":["食べば","食べるば","食べようば","食べれば"],"answer":3,"explanation":"第二類去る再加れば。"}]},{"id":39,"title":"說明背景的「のです」","symbol":"んです","intro":"用のです／んです解釋背景、理由或發現。","tag":"のだ・のです・んです","concepts":[["核心是說明背景","<mark class=\"study-key\">普通形</mark>＋<mark class=\"study-key\">のです</mark>；會話常用んです。可解釋原因、補充背景，也可視語調強調，不只是「我就是要」。","どうして<ruby>休<rt>やす</rt></ruby>んだんですか。<ruby>風邪<rt>かぜ</rt></ruby>をひいたんです。","為甚麼請假？因為感冒了。回答補充請假的背景。"],["名詞／な形容詞要加な","肯定非過去：学生<mark class=\"study-key\">なのです</mark>／静か<mark class=\"study-key\">なのです</mark>，口語成学生なんです／静かなんです。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みなんです。","今天放假（所以……）。休み是名詞，不能直接休み<mark class=\"study-key\">んです</mark>。"],["過去和否定放在前面","行かなかった＋<mark class=\"study-key\">んです</mark>；忙しかった＋<mark class=\"study-key\">んです</mark>；学生だった＋んです。只有名詞／な形容詞肯定非過去的だ改な。","<ruby>昨日<rt>きのう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しかったんです。","昨天很忙，這是在<mark class=\"study-key\">說明背景</mark>。不是忙しいだったんです。"],["陳述與解釋的差別","ます常直接報告事情；<mark class=\"study-key\">んです</mark>把事情連到語境中的背景或疑問。兩者都能禮貌使用。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>ります。／<ruby>今日<rt>きょう</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>るんです。","都說今天早點回家；後句帶<mark class=\"study-key\">說明背景</mark>的感覺。不必然是爭辯或不禮貌。"]],"caution":"<mark class=\"study-key\">のです</mark>／<mark class=\"study-key\">んです</mark>不是「不客氣的ます形」。追問理由、語調或場合可能讓人有壓力，但句型本身常用於自然而禮貌的解釋。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用のです／<mark class=\"study-key\">んです</mark>解釋背景、理由或發現。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">詞類</th><th scope=\"col\">肯定非過去</th><th scope=\"col\">其他形式例</th></tr></thead><tbody><tr><td>動詞</td><td><ruby>行<rt>い</rt></ruby>くんです</td><td><ruby>行<rt>い</rt></ruby>かなかったんです</td></tr><tr><td>い形容詞</td><td><ruby>寒<rt>さむ</rt></ruby>いんです</td><td><ruby>寒<rt>さむ</rt></ruby>かったんです</td></tr><tr><td>な形容詞</td><td><ruby>静<rt>しず</rt></ruby>かなんです</td><td><ruby>静<rt>しず</rt></ruby>かだったんです</td></tr><tr><td>名詞</td><td><ruby>学生<rt>がくせい</rt></ruby>なんです</td><td><ruby>学生<rt>がくせい</rt></ruby>ではないんです</td></tr></tbody></table></div><h3>核心是說明背景</h3><p><ruby>普通<rt>ふつう</rt></ruby>形＋のです；會話常用んです。可解釋原因、補充背景，也可視語調強調，不只是「我就是要」。</p><p lang=\"ja\">どうして<ruby>休<rt>やす</rt></ruby>んだんですか。<ruby>風邪<rt>かぜ</rt></ruby>をひいたんです。</p><p>為甚麼請假？因為感冒了。回答補充請假的背景。</p><h3>名詞／な形容詞要加な</h3><p>肯定非過去：<ruby>学生<rt>がくせい</rt></ruby>なのです／<ruby>静<rt>しず</rt></ruby>かなのです，<ruby>口語<rt>こうご</rt></ruby>成<ruby>学生<rt>がくせい</rt></ruby>なんです／<ruby>静<rt>しず</rt></ruby>かなんです。</p><p lang=\"ja\"><ruby>今日<rt>きょう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みなんです。</p><p>今天放假（所以……）。休み是名詞，不能直接休み<mark class=\"study-key\">んです</mark>。</p><h3>過去和否定放在前面</h3><p><ruby>行<rt>い</rt></ruby>かなかった＋んです；<ruby>忙<rt>いそが</rt></ruby>しかった＋んです；<ruby>学生<rt>がくせい</rt></ruby>だった＋んです。只有名詞／な形容詞肯定非過去的だ改な。</p><p lang=\"ja\"><ruby>昨日<rt>きのう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しかったんです。</p><p>昨天很忙，這是在說明背景。不是忙しいだったんです。</p><h3>陳述與解釋的差別</h3><p>ます常直接報告事情；んです把事情連到語境中的背景或疑問。兩者都能禮貌使用。</p><p lang=\"ja\"><ruby>今日<rt>きょう</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>ります。／<ruby>今日<rt>きょう</rt></ruby>は<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>るんです。</p><p>都說今天早點回家；後句帶說明背景的感覺。不必然是爭辯或不禮貌。</p><h3>再看幾個例子</h3><p>どうしたんですか。＝怎麼了？<br><ruby>頭<rt>あたま</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>いんです。＝我頭痛（解釋目前狀況）。<br>あ、この<ruby>店<rt>みせ</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>も<ruby>開<rt>ひら</rt></ruby>いているんですね。＝啊，原來這家店星期日也營業。<br>のだ可用於書面說明或強調；不必一律翻成「就是／一定」。</p><h3>容易混淆的地方</h3><p>のです／んです不是「不客氣的ます形」。追問理由、語調或場合可能讓人有壓力，但句型本身常用於自然而禮貌的解釋。</p><p class=\"grammar-reference\">文法核對參考：<a href=\"https://www.jpf.go.jp/j/project/japanese/teach/tsushin/grammar/201006.html\" target=\"_blank\" rel=\"noopener noreferrer\">國際交流基金・のだ／んだ（日文） ↗</p>","uploadedOriginal":"<p>[單元39] 加強語氣的「の」</p><p>學習目標</p><p>①　了解助詞「の」的加強語氣功能</p><p>②　了解加強語氣「の」的使用方法</p><p>③　了解「動詞＋のです」和「動詞ます形」的區別</p><p>我們在先前的眾多單元中，吃過了諸如可能形和假設用法等等的文法大餐，為了怕各位消化不良，這次就介紹一點較為輕鬆易懂的文法概念。</p><p>本單元要介紹的是「加強語氣」，什麼是加強語氣呢？簡單來說，就是當說話者想強調自己的想法或強烈表達自己的主張時，會使用不同的字句來加強說話的語氣，讓對方明確知道「我想表達這件事」。例如「我不吃青椒→ 我就是不吃青椒！」 「我想出國→ 我就是想出國啦！」這類型的語句。</p><p>日文中，有許多加強語氣的方式，其中一種就是本單元的主題：使用助詞「の」來達到加強語氣的效果。相信連沒有學過日文的人都知道，日文助詞「の」的基本意思是「的」，例如「私のパソコン（我的電腦）」，不過如果「の」不用來連接名詞和名詞，而是放在句尾的話，那麼就會給人有加強語氣的感覺，例如「私は学校に行きたい（我想去學校） → 私は学校に行きたいのです（我就是想去學校）」。</p><p>另外，許多人會將「～のです」和「動詞ます形」當作同樣的文法，例如「行くのです」和「行きます」，後面也會針對這個部分進行解說。</p><p>の</p><p>助詞「の」除了表示「…和…」的意思之外，若是放在句尾，則會有加強語氣的意思。請參照以下用法和中文翻譯，相信會比較容易理解。</p><p>基本用法:</p><p>い形容詞・動詞常体  ＋　の　＋　だ／です。</p><p>名詞・な形容詞　＋　なの　＋　だ／です。</p><p>例：</p><p>彼女が作ったカレーライスはおいしい。</p><p>彼女が作ったカレーライスはおいしいのだ！</p><p>（她煮的咖哩飯很好吃 → 她煮的咖哩飯真的很好吃！）</p><p>渡辺さんは英語がうまい。</p><p>渡辺さんは英語がうまいのだ！</p><p>（渡邊先生的英文很好 →　渡邊先生的英文真的很好！）</p><p>新しいアパートは広い。</p><p>新しいアパートは広いのだ！</p><p>（新公寓很大 →　新公寓真的很大！）</p><p>私は日本語の先生になる。</p><p>私は日本語の先生になるのだ！</p><p>（我成為日語老師 →　我一定要成為日語老師！）</p><p>弟はピーマンを食べない。</p><p>弟はピーマンを食べないのだ！</p><p>（弟弟不吃青椒 →　弟弟就是不吃青椒！）</p><p>犯人は金田一さんだ。</p><p>犯人は金田一さんなのだ！</p><p>（犯人是金田一先生 →　犯人就是金田一先生！）</p><p>私が買いたいものはあのパソコンだ。</p><p>私が買いたいものはあのパソコンなのだ！</p><p>（我想買的是那台電腦 →　我想買的就是那台電腦！）</p><p>私は国仲さんのことが好きだ。</p><p>私は国仲さんのことが好きなのだ！</p><p>（我喜歡國仲小姐 →　我就是喜歡國仲小姐！）</p><p>金城武は日本では有名だ。</p><p>金城武は日本では有名なのだ！</p><p>（金城武在日本很有名 →　金城武在日本真的很有名！）</p><p>另外，在口語會話中，為了發音方便，常會將「の」發音成「ん」的形式。在會話中，幾乎所有人都會唸成「ん」，請特別注意。</p><p>例：</p><p>（上述例句可以這樣改寫）</p><p>渡辺さんは英語がうまいんだ！</p><p>新しいアパートは広いんだ！</p><p>私は日本語の先生になるんだ！</p><p>弟はピーマンを食べないんだ！</p><p>犯人は金田一さんなんだ！</p><p>私が買いたいものはあのパソコンなんだ！</p><p>私は国仲さんのことが好きなんだ！</p><p>由於「の＋だ／です」的句型具有加強語氣的意思，因此也可以用來回答以「為什麼」開頭的疑問句。</p><p>例：</p><p>どうして学校に来ませんでした？　（為什麼沒來學校？）</p><p>風邪を引いたんです。（我感冒了。）</p><p>風邪を引きましたから。（因為我感冒了。）</p><p>どうしてご飯を食べないの？（為什麼不吃飯？）</p><p>食べたら太くなるんだ。（吃了就會變胖啊。）</p><p>食べたら太くなるから。（因為吃了會變胖。）</p><p>「動詞＋のです」和「動詞ます形」的差異</p><p>由於「動詞＋のです」和「動詞ます形」，都是以「です」和「ます」結尾，因此許多人會誤以為兩者是相同的東西，都是用來表示禮貌和尊敬的文法。</p><p>例：</p><p>私は朝ごはんを食べます。</p><p>私は朝ごはんを食べるんです。</p><p>先生は日本語を教えてくれます。</p><p>先生は日本語を教えてくれるんです。</p><p>「動詞ます形」：</p><p>用來向對方表示敬意及禮貌。</p><p>「動詞のです」：</p><p>用來強烈表達自己的主張，雖有「です」，但是不太禮貌。</p><p>「動詞ます形」：</p><p>用於想向對方表示禮貌時。</p><p>「動詞のです」：</p><p>用於想讓對方了解自己想法時。常用在爭辯或吵架時。</p><p>例：</p><p>先生は来週テストがないと言いました。</p><p>（老師說下週沒有考試。）</p><p>先生は来週テストがないと言ったんです！</p><p>（老師就是說下週沒有考試啊！）</p><p>彼はパーティーに来ます。</p><p>（他來參加派對。）</p><p>彼はパーティーに来るんです！</p><p>（他會來參加派對！）</p><p>私は朱と言います。</p><p>（我的名字是朱。）</p><p>私は朱と言うんです！</p><p>（我的名字叫做朱！ ）不是其他名字</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"學生用んです說明背景，應說？","options":["学生なんです","学生んです","学生なだです","学生だんです"],"answer":0,"explanation":"名詞肯定非過去用なのです，口語為なんです。"},{"prompt":"「風邪をひいたんです」常在做甚麼？","options":["下命令","說明背景或理由","列舉物品","禁止他人"],"answer":1,"explanation":"んです把感冒這件事連到語境中的原因或背景。","rubyView":{"prompt":"「<ruby>風邪<rt>かぜ</rt></ruby>をひいたんです」常在做甚麼？","options":["下命令","說明背景或理由","列舉物品","禁止他人"],"explanation":"んです把感冒這件事連到語境中的原因或背景。"}},{"prompt":"哪句正確表示「昨天很忙」的解釋？","options":["忙しいだったんです","忙しかったなです","忙しかったんです","忙しいでしたんです"],"answer":2,"explanation":"忙しい過去形忙しかった，再接んです。"},{"prompt":"關於んです，哪項正確？","options":["只能吵架用","永遠不禮貌","不能接動詞","也能用於禮貌地解釋"],"answer":3,"explanation":"んです本身不等於爭辯，禮貌取決於語境與語氣。"}]},{"id":40,"title":"限定用法「だけ」「しか」","symbol":"だけ","intro":"分清「只有這些」和「除此以外沒有」。","tag":"だけ・しか～ない","concepts":[["だけ：限定範圍","名詞＋<mark class=\"study-key\">だけ</mark>，可客觀限定人、物或數量，後面不一定是否定。","<ruby>水<rt>みず</rt></ruby>だけ<ruby>飲<rt>の</rt></ruby>みます。","只喝水。也可說水<mark class=\"study-key\">だけ</mark>を飲みます，を不一定必須省略。"],["しか：搭配否定","<mark class=\"study-key\">しか＋否定</mark>句，<mark class=\"study-key\">排除其他選項</mark>。常讓人感到數量有限或不夠，但不是固定情緒。","<ruby>財布<rt>さいふ</rt></ruby>に<ruby>百<rt>ひゃく</rt></ruby><ruby>円<rt>えん</rt></ruby>しかありません。","錢包裡只有一百日圓。雖然用了ありません，中文仍是「有，但只有」。"],["否定的位置會改變意思","<mark class=\"study-key\">だけ</mark>は＋否定可把某項排除；<mark class=\"study-key\">しか＋否定</mark>則只留下該項。","<ruby>肉<rt>にく</rt></ruby>だけは<ruby>食<rt>た</rt></ruby>べません。／<ruby>肉<rt>にく</rt></ruby>しか<ruby>食<rt>た</rt></ruby>べません。","前句：只有肉不吃。後句：只吃肉。兩句意思不能混淆。"],["動詞＋しかない：別無選擇","辭書形＋<mark class=\"study-key\">しかない</mark>，表示除了做這件事，沒有其他選擇。","<ruby>次<rt>つぎ</rt></ruby>のバスを<ruby>待<rt>ま</rt></ruby>つしかありません。","只好等下一班巴士。等待可能不理想，但句型不限定一定要悲壯或下決心。"]],"caution":"<mark class=\"study-key\">だけ</mark>和しか不是一個永遠弱、一個永遠強。先看是否<mark class=\"study-key\">限定範圍</mark>、是否排除其他選項，再看否定放在哪裡。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分清「只有這些」和「除此以外沒有」。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">句型</th><th scope=\"col\">意思</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>名詞＋<mark class=\"study-key\">だけ</mark>＋肯定</td><td>只……</td><td>パンだけ<ruby>食<rt>た</rt></ruby>べる</td></tr><tr><td>名詞＋<mark class=\"study-key\">しか＋否定</mark></td><td>除了……都不……</td><td>パンしか<ruby>食<rt>た</rt></ruby>べない</td></tr><tr><td>名詞＋<mark class=\"study-key\">だけ</mark>は＋否定</td><td>唯獨……不……</td><td>パンだけは<ruby>食<rt>た</rt></ruby>べない</td></tr><tr><td>辭書形＋しかない</td><td>只好……</td><td><ruby>待<rt>ま</rt></ruby>つしかない</td></tr></tbody></table></div><h3>だけ：限定範圍</h3><p>名詞＋<mark class=\"study-key\">だけ</mark>，可客觀限定人、物或數量，後面不一定是否定。</p><p lang=\"ja\"><ruby>水<rt>みず</rt></ruby>だけ<ruby>飲<rt>の</rt></ruby>みます。</p><p>只喝水。也可說水<mark class=\"study-key\">だけ</mark>を飲みます，を不一定必須省略。</p><h3>しか：搭配否定</h3><p><mark class=\"study-key\">しか＋否定</mark>句，<mark class=\"study-key\">排除其他選項</mark>。常讓人感到數量有限或不夠，但不是固定情緒。</p><p lang=\"ja\"><ruby>財布<rt>さいふ</rt></ruby>に<ruby>百<rt>ひゃく</rt></ruby><ruby>円<rt>えん</rt></ruby>しかありません。</p><p>錢包裡只有一百日圓。雖然用了ありません，中文仍是「有，但只有」。</p><h3>否定的位置會改變意思</h3><p><mark class=\"study-key\">だけ</mark>は＋否定可把某項排除；<mark class=\"study-key\">しか＋否定</mark>則只留下該項。</p><p lang=\"ja\"><ruby>肉<rt>にく</rt></ruby>だけは<ruby>食<rt>た</rt></ruby>べません。／<ruby>肉<rt>にく</rt></ruby>しか<ruby>食<rt>た</rt></ruby>べません。</p><p>前句：只有肉不吃。後句：只吃肉。兩句意思不能混淆。</p><h3>動詞＋しかない：別無選擇</h3><p>辭書形＋<mark class=\"study-key\">しかない</mark>，表示除了做這件事，沒有其他選擇。</p><p lang=\"ja\"><ruby>次<rt>つぎ</rt></ruby>のバスを<ruby>待<rt>ま</rt></ruby>つしかありません。</p><p>只好等下一班巴士。等待可能不理想，但句型不限定一定要悲壯或下決心。</p><h3>再看幾個例子</h3><p><ruby>家<rt>いえ</rt></ruby>には<ruby>弟<rt>おとうと</rt></ruby>しかいません。＝家裡只有弟弟。<br>この<ruby>部屋<rt>へや</rt></ruby>だけは<ruby>使<rt>つか</rt></ruby>わないでください。＝唯獨這個房間請不要用。<br><ruby>友達<rt>ともだち</rt></ruby>とだけ<ruby>話<rt>はな</rt></ruby>しました。＝只和朋友說了話。<br><ruby>友達<rt>ともだち</rt></ruby>としか<ruby>話<rt>はな</rt></ruby>しませんでした。＝除了朋友，沒和其他人說話。</p><h3>容易混淆的地方</h3><p>だけ和しか不是一個永遠弱、一個永遠強。先看是否限定範圍、是否排除其他選項，再看否定放在哪裡。</p>","uploadedOriginal":"<p>[單元40] 限定用法「だけ」「しか」</p><p>學習目標</p><p>①　學習限定用法「だけ」</p><p>②　學習限定用法「しか」</p><p>本單元要介紹日文中的「限定用法」，也就是用來「限定說話或動作對象」的文法。簡單來說，就是中文當中的「只有…」和「除了…都不…」句型，例如「家裡只有弟弟一個人」、「我除了零食之外什麼都不吃」等等。</p><p>あなただけ見つめてる～～　　BY　スラムダンク</p><p>以上是動畫「灌籃高手」片尾曲的第一句歌詞，如果你是七年級生，應該立刻就能回憶起歌曲的旋律和片尾動畫吧，沒錯，就是流川楓和櫻木花道搶籃板的定格畫面！</p><p>我們本單元的主題，其實就在這一句歌詞中。「あなただけ見つめてる」中文為「我只凝視著你」，當中的「だけ」是「只有…」的意思，這就是本單元將介紹的限定用法之一。中文當中的「只有」「只是」「只不過」等等用法，幾乎都可以套用日文中的「だけ」文法來使用。就這點來說，日文方便多了。</p><p>日文中還有另一種常見的限定用法: 「しか」。「しか」的語氣比「だけ」更為強烈，相當於中文「除了…之外，都不…」，例如「我只嫁給你（私はあなたとだけ結婚する）」「我除了你以外誰都不嫁（私はあなたとしか結婚しない）」，後句的語氣明顯強烈多了。</p><p>在本單元中，我們將依序介紹「だけ」和「しか」的使用方法、以及解說如何區別二者的使用時機。</p><p>だけ</p><p>「だけ」相當於中文的「只有…」，用於限定動作的對象。</p><p>就文法性質來說，「だけ」經常接在名詞之後。</p><p>基本用法:  名詞　＋　だけ</p><p>（只有…）</p><p>名詞　＋　だけは＋否定</p><p>（只有… 不行） 加強語氣</p><p>例：</p><p>私の全財産は100元だけです。</p><p>（我全部的財產只有100元。）</p><p>あなただけは許せない！</p><p>（只有你我無法原諒！）</p><p>家にいる人は弟だけです。</p><p>（只有弟弟一人在家。）</p><p>この提案に賛成した人は二人だけです。</p><p>（贊成這則提案的只有二人。）</p><p>通訳の仕事ができる人は、</p><p>クラスの中で王さんだけです。</p><p>（能夠勝任口譯工作的人，班上只有王同學而已。）</p><p>私は刺身だけは食べない。</p><p>（我只有生魚片不吃。）</p><p>タバコだけは吸わないでください。</p><p>（只有香煙別去碰。）</p><p>冷蔵庫にある食材はジャガイモだけだ。</p><p>（冰箱裡的食材只有馬鈴薯而已。）</p><p>彼女は見た目だけが綺麗で、本当は性格の悪い人だ。</p><p>（她只有外表漂亮，其實個性不太好。）</p><p>しか</p><p>「しか」和「だけ」相似，也是表示對象的限定，相當於中文的「只有…」，但是較為不同的是，「しか」後面必須接否定形，而且語氣比「だけ」更為強烈，聽起來有「除了…之外什麼都沒有」的感覺。</p><p>基本用法：しか　＋　否定形</p><p>（除了…都不…）  語氣較強烈</p><p>例：</p><p>私の全財産は100元しかないです。</p><p>（除了100元之外，沒有其他財產了。）</p><p>家にいる人は弟しかいないです。</p><p>（除了弟弟之外，沒有任何人在家。）</p><p>この提案に賛成した人は二人しかいないです。</p><p>（除了二個人之外，沒有人贊成這個提案。）</p><p>私は刺身しか食べない。</p><p>（我除了生魚片之外，什麼都不吃。）</p><p>冷蔵庫にある食材はジャガイモしかない。</p><p>（除了馬鈴薯之外，冰箱裡沒有其他食材。）</p><p>私は現在携帯と財布しか持っていない。</p><p>（除了手機和錢包之外，我現在沒有帶其他東西。）</p><p>私は日本語と英語しかできない。</p><p>（我除了日語和英語外，什麼都不會。）</p><p>木下さんは朝味噌汁とご飯しか食べない。</p><p>（木下先生除了味噌湯和白飯外，早上不吃其他東西。）</p><p>沢尻さんは高い服しか買わない。</p><p>（除了貴的衣服外，澤尻小姐不買其他衣服。）</p><p>私は明るい人としか友達にならない。</p><p>（除了開朗的人之外，我不和其他人做朋友。）</p><p>私の進む道はこれしかない。</p><p>（除了這條路之外，我沒有其他選擇了。）</p><p>「だけ」と「しか」の区別</p><p>「だけ」：</p><p>「 只有… 」單純限定某對象，語氣較弱。</p><p>「しか」：</p><p>「除了…之外、都不…」藉由否定其他所有東西，</p><p>來間接限定某對象，語氣較強烈。</p><p>例：</p><p>私は寿司だけ食べる。（我只吃壽司。）</p><p>私は寿司しか食べない。（除了壽司外什麼都不吃。）</p><p>あなただけ見つめている。（我只注視著妳。）</p><p>あなたしか見つめていない。（除了妳之外，我誰都不看。）</p><p>不過，如果是要表現出「悲壯」或「下定決心」語感的話，那麼就只能用「しか」這項文法了。</p><p>例：</p><p>俺にはあなたしかない！</p><p>（我除了妳之外什麼都沒有了！）</p><p>俺は一生懸命頑張るしかない！</p><p>（我除了拼命努力，沒有其他方法了！）</p><p>俺は今前に進むしかない！</p><p>（我除了向前邁進之外，沒有其他路可走了！）</p><p>俺が持っているものは、この命しかない！</p><p>（我除了這條命之外，什麼東西都沒有了！）</p><p>註：</p><p>第一項例句中，為了強調「擁有、所有」的意思，因此使用「ない」來表示。這裡使用「しかない」或「しかいない」都可以。</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「只有一百日圓」填入：百円しか＿＿。","options":["ありません","あります","ありましたです","あるです"],"answer":0,"explanation":"しか要搭配否定，百円しかありません仍表示有一百日圓。"},{"prompt":"「肉だけは食べません」意思是？","options":["只吃肉","唯獨肉不吃","甚麼也不吃","沒有肉"],"answer":1,"explanation":"だけは＋否定把肉排除，和肉しか食べません不同。","rubyView":{"prompt":"「<ruby>肉<rt>にく</rt></ruby>だけは<ruby>食<rt>た</rt></ruby>べません」意思是？","options":["只吃肉","唯獨肉不吃","甚麼也不吃","沒有肉"],"explanation":"だけは＋否定把肉排除，和肉しか食べません不同。"}},{"prompt":"「肉しか食べません」意思是？","options":["不吃肉","全部都吃","只吃肉","正在吃肉"],"answer":2,"explanation":"しか＋否定排除肉以外的選項。","rubyView":{"prompt":"「<ruby>肉<rt>にく</rt></ruby>しか<ruby>食<rt>た</rt></ruby>べません」意思是？","options":["不吃肉","全部都吃","只吃肉","正在吃肉"],"explanation":"しか＋否定排除肉以外的選項。"}},{"prompt":"「只好等」應說？","options":["待ってしかない","待っただけはない","待ちますしかない","待つしかない"],"answer":3,"explanation":"辭書形待つ＋しかない。"}]},{"id":41,"title":"動詞て形的相關句型用法","symbol":"てみる","intro":"從て形延伸到做完、嘗試與事先準備。","tag":"てしまう・てみる・ておく","concepts":[["てしまう：做完或遺憾","動詞て形＋しまう。可表示<mark class=\"study-key\">徹底完成</mark>，也可帶不小心、<mark class=\"study-key\">遺憾</mark>等感受，不一定吃驚。","<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>全部<rt>ぜんぶ</rt></ruby>やってしまいました。","把功課全部做完了。這句可只是完成，不必翻成「糟了」。"],["てみる：試著做","先做出て形，再接みる。作為輔助用法通常寫假名，不是一定要用眼睛看。","この<ruby>服<rt>ふく</rt></ruby>を<ruby>着<rt>き</rt></ruby>てみます。","試穿這件衣服。着る→着て→着てみます；行く→行っ<mark class=\"study-key\">てみる</mark>＝去看看。"],["ておく：事先準備或維持","動詞て形＋おく。常為之後的<mark class=\"study-key\">事先準備</mark>，也能表示<mark class=\"study-key\">保持某狀態</mark>。","<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に、ホテルを<ruby>予約<rt>よやく</rt></ruby>しておきます。","旅行前先把飯店訂好。予約する→予約して→予約し<mark class=\"study-key\">ておく</mark>。"],["會話縮約","<mark class=\"study-key\">てしまう</mark>→<mark class=\"study-key\">ちゃう</mark>；でしまう→じゃう。ておく→とく；でおく→どく。","<ruby>読<rt>よ</rt></ruby>んでしまう → <ruby>読<rt>よ</rt></ruby>んじゃう。／<ruby>読<rt>よ</rt></ruby>んでおく → <ruby>読<rt>よ</rt></ruby>んどく。","把它讀完／先讀好。初學先熟悉完整形式，再辨認縮約。"]],"caution":"しまう不只表示後悔；<mark class=\"study-key\">てみる</mark>不等於只能看；<mark class=\"study-key\">ておく</mark>不只表示將來。三者都先接正確て形，再改最後的時態和禮貌形式。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">從て形延伸到做完、嘗試與<mark class=\"study-key\">事先準備</mark>。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">功能</th><th scope=\"col\">基本形</th><th scope=\"col\">禮貌形／過去</th></tr></thead><tbody><tr><td>完成／<mark class=\"study-key\">遺憾</mark></td><td><ruby>食<rt>た</rt></ruby>べてしまう</td><td><ruby>食<rt>た</rt></ruby>べてしまいました</td></tr><tr><td>嘗試</td><td><ruby>食<rt>た</rt></ruby>べてみる</td><td><ruby>食<rt>た</rt></ruby>べてみました</td></tr><tr><td>預先</td><td><ruby>作<rt>つく</rt></ruby>っておく</td><td><ruby>作<rt>つく</rt></ruby>っておきました</td></tr></tbody></table></div><h3>てしまう：做完或遺憾</h3><p>動詞て形＋しまう。可表示<mark class=\"study-key\">徹底完成</mark>，也可帶不小心、<mark class=\"study-key\">遺憾</mark>等感受，不一定吃驚。</p><p lang=\"ja\"><ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>全部<rt>ぜんぶ</rt></ruby>やってしまいました。</p><p>把功課全部做完了。這句可只是完成，不必翻成「糟了」。</p><h3>てみる：試著做</h3><p>先做出て形，再接みる。作為輔助用法通常寫假名，不是一定要用眼睛看。</p><p lang=\"ja\">この<ruby>服<rt>ふく</rt></ruby>を<ruby>着<rt>き</rt></ruby>てみます。</p><p>試穿這件衣服。着る→<ruby>着<rt>き</rt></ruby>て→<ruby>着<rt>き</rt></ruby>てみます；<ruby>行<rt>い</rt></ruby>く→<ruby>行<rt>い</rt></ruby>ってみる＝去看看。</p><h3>ておく：事先準備或維持</h3><p>動詞て形＋おく。常為之後的<mark class=\"study-key\">事先準備</mark>，也能表示<mark class=\"study-key\">保持某狀態</mark>。</p><p lang=\"ja\"><ruby>旅行<rt>りょこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に、ホテルを<ruby>予約<rt>よやく</rt></ruby>しておきます。</p><p>旅行前先把飯店訂好。<ruby>予約<rt>よやく</rt></ruby>する→<ruby>予約<rt>よやく</rt></ruby>して→<ruby>予約<rt>よやく</rt></ruby>しておく。</p><h3>會話縮約</h3><p><mark class=\"study-key\">てしまう</mark>→<mark class=\"study-key\">ちゃう</mark>；でしまう→じゃう。ておく→とく；でおく→どく。</p><p lang=\"ja\"><ruby>読<rt>よ</rt></ruby>んでしまう → <ruby>読<rt>よ</rt></ruby>んじゃう。／<ruby>読<rt>よ</rt></ruby>んでおく → <ruby>読<rt>よ</rt></ruby>んどく。</p><p>把它讀完／先讀好。初學先熟悉完整形式，再辨認縮約。</p><h3>再看幾個例子</h3><p><ruby>傘<rt>かさ</rt></ruby>を<ruby>電車<rt>でんしゃ</rt></ruby>に<ruby>忘<rt>わす</rt></ruby>れてしまいました。＝不小心把傘忘在電車上了。<br>この<ruby>料理<rt>りょうり</rt></ruby>を<ruby>食<rt>た</rt></ruby>べてみたいです。＝想試吃這道料理。<br><ruby>明日<rt>あした</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>の<ruby>資料<rt>しりょう</rt></ruby>を<ruby>準備<rt>じゅんび</rt></ruby>しておきます。＝先準備好明天會議的資料。<br><ruby>窓<rt>まど</rt></ruby>は<ruby>開<rt>あ</rt></ruby>けておいてください。＝請讓窗戶開著。</p><h3>容易混淆的地方</h3><p>しまう不只表示後悔；<mark class=\"study-key\">てみる</mark>不等於只能看；<mark class=\"study-key\">ておく</mark>不只表示將來。三者都先接正確て形，再改最後的時態和禮貌形式。</p>","uploadedOriginal":"<p>[單元41] 動詞て形的相關句型用法</p><p>學習目標</p><p>①　學習表示意料之外的「動詞て形＋しまう」句型</p><p>②　學習表示嘗試的「動詞て形＋みる」句型</p><p>③　學習表示事先的「動詞て形＋おく」句型</p><p>經過幾回的休息之後，我們在本單元中，將繼續介紹和「動詞て形」相關的句型用法。「動詞て形」是最重要的動詞變化之一，能衍生出相當多的相關句型，因此，如果你對於「動詞て形」的變化方式還不熟悉的話，請先回到之前的單元多加練習，直到完全理解為止。</p><p>本單元將介紹三項「動詞て形」相關句型：</p><p>①「動詞て形＋しまう」</p><p>②「動詞て形＋みる」</p><p>③「動詞て形＋おく」</p><p>不免俗地，我們仍然要再補上一句：這些句型都很實用，如果不是真正實用的文法，我們不會特地挑出來說明～</p><p>首先，「動詞て形＋しまう」為表示「意料之外」或「遺憾」語氣的句型用法，相當於中文的「啊！我…了」，例如：</p><p>妹のケーキを全部食べてしまった。</p><p>（啊！我吃掉妹妹的蛋糕了）</p><p>先生が怒って帰ってしまった。</p><p>（啊！老師生氣回家了）</p><p>其次為「動詞て形＋みる」這個用法，「みる」是「見る、看」之意，因此這個句型的中文意思是「…看看」，表示嘗試進行某動作。例如：上海に行ってみる（去上海看看）学食の料理を食べてみる（吃看看學生餐廳的料理）</p><p>最後是「動詞て形＋おく」，「おく」是「置く（放置）」之意，整句相當於中文「事先…」，表示預先做某樣動作，可以想成「將某件事先做起來放著」，這樣應該有助於理解。例如「言っておく（話講在前頭）、冷蔵庫に入れておく（事先放進冰箱中）」</p><p>以下進行更完整的文法和用法例句介紹。</p><p>てしまう</p><p>「動詞て形＋しまう」表示「意料之外」或「遺憾」的語氣，相當於中文的「啊！我…了」。通常說話者在使用時，聲音中會帶有吃驚的感覺。另外，我們通常對於已經發生的事情才會感到吃驚和遺憾，因此「てしまう」常以過去式的形式「てしまった」進行使用。</p><p>基本用法:  動詞て形＋しまう／しまった。</p><p>（啊！我…了）</p><p>「しまう」為第一類動詞，「ます形」為「しまいます」。</p><p>例：</p><p>私は今月のお小遣いを全部使ってしまった。</p><p>（啊！我將這個月的零用錢全部用完了。）</p><p>父は妹の作ったケーキを食べてしまった。</p><p>（啊！爸爸吃掉妹妹做的蛋糕了。）</p><p>彼女はあの高い服を買ってしまったのか。</p><p>（啊！她買了那件很貴的衣服嗎？）</p><p>欲しいオモチャは売り切れてしまった。</p><p>（啊！喜歡的玩具賣完了。）</p><p>傘を電車に忘れてしまった。</p><p>（啊！把雨傘忘在電車裡了。）</p><p>兄のパソコンを壊してしまった。</p><p>（啊！我不小心將哥哥的電腦弄壞了。）</p><p>另外，在口語會話中，為了方便發音，常會將「てしまう」唸成「ちゃう」的形式。</p><p>「てしまう」→「ちゃう」</p><p>「でしまう」→「じゃう」</p><p>例：</p><p>食べてしまう　→　食べちゃう</p><p>忘れてしまう　→　忘れちゃう</p><p>買ってしまう　→　買っちゃう</p><p>読んでしまう　→　読んじゃう</p><p>呼んでしまう　→　呼んじゃう</p><p>死んでしまう　→　死んじゃう</p><p>てみる</p><p>「動詞て形＋みる」表示「嘗試進行某動作」的意思，</p><p>「みる」漢字寫作「見る（看）」，因此可以想成是中文的「…看看」。</p><p>基本用法:  動詞て形＋みる</p><p>（ … 看看）</p><p>「みる」為第二類動詞，「ます形」為「みます」。</p><p>例：</p><p>あの新しいレストランに行ってみる。</p><p>（去那間新的餐廳看看。）</p><p>コンビニのインスタントコーヒーを飲んでみる。</p><p>（喝喝看便利商店的沖泡咖啡。）</p><p>運動会の陸上競技に参加してみる。</p><p>（參加看看運動會的賽跑項目。）</p><p>先生の手料理を食べてみる。</p><p>（吃吃看老師親手做的料理。）</p><p>この派手な服を着てみる。</p><p>（穿穿看這件華麗的衣服。）</p><p>台湾新幹線に乗ってみる。</p><p>（坐坐看台灣高鐵。）</p><p>通訳の仕事をしてみる。</p><p>（做做看口譯的工作。）</p><p>除了「てみる」的形式外，也可以使用過去式「てみた」、願望用法「てみたい」等等。</p><p>例：</p><p>あの新しいレストランに行ってみる。</p><p>（去那間新開的餐廳看看。）</p><p>あの新しいレストランに行ってみたい。</p><p>（想去那間新開的餐廳看看。） 表示願望</p><p>あの新しいレストランに行ってみたが、</p><p>おいしくなかった。</p><p>（去了那間新開的餐廳，不過並不好吃。） 表示過去式</p><p>通訳の仕事をしてみる。</p><p>（做做看口譯的工作。）</p><p>通訳の仕事をしてみたい。</p><p>（想做做看口譯的工作。） 表示願望</p><p>通訳の仕事をしてみたけど、とても大変な仕事だった。</p><p>（做了口譯的工作，真的是非常辛苦。） 表示過去式</p><p>ておく</p><p>「動詞て形＋おく」表示「事先進行某動作」的意思，「おく」漢字寫作「置く（放置）」，因此可以想成是中文的「事先…、預先…」。</p><p>基本用法:  動詞て形＋おく</p><p>（事先…）</p><p>「おく」為第一類動詞，「ます形」為「おきます」。</p><p>例：</p><p>ホテルを予約しておく。</p><p>（事先預約旅館。）</p><p>ビールを冷蔵庫に入れておく。</p><p>（事先將啤酒放進冰箱中。）</p><p>明日会議用の資料を準備しておく。</p><p>（事先準備好明天開會用的資料。）</p><p>食べる前に、料金を払っておく。</p><p>（在吃飯之前，先付錢。）</p><p>ほしい資料を図書館でコピーしておく。</p><p>（事先在圖書館影印想要的資料。）</p><p>休みのことを先生に言っておく。</p><p>（事先告訴老師要請假的事。）</p><p>会社に行く前に、昼の弁当を作っておく。</p><p>（去上班之前，事先做好中午的便當。）</p><p>除了「ておく」的現在式外，也可以使用過去式「ておいた」、願望用法「ておきたい」等等。</p><p>例：</p><p>ホテルを予約しておく／おきます。</p><p>（事先預約旅館。）</p><p>ホテルを予約しておいた／おきました。</p><p>（事先預約了旅館。）  表示過去式</p><p>ホテルを予約しておきたい。</p><p>（想事先預約旅館。） 表示願望</p><p>ホテルを予約しておこう／おきましょう。</p><p>（一起事先預約旅館吧。）  表示邀請</p><p>ビールを冷蔵庫に入れておく／おきます。</p><p>（事先將啤酒放進冰箱中。）</p><p>ビールを冷蔵庫に入れておいた／おきました。</p><p>（事先將啤酒放進冰箱中了。）  表示過去式</p><p>ビールを冷蔵庫に入れておきたい。</p><p>（想先將啤酒放進冰箱中。）  表示願望</p><p>ビールを冷蔵庫に入れておこう／おきましょう。</p><p>（一起先將啤酒放進冰箱中吧。）  表示邀請</p><p>另外，在口語會話中，為了發音方便，會將「ておく」發音成「とく」、「でおく」則發音成「どく」的形式。</p><p>例：</p><p>予約する　→　予約しておく　→　予約しとく</p><p>言う　→　言っておく　→　言っとく</p><p>読む　→　読んでおく　→　読んどく</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"把読む接てしまう，正確是？","options":["読んでしまう","読みてしまう","読むてしまう","読んてしまう"],"answer":0,"explanation":"読む→読んで，保留濁音で。"},{"prompt":"想試穿衣服應說？","options":["着ておきます","着てみます","着たことです","着るみます"],"answer":1,"explanation":"てみる表示嘗試，着る的て形是着て。"},{"prompt":"「事先訂好飯店」應說？","options":["予約するおく","予約したみる","予約しておく","予約しているだけ"],"answer":2,"explanation":"為之後準備，用ておく。"},{"prompt":"てしまう是否一定表達後悔？","options":["一定","只能悲傷","只代表未來","不一定，也能表示完成"],"answer":3,"explanation":"如宿題を全部やってしまった，可以只是全部做完。"}]},{"id":42,"title":"自動詞和他動詞","symbol":"ひらく","intro":"從句子的焦點，分清「門開了」和「把門打開」。","tag":"自動詞・他動詞・が／を","concepts":[["自動詞：描述事物的動作或變化","不以<mark class=\"study-key\">直接受詞</mark>作動作對象。並不是「一定自己發生、沒有外力」。","ドアが<ruby>開<rt>ひら</rt></ruby>きました。","門開了。開く（あく）是<mark class=\"study-key\">自動詞</mark>，聚焦門的變化，可能是有人打開。"],["他動詞：對某對象做動作","<mark class=\"study-key\">直接對象</mark>常以を標示；對象清楚時也能省略，不代表每句都要把它寫出來。","<ruby>私<rt>わたし</rt></ruby>がドアを<ruby>開<rt>あ</rt></ruby>けました。","我把門打開了。開ける（あける）是<mark class=\"study-key\">他動詞</mark>，直接對象是ドア。"],["成對記單字","一起記<mark class=\"study-key\">が＋自動詞</mark>、<mark class=\"study-key\">を＋他動詞</mark>，比只看字尾猜更可靠。並非所有動詞都有一一對應的另一半。","<ruby>電気<rt>でんき</rt></ruby>が<ruby>消<rt>き</rt></ruby>える。／<ruby>電気<rt>でんき</rt></ruby>を<ruby>消<rt>け</rt></ruby>す。","燈熄了／把燈關掉。壊れる／壊す＝壞掉／弄壞；入る／入れる＝進去／放入。"],["看到を，不一定是他動詞","を也能標示經過的<mark class=\"study-key\">路線</mark>或<mark class=\"study-key\">離開的位置</mark>；這時不是直接受詞。","<ruby>公園<rt>こうえん</rt></ruby>を<ruby>歩<rt>ある</rt></ruby>きます。","在公園走路。歩く仍是<mark class=\"study-key\">自動詞</mark>；を標示行經場所，不是「把公園走掉」。"]],"caution":"<mark class=\"study-key\">自動詞</mark>≠毫無外力，<mark class=\"study-key\">他動詞</mark>≠由別人做。不要只按有沒有を或え段字尾判斷；應連意思與搭配一起記。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">從句子的焦點，分清「門開了」和「把門打開」。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">自動詞</th><th scope=\"col\">他動詞</th><th scope=\"col\">意思</th></tr></thead><tbody><tr><td>ドアが<ruby>開<rt>ひら</rt></ruby>く（あく）</td><td>ドアを<ruby>開<rt>あ</rt></ruby>ける</td><td>門開／開門</td></tr><tr><td>ドアが<ruby>閉<rt>し</rt></ruby>まる</td><td>ドアを<ruby>閉<rt>し</rt></ruby>める</td><td>門關／關門</td></tr><tr><td><ruby>電気<rt>でんき</rt></ruby>が<ruby>消<rt>き</rt></ruby>える</td><td><ruby>電気<rt>でんき</rt></ruby>を<ruby>消<rt>け</rt></ruby>す</td><td>燈熄／關燈</td></tr><tr><td><ruby>時計<rt>とけい</rt></ruby>が<ruby>壊<rt>こわ</rt></ruby>れる</td><td><ruby>時計<rt>とけい</rt></ruby>を<ruby>壊<rt>こわ</rt></ruby>す</td><td>鐘壞／弄壞鐘</td></tr><tr><td><ruby>水<rt>みず</rt></ruby>が<ruby>入<rt>はい</rt></ruby>る</td><td><ruby>水<rt>みず</rt></ruby>を<ruby>入<rt>い</rt></ruby>れる</td><td>水進入／放入水</td></tr><tr><td>人が<ruby>出<rt>で</rt></ruby>る</td><td><ruby>物<rt>もの</rt></ruby>を<ruby>出<rt>だ</rt></ruby>す</td><td>人出去／拿出物件</td></tr></tbody></table></div><h3>自動詞：描述事物的動作或變化</h3><p>不以<mark class=\"study-key\">直接受詞</mark>作動作對象。並不是「一定自己發生、沒有外力」。</p><p lang=\"ja\">ドアが<ruby>開<rt>ひら</rt></ruby>きました。</p><p>門開了。開く（あく）是<mark class=\"study-key\">自動詞</mark>，聚焦門的變化，可能是有人打開。</p><h3>他動詞：對某對象做動作</h3><p><mark class=\"study-key\">直接對象</mark>常以を標示；對象清楚時也能省略，不代表每句都要把它寫出來。</p><p lang=\"ja\"><ruby>私<rt>わたし</rt></ruby>がドアを<ruby>開<rt>あ</rt></ruby>けました。</p><p>我把門打開了。開ける（あける）是<mark class=\"study-key\">他動詞</mark>，<mark class=\"study-key\">直接對象</mark>是ドア。</p><h3>成對記單字</h3><p>一起記<mark class=\"study-key\">が＋自動詞</mark>、<mark class=\"study-key\">を＋他動詞</mark>，比只看字尾猜更可靠。並非所有動詞都有一一對應的另一半。</p><p lang=\"ja\"><ruby>電気<rt>でんき</rt></ruby>が<ruby>消<rt>き</rt></ruby>える。／<ruby>電気<rt>でんき</rt></ruby>を<ruby>消<rt>け</rt></ruby>す。</p><p>燈熄了／把燈關掉。<ruby>壊<rt>こわ</rt></ruby>れる／<ruby>壊<rt>こわ</rt></ruby>す＝壞掉／弄壞；<ruby>入<rt>はい</rt></ruby>る／<ruby>入<rt>い</rt></ruby>れる＝進去／放入。</p><h3>看到を，不一定是他動詞</h3><p>を也能標示經過的<mark class=\"study-key\">路線</mark>或<mark class=\"study-key\">離開的位置</mark>；這時不是直接受詞。</p><p lang=\"ja\"><ruby>公園<rt>こうえん</rt></ruby>を<ruby>歩<rt>ある</rt></ruby>きます。</p><p>在公園走路。歩く仍是<mark class=\"study-key\">自動詞</mark>；を標示行經場所，不是「把公園走掉」。</p><h3>再看幾個例子</h3><p><ruby>窓<rt>まど</rt></ruby>が<ruby>開<rt>ひら</rt></ruby>いています。＝窗戶開著，描述目前結果狀態。<br><ruby>窓<rt>まど</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けてください。＝請打開窗戶。<br>バスに<ruby>乗<rt>の</rt></ruby>ります。＝坐巴士；乗る是<mark class=\"study-key\">自動詞</mark>，使用に。<br><ruby>部屋<rt>へや</rt></ruby>を<ruby>出<rt>で</rt></ruby>ます。＝離開房間；出る前的を表示離開位置。</p><h3>容易混淆的地方</h3><p><mark class=\"study-key\">自動詞</mark>≠毫無外力，<mark class=\"study-key\">他動詞</mark>≠由別人做。不要只按有沒有を或え段字尾判斷；應連意思與搭配一起記。</p>","uploadedOriginal":"<p>[單元42] 自動詞和他動詞</p><p>學習目標</p><p>①　了解何謂「自動詞」和「他動詞」</p><p>②　了解「自動詞」和「他動詞」的使用方法</p><p>③　了解「自動詞」和「他動詞」的區別</p><p>這次要介紹的概念比較抽象，為日文中的「自動詞」和「他動詞」。日文的動詞，依使用方法和意思，分為「自動詞」和「他動詞」二大類，事不宜遲，我們立刻進入學習內容吧！</p><p>自動詞？他動詞？</p><p>「自動詞」和「他動詞」到底是什麼意思呢？</p><p>自動詞 : 由自己進行該動作的動詞。</p><p>＝「～が～になる」（自然變成～）</p><p>他動詞 : 藉由他人力量（外力）進行該動作的動詞。</p><p>＝「～を～にする」（將～變成～）</p><p>例：</p><p>入る    →　自己進去某場所　  自動詞</p><p>入れる　→ 將…放進去         他動詞</p><p>出る　→  自己從某場所出去     自動詞</p><p>出す  →　將…拿出來           他動詞</p><p>壊れる　→  東西壞掉了         自動詞</p><p>壊す    →  將東西弄壞         他動詞</p><p>消える　→  東西自己消失了      自動詞</p><p>消す    →  將…消除掉          他動詞</p><p>倒れる　→  某物自己倒下        自動詞</p><p>倒す    →  將某物弄倒          他動詞</p><p>如果以文法規則的角度解釋，則如下所示：</p><p>自動詞 : 前面不需要加上表示動作對象的「受詞」。</p><p>他動詞 : 前面要加上表示動作對象的「受詞」，</p><p>意思才會顯得較完整。</p><p>以中文為例，</p><p>①　「我跑」  「我走路」  「我生氣」  「我哭」</p><p>這類動詞，只要「名詞＋動詞」，意思就可以通。</p><p>這就是「自動詞」。</p><p>②　但是  我「看」   我「寫」  我「參加」  我「用」</p><p>這類動詞，如果只有「名詞＋動詞」的話，意思沒辦法清楚傳達。</p><p>我看什麼？  我寫什麼？ 我參加什麼？ 我用什麼？</p><p>少了後面的字，我們很難弄清楚那是什麼意思。</p><p>在動詞後面要加上「受詞」，意思才完整。</p><p>例如: 我看小説   我寫字  我參加話劇  我用電腦</p><p>「小説、字、話劇、電腦」就是受詞</p><p>上述這類型動詞，就是「他動詞」。</p><p>自動詞 : 不需要加上其他詞彙。</p><p>他動詞 : 要加上其他詞彙，意思才完整。</p><p>如果你的英文能力不錯的話，也可以用以下方式進行理解:</p><p>自動詞 :</p><p>英文的不及物動詞。意思就是動詞後面不用有東西。</p><p>他動詞 :</p><p>英文的及物動詞。意思就是動詞後面要有東西在才行。</p><p>將剛才的中文舉例，翻譯成日文的話，就會變成 :</p><p>自動詞: 「私は走る」、「私は歩く」、「私は怒る」、「私は泣く」。</p><p>他動詞：「私は小説を読む」「私は字を書く」、</p><p>「私はパソコンを使う」。</p><p>自他動詞用法</p><p>基本用法 : 　を　＋　他動詞</p><p>其他助詞　＋　自動詞</p><p>例：</p><p>私は朝起きる。（我早上起床。） 自動詞</p><p>目が覚める。（眼睛睜開。） 自動詞</p><p>朝食を食べる。（吃早飯。） 他動詞</p><p>靴を履く。（穿鞋子。） 他動詞</p><p>学校に行く。（去學校） 自動詞</p><p>バスに乗る。（坐公車。） 自動詞</p><p>人が多くて困る。（人很多，很困擾。） 自動詞</p><p>学校に到着する。（到了學校。） 自動詞</p><p>先生に会う。（和老師見面。） 自動詞</p><p>授業を受ける。（上課。） 他動詞</p><p>先生の話を聞く。（聆聽老師的話。） 他動詞</p><p>宿題を提出する。（交作課。） 他動詞</p><p>先生が先週のテストを配る。</p><p>（老師發回上週的考卷。） 他動詞</p><p>クラスメイトがすごく心配する。</p><p>（班上同學都非常擔心。） 自動詞</p><p>【補充】例外情況</p><p>當表示「通過地點」時，自動詞前方也會用「を」。</p><p>例：</p><p>空を飛ぶ。（飛過天空。）</p><p>道を渡る。（穿越馬路。）</p><p>廊下を走る。（跑過走廊。）</p><p>區別自他動詞的方法</p><p>一般情況下，同一種意思的動詞，可能會同時有「自動詞」「他動詞」二種形態，</p><p>例如:</p><p>転がる／転がす　 流れる／流す　　外れる／外す</p><p>照る／照らす　　  動く／動かす　　回る／回す</p><p>這時，如何區分其意思，就變得十分關鍵。</p><p>區別自他動詞的方法，有三種:</p><p>①　依據經驗</p><p>②　依據前面的助詞</p><p>③　依據固定的音韻變化</p><p>①　待日文學習到一定程度，累積到一定語彙量後，就會知道哪些是自動詞、哪些是他動詞。不過這是廢話，說了等於沒說，必須得以時間慢慢磨，沒有任何技巧性可言。</p><p>②　以動詞前面出現的助詞來區分。</p><p>他動詞 : 前方一般會出現助詞「を」。</p><p>自動詞 : 前方一般會出現其他助詞（例：に、が）。</p><p>偶有例外，如前面所述。</p><p>這個方法容易理解、準確率也很高。但是有一個缺點：如果動詞單獨出現，前面沒有助詞可供參考的話，那麼就無從判斷起了。</p><p>③　自動詞和他動詞之間的音韻變化，具有一定的規律性，可以從其發音的變化，來判斷及記憶自動詞和他動詞。</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「門開了」以門的變化為焦點，應說？","options":["ドアが開きました。","ドアを開きましたです。","ドアが開けました。","ドアに開けました。"],"answer":0,"explanation":"自動詞開く，主語ドア以が標示。"},{"prompt":"「我把門打開了」應說？","options":["私はドアが開きました。","私はドアを開けました。","私はドアに開けました。","私はドアで開けました。"],"answer":1,"explanation":"他動詞開ける，直接對象用を。"},{"prompt":"「公園を歩く」中的歩く是？","options":["因有を所以必是他動詞","名詞","自動詞，を標示行經場所","形容詞"],"answer":2,"explanation":"這裡を不是直接受詞標記，不能只靠を判斷自他。","rubyView":{"prompt":"「<ruby>公園<rt>こうえん</rt></ruby>を<ruby>歩<rt>ある</rt></ruby>く」中的歩く是？","options":["因有を所以必是他動詞","名詞","自動詞，を標示行經場所","形容詞"],"explanation":"這裡を不是直接受詞標記，不能只靠を判斷自他。"}},{"prompt":"電気を＿＿：把燈關掉。","options":["消える","閉まる","入る","消す"],"answer":3,"explanation":"消す是關掉的他動詞；消える描述燈熄掉。"}]},{"id":43,"title":"動詞意向形與計劃的說法","symbol":"しよう","intro":"表達邀請、意願、打算與預定安排。","tag":"意向形・つもり・予定","concepts":[["意向形：邀請，也能表意志","第一類<mark class=\"study-key\">う段→お段＋う</mark>；第二類<mark class=\"study-key\">去る＋よう</mark>。する→しよう；来る→来よう（こよう）。","<ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>もう。<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べよう。","讀吧／吃吧。它也叫意志形，不只表示邀請；一人自言自語也可說今日は早く寝よう。"],["意向形＋と思う：打算","表達準備去做的意向，和たい的「想要」焦點不同，不只是更委婉的同義詞。","<ruby>来年<rt>らいねん</rt></ruby>、<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>こうと<ruby>思<rt>おも</rt></ruby>っています。","我<mark class=\"study-key\">打算</mark>明年去日本。行く→行こう，再接と思っています。"],["つもり：個人打算","辭書形／ない形＋<mark class=\"study-key\">つもり</mark>です。知道他人的<mark class=\"study-key\">打算</mark>時，也可以描述第三人稱。","<ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>家<rt>いえ</rt></ruby>で<ruby>勉強<rt>べんきょう</rt></ruby>するつもりです。","週末<mark class=\"study-key\">打算</mark>在家讀書。不是只有「我」才能用；也不是固定低於某個確定百分比。"],["予定：安排或預定","辭書形＋<mark class=\"study-key\">予定</mark>です；名詞＋の<mark class=\"study-key\">予定</mark>です。側重安排、日程，不保證100%不會改變。","<ruby>来週<rt>らいしゅう</rt></ruby>、<ruby>友達<rt>ともだち</rt></ruby>と<ruby>会<rt>あ</rt></ruby>う<ruby>予定<rt>よてい</rt></ruby>です。","下週預定和朋友見面。<mark class=\"study-key\">つもり</mark>偏向打算，予定偏向安排。"],["否定位置的差別","行かない<mark class=\"study-key\">つもり</mark>：<mark class=\"study-key\">打算</mark>不去。行くつもりはない：沒有去的打算。行く予定はない：沒有去的安排。","<ruby>今年<rt>ことし</rt></ruby>は<ruby>引っ越<rt>ひっこ</rt></ruby>す<ruby>予定<rt>よてい</rt></ruby>はありません。","今年沒有搬家的<mark class=\"study-key\">安排</mark>；不代表永遠不搬。"]],"caution":"ましょう也能對朋友使用；是否自然看場合和語氣。<mark class=\"study-key\">意向形</mark>不等於每次都邀請多人，<mark class=\"study-key\">つもり</mark>／予定也不是固定的機率差。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">表達邀請、意願、<mark class=\"study-key\">打算</mark>與預定<mark class=\"study-key\">安排</mark>。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">原形／詞類</th><th scope=\"col\">意向形</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>第一類書く</td><td><ruby>書<rt>か</rt></ruby>こう</td><td>く→こ＋う</td></tr><tr><td>第一類待つ</td><td><ruby>待<rt>ま</rt></ruby>とう</td><td>つ→と＋う</td></tr><tr><td>第二類見る</td><td><ruby>見<rt>み</rt></ruby>よう</td><td><ruby>去<rt>さ</rt></ruby>る＋よう</td></tr><tr><td>する</td><td><mark class=\"study-key\">しよう</mark></td><td>特別記</td></tr><tr><td><ruby>来<rt>く</rt></ruby>る</td><td><ruby>来<rt>こ</rt></ruby>よう（こよう）</td><td>讀音改變</td></tr><tr><td>名詞＋<mark class=\"study-key\">予定</mark></td><td><ruby>旅行<rt>りょこう</rt></ruby>の<ruby>予定<rt>よてい</rt></ruby></td><td>名詞加の</td></tr></tbody></table></div><h3>意向形：邀請，也能表意志</h3><p>第一類<mark class=\"study-key\">う段→お<ruby>段<rt>だん</rt></ruby>＋う；第二類<mark class=\"study-key\">去る＋よう</mark>。する→しよう；<ruby>来<rt>く</rt></ruby>る→<ruby>来<rt>こ</rt></ruby>よう（こよう）。</p><p lang=\"ja\"><ruby>読<rt>よ</rt></ruby>む → <ruby>読<rt>よ</rt></ruby>もう。<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べよう。</p><p>讀吧／吃吧。它也叫意志形，不只表示邀請；一人自言自語也可說今日は早く寝よう。</p><h3>意向形＋と思う：打算</h3><p>表達準備去做的意向，和たい的「想要」焦點不同，不只是更委婉的同義詞。</p><p lang=\"ja\"><ruby>来年<rt>らいねん</rt></ruby>、<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>こうと<ruby>思<rt>おも</rt></ruby>っています。</p><p>我<mark class=\"study-key\">打算</mark>明年去日本。<ruby>行<rt>い</rt></ruby>く→行こう，再接と思っています。</p><h3>つもり：個人打算</h3><p>辭書形／ない形＋つもりです。知道他人的<mark class=\"study-key\">打算</mark>時，也可以描述第三人稱。</p><p lang=\"ja\"><ruby>週末<rt>しゅうまつ</rt></ruby>は<ruby>家<rt>いえ</rt></ruby>で<ruby>勉強<rt>べんきょう</rt></ruby>するつもりです。</p><p>週末<mark class=\"study-key\">打算</mark>在家讀書。不是只有「我」才能用；也不是固定低於某個確定百分比。</p><h3>予定：安排或預定</h3><p>辭書形＋<ruby>予定<rt>よてい</rt></ruby>です；名詞＋の<mark class=\"study-key\">予定</mark>です。側重安排、日程，不保證100%不會改變。</p><p lang=\"ja\"><ruby>来週<rt>らいしゅう</rt></ruby>、<ruby>友達<rt>ともだち</rt></ruby>と<ruby>会<rt>あ</rt></ruby>う<ruby>予定<rt>よてい</rt></ruby>です。</p><p>下週預定和朋友見面。つもり<ruby>偏向<rt>へんこう</rt></ruby><ruby>打算<rt>ださん</rt></ruby>，<ruby>予定<rt>よてい</rt></ruby><ruby>偏向<rt>へんこう</rt></ruby><ruby>安<rt>やす</rt></ruby><ruby>排<rt>はい</rt></ruby>。</p><h3>否定位置的差別</h3><p><ruby>行<rt>い</rt></ruby>かないつもり：打算不去。<ruby>行<rt>い</rt></ruby>くつもりはない：沒有去的打算。<ruby>行<rt>い</rt></ruby>く<ruby>予定<rt>よてい</rt></ruby>はない：沒有去的安排。</p><p lang=\"ja\"><ruby>今年<rt>ことし</rt></ruby>は<ruby>引っ越<rt>ひっこ</rt></ruby>す<ruby>予定<rt>よてい</rt></ruby>はありません。</p><p>今年沒有搬家的安排；不代表永遠不搬。</p><h3>再看幾個例子</h3><p><ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ろう。＝一起回去吧。<br><ruby>少<rt>すこ</rt></ruby>し<ruby>休<rt>やす</rt></ruby>もうと<ruby>思<rt>おも</rt></ruby>います。＝我打算休息一下。<br><ruby>妹<rt>いもうと</rt></ruby>は<ruby>留学<rt>りゅうがく</rt></ruby>するつもりだと<ruby>言<rt>い</rt></ruby>っています。＝妹妹說她打算留學。<br><ruby>会議<rt>かいぎ</rt></ruby>は三<ruby>時<rt>じ</rt></ruby>からの<ruby>予定<rt>よてい</rt></ruby>です。＝會議預定三點開始。</p><h3>容易混淆的地方</h3><p>ましょう也能對朋友使用；是否自然看場合和語氣。意向形不等於每次都邀請多人，つもり／予定也不是固定的機率差。</p>","uploadedOriginal":"<p>[單元43] 動詞邀請形和願望的說法</p><p>學習目標</p><p>①　學會表示邀請的「動詞邀請形」</p><p>②　學會表示願望的句型「動詞邀請形＋と思う」</p><p>③　學會表示計劃的句型「～つもり」</p><p>④　學會表示計劃的句型「～予定」</p><p>本單元的學習重點有三個，分別是「動詞邀請形」的用法、表示願望的「～つもり」、以及表示計劃的「～予定」用法。其中，後二種用法經常容易搞混。</p><p>首先是「動詞邀請形」。我想應該沒有人聽過這個專有名詞，因為「動詞邀請形」這個名字是我們自己取的，原名是「動詞意志形」或「動詞意向形」，功能是表示自己強烈的個人意志……不過這種敘述誰看得懂呢？</p><p>簡單來說 :</p><p>「動詞邀請形」＝「～ましょう」的「常体」形態</p><p>「～ましょう」這個用法相信大家都很熟悉，相當於中文的「 一起…吧」，例如「ご飯を食べましょう（一起吃飯吧）、日本に行きましょう（一起去日本吧）」，常用來邀請別人一起做什麼樣的事情。但是這個「～ましょう」是由「～ます」變來的，屬於所謂的「敬体」，可以用於老師或上司長輩，但是卻不能用於你的家人或朋友，因此我們需要「常体」形態的「～ましょう」，這個東西就是「動詞邀請形」，意思完全相同，只是正式程度不同。</p><p>另外，我們也將介紹「動詞邀請形＋と思う」句型，這個句型基本上和「～たい」相同，用來表達個人的希望和願望，只是聽起來比較委婉。</p><p>本單元的另一個重點，則是學習「計劃」的說法，例如「我計劃週末去玩」「明天預定和部長吃飯」等等語句。日文當中，則是使用「つもり」和「予定」這二項句型表示。</p><p>「つもり」: 表示僅止於自己心裡計劃，並未確定100%會執行。相當於中文的「我計劃…」。</p><p>「予定」:  表示已經確定會進行的計劃。相當於中文的「我預定…」。</p><p>以下將進行更詳細的解說。</p><p>動詞邀請形</p><p>「動詞邀請形」和「ましょう」的意思相同，都是表示「一起…吧」的意思，唯一不同的地方在於，「ましょう」屬於「敬体」，一般用於師長上司等地位比自己高的人，「動詞邀請形」屬於「常体」，可以用於家人朋友同事等等上面。</p><p>例：</p><p>ご飯を食べましょう。ご飯を食べよう。（一起吃飯吧）</p><p>海外旅行に行きましょう。海外旅行に行こう。</p><p>（一起去國外旅行吧）</p><p>動詞變化方法</p><p>第一類動詞</p><p>將動詞字尾的發音「u」改成「o」 之後，加上「う」。</p><p>例：</p><p>貸す　Kasu →　貸そ  Kaso　→　貸そう　　（借吧）</p><p>書く　Kaku →　書こ  Kako　→　書こう     （寫吧）</p><p>泳ぐ　Oyogu →　泳ご  Oyogo　→　泳ごう  （游泳吧）</p><p>言う　Iu →　言お  Io　→　言おう          （說吧）</p><p>待つ　Matsu →　待と  mato　→　待とう     （等吧）</p><p>帰る　Kaeru →　帰ろ  Kaero　→　帰ろう  （回家吧）</p><p>読む　Yomu →　読も  Yomo　→　読もう     （讀書吧）</p><p>第二類動詞</p><p>將動詞字尾的「る」改成「よう」即可。</p><p>食べる　→　食べよう      （吃吧）</p><p>着る　  →　着よう        （穿吧）</p><p>忘れる　→　忘れよう      （忘記吧）</p><p>寝る　  →　寝よう         （睡吧）</p><p>開ける　→　開けよう       （打開吧）</p><p>見る　  →　見よう　       （看吧）</p><p>不規則動詞</p><p>する　→　しよう               （做…吧）</p><p>勉強する　→　勉強しよう   （讀書吧）</p><p>来る　→　来よう               （來吧）注意發音</p><p>動詞邀請形＋と思う</p><p>「動詞邀請形＋と思う」為「一起…」加上「我覺得」之意，直譯是「我覺得要一起…」，其實就是中文「我打算…」的意思。「動詞邀請形＋と思う」和我們之前學過的「～たい」意思相似，都是用來表示自己的想法和願望。不同的地方在於，「～たい」給人感覺非常直接，「動詞邀請形＋と思う」則比較委婉，適合用在較正式的場合中。</p><p>「～たい」:  我想要… 。語氣較直接。</p><p>「動詞邀請形＋と思う」：我打算要…。語氣較間接。</p><p>例：</p><p>私は日本に行きたい。          （我想去日本。）</p><p>私は日本に行こうと思う。      （我打算去日本。）</p><p>私は新しい部屋を買いたい。    （我想買新房子。）</p><p>私は新しい部屋を買おうと思う。 （我打算買新房子。）</p><p>基本用法 :  動詞邀請形＋と思う 。</p><p>（我打算要…）</p><p>例：</p><p>あのことを忘れようと思う。</p><p>（打算忘記那件事。）</p><p>新しい服を着ようと思う。</p><p>（打算穿新衣服。）</p><p>小説を書こうと思う。</p><p>（打算寫小說。）</p><p>ノートパソコンを買おうと思う。</p><p>（打算買電腦。）</p><p>朝まで仕事しようと思う。</p><p>（打算工作到早上。）</p><p>道子さんと一緒に来ようと思った。</p><p>（本來打算和道子小姐一起來。）</p><p>つもり・予定</p><p>「つもり」和「予定」，都是用來表示「計劃」的說法，描述今後想要進行的動作或事情。區別在於 :</p><p>「つもり」: 表示僅止於自己心裡計劃，並未確定100％會執行。相當於中文的「我計劃…」。</p><p>由於是表示自己的心裡想法，因此一般只用於第一人稱「我」。</p><p>「予定」:  表示已經確定會進行的計劃。</p><p>相當於中文的「我預定…」。</p><p>基本用法 : 動詞原形・ない形　＋　つもり／予(よ)定(てい)</p><p>例：</p><p>私は今晩カレーを食べるつもり／予定だ。</p><p>（我計劃／預定今晚吃咖哩。）</p><p>私は先生と食事に行くつもり／予定だ。</p><p>（我計劃／預定和老師去吃飯。）</p><p>徹夜で仕事をするつもり／予定だ。</p><p>（我計劃／預定熬夜工作。）</p><p>朝６時に起きるつもり／予定だ。</p><p>（我計劃／預定早上六點起來。）</p><p>？　父は新しいノートパソコンを購入するつもりだ。</p><p>○　父は新しいノートパソコンを購入する予定だ。</p><p>（爸爸預定購買新的筆電。） つもり一般只用於第一人稱</p><p>？　手嶋さんは７月に日本語検定を受けるつもりだ。</p><p>○　手嶋さんは７月に日本語検定を受ける予定だ。</p><p>（手嶋先生預定七月參加日語檢定。）</p><p>つもり一般只用於第一人稱</p><p>比較需要注意的是，「つもり」和「予定」的否定用法。</p><p>否定用法 :</p><p>①　動詞否定形　＋　つもり／予定だ</p><p>（我計劃／預定不要…）</p><p>②　動詞常体　＋　つもり／予定　＋はない。</p><p>（我沒有…的計劃／預定）</p><p>不同之處在於，第一句的否定語氣較弱，第二句的否定語氣則較為強烈。</p><p>請對照下列例句的中文翻譯，相信並不難理解。</p><p>例：</p><p>私はパーティーに行かないつもりだ。</p><p>（我打算不去參加派對。）</p><p>私はパーティーに行かない予定だ。</p><p>（我預計不去參加派對。）</p><p>私はパーティーに行くつもりはない。</p><p>（我沒有去參加派對的打算。） 語氣較強烈</p><p>私はパーティーに行く予定はない。</p><p>（我沒有預定要去參加派對。）  語氣較強烈</p><p>徹夜で仕事をしないつもりだ。</p><p>（我打算不熬夜工作。）</p><p>徹夜で仕事をしない予定だ。</p><p>（我預計不熬夜工作。）</p><p>徹夜で仕事をするつもりはない。</p><p>（我沒有熬夜工作的打算。）  語氣較強烈</p><p>徹夜で仕事をする予定はない。</p><p>（我沒有預定要熬夜工作。）   語氣較強烈</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"第一類書く的意向形是？","options":["書こう","書きよう","書くよう","書けよう"],"answer":0,"explanation":"く換お段こ，再加う。"},{"prompt":"来よう的讀音是？","options":["きよう","こよう","くよう","くらよう"],"answer":1,"explanation":"来る的意向形讀こよう。"},{"prompt":"「打算不去」應說？","options":["行ったつもりです。","行く予定です。","行かないつもりです。","行くことがあります。"],"answer":2,"explanation":"ない形＋つもり表示打算不做。"},{"prompt":"つもり與予定的差別，哪項較合適？","options":["前者只能第一人稱","後者永不改變","完全沒有差別","前者偏意向，後者偏安排"],"answer":3,"explanation":"兩者焦點不同，不能用固定百分比區分。"}]},{"id":44,"title":"建議和推測的說法","symbol":"でしょう","intro":"提出建議，並分清「可能」和「大概」。","tag":"ほうがいい・かもしれない・でしょう","concepts":[["たほうがいい：做比較好","<mark class=\"study-key\">た形＋ほうがいい</mark>です，常用於具體<mark class=\"study-key\">建議</mark>；不是說對方已經做了。","<ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>たほうがいいです。","早點睡比較好。寝る→寝た→寝たほうがいい；語氣有時較強，留意關係。"],["ないほうがいい：不做比較好","<mark class=\"study-key\">ない形＋ほうがいい</mark>です。直接把肯定<mark class=\"study-key\">建議</mark>改成否定動作。","<ruby>夜<rt>よる</rt></ruby><ruby>遅<rt>おそ</rt></ruby>くコーヒーを<ruby>飲<rt>の</rt></ruby>まないほうがいいです。","夜深時最好不要喝咖啡。飲む→飲まない，再接ほうがいい。"],["かもしれない：有可能","動詞／い形容詞普通形直接接；名詞／な形容詞非過去肯定<mark class=\"study-key\">不加だ</mark>。禮貌形<mark class=\"study-key\">かもしれません</mark>。","<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>かもしれません。","明天可能下雨。不是雨だ<mark class=\"study-key\">かもしれません</mark>；可依據資訊推測，不限於直覺。"],["だろう／でしょう：大概……吧","動詞／い形容詞普通形直接接；名詞／な形容詞非過去肯定<mark class=\"study-key\">不加だ</mark>。<mark class=\"study-key\">でしょう</mark>較禮貌。","<ruby>明日<rt>あした</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いでしょう。","明天大概很冷吧。推測不是客觀事實，也沒有固定機率。"],["だろうと思う：我想大概","把推測內容當作自己的想法來說。通常用<mark class=\"study-key\">だろう</mark>と思います，不用<mark class=\"study-key\">でしょう</mark>と思います作基本接法。","<ruby>彼<rt>かれ</rt></ruby>はもうすぐ<ruby>来<rt>く</rt></ruby>るだろうと<ruby>思<rt>おも</rt></ruby>います。","我想他大概快來了。不是雙重推測就必然更正確或更客氣。"]],"caution":"ほうがいい的た形是句型接法，不代表已發生。<mark class=\"study-key\">かもしれない</mark>、<mark class=\"study-key\">でしょう</mark>並非精確的機率刻度；でしょう也可能依語調用來確認。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">提出<mark class=\"study-key\">建議</mark>，並分清「可能」和「大概」。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">意思</th><th scope=\"col\">句型</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td><mark class=\"study-key\">建議</mark>做</td><td>た形＋ほうがいい</td><td><ruby>休<rt>やす</rt></ruby>んだほうがいい</td></tr><tr><td><mark class=\"study-key\">建議</mark>不做</td><td>ない形＋ほうがいい</td><td><ruby>行<rt>い</rt></ruby>かないほうがいい</td></tr><tr><td>可能</td><td><ruby>普通<rt>ふつう</rt></ruby>形＋かもしれない</td><td><ruby>来<rt>く</rt></ruby>るかもしれない／<ruby>学生<rt>がくせい</rt></ruby>かもしれない</td></tr><tr><td>大概</td><td><ruby>普通<rt>ふつう</rt></ruby>形＋でしょう</td><td><ruby>来<rt>く</rt></ruby>るでしょう／<ruby>静<rt>しず</rt></ruby>かでしょう</td></tr></tbody></table></div><h3>たほうがいい：做比較好</h3><p>た形＋ほうがいいです，<ruby>常用<rt>じょうよう</rt></ruby>於具體建議；不是說對方已經做了。</p><p lang=\"ja\"><ruby>早<rt>はや</rt></ruby>く<ruby>寝<rt>ね</rt></ruby>たほうがいいです。</p><p>早點睡比較好。<ruby>寝<rt>ね</rt></ruby>る→<ruby>寝<rt>ね</rt></ruby>た→<ruby>寝<rt>ね</rt></ruby>たほうがいい；語氣有時較強，留意關係。</p><h3>ないほうがいい：不做比較好</h3><p>ない形＋ほうがいいです。直接把肯定<mark class=\"study-key\">建議</mark>改成否定動作。</p><p lang=\"ja\"><ruby>夜<rt>よる</rt></ruby><ruby>遅<rt>おそ</rt></ruby>くコーヒーを<ruby>飲<rt>の</rt></ruby>まないほうがいいです。</p><p>夜深時最好不要喝咖啡。<ruby>飲<rt>の</rt></ruby>む→飲まない，再接ほうがいい。</p><h3>かもしれない：有可能</h3><p>動詞／い形容詞普通形直接接；名詞／な形容詞非過去肯定<mark class=\"study-key\">不加だ</mark>。禮貌形かもしれません。</p><p lang=\"ja\"><ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>かもしれません。</p><p>明天可能下雨。不是雨だかもしれません；可依據資訊推測，不限於直覺。</p><h3>だろう／でしょう：大概……吧</h3><p>動詞／い形容詞普通形直接接；名詞／な形容詞非過去肯定不加だ。でしょう較禮貌。</p><p lang=\"ja\"><ruby>明日<rt>あした</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いでしょう。</p><p>明天大概很冷吧。推測不是客觀事實，也沒有固定機率。</p><h3>だろうと思う：我想大概</h3><p>把推測內容當作自己的想法來說。通常用だろうと思います，不用でしょうと思います作基本接法。</p><p lang=\"ja\"><ruby>彼<rt>かれ</rt></ruby>はもうすぐ<ruby>来<rt>く</rt></ruby>るだろうと<ruby>思<rt>おも</rt></ruby>います。</p><p>我想他大概快來了。不是雙重推測就必然更正確或更客氣。</p><h3>再看幾個例子</h3><p>この<ruby>本<rt>ほん</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しいかもしれません。＝這本書可能很難。<br><ruby>彼<rt>かれ</rt></ruby>は<ruby>来<rt>こ</rt></ruby>ないかもしれません。＝他可能不來。<br><ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みでしょう。＝明天大概放假吧。<br>今、何をしているんだろう。＝現在在做甚麼呢？だろう也可表自問。</p><h3>容易混淆的地方</h3><p>ほうがいい的た形是句型接法，不代表已發生。かもしれない、でしょう並非精確的機率刻度；でしょう也可能依語調用來確認。</p>","uploadedOriginal":"<p>[單元44] 建議和推測的說法</p><p>學習目標</p><p>①  學習表示建議的「動詞た形＋ほうがいい」句型</p><p>②　學習表示推測的「かもしれない」「～だろう」</p><p>本單元將介紹日文會話中常見的「建議」和「推測」說法。</p><p>所謂「建議」，指的是針對他人的疑問，提出自己的看法和意見，像是「你應該怎樣怎樣比較好喔！」、「我覺得應該要怎樣怎樣」之類的句子。日文會話中，習慣使用「動詞た形＋ほうがいい」的句型來表示「給予他人的建議或意見」。</p><p>「ほう」的漢字寫做「方」，為「方面」的意思，因此「ほう が いい」直譯中文就是「這一方面較好」，也就是「這麼做比較好」的建議語氣。</p><p>至於推測用法，在日文中有很多，這可能和日本的民族性格有關係，日本人認為太過主觀、武斷的說法會顯得不客氣、對聽話者不禮貌，同時太過武斷也會有風險，因此很多時候，即使是已經非常肯定的事情，也會傾向使用「推測語氣」來表示。例如，即使降雨機率100％，氣象主播仍會說成「明日は雨が降るでしょう（明天應該會下雨吧）」。</p><p>本單元中，將介紹三種基本的「推測用法」，分別為「かもしれない、だろう、だろうと思う」。「かもしれない」相當於中文的「或許、有可能」之意，「だろう」則和「でしょう」相同，用在表示不確定的情況。「だろうと思う」則是比「だろう」更為間接的講法，「だろう（應該）」加上「と思う（我覺得）」，等於是具有雙重推測的功能，語氣顯得更為委婉。</p><p>詳細介紹請參照以下說明。</p><p>～たほうがいい</p><p>「動詞た形＋ほうがいい」是日文當中經常用來表示建議的句型用法，用於向對方表達自己的主張或是評論。</p><p>「動詞た形＋ほうがいい」由幾個部分組成:</p><p>「動詞た形」＋「ほう」＋「が」＋「いい」</p><p>動作         方面      是       好的</p><p>相當於中文的「這樣做比較好～」。不過必須注意的是，前面的動詞要使用「動詞た形」，聽起來才會有「建議」的感覺。</p><p>基本用法 : 動詞た形・ない形＋ほうがいい　です</p><p>（…這樣做比較好）</p><p>例:</p><p>寝る前に宿題をしたほうがいいですよ。</p><p>（睡覺前最好先寫完作業喔。）</p><p>大学でいろんなサークルに入ってみたほうがいいですよ。</p><p>（在大學中最好多去參加看看不同的社團喔。）</p><p>あまりテレビを見ないほうがいいですよ。</p><p>（最好別看太多電視喔。）</p><p>ファストフードより、</p><p>健康志向の食べ物を食べたほうがいいです。</p><p>（比起速食，多吃點對身體有益的食物比較好喔。）</p><p>アルバイトを沢山するより、</p><p>勉強に専念したほうがいいです。</p><p>（比起打很多工，最好專心唸書比較好喔。）</p><p>部屋は一週間に一回ぐらい</p><p>掃除したほうがいいですよ。</p><p>（最好一星期打掃一次房間喔。）</p><p>推測的說法</p><p>かもしれない</p><p>「かもしれない」為日文中典型表示推測的說法，相當於中文的「或許、應該」，用於句尾。使用範圍很廣泛，可以使用於大多數帶有「或許、應該」語氣的情況下。</p><p>基本用法:</p><p>動詞常体　＋　かもしれない／かもしれません</p><p>（或許、應該）</p><p>例：</p><p>私は明日の打ち上げパーティーに</p><p>行かないかもしれない。</p><p>（我或許不會去明天的慶功宴。）</p><p>今回は内定が取れるかもしれない。</p><p>（這次或許能順利錄取。）</p><p>速ければ、三日以内に商品を手に入れるかもしれない。</p><p>（快的話，或許在三天之內能夠收到商品。）</p><p>彼は将来もしかして総統になれるかもしれない。</p><p>（他將來或許能夠成為總統。）</p><p>沢山レシートを集めると、</p><p>一等賞に当たるかもしれない。</p><p>（收集很多發票的話，說不定就能中頭獎。）</p><p>今日は天気いいから、</p><p>海水浴場に遊びに行く人は多いかもしれない。</p><p>（今天天氣很好，去海水浴場玩的人應該很多。）</p><p>だろう／でしょう</p><p>「だろう／でしょう」常用在「不是很確定、不是很肯定」的情況之下。另外，相較於肯定語氣的「だ／です」，「だろう／でしょう」顯得較為客觀、委婉、有禮貌，因此有時候為了聽起來不那麼主觀，也會使用「だろう／でしょう」。</p><p>例：</p><p>彼は来ます。彼は来るでしょう。</p><p>（他會來／他應該會來吧） 後者較客觀</p><p>先生、大丈夫ですか。先生、大丈夫でしょうか。</p><p>（老師，沒事吧？／老師，您沒事吧？ ） 後者較禮貌</p><p>明日、空いていますか。明日、空いているでしょうか。</p><p>（明天有空嗎？／明天是否有空呢？） 後者較委婉</p><p>基本用法 : （用於句尾）だろう／でしょう。</p><p>（…吧。）</p><p>例 :</p><p>この映画を見た人は沢山いるだろう。</p><p>（看過這部電影的人應該很多吧。）</p><p>有名なコックだから、作る料理は美味しいでしょう。</p><p>（因為是有名的廚師，所以做的菜應該很好吃吧。）</p><p>一番大事なものは何だろう。</p><p>（最重要的東西是什麼呢？）</p><p>休日の学校図書館は普段より静かだろう。</p><p>（假日的學校圖書館應該比平日安靜吧。）</p><p>もう少しで家に帰れるだろう。</p><p>（再過一下就能回家了吧。）</p><p>彼は確かにそういうことを言っただろう。</p><p>（他的確說了那樣的事情吧。）</p><p>だろうと思(おも)う</p><p>「だろうと思う」由剛才介紹過的「だろう」和「と思う」組合而成。其實，「と思う」本身就有一點點推測的意思，</p><p>例:</p><p>明日学校に行く。明日学校に行くと思う。</p><p>（我明天要去學校。我認為明天要去學校。）</p><p>この服を買う。この服を買うと思う。</p><p>（我會買這件衣服。我認為會買這件衣服。）</p><p>因此「だろう」加上「と思う」，等於是使用二種具有推測功能的字彙、有雙重推測的感覺，因此比起單獨使用「だろう」，語氣更為和緩、委婉且客氣。</p><p>另外，由於「と思う」前面只能接「動詞常体」，因此在這個句型中，只能使用「だろう」，而不能使用「でしょう」。</p><p>基本用法 : 動詞常体　だろう　と思う／思います。</p><p>（我認為應該是…）</p><p>例：</p><p>彼はもうすぐ帰るだろうと思います。</p><p>（我認為他應該馬上就會回家了。）</p><p>カレーに蜂蜜を入れたらうまいだろうと思います。</p><p>（我覺得咖哩中加入蜂蜜應該會很好吃。）</p><p>もっと安い値段で買えるだろうと思います。</p><p>（我認為應該能用更便宜的價錢買到。）</p><p>社長は今日本を旅行しているだろうと思います。</p><p>（我認為社長現在應該在日本旅行。）</p><p>これから物価が上がるだろうと思います。</p><p>（我覺得今後物價應該會上漲。）</p><p>雪国の生活は厳しいだろうと思います。</p><p>（我認為雪國的生活應該很辛苦。）</p><p>明日会議に出なければならないだろうと思います。</p><p>（我認為明天應該不得不去開會。）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「早點休息比較好」應說？","options":["早く休んだほうがいいです。","早く休むでした。","早く休みますほうがいいです。","早く休んでほうがいいです。"],"answer":0,"explanation":"具體建議通常用た形＋ほうがいい。"},{"prompt":"「最好別去」應說？","options":["行ったほうがいい","行かないほうがいい","行くほうがない","行ってないほう"],"answer":1,"explanation":"ない形行かない＋ほうがいい。"},{"prompt":"「可能是學生」應說？","options":["学生だかもしれません","学生なかもしれません","学生かもしれません","学生のかもしれません"],"answer":2,"explanation":"名詞非過去肯定直接接かもしれません，不加だ。"},{"prompt":"「明日は寒いでしょう」最自然的理解是？","options":["昨天很冷","必須變冷","絕對不冷","明天大概很冷吧"],"answer":3,"explanation":"でしょう在這裡表示推測，不是百分之百確定。","rubyView":{"prompt":"「<ruby>明日<rt>あした</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いでしょう」最自然的理解是？","options":["昨天很冷","必須變冷","絕對不冷","明天大概很冷吧"],"explanation":"でしょう在這裡表示推測，不是百分之百確定。"}}]},{"id":45,"title":"表示推測的「はず」和「らしい」","symbol":"はず","intro":"把有根據的預期與得知的消息分開表達。","tag":"はず・らしい・否定","concepts":[["はず：按已知資訊，理應……","動詞／い形容詞普通形＋<mark class=\"study-key\">はず</mark>；名詞＋<mark class=\"study-key\">のはず</mark>；な形容詞＋なはず。根據理由推算，不是客觀保證。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>だから、<ruby>銀行<rt>ぎんこう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みのはずです。","今天星期日，銀行照理應該休息。說話者有推論依據，但仍可能判斷錯。"],["らしい：據消息或跡象，似乎……","動詞／い形容詞普通形＋<mark class=\"study-key\">らしい</mark>；名詞／な形容詞非過去肯定直接接<mark class=\"study-key\">らしい</mark>。","<ruby>駅前<rt>えきまえ</rt></ruby>の<ruby>店<rt>みせ</rt></ruby>はおいしいらしいです。","據消息，車站前的店似乎很好吃。不是固定60%確定。"],["はず的兩種否定","来ない<mark class=\"study-key\">はず</mark>：按道理不會來。来る<mark class=\"study-key\">はずがない</mark>：不可能會來，否定可能性較強。","<ruby>彼<rt>かれ</rt></ruby>は<ruby>出張<rt>しゅっちょう</rt></ruby>中なので、ここにいるはずがありません。","他正在出差，所以不可能在這裡。這是說話者依資訊作的判斷。"],["らしい前面也能否定","把推測內容變成否定，再接<mark class=\"study-key\">らしい</mark>：降らない<mark class=\"study-key\">らしい</mark>、学生ではないらしい。","<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないらしいです。","聽消息看來，明天似乎不下雨。否定的是下雨，不是消息來源。"]],"caution":"刪除原筆記把<mark class=\"study-key\">らしい</mark>定為60%、<mark class=\"study-key\">はず</mark>定為90%的說法。かもしれない也能根據證據；はず也能根據間接消息，不以「親眼／非親眼」硬分。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">把有根據的預期與得知的消息分開表達。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">詞類</th><th scope=\"col\">はず</th><th scope=\"col\">らしい</th></tr></thead><tbody><tr><td>動詞</td><td><ruby>来<rt>く</rt></ruby>るはず</td><td><ruby>来<rt>く</rt></ruby>るらしい</td></tr><tr><td>い形容詞</td><td><ruby>高<rt>たか</rt></ruby>いはず</td><td><ruby>高<rt>たか</rt></ruby>いらしい</td></tr><tr><td>な形容詞</td><td><ruby>静<rt>しず</rt></ruby>かなはず</td><td><ruby>静<rt>しず</rt></ruby>からしい</td></tr><tr><td>名詞</td><td><ruby>学生<rt>がくせい</rt></ruby>のはず</td><td><ruby>学生<rt>がくせい</rt></ruby>らしい</td></tr></tbody></table></div><h3>はず：按已知資訊，理應……</h3><p>動詞／い形容詞普通形＋<mark class=\"study-key\">はず</mark>；名詞＋<mark class=\"study-key\">のはず</mark>；な形容詞＋なはず。根據理由推算，不是客觀保證。</p><p lang=\"ja\"><ruby>今日<rt>きょう</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>だから、<ruby>銀行<rt>ぎんこう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みのはずです。</p><p>今天星期日，銀行照理應該休息。說話者有推論依據，但仍可能判斷錯。</p><h3>らしい：據消息或跡象，似乎……</h3><p>動詞／い形容詞普通形＋<mark class=\"study-key\">らしい</mark>；名詞／な形容詞非過去肯定直接接<mark class=\"study-key\">らしい</mark>。</p><p lang=\"ja\"><ruby>駅前<rt>えきまえ</rt></ruby>の<ruby>店<rt>みせ</rt></ruby>はおいしいらしいです。</p><p>據消息，車站前的店似乎很好吃。不是固定60%確定。</p><h3>はず的兩種否定</h3><p><ruby>来<rt>こ</rt></ruby>ないはず：按道理不會來。<ruby>来<rt>く</rt></ruby>るはずがない：不可能會來，否定可能性較強。</p><p lang=\"ja\"><ruby>彼<rt>かれ</rt></ruby>は<ruby>出張<rt>しゅっちょう</rt></ruby>中なので、ここにいるはずがありません。</p><p>他正在出差，所以不可能在這裡。這是說話者依資訊作的判斷。</p><h3>らしい前面也能否定</h3><p>把推測內容變成否定，再接<mark class=\"study-key\">らしい</mark>：<ruby>降<rt>ふ</rt></ruby>らないらしい、<ruby>学生<rt>がくせい</rt></ruby>ではないらしい。</p><p lang=\"ja\"><ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>らないらしいです。</p><p>聽消息看來，明天似乎不下雨。否定的是下雨，不是消息來源。</p><h3>再看幾個例子</h3><p><ruby>田中<rt>たなか</rt></ruby>さんは<ruby>大学生<rt>だいがくせい</rt></ruby>のはずです。＝田中照理應該是大學生。<br>この<ruby>図書館<rt>としょかん</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かなはずです。＝這間圖書館照理應該安靜。<br><ruby>友達<rt>ともだち</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>では、あの<ruby>店<rt>みせ</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>も<ruby>開<rt>ひら</rt></ruby>いているらしいです。＝據朋友說，那家店似乎星期日也營業。<br>名詞＋らしい也可能表示「具有典型特質」，例如春らしい天気（很有春天感的天氣），須看語境。</p><h3>容易混淆的地方</h3><p>刪除原筆記把らしい定為60%、はず定為90%的說法。かもしれない也能根據證據；はず也能根據間接消息，不以「親眼／非親眼」硬分。</p>","uploadedOriginal":"<p>[單元45] 表示推測的「はず」和「らしい」</p><p>學習目標</p><p>①　學習日文中表示推測的「はず」及其句型用法</p><p>②　學習日文中表示推測的「らしい」及其句型用法</p><p>本單元算是前一單元的延伸，前一單元我們介紹了日文中表示推測的「かもしれない」用法，在本單元，我們將繼續補充另外二種「表示推測語氣」的句型，分別是「はず」和「らしい」。</p><p>那麼這二個推測用法，和「かもしれない」有什麼不同呢？為什麼我們還得另外學習呢？不能直接用「かもしれない」一招打遍天下嗎？</p><p>我們先前學過的「かもしれない」，翻成中文相當於「或許」的意思，如果解釋地更詳細，就是「憑自己的感覺進行猜測」之意，猜得中猜不中不知道，反正就是憑自己的直覺、覺得「或許就是那個樣子」。但是本單元要學的「はず」和「らしい」，則是「根據得到的情報資訊，進行有憑有據的推測」，一個是猜測、一個是推測，一個憑自己感覺、一個憑事實證據。可以整理如下:</p><p>「かもしれない」：以自己的感覺進行推測。正確機率低。</p><p>「らしい」：</p><p>根據間接得到的情報資訊，進行推測。正確機率為60％。</p><p>「はず」：</p><p>根據直接得到、或是可信度很高的情報資訊，進行推測。正確機率為90％。</p><p>舉例來說，如果今天早上起來，由於昨晚下大雨、因此你直覺今天也會下雨的時候，可以說「今日は雨が降るかもしれない」。如果你轉開電視，氣象預報說今天可能會下雨，則可以說「今日は雨が降るらしい（間接情報）」。</p><p>如果你走出去，發現天空黑壓壓的一片，根本就是暴風雨要來的前兆，這時就可以說「今日は雨が降るはずだ。（直接且正確度高的情報）」。</p><p>詳細的文法和例句解說，請參照以下內容。</p><p>らしい</p><p>「らしい」用於表示推測語氣，通常為根據間接得到的情報資訊進行推測，正確機率約為60％。相當於中文的「看起來應該…」。如果是根據某項資訊進行猜測，但又不是十分確定的話，就可以使用「らしい」。</p><p>基本用法:</p><p>動詞常体・名詞・形容詞　＋　らしい　です。</p><p>（似乎…）</p><p>例：</p><p>明日は雨が降るらしいです。</p><p>（明天似乎會下雨。）</p><p>彼は学生らしいです。</p><p>（他似乎是學生。）</p><p>駅前のラーメン屋はおいしいらしいです。</p><p>（車站前面的拉麵店似乎很好吃。）</p><p>藤木さんは綾瀬さんのことを諦めたらしいです。</p><p>（藤木先生似乎已經放棄追求綾瀨小姐了。）</p><p>弟は卒業旅行はタイランドに行ったらしいです。</p><p>（弟弟畢業旅行似乎去的是泰國。）</p><p>山田さんは女の子にモテるらしいです。</p><p>（山田先生似乎很受女生歡迎。）</p><p>否定用法，則是將「らしい」前面的字詞改為否定形態就可以了。</p><p>否定用法:</p><p>動詞常体・名詞・形容詞の否定形＋らしい　です。</p><p>（似乎不…）</p><p>例：</p><p>明日は雨が降るらしいです。</p><p>（明天似乎會下雨。）</p><p>明日は雨が降らないらしいです。</p><p>（明天似乎不會下雨。）</p><p>彼は学生らしいです。</p><p>（他似乎是學生。）</p><p>彼は学生ではないらしいです。</p><p>（他似乎不是學生。）</p><p>駅前のラーメン屋はおいしいらしいです。</p><p>（車站前的拉麵店似乎很好吃。）</p><p>駅前のラーメン屋はおいしくないらしいです。</p><p>（車站前的拉麵店似乎不好吃。）</p><p>藤木さんは綾瀬さんのことを諦めたらしいです。</p><p>（藤木先生似乎已經放棄追求綾瀨小姐了。）</p><p>藤木さんは綾瀬さんのことを諦めていないらしいです。</p><p>（藤木先生似乎還沒放棄追求綾瀨小姐。）</p><p>はず</p><p>「はず」同樣用於表示推測語氣，表示根據直接得到、或是根據可信度很高的情報資訊進行推測，正確機率約90%，相當於中文的「理應…」。如果你對於某項推測很有自信，覺得八九不離十了，就可以使用「はず」。換句話說，「はず」一般用在幾乎百分之分肯定的情況，如果你不太確定，那麼就必須換成「かもしれない」或是「らしい」。</p><p>基本用法:</p><p>動詞常体・い形容詞　＋　はず　だ／です。</p><p>な形容詞　＋　なはず　だ／です。</p><p>名詞　＋　のはず　だ／です。</p><p>（照理說應該…）</p><p>例：</p><p>明日は雨が降るはずです。</p><p>（明天照理說應該會下雨。）</p><p>彼は学生のはずです。</p><p>（他照理說應該是學生。）</p><p>駅前のラーメン屋はおいしいはずです。</p><p>（車站前的拉麵店照理說應該很好吃。）</p><p>藤木さんは綾瀬さんのことを諦めたはずです。</p><p>（藤木先生照理說應該已經放棄追求綾瀨小姐了。）</p><p>弟は卒業旅行はタイランドに行ったはずです。</p><p>（弟弟照理說畢業旅行應該去了泰國。）</p><p>山田さんは女の子にモテるはずです。</p><p>（山田先生照理說應該很受女生歡迎。）</p><p>「はず」的否定用法有二種，和先前介紹過的「つもり」相似，一種語氣較弱，一種語氣較強。</p><p>否定用法:</p><p>①</p><p>動詞常体・名詞・形容詞の否定形＋はず　だ／です。</p><p>（照理說應該不…）</p><p>②  動詞常体・い形容詞　＋　はず　が　ない。</p><p>な形容詞　＋　なはず　が　ない。</p><p>名詞　＋　のはず　が　ない。</p><p>（照理說不可能…）  語氣較強烈</p><p>例：</p><p>明日は雨が降るはずだ。</p><p>（明天照理說應該會下雨。）</p><p>明日は雨が降らないはずだ。</p><p>（明天照理說應該不會下雨。）</p><p>明日は雨が降るはずがない。</p><p>（明天照理說不會有下雨的可能。） 語氣較強烈</p><p>駅前のラーメン屋はおいしいはずだ。</p><p>（車站前的拉麵店照理說應該很好吃。）</p><p>駅前のラーメン屋はおいしくないはずだ。</p><p>（車站前的拉麵店照理說應該不好吃。）</p><p>駅前のラーメン屋はおいしいはずがない。</p><p>（車站前的拉麵店照理說不會有好吃的可能。）語氣較強烈</p><p>山田さんは女の子にモテるはずだ。</p><p>（山田先生照理說應該很受女生歡迎。）</p><p>山田さんは女の子にモテないはずだ。</p><p>（山田先生照理說應該不受女生歡迎。）</p><p>山田さんは女の子にモテるはずがない。</p><p>（山田先生照理說沒有受女生歡迎的可能。）語氣較強烈</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「照理應該是學生」應說？","options":["学生のはずです","学生だはずです","学生なはずです","学生はずです"],"answer":0,"explanation":"名詞接のはず。"},{"prompt":"らしい的確定程度可以固定為60%嗎？","options":["可以","不可以，文法沒有固定百分比","固定為90%","固定為100%"],"answer":1,"explanation":"確定程度取決於資訊、語境和說話者，不能套固定數字。"},{"prompt":"「不可能會來」應說？","options":["来ないはずだ","来るかもしれない","来るはずがない","来るらしい"],"answer":2,"explanation":"来るはずがない否定「會來」的可能。"},{"prompt":"静か接はず的正確形式是？","options":["静かのはず","静かだはず","静かいはず","静かなはず"],"answer":3,"explanation":"な形容詞接なはず。"}]},{"id":46,"title":"命令和禁止的說法","symbol":"待て","intro":"看懂強烈命令，也懂得按場合選擇請求方式。","tag":"命令形・なさい・辭書形＋な","concepts":[["第一類命令形：う段→え段","書く→書け；読む→読め；待つ→待て；帰る→帰れ。只換字尾，<mark class=\"study-key\">不加る</mark>。","<ruby>危<rt>あぶ</rt></ruby>ない！<ruby>止<rt>と</rt></ruby>まれ！","危險！停下！<mark class=\"study-key\">強烈命令</mark>可出現在緊急情境，不限於責罵。"],["第二類和不規則","第二類<mark class=\"study-key\">去る＋ろ</mark>：食べろ、見ろ。する→<mark class=\"study-key\">しろ</mark>（也有せよ）；来る→来い（こい）。","こっちを<ruby>見<rt>み</rt></ruby>ろ。","看這邊。命令形通常很強，日常請求可用見てください。"],["ます去ます＋なさい","常用於家長、老師等下達指示；男女都可用，也不適合當作對長輩的普遍禮貌請求。","<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>きなさい。","寫名字。書きます→書き＋<mark class=\"study-key\">なさい</mark>，仍帶命令語氣。"],["辭書形＋な：禁止","直接用<mark class=\"study-key\">辭書形＋な</mark>，表示別做，不能先變命令形。","ここで<ruby>走<rt>はし</rt></ruby>るな。","不要在這裡跑。柔和請求可用走らないでください；規則可用走ってはいけません。"]],"caution":"<mark class=\"study-key\">強烈命令</mark>與<mark class=\"study-key\">禁止</mark>並非男性專用，なさい也非女性專用。依場合、關係和緊急程度選詞，不按性別劃分。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">看懂<mark class=\"study-key\">強烈命令</mark>，也懂得按場合選擇請求方式。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">形式</th><th scope=\"col\">第一類書く</th><th scope=\"col\">第二類見る</th><th scope=\"col\">第三類</th></tr></thead><tbody><tr><td>命令形</td><td><ruby>書<rt>か</rt></ruby>け</td><td><ruby>見<rt>み</rt></ruby>ろ</td><td>しろ／<ruby>来<rt>こ</rt></ruby>い</td></tr><tr><td><mark class=\"study-key\">なさい</mark></td><td><ruby>書<rt>か</rt></ruby>きなさい</td><td>見なさい</td><td>しなさい／来なさ
