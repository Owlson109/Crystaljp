い（きなさい）</td></tr><tr><td><mark class=\"study-key\">禁止</mark></td><td><ruby>書<rt>か</rt></ruby>くな</td><td><ruby>見<rt>み</rt></ruby>るな</td><td>するな／<ruby>来<rt>く</rt></ruby>るな（くるな）</td></tr></tbody></table></div><h3>第一類命令形：う段→え段</h3><p><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>け；<ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>め；<ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>て；<ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>れ。只換字尾，<mark class=\"study-key\">不加る</mark>。</p><p lang=\"ja\"><ruby>危<rt>あぶ</rt></ruby>ない！<ruby>止<rt>と</rt></ruby>まれ！</p><p>危險！停下！<mark class=\"study-key\">強烈命令</mark>可出現在緊急情境，不限於責罵。</p><h3>第二類和不規則</h3><p>第二類<mark class=\"study-key\">去る＋ろ</mark>：<ruby>食<rt>た</rt></ruby>べろ、<ruby>見<rt>み</rt></ruby>ろ。する→<mark class=\"study-key\">しろ</mark>（也有せよ）；<ruby>来<rt>く</rt></ruby>る→来い（こい）。</p><p lang=\"ja\">こっちを<ruby>見<rt>み</rt></ruby>ろ。</p><p>看這邊。命令形通常很強，日常請求可用見てください。</p><h3>ます去ます＋なさい</h3><p>常用於家長、老師等下達指示；男女都可用，也不適合當作對長輩的普遍禮貌請求。</p><p lang=\"ja\"><ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>きなさい。</p><p>寫名字。<ruby>書<rt>か</rt></ruby>きます→<ruby>書<rt>か</rt></ruby>き＋なさい，仍帶命<ruby>令<rt>れい</rt></ruby><ruby>語<rt>ご</rt></ruby>氣。</p><h3>辭書形＋な：禁止</h3><p>直接用<mark class=\"study-key\">辭書形＋な</mark>，表示別做，不能先變命令形。</p><p lang=\"ja\">ここで<ruby>走<rt>はし</rt></ruby>るな。</p><p>不要在這裡跑。柔和請求可用走らないでください；規則可用走ってはいけません。</p><h3>再看幾個例子</h3><p><ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>りなさい。＝早點回去。<br><ruby>今<rt>いま</rt></ruby>すぐ<ruby>来<rt>こ</rt></ruby>い。＝現在馬上過來。<br>この<ruby>箱<rt>はこ</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けるな。＝別打開這個箱子。<br>この<ruby>箱<rt>はこ</rt></ruby>を<ruby>開<rt>あ</rt></ruby>けないでください。＝請不要打開這個箱子。意思相近，語氣不同。</p><h3>容易混淆的地方</h3><p>強烈命令與禁止並非男性專用，なさい也非女性專用。依場合、關係和緊急程度選詞，不按性別劃分。</p>","uploadedOriginal":"<p>[單元46] 命令和禁止的說法</p><p>學習目標</p><p>①　學會表示命令的「動詞命令形」</p><p>②　學會表示命令的「～なさい」用法</p><p>③　學會表示禁止的「動詞原形＋な」用法</p><p>本單元介紹的內容，就某種程度來說也算是「非常地實用」（笑）。本回的主題是學習日文中表示「命令」和「禁止」的說法。</p><p>所謂命令的說法，相信不用解釋大家都知道，就是指命令某人去做什麼事情，常見於父母親命令小孩、老師命令學生、上司命令部下、主人命令寵物等等。我們之前學過「～てください」這個句型，是「請…」的意思，表示請求別人去做什麼事情，雖然有請求之意，但是語氣還是沒有像命令一樣強烈。日文中的命令說法，會以動詞變化的形式來表示，有所謂的「動詞命令形」。相信對於已經克服了許許多多動詞變化難關的各位來說，一定是小菜一碟。</p><p>另外，由於「動詞命令形」的語氣較為強烈、通常只有男生會使用，因此如果女生想表達命令語氣，像是媽媽早上叫小孩起床的話，一般會使用「～なさい」這個句型，將之想成不粗魯的「動詞命令形」即可。</p><p>最後，是日文中「禁止」的說法，用來表示禁止別人做什麼樣的事情，相當於中文的「別…！」，例如「別動！ 別抽菸！」等等，這時會使用「動詞原形＋な」這個文法。同樣地，「動詞原形＋な」語氣也很強烈，不適合女性使用，一般女性表示禁止的說法為「～ないでください」，我們之前也學習過這個句型。</p><p>詳細文法及例句介紹，請參照以下說明。</p><p>動詞命令形</p><p>「動詞命令形」，顧名思義就是命令他人時使用的句型，相當於中文的「快去…！」。日文中的命令語氣和中文不同，會以動詞變化的形式來表示。</p><p>動詞變化方法</p><p>第一類動詞</p><p>將動詞羅馬拼音字尾的發音「u」改為「e」即可。</p><p>例：</p><p>貸す　Kasu   →   貸せ　Kase</p><p>書く　Kaku   → 　書け  Kake</p><p>泳ぐ　Oyogu   →   泳げ   Oyoge</p><p>言う　Iu      →　  言え   Ie</p><p>待つ　Matsu   →　  待て   Mate</p><p>帰る　Kaeru   →　  帰れ  Kaere</p><p>飛ぶ　Tobu    →　   飛べ  Tobe</p><p>読む　Yomu    →　   読め  Yome</p><p>第二類動詞</p><p>將動詞字尾的發音「る」改為「ろ」即可。</p><p>食べる   →   食べろ</p><p>着る　   →　 着ろ</p><p>忘れる　→　 忘れろ</p><p>寝る　   →　 寝ろ</p><p>開ける　 →　 開けろ</p><p>見る　   →　 見ろ</p><p>不規則動詞</p><p>沒有規則，請直接記起來吧。</p><p>する　→　しろ</p><p>勉強する　→　勉強しろ</p><p>買物する　→　買物しろ</p><p>来る　→　来い （注意發音）</p><p>例：</p><p>ピーマンを食べろ！</p><p>（去吃青椒！）</p><p>家に帰れ！</p><p>（給我回家！）</p><p>早く宿題をしろ！</p><p>（快去寫作業！）</p><p>今すぐここに来い！</p><p>（現在馬上來這裡！）</p><p>今月の営業成績を見ろ！</p><p>（你去看看這個月的業績！）</p><p>反省文を書け！</p><p>（給我寫悔過書！）</p><p>なさい</p><p>「動詞命令形」的語氣很強烈，是很兇的命令語氣，一般只有責備他人時才會使用，而且多為男性使用。如果說話者是女性，一般會使用「なさい」這個用法來表示命令的語氣。最常聽到的，就是每天早上媽媽叫小孩起來的情況，「早く起きなさい（快點起床！）」。</p><p>基本用法: 動詞ます形－「ます」＋「なさい」</p><p>（表示輕微命令）</p><p>例：</p><p>早く起きなさい！</p><p>（快起來！）</p><p>ピーマンを食べなさい！</p><p>（快吃青椒！）</p><p>家に帰りなさい！</p><p>（快回家！）</p><p>早く宿題をしなさい！</p><p>（快點寫作業！）</p><p>今すぐここに来なさい！</p><p>（現在馬上到這裡來！）</p><p>今月の営業成績を見なさい！</p><p>（你看看這個月的業績！）</p><p>反省文を書きなさい！</p><p>（去寫悔過書！）</p><p>動詞原形＋な</p><p>「動詞原形＋な」為表示「禁止」的用法，禁止別人進行某項動作，相當於中文的「別…！」。</p><p>如同「動詞命令形」，「動詞原形＋な」的語氣也相當強烈，多為男性使用。女性則大多使用「～ないでください」這個句型來表示禁止的語氣。</p><p>基本用法:  動詞原形＋な。</p><p>（別…！）</p><p>例：</p><p>仕事をサボるな！</p><p>（工作別偷懶！）</p><p>タバコを吸うな！</p><p>（別抽菸！）</p><p>ここに来るな！</p><p>（別來這裡！）</p><p>夜食を食べるな！</p><p>（別吃消夜！）</p><p>俺のことを忘れるな！</p><p>（別忘記我！）</p><p>俺の日記を見るな！<br>（別看我的日記！）</p><p>勝手に手紙を開けるな！</p><p>（別隨便打開我的信！）</p><p>宿題をする前に寝るな！</p><p>（在寫作業前別睡覺！）</p><p>変なことを書くな！</p><p>（別寫奇怪的事情！）</p><p>台風の日に海辺に行くな！</p><p>（颱風天別去海邊！）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"待つ的命令形是？","options":["待て","待とう","待つろ","待ちろ"],"answer":0,"explanation":"第一類つ換え段て。"},{"prompt":"「不要看」的強烈禁止是？","options":["見ろ","見るな","見なさい","見よう"],"answer":1,"explanation":"禁止用辭書形見る＋な。"},{"prompt":"書く接なさい應說？","options":["書くなさい","書けなさい","書きなさい","書いたなさい"],"answer":2,"explanation":"ます形書きます去ます，再接なさい。"},{"prompt":"命令形的使用應主要看甚麼？","options":["只能看性別","只能看年齡","沒有任何語氣差別","場合、關係、語氣和緊急程度"],"answer":3,"explanation":"不是男性／女性專用規則，語境才是判斷重點。"}]},{"id":47,"title":"「ば」的常用句型","symbol":"ほど","intro":"用ば表示程度變化、詢問方法及提出建議。","tag":"ば～ほど・ばいい・ば？","concepts":[["ば～ほど：愈……愈……","同一動詞用<mark class=\"study-key\">ば形＋辭書形＋ほど</mark>。","<ruby>練習<rt>れんしゅう</rt></ruby>すればするほど、<ruby>上手<rt>じょうず</rt></ruby>になります。","<mark class=\"study-key\">愈</mark>練習愈熟練。する→すれば，再重複する，不能把後半也改成すれば。"],["形容詞也能表示程度","い形容詞去い＋<mark class=\"study-key\">ければ</mark>，再重複原形＋ほど。な形容詞可用であれば……であるほど。","<ruby>安<rt>やす</rt></ruby>ければ<ruby>安<rt>やす</rt></ruby>いほど、うれしいです。","<mark class=\"study-key\">愈</mark>便宜愈開心。安い→安ければ＋安いほど。"],["ばいい：做……就可以","<mark class=\"study-key\">ば形＋いい</mark>。也可加疑問詞詢問方法：<mark class=\"study-key\">どうすればいい</mark>ですか。","どこで<ruby>切符<rt>きっぷ</rt></ruby>を<ruby>買<rt>か</rt></ruby>えばいいですか。","應在哪裡買票？買う→買えば。不是所有ばいい都帶質問或不滿。"],["ばできる／ばわかる","普通條件句：如果做A就能辦到／知道。並非ば只能接這兩個動詞。","<ruby>説明<rt>せつめい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>めば、<ruby>使い方<rt>つかいかた</rt></ruby>がわかります。","讀說明就明白用法。這句可以中性，不必然輕視對方。"],["句尾ば？：簡短建議","如先生に聞けば？可理解為「問老師如何？」。親近會話中常見，語調不當可能顯得冷淡。","<ruby>少<rt>すこ</rt></ruby>し<ruby>休<rt>やす</rt></ruby>めば？","休息一下如何？對不熟悉的人可改為少し休んだほうがいいですよ等完整說法。"]],"caution":"ば本身是條件形式，不只出現在慣用句。ばいい、ばわかる、ば？的態度不能只看文法決定，還要看語調及關係。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用ば表示程度變化、詢問方法及提出建議。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">意思</th><th scope=\"col\">形式</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td><mark class=\"study-key\">愈</mark>做<mark class=\"study-key\">愈</mark>……</td><td>ば形＋辭書形＋ほど</td><td><ruby>読<rt>よ</rt></ruby>めば<ruby>読<rt>よ</rt></ruby>むほど</td></tr><tr><td><mark class=\"study-key\">愈</mark>……<mark class=\"study-key\">愈</mark>……</td><td><mark class=\"study-key\">ければ</mark>＋い形容詞＋ほど</td><td><ruby>多<rt>おお</rt></ruby>ければ<ruby>多<rt>おお</rt></ruby>いほど</td></tr><tr><td>怎麼做才好</td><td>どう＋すればいい</td><td><mark class=\"study-key\">どうすればいい</mark>ですか</td></tr><tr><td>建議</td><td>ば形？</td><td><ruby>聞<rt>き</rt></ruby>けば？</td></tr></tbody></table></div><h3>ば～ほど：愈……愈……</h3><p>同一動詞用<mark class=\"study-key\">ば形＋辭書形＋ほど</mark>。</p><p lang=\"ja\"><ruby>練習<rt>れんしゅう</rt></ruby>すればするほど、<ruby>上手<rt>じょうず</rt></ruby>になります。</p><p><mark class=\"study-key\">愈</mark>練習<mark class=\"study-key\">愈</mark>熟練。する→すれば，再重複する，不能把後半也改成すれば。</p><h3>形容詞也能表示程度</h3><p>い形容詞去い＋<mark class=\"study-key\">ければ</mark>，再重複原形＋ほど。な形容詞可用であれば……であるほど。</p><p lang=\"ja\"><ruby>安<rt>やす</rt></ruby>ければ<ruby>安<rt>やす</rt></ruby>いほど、うれしいです。</p><p><mark class=\"study-key\">愈</mark>便宜<mark class=\"study-key\">愈</mark>開心。<ruby>安<rt>やす</rt></ruby>い→<ruby>安<rt>やす</rt></ruby>ければ＋<ruby>安<rt>やす</rt></ruby>いほど。</p><h3>ばいい：做……就可以</h3><p>ば形＋いい。也可加疑問詞詢問方法：<mark class=\"study-key\">どうすればいい</mark>ですか。</p><p lang=\"ja\">どこで<ruby>切符<rt>きっぷ</rt></ruby>を<ruby>買<rt>か</rt></ruby>えばいいですか。</p><p>應在哪裡買票？買う→<ruby>買<rt>か</rt></ruby>えば。不是所有ばいい都帶質問或不滿。</p><h3>ばできる／ばわかる</h3><p>普通條件句：如果做A就能辦到／知道。並非ば只能接這兩個動詞。</p><p lang=\"ja\"><ruby>説明<rt>せつめい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>めば、<ruby>使い方<rt>つかいかた</rt></ruby>がわかります。</p><p>讀說明就明白用法。這句可以中性，不必然輕視對方。</p><h3>句尾ば？：簡短建議</h3><p>如先生に聞けば？可理解為「問老師如何？」。親近會話中常見，語調不當可能顯得冷淡。</p><p lang=\"ja\"><ruby>少<rt>すこ</rt></ruby>し<ruby>休<rt>やす</rt></ruby>めば？</p><p>休息一下如何？對不熟悉的人可改為少し休んだほうがいいですよ等完整說法。</p><h3>再看幾個例子</h3><p>この<ruby>本<rt>ほん</rt></ruby>は<ruby>読<rt>よ</rt></ruby>めば<ruby>読<rt>よ</rt></ruby>むほど、<ruby>面白<rt>おもしろ</rt></ruby>くなります。＝這本書<mark class=\"study-key\">愈</mark>讀愈有趣。<br><ruby>部屋<rt>へや</rt></ruby>が<ruby>静<rt>しず</rt></ruby>かであれば<ruby>静<rt>しず</rt></ruby>かであるほど、<ruby>集中<rt>しゅうちゅう</rt></ruby>しやすいです。＝房間愈安靜，愈容易集中。<br>ここに<ruby>名前<rt>なまえ</rt></ruby>を<ruby>書<rt>か</rt></ruby>けばいいです。＝在這裡寫名字就可以。<br><ruby>実際<rt>じっさい</rt></ruby>に<ruby>使<rt>つか</rt></ruby>えば、<ruby>便利<rt>べんり</rt></ruby>さがわかります。＝實際用過便能了解它有多方便。</p><h3>容易混淆的地方</h3><p>ば本身是條件形式，不只出現在慣用句。ばいい、ばわかる、ば？的態度不能只看文法決定，還要看語調及關係。</p>","uploadedOriginal":"<p>[單元47] 「ば」の慣用句</p><p>學習目標</p><p>①　學會表示「愈…愈…」的「～ば～ほど」用法</p><p>②　學會慣用句型「～ばいい」</p><p>③　學會慣用句型「～ばできる」和「～ばわかる」</p><p>④　學會反問用法「～ば？」</p><p>本單元的重點為各種關於「～ば」的慣用句型。「～ば」的主要功能為表示假設，我們在單元38中介紹過表示假設的四項用法「と、ば、なら、たら」，「～ば」就是其中一項。就文法性質來說，「と」「なら」「たら」只要直接放在動詞後面即可，但是「ば」卻是以動詞變化的形式出現，也就是說，必須先將該動詞變成「動詞ば形」後，才能使用。</p><p>例: 行く　  →　 行けば</p><p>食べる　→　 食べれば</p><p>する　  →　 すれば</p><p>關於「ば」的使用方法，我們在單元38中也提過：「主要用於慣用語、諺語、慣用句型、或是接續特定動詞。用法較為固定」。由於「ば」主要用於慣用句，因此我們在先前的單元中就沒有詳細解釋其用法，但是這並不表示必須死背，我們的作法，是將「ば」的慣用句型獨立成一個章節來進行完整介紹。</p><p>本單元介紹五項關於「ば」的慣用句型及用法。首先是「～ば～ほど」，這是會話中常見的句型，相當於中文的「愈…愈…」，例如「愈玩愈有趣」「日文愈讀愈好」等等。</p><p>其次是「～ばいい」，形容詞「いい」的本意是「好的、不錯的」，因此「～ばいい」整句就是「…的話就好了、就可以了」之意，例如「學生只要讀書就好了」「只要有東西吃就可以了」等等。</p><p>「ば」後面也可以接動詞，常見的有「～ばできる」和「～ばわかる」二項句型，「～ばできる」是「只要…的話就能辦到」之意，常用來鼓勵他人。「～ばわかる」為「只要…的話就知道了」之意，例如「只要想一下就知道了、只要到現場就知道了」等等，帶有些許輕視的感覺。</p><p>最後是表示反問語氣的「～ば？」。「～ば？」其實是「～ばいいんじゃない？（…的話不就好了？）」的省略，主要放在句尾，用以反問對方，相當於中文的「…不就好了？」例如「在家休息不就好了？」、「直接講出來不就好了？」等等用法，特別常見於口語會話中。</p><p>以下將依序進行介紹。</p><p>～ば～ほど</p><p>「～ば～ほど」由表示假設語氣的「ば」和表示程度的「ほど（程）」所組成，意思為「愈…愈…」，具有強調的功能。由於前後文意的關係，「～ば～ほど」後方經常接續「なる」這個動詞，表示變化的情況。</p><p>基本用法:  動詞ば形＋動詞原形＋ほど、～。</p><p>（愈…，愈…。）</p><p>例：</p><p>サッカーは練習すれば練習するほど、上手になる。</p><p>（足球愈是練習，就愈是拿手。）</p><p>パソコンで仕事をすればするほど、目が悪くなる。</p><p>（愈是使用電腦工作，視力就會愈差。）</p><p>研究が進めば進むほど、分からないことが出(で)てくる。</p><p>（愈是進行研究，愈是有不了解的事情出來。）</p><p>この首飾りは、磨けば磨くほど、きれいになる。</p><p>（這條首飾愈磨愈漂亮。）</p><p>上へ登れば登るほど、気温が下がる。</p><p>（愈往上走，溫度愈是低。）</p><p>休みが長ければ長いほど、クラスメートに会いたくなる。</p><p>（休假愈長，就會愈想念同學。） 也可以接い形容詞</p><p>奨学金は多ければ多いほど良い。</p><p>（獎學金愈多愈好。）接い形容詞</p><p>部屋がきれいであればきれいであるほど、</p><p>住み心地がいい。</p><p>（房間愈漂亮，住起來愈是舒服。）</p><p>接な形容詞時，常會用「であれば」的形式</p><p>～ばいい</p><p>「～ばいい」由表示假設語氣的「ば」和表示「好、不錯」意思的「いい（良い）」所組成，意思為「…就好了、…就可以了」，時常用於下達指示或是向對方詢問時。</p><p>「～ばいい」也可以說成「～ばいいんじゃない？」這樣的反問形式，相當於中文的「～不就好了嗎？」</p><p>可以改寫為「～ばいいでしょう！」或「～ばいいよね！」，中文為「～就可以了吧！」，語氣較為強烈。也可以改為疑問句的形式「～ばいいですか？」「～ばいい？」，相當於中文的「～就可以了吧？」。</p><p>基本用法: 動詞ば形＋いい（です）。</p><p>（…就好了。）</p><p>延伸用法: 動詞ば形＋いいんじゃない？</p><p>（…不就好了嗎？  反問）</p><p>動詞ば形＋いいよね！／いいでしょうね！</p><p>（…就可以了吧！ 質問）</p><p>動詞ば形＋いい？／いいですか？</p><p>（…就可以了嗎？ 疑問）</p><p>例：</p><p>６０点を取ればいい。</p><p>（拿60分就好了。）</p><p>この道をまっすぐ行けばいい。</p><p>（這條路直直走就可以了。）</p><p>コインを入れて、ここのボタンを押せばいい。</p><p>（放進硬幣後，按下按鈕就好了。）</p><p>一日三回、この薬を飲めばいい。</p><p>（這個藥一天吃三次就好了。）</p><p>勉強すればいい。</p><p>（只要讀書就好了。）</p><p>勉強すればいいんじゃない？</p><p>（只要讀書不就好了嗎？） 反問</p><p>勉強すればいいよね！</p><p>（只要讀書就好了吧！） 質問</p><p>勉強すればいい？</p><p>（只要讀書就可以了嗎？） 疑問</p><p>「～ばできる」和「～ばわかる」</p><p>「できる（能夠）」和「わかる（知道）」是二個經常和「ば」一起連用的動詞，由於使用頻率相當高，因此也可以直接將「～ばできる」和「～ばわかる」視為慣用句型的一種。</p><p>「～ばできる」意為「～的話就能辦到」，「～ばわかる」意為「～的話就會知道」，具體例句請參照下方。</p><p>基本用法:  動詞ば形＋できる。（只要…就能辦到。）</p><p>動詞ば形＋わかる。（只要…就會知道。）</p><p>例：</p><p>やればできる。</p><p>（只要嘗試就能辦到。）</p><p>がんばればできる。</p><p>（只要堅持就能辦到。）</p><p>努力すればできる。</p><p>（只要努力就能辦到。）</p><p>どうすればできるのか。</p><p>（要怎麼做才能辦到呢？）</p><p>自信を持っていればできる。</p><p>（只要有自信就能辦到。）</p><p>暇があればできる。</p><p>（只要有時間就能辦到。）</p><p>見ればわかる。</p><p>（只要看就會知道。）</p><p>聞けばわかる。</p><p>（只要問一下就會知道。）</p><p>行けばわかる。</p><p>（只要去了就會知道。）</p><p>実際に操作すればわかる。</p><p>（實際操作就會知道。）</p><p>電源を入れれば故障の問題がわかる。</p><p>（只要按下電源開關，就會知道問題在哪裡。）</p><p>本を読めばわかる。</p><p>（只要讀書就會知道。）</p><p>反問的「～ば？」</p><p>「～ば？」經常使用於句尾，是「～ばいいんじゃない？」的省略說法，中文意為「～不就好了？」，雖然不是正式文法，但在會話中被廣泛地使用，通常用於給予對方簡單的建議或提議時。由於帶有較隨便的語氣，因此不可以對長輩或是在正式場合中使用。</p><p>基本用法: 句子＋動詞ば形？</p><p>（…不就好了？）</p><p>例：</p><p>先生に言えば？</p><p>（跟老師說不就好了？）</p><p>弁当を買って来れば？</p><p>（去買便當來不就好了？）</p><p>自分で決めれば？</p><p>（自己決定不就好了？）</p><p>トイレに行けば？</p><p>（去上廁所不就好了？）</p><p>勇気を出して誘えば？</p><p>（拿出勇氣去約他不就好了？）</p><p>大学に入れば？</p><p>（進大學不就好了？）</p><p>日本語教師になれば？</p><p>（當日文老師不就好了？）</p><p>直接彼と話せば？</p><p>（直接跟他說不就好了？）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「愈讀愈有趣」應填：＿＿、面白くなります。","options":["読めば読むほど","読んだら読めば","読むば読むほど","読める読むほど"],"answer":0,"explanation":"ば形読めば＋辭書形読む＋ほど。"},{"prompt":"「應該怎麼做？」應說？","options":["どうするほどですか","どうすればいいですか","どうしばですか","どうするなですか"],"answer":1,"explanation":"どうすればいいですか用來詢問方法。"},{"prompt":"安い的ば形是？","options":["安いば","安くば","安ければ","安かったば"],"answer":2,"explanation":"い形容詞去い加ければ。"},{"prompt":"「先生に聞けば？」可能有甚麼語氣？","options":["只可能是稱讚","任何場合都最禮貌","只能是命令","可作簡短建議，也可能因語調顯得冷淡"],"answer":3,"explanation":"句尾ば？的態度由語境和語調決定。"}]},{"id":48,"title":"日文中的「ように」","symbol":"ように","intro":"描述習慣與能力的改變、持續努力及轉述指示。","tag":"ようになる・ようにする・ように言う","concepts":[["ようになる：變得會／開始有習慣","辭書形／可能形＋<mark class=\"study-key\">ようになる</mark>，描述原來沒有、現在有的<mark class=\"study-key\">習慣或能力</mark>。也可能是努力的結果。","<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せるようになりました。","變得能說日文了。話す→話せる→話せる<mark class=\"study-key\">ようになる</mark>，不等於毫不努力自然就會。"],["不再做／不能做","ない形的い改く，再接なる：飲まない→飲ま<mark class=\"study-key\">なくなる</mark>；話せない→話せ<mark class=\"study-key\">なくなる</mark>。","<ruby>最近<rt>さいきん</rt></ruby>、<ruby>夜<rt>よる</rt></ruby>にコーヒーを<ruby>飲<rt>の</rt></ruby>まなくなりました。","最近晚上不再喝咖啡了。否定習慣變化常用<mark class=\"study-key\">なくなる</mark>；不能說ようにならない在所有語境都錯。"],["ようにしている：盡量維持做法","辭書形／ない形＋<mark class=\"study-key\">ようにしている</mark>。強調平時<mark class=\"study-key\">有意識</mark>地努力去做或避免。","<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むようにしています。","我盡量每天讀日文。不是每次都已成功，而是持續留意這個做法。"],["ように言う：轉述指示","辭書形／ない形＋<mark class=\"study-key\">ように言う</mark>／伝える，常<mark class=\"study-key\">轉述</mark>要求、勸告或指示，不是所有話語都能用它取代と。","先生は学生に、遅れないように言いました。","老師叫學生不要遲到。<mark class=\"study-key\">轉述</mark>時可按視角調整來／去與人稱。"]],"caution":"<mark class=\"study-key\">ようになる</mark>聚焦轉變，<mark class=\"study-key\">ようにしている</mark>聚焦持續努力。形容詞變化先用高くなる／静かになる；動詞能否搭配要看所描述的變化，不宜列一份絕對禁用清單。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">描述習慣與能力的改變、持續努力及<mark class=\"study-key\">轉述</mark>指示。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">目的</th><th scope=\"col\">結構</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>形成習慣</td><td>辭書形＋ようになる</td><td><ruby>読<rt>よ</rt></ruby>むようになる</td></tr><tr><td>能力提升</td><td><ruby>可能<rt>かのう</rt></ruby>形＋ようになる</td><td><ruby>読<rt>よ</rt></ruby>めるようになる</td></tr><tr><td>不再做</td><td>ない→<mark class=\"study-key\">なくなる</mark></td><td><ruby>読<rt>よ</rt></ruby>まなくなる</td></tr><tr><td>刻意維持</td><td>辭書形／ない形＋ようにしている</td><td><ruby>読<rt>よ</rt></ruby>むようにしている</td></tr><tr><td><mark class=\"study-key\">轉述</mark>指示</td><td>辭書形／ない形＋ように<ruby>言<rt>い</rt></ruby>う</td><td><ruby>読<rt>よ</rt></ruby>むように<ruby>言<rt>い</rt></ruby>う</td></tr></tbody></table></div><h3>ようになる：變得會／開始有習慣</h3><p>辭書形／<ruby>可能<rt>かのう</rt></ruby>形＋ようになる，描述原來沒有、現在有的<mark class=\"study-key\">習慣或能力</mark>。也可能是努力的結果。</p><p lang=\"ja\"><ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せるようになりました。</p><p>變得能說日文了。<ruby>話<rt>はな</rt></ruby>す→<ruby>話<rt>はな</rt></ruby>せる→話せる<mark class=\"study-key\">ようになる</mark>，不等於毫不努力自然就會。</p><h3>不再做／不能做</h3><p>ない形的い改く，再接なる：<ruby>飲<rt>の</rt></ruby>まない→<ruby>飲<rt>の</rt></ruby>まなくなる；<ruby>話<rt>はな</rt></ruby>せない→<ruby>話<rt>はな</rt></ruby>せなくなる。</p><p lang=\"ja\"><ruby>最近<rt>さいきん</rt></ruby>、<ruby>夜<rt>よる</rt></ruby>にコーヒーを<ruby>飲<rt>の</rt></ruby>まなくなりました。</p><p>最近晚上不再喝咖啡了。否定習慣變化常用<mark class=\"study-key\">なくなる</mark>；不能說ようにならない在所有語境都錯。</p><h3>ようにしている：盡量維持做法</h3><p>辭書形／ない形＋ようにしている。強調平時有意識地努力去做或避免。</p><p lang=\"ja\"><ruby>毎日<rt>まいにち</rt></ruby>、<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むようにしています。</p><p>我盡量每天讀日文。不是每次都已成功，而是持續留意這個做法。</p><h3>ように言う：轉述指示</h3><p>辭書形／ない形＋ように<ruby>言<rt>い</rt></ruby>う／伝える，常轉述要求、勸告或指示，不是所有話語都能用它取代と。</p><p lang=\"ja\"><ruby>先生<rt>せんせい</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>に、<ruby>遅<rt>おく</rt></ruby>れないように<ruby>言<rt>い</rt></ruby>いました。</p><p>老師叫學生不要遲到。轉述時可按視角調整來／去與人稱。</p><h3>再看幾個例子</h3><p>毎朝、<ruby>散歩<rt>さんぽ</rt></ruby>するようになりました。＝開始有每天早上散步的習慣。<br><ruby>忘れ物<rt>わすれもの</rt></ruby>をしないようにしています。＝我盡量避免遺漏東西。<br><ruby>母<rt>はは</rt></ruby>は<ruby>弟<rt>おとうと</rt></ruby>に、<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>るように<ruby>言<rt>い</rt></ruby>いました。＝媽媽叫弟弟早點回家。<br>「<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みです」と<ruby>言<rt>い</rt></ruby>いました。是轉述事實，不能直接換成休みように言いました。</p><h3>容易混淆的地方</h3><p>ようになる聚焦轉變，ようにしている聚焦持續努力。形容詞變化先用高くなる／<ruby>静<rt>しず</rt></ruby>かになる；動詞能否搭配要看所描述的變化，不宜列一份絕對禁用清單。</p><p class=\"grammar-reference\">文法核對參考：<a href=\"https://www.jpf.go.jp/j/project/japanese/teach/tsushin/grammar/201310.html\" target=\"_blank\" rel=\"noopener noreferrer\">國際交流基金・よう（2）（日文） ↗</a></p>","uploadedOriginal":"<p>[單元48] 日文中的「ように」</p><p>學習目標</p><p>①　學會表示習慣、能力轉變的「ようになる」用法</p><p>②　學會表示個人行動的「ようにしている」用法</p><p>③　學會表示間接引用的「ように」用法</p><p>本單元，我們將介紹「ように」這個文法。「ように」常用以表示習慣或是目的。「ように」由名詞「よう」和助詞「に」所組成，「よう」的漢字寫做「様」，本意為「樣子、樣貌」，但是在這裡，我們並不使用它本來的意思，而是要使用「よう」所延伸出的抽象意思，簡單來說，我們可以將「ように」大致想成「這樣」之意，如此能夠加速理解。</p><p>本單元要介紹三項關於「ように」的用法，首先是「～ようになる」，照字面上解釋是「變成…這樣」，可以翻譯成中文的「變成…」，表示習慣或能力的轉變，例如「早上變得會去跑步、讀書的速度變快了」等等。</p><p>其次是表示個人主觀行動的「ようにしている」。什麼意思呢？我們先前學過「～にする」的文法，為「將…變成…」之意，加上表示持續的「ている」和「ように」後，直譯就會變成「（以外力）將…變成這樣子」，也就是「刻意去做／刻意不去做…」的意思，例如「刻意不和老師打招呼、假日刻意不接電話」等等，用以描述個人的主觀行為。</p><p>剛才的「～ようになる」表示「習慣或能力的自然演變」，而「ようにしている」則是指「刻意培養某項習慣或能力」。</p><p>之所以使用「ている」，是因為「刻意去做／刻意不去做…」給人感覺是持續了一段時間的行為，因此使用表示狀態持續的「ている」（和「結婚している」用法相同）。</p><p>最後是表示「間接引用」的「ように」。</p><p>什麼是間接引用呢？我們之前學過表示引用的「と」，功能是照實敘述對方的話，稱作「直接引用」。而「ように」的功能，則是以說話者的觀點敘述對方說過的話，例如:</p><p>直接引用 :</p><p>老師說: 「小明和小王，等一下到我的辦公室來。」</p><p>間接引用 :</p><p>老師說，要小明和小王等一下去他的辦公室。</p><p>也就是說，一個要用引號，一個則不用。</p><p>關於「ように」的文法性質，仍然有些地方需特別注意，請參照接下來的詳細解說。</p><p>ようになる</p><p>「ようになる」由表示「樣子」的「ように」，加上「成為」之意的「なる」組合而成，照字面上可以解釋為「變成…的樣子」，主要用於表示「習慣或能力」的轉變。</p><p>「ようになる」前面接續「動詞原形」，但必須注意的是，並不是所有動詞都能接「ようになる」，只有表示習慣或能力的動詞（通常是動詞可能形）才能使用。若是表示狀態變化的動詞（如太る、痩せる等等），就不能夠使用「ようになる」這樣的方式來表示。</p><p>基本文法:</p><p>動詞原形／ 動詞可能形 ＋　ようになる。</p><p>（變成… ）習慣或能力的轉變</p><p>例：</p><p>毎朝お茶を飲むようになった。</p><p>（變成每天早上喝茶） 表示習慣變化</p><p>仕事のため、毎日外食するようになった。</p><p>（由於工作的關係，變成每天都吃外面。）表示習慣變化</p><p>刺身が食べられるようになった。</p><p>（變得能夠吃生魚片了。）表示能力變化</p><p>卒論が終わって、自由に海外に行けるようになった。</p><p>（寫完畢業論文，能夠自由出國旅行了。）表示能力變化</p><p>日本語がしゃべれるようになった。</p><p>（變得能夠說出順暢的日文。）表示能力變化</p><p>一分間で2000字が読めるようになった。</p><p>（變得能夠一分鐘閱讀二千字。）表示能力變化</p><p>おばあちゃんはパソコンが使えるようになった。</p><p>（奶奶變得會使用電腦了。）表示能力變化</p><p>不過，若是表示「狀態變化」的動詞，就不能用「ようになる」的形式，而是必須直接使用「動詞原形」。</p><p>另外，「ようになる」也無法接續形容詞。</p><p>例：</p><p>？　太るようになる 　　○　太る    （變胖。）</p><p>？　痩せるようになる  　○　痩せる  （變瘦。）</p><p>？　変わるようになる  　○　変わる  （產生變化。）</p><p>？　増えるようになる  　○　増える  （增加。）</p><p>？　減るようになる  　　○　減る    （減少。）</p><p>？　腐るようになる  　　○　腐る   （腐壞。）</p><p>？　故障するようになる  ○　故障する  （故障。）</p><p>？　高いようになる  　　○　高くなる   （變高。）</p><p>？　明るいようになる  　○　明るくなる  （變明亮。）</p><p>？　有名ようになる  　　○　有名になる （變有名。）</p><p>最後，如果要表示「ようになる」的否定語氣，一般也不直接使用「ようにならない」，這樣意思上有些不通，必須使用「動詞ない形＋くなる」的方式。</p><p>例：</p><p>毎朝お茶を飲まなくなった。</p><p>（每天早上變得不喝茶。）</p><p>仕事のため、毎日外食しなくなった。</p><p>（由於工作的關係，變得每天不吃外食了。）</p><p>刺身が食べられなくなった。</p><p>（變得不敢吃生魚片了。）</p><p>日本語がしゃべれなくなった。</p><p>（變得不會說日語。）</p><p>一分間で2000字が読めなくなった。</p><p>（變得一分鐘無法閱讀二千字了。）</p><p>ようにしている</p><p>「ようにしている」是由我們先前學過的「～にする（將…變成…）」，加上表示持續狀態的「ている」和「ように」組合而成，相當於中文的「刻意去…」。</p><p>和剛才提過的「ようになる」在文法構成上相似，「ようになる」表示「消極地變成什麼樣子」，而「ようにしている」則可以解釋成「積極地將…變成什麼樣子」。如果「ようになる」是描述自然的演變結果，那麼「ようにしている」就是表示人為刻意造成的結果。</p><p>「ようになる」：</p><p>變成…的樣子。表示習慣或能力的自然而然改變。</p><p>「ようにしている」：</p><p>讓…變成…。表示人為刻意地去做某些事、或是刻意培養某種習慣。</p><p>因此，「ようにしている」除了有「刻意做…／刻意不做…」的意思之外，也可以引申為「刻意培養…的習慣」之意。</p><p>基本文法:</p><p>動詞原形・動詞否定形 ＋　ようにしている。</p><p>（刻意、儘可能… ）表示刻意培養某種習慣</p><p>例：</p><p>毎朝ミルクティーを飲まないようにしている。</p><p>（我儘可能每天早上不喝奶茶。）</p><p>運動不足のため、毎日ジョギングするようにしている。</p><p>（由於運動不足的關係，我儘可能每天都去慢跑。）</p><p>生の物を食べないようにしている。</p><p>（我儘可能不吃生的東西。）</p><p>毎晩早く寝るようにしている。</p><p>（我儘可能每晚早點睡。）</p><p>外国人と毎日日本語をしゃべるようにしている。</p><p>（我儘可能每天和外國人說日語。）</p><p>毎日寝る前に小説を読むようにしている。</p><p>（我儘可能每天睡前閱讀小說。）</p><p>おばあちゃんは毎晩テレビのパソコン講座を見るようにしている。</p><p>（奶奶儘可能每晚觀看電視的電腦教學節目。）</p><p>和「ようになる」相同，「ようにしている」前面一般不接續表示狀態變化的動詞，而通常也不接續動詞可能形，主要使用表示「動作」的普通動詞。</p><p>例：</p><p>○　歩いて帰るようにしている。</p><p>（我儘可能走路回家。）</p><p>？　歩いて帰れるようにしている。</p><p>（我儘可能可以走路回家。） 意思不通</p><p>○　痩せるように、努力している。（為了變瘦而努力。）</p><p>？　痩せるようにしている。（儘可能瘦。） 意思不通</p><p>間接引用の「ように」</p><p>「ように」也可以用於表示「間接引用」，代替我們之前學過的「と」。</p><p>直接引用: 直接以引號原封不動地引用對方說過的話。</p><p>間接引用: 以轉述者的觀點，間接轉述對方說過的話，不使用引號。</p><p>由於是間接引用，因此必須以轉述者的觀點來敘述、而不能將說話者的話原封不動直接引用，原句中表示語氣的字詞也必須拿掉才行。請參照下列例句說明。</p><p>例：</p><p>先生は「後で私の事務室に来なさい」と言った。</p><p>（老師說: 等一下到我的辦公室來。） 直接引用</p><p>先生は後で彼の事務室に行くように言った。</p><p>（老師說等一下去他的辦公室。） 間接引用</p><p>基本用法:</p><p>引用的話　＋　ように ＋ 和説話有關的動詞 。</p><p>例：</p><p>部長に明日の会議に出るように伝えてください。</p><p>（請跟部長說明天要出席會議。）</p><p>妻に今日夕食を作っておくように言った。</p><p>（跟妻子說今天要先做好晚飯。）</p><p>父は今日早く帰るように弟に言った。</p><p>（父親告訴弟弟今天要早點回家。）</p><p>上司は彼に仕事をやめるように言った。</p><p>（上司告訴他，要他辭職。）</p><p>後で電話をかけなおすように彼に伝えた。</p><p>（告訴他說等一下要再打電話回去。）</p><p>弟に金曜日までに申込書を出すように伝えた。</p><p>（告訴弟弟說在週五前要寄出申請書。）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「變得能讀漢字」應說？","options":["漢字が読めるようになりました。","漢字が読むできるです。","漢字が読めてようです。","漢字が読まないようです。"],"answer":0,"explanation":"可能形読める＋ようになる表示能力的改變。"},{"prompt":"「盡量每天讀書」應說？","options":["毎日本を読むままです。","毎日本を読むようにしています。","毎日本を読んだ前です。","毎日本を読むしかです。"],"answer":1,"explanation":"ようにしている表示有意識地維持做法。"},{"prompt":"「不再喝咖啡」應說？","options":["飲まないなる","飲むなくなった","飲まなくなった","飲めるになる"],"answer":2,"explanation":"飲まない的ない→なく，再接なる。"},{"prompt":"ように言う最典型用於？","options":["把所有引用都替換","只轉述名詞","列舉水果","轉述指示、要求或勸告"],"answer":3,"explanation":"遅れないように言う是轉述不要遲到的要求。"}]},{"id":49,"title":"表示目的和原因的「ように」「ために」","symbol":"ために","intro":"從想達到的結果與原因，分辨兩種「為了」。","tag":"目的・ように・ために・原因","concepts":[["ために：以意志行動為目標","辭書形＋<mark class=\"study-key\">ために</mark>；名詞＋の<mark class=\"study-key\">ために</mark>。常用於能有意進行的目標，前後動作者通常相同，但不能用自他動詞硬分。","<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くために、お<ruby>金<rt>かね</rt></ruby>を<ruby>貯<rt>た</rt></ruby>めています。","為了去日本而存錢。行く是自動詞，也能用<mark class=\"study-key\">ために</mark>。"],["ように：希望某種結果實現","常接<mark class=\"study-key\">可能形</mark>、<mark class=\"study-key\">ない形</mark>或非意志性的狀態，著重達成或避免的結果。","<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せるように、<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>しています。","為了能說日文，每天練習。話せる是希望達到的能力。"],["前後可有不同動作者","<mark class=\"study-key\">ように</mark>能表達為讓別人達到某狀態而做事，不能只看到を就排除<mark class=\"study-key\">ように</mark>。","<ruby>子<rt>こ</rt></ruby>どもが<ruby>読<rt>よ</rt></ruby>めるように、<ruby>大<rt>おお</rt></ruby>きな<ruby>字<rt>じ</rt></ruby>で<ruby>書<rt>か</rt></ruby>きます。","為了讓孩子看得懂／讀得到，把字寫大。讀的人是孩子，寫的人是我。"],["ために也能表示原因","普通形＋<mark class=\"study-key\">ために</mark>；名詞＋の<mark class=\"study-key\">ために</mark>；な形容詞肯定非過去＋なために。常見於較正式說明，不保證客觀。","<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れたために、<ruby>遅刻<rt>ちこく</rt></ruby>しました。","由於電車誤點而遲到。前半是已發生的<mark class=\"study-key\">原因</mark>，不是想追求的目標。"]],"caution":"不要用「を→<mark class=\"study-key\">ために</mark>、が／に→<mark class=\"study-key\">ように</mark>」判斷。意志性不等於他動詞，原因用法也不只接自動詞；要閱讀整句意思。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">從想達到的<mark class=\"study-key\">結果</mark>與<mark class=\"study-key\">原因</mark>，分辨兩種「為了」。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">用途</th><th scope=\"col\">接法</th><th scope=\"col\">例子</th></tr></thead><tbody><tr><td>目的：有意做</td><td>辭書形＋ために</td><td><ruby>買<rt>か</rt></ruby>うために／<ruby>行<rt>い</rt></ruby>くために</td></tr><tr><td>為某人／事</td><td>名詞＋の<mark class=\"study-key\">ために</mark></td><td><ruby>家族<rt>かぞく</rt></ruby>のために</td></tr><tr><td>目的：達成狀態</td><td><ruby>可能<rt>かのう</rt></ruby>形／ない形等＋ように</td><td><ruby>読<rt>よ</rt></ruby>めるように／<ruby>忘<rt>わす</rt></ruby>れないように</td></tr><tr><td><mark class=\"study-key\">原因</mark></td><td><ruby>普通<rt>ふつう</rt></ruby>形＋ために</td><td><ruby>遅<rt>おく</rt></ruby>れたために／<ruby>雨<rt>あめ</rt></ruby>のために</td></tr></tbody></table></div><h3>ために：以意志行動為目標</h3><p>辭書形＋ために；名詞＋の<mark class=\"study-key\">ために</mark>。常用於能有意進行的目標，前後動作者通常相同，但不能用自他動詞硬分。</p><p lang=\"ja\"><ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くために、お<ruby>金<rt>かね</rt></ruby>を<ruby>貯<rt>た</rt></ruby>めています。</p><p>為了去日本而存錢。行く是自動詞，也能用ために。</p><h3>ように：希望某種結果實現</h3><p>常接可能形、ない形或非意志性的狀態，著重達成或避免的結果。</p><p lang=\"ja\"><ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せるように、<ruby>毎日<rt>まいにち</rt></ruby><ruby>練習<rt>れんしゅう</rt></ruby>しています。</p><p>為了能說日文，每天練習。話せる是希望達到的能力。</p><h3>前後可有不同動作者</h3><p>ように能表達為讓別人達到某狀態而做事，不能只看到を就排除ように。</p><p lang=\"ja\"><ruby>子<rt>こ</rt></ruby>どもが<ruby>読<rt>よ</rt></ruby>めるように、<ruby>大<rt>おお</rt></ruby>きな<ruby>字<rt>じ</rt></ruby>で<ruby>書<rt>か</rt></ruby>きます。</p><p>為了讓孩子看得懂／讀得到，把字寫大。讀的人是孩子，寫的人是我。</p><h3>ために也能表示原因</h3><p><ruby>普通<rt>ふつう</rt></ruby>形＋ために；名詞＋のために；な形容詞肯定非過去＋なために。常見於較正式說明，不保證客觀。</p><p lang=\"ja\"><ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れたために、<ruby>遅刻<rt>ちこく</rt></ruby>しました。</p><p>由於電車誤點而遲到。前半是已發生的原因，不是想追求的目標。</p><h3>再看幾個例子</h3><p><ruby>家<rt>いえ</rt></ruby>を<ruby>買<rt>か</rt></ruby>うために、<ruby>貯金<rt>ちょきん</rt></ruby>しています。＝為了買房而存錢。<br><ruby>忘<rt>わす</rt></ruby>れないように、メモします。＝為了不忘記而記下來。<br><ruby>後<rt>うし</rt></ruby>ろの人にも<ruby>聞<rt>き</rt></ruby>こえるように、<ruby>大<rt>おお</rt></ruby>きな<ruby>声<rt>こえ</rt></ruby>で<ruby>話<rt>はな</rt></ruby>します。＝為了讓後面的人也聽到，大聲說話。<br><ruby>雨<rt>あめ</rt></ruby>のために、<ruby>試合<rt>しあい</rt></ruby>が<ruby>中止<rt>ちゅうし</rt></ruby>になりました。＝因下雨，比賽取消了。</p><h3>容易混淆的地方</h3><p>不要用「を→ために、が／に→ように」判斷。意志性不等於他動詞，原因用法也不只接自動詞；要閱讀整句意思。</p><p class=\"grammar-reference\">文法核對參考：<a href=\"https://www.jpf.go.jp/j/project/japanese/teach/tsushin/grammar/201310.html\" target=\"_blank\" rel=\"noopener noreferrer\">國際交流基金・よう（2）（日文） ↗</a></p>","uploadedOriginal":"<p>[單元49] 表示目的和原因的「ように」「ために」</p><p>學習目標</p><p>①　學會表示目的的「ために」用法</p><p>②　學會表示目的的「ように」「～ないように」句型</p><p>③　學會表示原因的「ために」用法</p><p>我們在上一單元，介紹過各種關於「ように」的用法，包括「習慣或能力的轉變」以及「間接引用」。然而，「ように」還有另一項重要的用法:「表示目的」。本單元將介紹日文中「表示目的」的用法，分別為「ように」和「ために」，以及用於表示「原因」的「ために」文法。</p><p>「ように」和「ために」都可以用來表示「目的」，翻成中文都是「為了…」的意思，例如「為了學會吉他而每天練習、為了得到好工作而每天投履歷」等等。那麼，如何區分「ように」和「ために」的使用時機呢？其實，這是許多日語學習者很頭痛的問題，即使學了很久的日文，還是有許多人會將這二者錯誤使用，對於如何區分「ように」和「ために」也是模模糊糊、似懂非懂，因此本單元的重點之一，就是教授各位如何有效區別這二者的使用方法。</p><p>用於表示「目的」的「ために」，前面必須接續「意志性的動詞」，也就是有人為意志在內的動詞，很難懂嗎？呵呵，簡單來說，就是指「他動詞」，例如「為了買房屋而存錢」「為了治好病而吃藥」「為了更了解日本而去留學」等例句，「買」「治療」「了解」都是具有人為意志在內的他動詞，後面會接續「ために」。簡單來說，「ために」之前通常會出現助詞「を」。</p><p>其次是表示「目的」的「ように」和「～ないように」，相當於中文的「為了…」，這裡要注意的是，「ように」前面接續的是「狀態性動詞」，也就是表示事物狀態的動詞，一般會是「自動詞」和「動詞可能形」，例如「為了不遲到而設定鬧鐘、為了能取得好成績而努力」等等，「不遲到」是自動詞，「能取得」則為動詞可能形，後面會接續「ように」。「ように」之前通常會出現助詞「を」之外的其他助詞，例如「が」「に」等等。</p><p>另外，「ために」也可用於表示「原因」，和「から」「ので」的用法相同。唯一的區別在於，「ために」是三者中最客觀、最禮貌、最正式的用法，適合用在正式場合及文章上。</p><p>關於更詳細的介紹及例句，請參照以下說明。</p><p>ために</p><p>「ために」用於表示「目的」，相當於中文的「為了…」。</p><p>需注意之處有:</p><p>①　「ために」前面一般接續動詞原形，而不接續其他形</p><p>式的動詞。</p><p>②　「ために」前面通常接續他動詞，較少接續自動詞或其他動詞變化。</p><p>③　「ために」前面一般會出現助詞「を」。</p><p>基本用法:  動詞原形　 ＋　ために、～。</p><p>名詞 ＋の　＋　ために、～。</p><p>（為了…  ）</p><p>例:</p><p>家を買うために、貯金しています。</p><p>（為了買房子而存錢。）</p><p>熱を下げるために、注射をしました。</p><p>（為了退燒而打了一針。）</p><p>生きるために、一生懸命に働かなければならない。</p><p>（為了生活，必須非常拼命地工作。）</p><p>犬の散歩をするために、毎朝５時に起きます。</p><p>（為了帶狗散步，每天早上五點起來。）</p><p>娘を喜ばせるために、ぬいぐるみを買いました。</p><p>（為了讓女兒高興而買了絨毛娃娃。）</p><p>いいスピーチをするために、</p><p>毎日鏡に向かって練習している。</p><p>（為了能夠進行一場好演講，每天對著鏡子練習。）</p><p>日本をもっと知るために、日本に留学した。</p><p>（為了更了解日本而去日本留學。）</p><p>息子は野球の試合を見るために、早く帰ってきた。</p><p>（兒子為了看棒球比賽而提早回來。）</p><p>夜３時のドラマを見るために、録画をセットしておく。</p><p>（為了觀看半夜三點的連續劇而事先設定錄影。）</p><p>註：例句中的「生きる」雖然分類為自動詞，不過由於中文意思是「過生活、維生」，具有人為意志，因此會使用「ために」，算是特殊用法。</p><p>ように</p><p>「ように」除了前一單元介紹過的用法之外，也經常用於表示「目的」，相當於中文的「為了…」。</p><p>需注意之處有:</p><p>①　「ように」前可以接續動詞原形、否定形、動詞可能形（佔大部分）。</p><p>②　「ように」前一般接續自動詞。</p><p>③　「ように」前會出現助詞「を」以外的其他助詞。像是「が」或「に」。</p><p>基本用法:  動詞原形・可能形・ない形＋ように～。</p><p>（為了…、為了不…  ）</p><p>例：</p><p>いい点数が取れるように、毎日勉強している。</p><p>（為了得到好成績，每天用功唸書。）</p><p>遅刻しないように、寝る前に目覚まし時計をかけておく。</p><p>（為了不遲到，在睡前先設定好鬧鐘。）</p><p>熱が下がるように、薬を飲みました。</p><p>（為了退燒而吃藥。）</p><p>いいスピーチができるように、毎日先生のところに行く。</p><p>（為了能進行一場好演講，每天都去老師那裡。）</p><p>日本語が上手になるように、</p><p>日本語のブログを書き始めた。</p><p>（為了讓日文進步，開始寫日文的部落格。）</p><p>子どもが誤って飲まないように、</p><p>薬をロッカーにしまった。</p><p>（為了不讓小孩誤飲，將藥放在置物櫃中。）</p><p>子ども部屋の壁には、</p><p>子どもが喜ぶように動物の絵を描いた。</p><p>（為了讓小孩高興，在小孩房間的牆壁畫上動物的畫。）</p><p>後ろの人もよく見えるように、</p><p>黒板の字を大きく書いてください。</p><p>(為了讓後面的人也能清楚看見，請將黑板的字寫大一點。)</p><p>よく聞こえるように、テレビの音を大きくする。</p><p>（為了能清楚聽見而調高電視的音量。）</p><p>「ために」和「ように」的區別</p><p>「ために」</p><p>由於接續他動詞的關係，前方幾乎都會出現助詞「を」。</p><p>「ように」</p><p>由於接續自動詞的關係，前方會出現助詞「が」或「に」。</p><p>若前方句子是「を＋動詞」，多數情況會使用「ために」</p><p>若前方句子是「其他助詞＋動詞」，那麼則大多用「ように」</p><p>例：</p><p>日本語を上手にするために、</p><p>毎日日本語でブログを書いている。</p><p>日本語が上手になるように、</p><p>毎日日本語でブログを書いている。</p><p>（為了讓日文進步，每天使用日文寫部落格。）</p><p>良いスピーチをするために、</p><p>講習会で発音をトレーニングしている。</p><p>良いスピーチができるように、</p><p>講習会で発音をトレーニングしている。</p><p>（為了進行一場好演講，在研習會中訓練發音方式。）</p><p>原因の「ために」</p><p>我們剛才學到了「ために」的用法，但是，「ために」同時也可以用於表示「原因」，和我們先前介紹過的「から、ので」用法大致相同。</p><p>「から」：表示個人的主觀推測，感覺較主觀。</p><p>「ので」：表示根據事實的客觀推測，感覺較客觀。</p><p>「ために」：完全根據事實進行推論，感覺最為客觀、委婉。</p><p>基本用法 :</p><p>自動詞常体／い形容詞　＋　ために、～。</p><p>名詞　＋の　＋　ために、～。</p><p>な形容詞　  ＋　な　＋　ために、～。</p><p>（由於…）</p><p>例：</p><p>電車が遅れたために、</p><p>鉄道会社がみんなにお詫びをした。</p><p>（由於電車誤點，因此鐵路公司向大家致歉。）</p><p>荷物があまりにも多いために、空港で検査を受けた。</p><p>（由於行李太多了，因此在機場遭到檢查。）</p><p>この図書館は静かなために、</p><p>休日になるといつも人がいっぱいいる。</p><p>（由於圖書館很安靜，因此到了假日就會有很多人來訪。）</p><p>彼は日本語ができるために、就職がしやすくなる。</p><p>（由於他會日文，因此找工作會變得很容易。）</p><p>いつでも海外に行けるために、</p><p>今行かなくてもかまわないと思う。</p><p>（由於隨時都可以出國，因此現在不去也沒關係。）</p><p>息子が登校しないために、</p><p>お母さんが医者を家に呼んできた。</p><p>（由於兒子不去上學，因此母親請醫生到家裡來診療。）</p><p>那麼，表示原因的「ために」和表示目的的「ために」，</p><p>該如何區別呢？</p><p>表示目的「ために」：</p><p>前多接他動詞、動詞原形。</p><p>表示目的「ように」：</p><p>前接自動詞、否定ない形、動詞可能形。</p><p>表示原因「ために」：</p><p>前接自動詞、否定ない形、動詞可能形、動詞た形。</p><p>簡單來說，表示原因的「ために」，和「ように」用法幾乎相同。因此，根據「ために」前面動詞種類的不同，就可以判斷「ために」在該句中是表示原因、或是表示目的。</p><p>例：</p><p>病気を治すために、手術を受けた。</p><p>（為了治病而接受手術。） 表示目的</p><p>病気が治せるために、彼は全然心配しない。</p><p>（由於病治得好，因此他完全不擔心。） 表示原因</p><p>病気が治ったために、海外旅行に行った。</p><p>（由於病好了，因此去國外玩。） 表示原因</p><p>薬が飲めないために、注射で治療するしかない。</p><p>(由於無法吃藥，因此只好以注射方式治療。）表示原因</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「為了去日本而存錢」哪句自然？","options":["日本に行くために、貯金しています。","日本を行くために、貯金しています。","日本に行くのために、貯金しています。","日本に行きますために、貯金しています。"],"answer":0,"explanation":"行く雖是自動詞，作有意追求的目標時也可接ために。"},{"prompt":"「為了能說日文」應填：日本語が話せる＿＿、練習します。","options":["なので","ように","のために","まま"],"answer":1,"explanation":"希望能力達成，可能形＋ように最典型。"},{"prompt":"「電車が遅れたために、遅刻しました」的ために是？","options":["列舉","目的","原因","比較"],"answer":2,"explanation":"誤點是遲到的原因，不是目的。","rubyView":{"prompt":"「<ruby>電車<rt>でんしゃ</rt></ruby>が<ruby>遅<rt>おく</rt></ruby>れたために、<ruby>遅刻<rt>ちこく</rt></ruby>しました」的ために是？","options":["列舉","目的","原因","比較"],"explanation":"誤點是遲到的原因，不是目的。"}},{"prompt":"如何區分目的的ために與ように？","options":["只看有沒有を","只看是否自動詞","兩者完全同義","看意志行動目標與希望達成的狀態"],"answer":3,"explanation":"不能只按助詞或自他動詞分類決定。"}]},{"id":50,"title":"表示推斷、樣態和傳聞的「よう」「そう」","symbol":"そう","intro":"分清「似乎」「看樣子」與「聽說」，完成五十課。","tag":"ようだ・樣態そうだ・傳聞そうだ","concepts":[["ようだ：根據線索判斷","動詞／い形容詞普通形＋<mark class=\"study-key\">ようだ</mark>；名詞＋の<mark class=\"study-key\">ようだ</mark>；な形容詞＋なようだ。線索可以包括親眼所見，不只憑感覺。","<ruby>部屋<rt>へや</rt></ruby>が<ruby>暗<rt>くら</rt></ruby>いです。<ruby>誰<rt>だれ</rt></ruby>もいないようです。","房間很暗，看來沒有人。根據情況判斷，仍可能有誤。"],["樣態そうだ：看樣子／快要","い形容詞去い、な形容詞直接接、動詞ます形去ます＋そうだ。描述表面的樣子或將發生的跡象。","<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>お</rt></ruby>りそうです。","看樣子快下雨。降ります→降りそう；不是傳聞。跡象不限定只靠視覺。"],["傳聞そうだ：聽說","<mark class=\"study-key\">普通形＋そうだ</mark>，名詞和な形容詞非過去肯定保留だ。重點是轉述得到的消息。","<ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです。","據天氣預報，聽說明天會下雨。降るそう，而不是降りそう。"],["同一個字，接法決定意思","<mark class=\"study-key\">おいしそう</mark>：看起來好吃。<mark class=\"study-key\">おいしいそう</mark>：聽說好吃。元気そう：看起來精神好。元気だそう：聽說精神好。","このケーキはおいしそうです。／この<ruby>店<rt>みせ</rt></ruby>のケーキはおいしいそうです。","前句是眼前樣子的判斷，後句是轉述消息。"],["否定與常見例外","樣態：いい→<mark class=\"study-key\">よさそう</mark>；ない→<mark class=\"study-key\">なさそう</mark>；おいしくない→おいしくなさそう。動詞可用降りそうにない。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>お</rt></ruby>りそうにありません。","今天看來不會下雨。傳聞否定則用降らないそうです＝聽說不下雨。"],["よう的比喻：像……一樣","名詞<mark class=\"study-key\">のような</mark>＋名詞；名詞<mark class=\"study-key\">のように</mark>＋動詞／形容詞。這是比喻，與推斷的焦點不同。","<ruby>星<rt>ほし</rt></ruby>のように<ruby>輝<rt>かがや</rt></ruby>く<ruby>目<rt>め</rt></ruby>。／<ruby>夢<rt>ゆめ</rt></ruby>のような<ruby>時間<rt>じかん</rt></ruby>。","像星星般閃亮的眼睛／如夢般的時光。ように修飾輝く；ような修飾時間。"]],"caution":"<mark class=\"study-key\">ようだ</mark>不是「沒有親眼看才可用」；<mark class=\"study-key\">樣態そうだ</mark>也不只憑視覺。名詞通常不直接接樣態そう；「学生だそうです」是傳聞，「学生のようです」是判斷。","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分清「似乎」「看樣子」與「聽說」，完成五十課。</p><h3>接續與用法整理</h3><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">詞語</th><th scope=\"col\">樣態そう</th><th scope=\"col\">傳聞そう</th><th scope=\"col\">推斷よう</th></tr></thead><tbody><tr><td><ruby>降<rt>ふ</rt></ruby>る</td><td><ruby>降<rt>お</rt></ruby>りそうだ</td><td><ruby>降<rt>ふ</rt></ruby>るそうだ</td><td><ruby>降<rt>ふ</rt></ruby>るようだ</td></tr><tr><td>おいしい</td><td><mark class=\"study-key\">おいしそう</mark>だ</td><td><mark class=\"study-key\">おいしいそう</mark>だ</td><td>おいしい<mark class=\"study-key\">ようだ</mark></td></tr><tr><td><ruby>元気<rt>げんき</rt></ruby></td><td><ruby>元気<rt>げんき</rt></ruby>そうだ</td><td><ruby>元気<rt>げんき</rt></ruby>だそうだ</td><td><ruby>元気<rt>げんき</rt></ruby>なようだ</td></tr><tr><td><ruby>学生<rt>がくせい</rt></ruby></td><td>通常改用其他句型</td><td><ruby>学生<rt>がくせい</rt></ruby>だそうだ</td><td><ruby>学生<rt>がくせい</rt></ruby>のようだ</td></tr><tr><td>ない</td><td><mark class=\"study-key\">なさそう</mark>だ</td><td>ないそうだ</td><td>ない<mark class=\"study-key\">ようだ</mark></td></tr></tbody></table></div><h3>ようだ：根據線索判斷</h3><p>動詞／い形容詞普通形＋<mark class=\"study-key\">ようだ</mark>；名詞＋の<mark class=\"study-key\">ようだ</mark>；な形容詞＋なようだ。線索可以包括親眼所見，不只憑感覺。</p><p lang=\"ja\"><ruby>部屋<rt>へや</rt></ruby>が<ruby>暗<rt>くら</rt></ruby>いです。<ruby>誰<rt>だれ</rt></ruby>もいないようです。</p><p>房間很暗，看來沒有人。根據情況判斷，仍可能有誤。</p><h3>樣態そうだ：看樣子／快要</h3><p>い形容詞去い、な形容詞直接接、動詞ます形去ます＋そうだ。描述表面的樣子或將發生的跡象。</p><p lang=\"ja\"><ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>お</rt></ruby>りそうです。</p><p>看樣子快下雨。<ruby>降<rt>お</rt></ruby>ります→<ruby>降<rt>お</rt></ruby>りそう；不是傳聞。跡象不限定只靠視覺。</p><h3>傳聞そうだ：聽說</h3><p><mark class=\"study-key\">普通形＋そうだ</mark>，名詞和な形容詞非過去肯定保留だ。重點是轉述得到的消息。</p><p lang=\"ja\"><ruby>天気<rt>てんき</rt></ruby><ruby>予報<rt>よほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです。</p><p>據天氣預報，聽說明天會下雨。降るそう，而不是降りそう。</p><h3>同一個字，接法決定意思</h3><p><mark class=\"study-key\">おいしそう</mark>：看起來好吃。<mark class=\"study-key\">おいしいそう</mark>：聽說好吃。<ruby>元気<rt>げんき</rt></ruby>そう：看起來精神好。<ruby>元気<rt>げんき</rt></ruby>だそう：聽說精神好。</p><p lang=\"ja\">このケーキはおいしそうです。／この<ruby>店<rt>みせ</rt></ruby>のケーキはおいしいそうです。</p><p>前句是眼前樣子的判斷，後句是轉述消息。</p><h3>否定與常見例外</h3><p>樣態：いい→<mark class=\"study-key\">よさそう</mark>；ない→なさそう；おいしくない→おいしくなさそう。動詞可用降りそうにない。</p><p lang=\"ja\"><ruby>今日<rt>きょう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>お</rt></ruby>りそうにありません。</p><p>今天看來不會下雨。傳聞否定則用降らないそうです＝聽說不下雨。</p><h3>よう的比喻：像……一樣</h3><p>名詞のような＋名詞；名詞のように＋動詞／形容詞。這是比喻，與推斷的焦點不同。</p><p lang=\"ja\"><ruby>星<rt>ほし</rt></ruby>のように<ruby>輝<rt>かがや</rt></ruby>く<ruby>目<rt>め</rt></ruby>。／<ruby>夢<rt>ゆめ</rt></ruby>のような<ruby>時間<rt>じかん</rt></ruby>。</p><p>像星星般閃亮的眼睛／如夢般的時光。ように修飾<ruby>輝<rt>かがや</rt></ruby>く；ような修飾<ruby>時間<rt>じかん</rt></ruby>。</p><h3>再看幾個例子</h3><p><ruby>赤<rt>あか</rt></ruby>ちゃんは<ruby>眠<rt>ねむ</rt></ruby>ったようです。＝嬰兒似乎睡著了。<br>このかばんは<ruby>丈夫<rt>じょうぶ</rt></ruby>そうです。＝這個袋看起來很耐用。<br><ruby>田中<rt>たなか</rt></ruby>さんは<ruby>学生<rt>がくせい</rt></ruby>だそうです。＝聽說田中是學生。<br><ruby>田中<rt>たなか</rt></ruby>さんは<ruby>来<rt>こ</rt></ruby>ないそうです。＝聽說田中不來。<br><ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>天使<rt>てんし</rt></ruby>のような人です。＝她是像天使一樣的人。</p><h3>容易混淆的地方</h3><p>ようだ不是「沒有親眼看才可用」；樣態そうだ也不只憑視覺。名詞通常不直接接樣態そう；「<ruby>学生<rt>がくせい</rt></ruby>だそうです」是傳聞，「<ruby>学生<rt>がくせい</rt></ruby>のようです」是判斷。</p><p class=\"grammar-reference\">文法核對參考：<a href=\"https://www.jpf.go.jp/j/project/japanese/teach/tsushin/grammar/201012.html\" target=\"_blank\" rel=\"noopener noreferrer\">國際交流基金・そうだ／ようだ／らしい（日文） ↗</p>","uploadedOriginal":"<p>[單元50] 表示樣態和傳聞的「よう」「そう」</p><p>學習目標</p><p>①　學會表示樣態的用法「よう」</p><p>②　學會表示樣態的用法「そう」</p><p>③　學會表示傳聞的用法「そう」</p><p>看到本單元的學習目標①，有沒有覺得很熟悉？沒錯，我們在這一單元中，依然會提到「よう」這項文法。「よう」在日文中具有很多功能，可以表達許多不同的意思，為了不讓各位感到混亂，因此我們將「よう」的所有用法，配合對照其他句型，分成數個單元講解。話雖如此，我們保證只要學完這一單元，往後短時間內將不會再出現和「よう」相關的句型用法。</p><p>本單元的重點為表示「樣態用法」的「よう」、以及表示「樣態和傳聞用法」的「そう」。首先，先解說一下什麼是「樣態」，意思是「東西事物的樣貌、形態、性質」；至於「樣態用法」，簡單來說就是「去推測某項事物的性質」，例如「這家餐廳的東西好像很難吃」、「她看起來應該才三十歲吧」等等，翻成中文就是「好像…」。</p><p>我們先前也學過一項「樣態用法」，就是「らしい」。</p><p>「らしい」</p><p>例：彼は最近忙しいらしい。</p><p>（他最近似乎很忙。）</p><p>学食で食事をする人は少なくなったらしい。</p><p>（在學校餐廳吃飯的人似乎變少了。）</p><p>本單元我們將介紹另外二種「樣態用法」，分別為「よう」和「そう」。</p><p>雖然中文翻譯都是「好像…」，不過區分方法並不難，「よう」表示依據個人感覺的推測，相當於中文的「感覺起來好像…」，而「そう」則是根據眼前實際看到的事物進行推測，相當於中文的「看起來好像…」。更多具體說明，請參照後面篇幅。</p><p>最後是表示傳聞用法的「そう」。所謂的傳聞，翻譯成日常用語，就是「聽說…」的意思，例如「聽說明天停課一天」、「聽說小王結婚了」、「聽說股票又跌了」等等，主要用於表示經由他人口中所聽到的情報資訊。由於經常會和樣態用法的「そう」搞混，因此必須特別注意才行。</p><p>よう</p><p>「よう」主要用於推測某件事、某項東西的性質，需注意的是，「よう」只適用於沒有親眼看到該物品、只憑個人感覺進行推測的情況，相當於中文的「感覺起來像是…」。</p><p>另外，「よう」的使用範圍相當寬廣，前方幾乎可以接續任何詞種。在文法性質方面，「よう」和名詞的接續方法大致相同。</p><p>基本用法:</p><p>名詞　＋　の　＋　よう　だ／です。</p><p>い形容詞　＋　よう　だ／です。</p><p>な形容詞　＋　な　＋　よう　だ／です。</p><p>動詞常体　＋　よう　だ／です。</p><p>（感覺好像……）</p><p>例：</p><p>中島さんは、みんなに数学を教えてくれて、</p><p>まるで先生のようだ。</p><p>（中島先生教大家數學，簡直就像是老師一樣。）</p><p>あのカレー屋はニュースにも出たから、</p><p>相当おいしいようだね。</p><p>（那間咖哩店有上過新聞，感覺起來應該相當好吃吧。）</p><p>休日になると、士林夜市は不夜城になって、</p><p>かなり賑やかなようだ。</p><p>（一到假日，士林夜市就變成不夜城，感覺好像很熱鬧。）</p><p>赤ちゃんはやっと眠ったようだ。</p><p>（小寶寶好像終於睡著了。）</p><p>今日は蒸し暑くて、もうすぐ雨が降るようだな。</p><p>（今天很悶熱，感覺起來馬上就會下雨了。）</p><p>あなたに会えるなんて、まるで夢のようだ。</p><p>（能夠和你見面，簡直就像是作夢一樣。）</p><p>「よう」的後方，除了接續「だ／です」之外，也可以變成「ように」「ような」的形式，後面加上各式詞類、甚至加上一個句子，讓整句話的意思顯得更完整。</p><p>基本用法二 :</p><p>～ように　＋　い形容詞／な形容詞／動詞。</p><p>～ような　＋　名詞。</p><p>例：</p><p>冬なのに、真夏のように暑い。</p><p>（明明是冬天，卻像夏天一樣炎熱。）</p><p>お城のようにきれいなホテルに泊まってみたくない？</p><p>（想不想住住看像城堡一樣漂亮的旅館呢？）</p><p>子どもの目は星のようにキラキラ輝いている。</p><p>（小孩子的眼睛就像星星般閃爍著光芒。）</p><p>先生は太陽のように、周りの人を暖かくする。</p><p>（老師就像太陽一樣，溫暖周圍的人。）</p><p>彼女は優しくて天使のような人です。</p><p>（她十分溫柔，就像是天使一般。）</p><p>至於「よう」的否定形，只要將「よう」前面的字改為否定的「ない形」即可。</p><p>例：</p><p>楊さんは日本語が得意なようだ。</p><p>（楊先生好像很擅長日語。）</p><p>楊さんは日本語が得意ではないようだ。</p><p>（楊先生好像不擅長日語。）</p><p>赤ちゃんはやっと眠ったようだ。</p><p>（小寶寶好像終於睡著了。）</p><p>赤ちゃんはまだ眠っていないようだ。</p><p>（小寶寶好像還沒睡著。）</p><p>夢のようだ。</p><p>（好像作夢一樣。）</p><p>夢ではないようだ。</p><p>（好像不是作夢。）</p><p>そう</p><p>「そう」也用於推測某件事、某項東西的性質，值得注意的是，和「よう」完全不同，「そう」只適用於親眼看到、然後心中覺得「應該是這樣吧」的情形，相當於中文的「看起來像是…」。</p><p>由於「そう」同時具有表示「樣態」和「傳聞」二種功能，因此這裡要特別注意「そう」的文法性質，也就是「そう」以什麼方式和形容詞及動詞接續。另外，「そう」的前方一般也不會出現名詞，若要表示推測的話，會改用「名詞＋らしい」的形式。</p><p>基本用法:</p><p>い形容詞　－「い」＋　そう　だ。</p><p>な形容詞　＋　そう　だ／です。</p><p>動詞ます形　－「ます」＋　そう　だ。</p><p>（看起來好像……）</p><p>例：</p><p>このカレーライスは変な色をして、まずそうだね。</p><p>（這盤咖哩飯顏色怪怪的，看起來似乎很難吃。）</p><p>あの服は派手な刺繍が付いていて、値段が高そうだ。</p><p>（那件衣服上有華麗的刺繡，看起來似乎很貴。）</p><p>彼は一日中町をぶらぶら歩きまわって、暇そうだな。</p><p>（他整天在鎮上閒晃，看起來似乎很閒。）</p><p>上から見下ろして、夜市に人が大勢いて、賑やかそうだ。</p><p>（從上往下看，夜市有很多人，看起來好像很熱鬧。）</p><p>雷がゴロゴロ鳴って、もうすぐ雨が降りそうだ。</p><p>（傳來轟隆隆的打雷聲，看來似乎快下雨了。）</p><p>夜中になっても明かりが付いている。</p><p>彼はまた徹夜で仕事をしていそうだ。</p><p>（三更半夜燈還亮著，看來他又熬夜工作了。）</p><p>另外必須特別注意的是「そう」的否定用法，當「そう」用來表示「樣態（看起來像…）」時，否定用法變化方式為：</p><p>形容詞のない形－「い」＋「さ」＋そうだ。</p><p>動詞のない形－「い」＋そうだ。</p><p>例:</p><p>このカレーライスは変な色をして、</p><p>おいしくなさそうだね。</p><p>（這碗咖哩飯顏色怪怪的，看起來似乎不好吃。）</p><p>彼は一日中パソコンの前で仕事をしていて、</p><p>暇ではなさそうだね。</p><p>（他整天在電腦前工作，看起來似乎沒什麼空。）</p><p>今日は晴れて天気のいい日だ。雨が降らなそうだ。</p><p>（今天是晴朗的好天氣，看來似乎不會下雨。）</p><p>「よう」「そう」的區別方法</p><p>「よう」:</p><p>沒有當場實際看到，而是憑自己的感覺進行推測。</p><p>「そう」:</p><p>當場親眼看到，而根據當場看到的情形進行推測。</p><p>例：</p><p>雨が降るようです。</p><p>（覺得有些悶）感覺可能會下雨。</p><p>雨が降りそうです。</p><p>（看到天上烏雲密佈）看樣子可能會下雨。</p><p>彼は待ち合わせに遅れるようです。</p><p>（覺得他很忙碌，應該無法準時到）感覺他可能會遲到。</p><p>彼は待ち合わせに遅れそうです。</p><p>（知道他在路上塞車）看樣子他可能會遲到。</p><p>伝聞の「そう」</p><p>「そう」除了表示「樣態」之外，還能夠用來表示「傳聞」，也就是「從別人那裡聽說了什麼」，相當於中文的「聽說…」。</p><p>表示「傳聞」的「そう」，在接續形容詞和動詞時的方式，和表示「樣態」的「そう」不一樣，請特別注意。</p><p>另外，「傳聞」的「そう」經常和「～によると（根據…）」這個句型一起使用，形成「～によると、～そうだ（根據～，聽說會～）」的句型。</p><p>基本用法:</p><p>い形容詞＋　そう　だ。</p><p>な形容詞・名詞＋だ　そう　だ。</p><p>動詞常体＋　そう　だ。</p><p>（聽說…）</p><p>例:</p><p>あそこのレストランが美味しくて安いそうだ。</p><p>（聽說那間餐廳既好吃又便宜。）</p><p>新しく入ってきた編入生はきれいで、</p><p>スタイルもいいそうだよ。</p><p>（聽說新來的轉學生很漂亮、身材也很好喔。）</p><p>日本文化の授業を教える先生はよくテレビに出て、有名人だそうだよ。</p><p>（上日本文化課的老師經常上電視，聽說是個名人喔。）</p><p>彼は英語が下手だけど、英語の先生だそうだよ。</p><p>（雖然他的英文很破，不過聽說是英文老師喔。）</p><p>彼は仕事をしないで、家でごろごろしているそうだ。</p><p>（聽說他都不工作，整天在家裡閒晃。）</p><p>林さんは明日記者会見に出るそうだよ。</p><p>（聽說林先生明天要出席記者會。）</p>","noteRevision":"精修版","revisionReason":"已刪減離題鋪陳與重複文字，整理接續、例句及容易混淆的地方。頁末保留上傳原文供對照。","quiz":[{"prompt":"「看樣子快下雨」應說？","options":["雨が降りそうです。","雨が降るそうです。","雨が降ったそうです。","雨が降るでした。"],"answer":0,"explanation":"樣態用ます去ます：降り＋そう。"},{"prompt":"「聽說這家店很好吃」應說？","options":["この店はおいしそうです。","この店はおいしいそうです。","この店はおいしくそうです。","この店はおいしいなそうです。"],"answer":1,"explanation":"傳聞保留い形容詞普通形おいしい，再接そうです。"},{"prompt":"「看起來不太好吃」的形式是？","options":["おいしくないそうだ（樣態）","おいしいなさそうだ","あまりおいしくなさそうだ","おいしないようなだ"],"answer":2,"explanation":"樣態的形容詞否定用～くなさそう。おいしくないそう是聽說不好吃。"},{"prompt":"ようだ能否根據親眼所見作判斷？","options":["永遠不可以","只能據傳聞","只用於未來","可以，線索包含所見及其他資訊"],"answer":3,"explanation":"ようだ根據各種線索作判斷，不排除視覺證據。"}]}];</script><script>const main=document.querySelector('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>String(n).padStart(2,'0');
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const quizSessions=new Map();const verbChoices=new Map();let readerObserver;
function currentRoute(){const [page='home',id,mode]=location.hash.slice(1).split('/');return {page:page||'home',unit:UNITS.find(u=>u.id===Number(id)),mode:['guide','quiz'].includes(mode)?mode:'notes'};}
let catalogView='grid';try{if(localStorage.getItem('crystal-catalog-view')==='list')catalogView='list';}catch{}
const READING_KEY='crystal-last-unit';
let lastReadUnit=null,readingStored=true;
try{const saved=JSON.parse(localStorage.getItem(READING_KEY)||'null');if(saved&&Number.isInteger(saved.unitId)&&UNITS.some(u=>u.id===saved.unitId))lastReadUnit=saved.unitId;}catch{}
function rememberUnit(unit){lastReadUnit=unit.id;try{localStorage.setItem(READING_KEY,JSON.stringify({unitId:unit.id,updatedAt:Date.now()}));readingStored=true;}catch{readingStored=false;}}
function resumeReading(){const u=UNITS.find(u=>u.id===lastReadUnit);if(!u)return '';return `<section class="resume-reading" aria-label="上次閱讀"><div class="bookmark-mark" aria-hidden="true">栞</div><div class="resume-copy"><span class="eyebrow">上次閱讀 · UNIT ${num(u.id)}</span><h2>${esc(u.title)}</h2><p>${readingStored?'已記住上次開啟的單元；紀錄保存在此瀏覽器。':'此瀏覽器未能儲存紀錄；目前只在這次開啟期間保留。'}</p></div><a class="primary" href="#unit/${u.id}">繼續上次閱讀 <span aria-hidden="true">↗</span></a></section>`;}
const COMPLETED_KEY='crystal-completed-quizzes';
let completedUnits=new Set(),completionStored=true,progressFrame=0,badgeObserver;

function verbSteps(u){const state=verbState(u);const v=UNITS.find(x=>x.id===24).verbExamples[state.index];const mode=u.labMode;const final=v[mode];const reading=v[mode+'Reading'];const rule=mode==='te'?v.teRule:mode==='nai'?v.naiRule:'先變て形，再把て→た、で→だ';const middle=mode==='ta'?`${v.word} → ${v.te} → ${final}`:rule;let sentence=v.sentence,translation=v.translation;

async function switchTheme(){
 if(themeBusy)return;
 themeBusy=true;themeButton.disabled=true;
 const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
 let curtain;
 try{
  if(reduceMotion()||typeof document.documentElement.animate!=='function'){applyTheme(next);return;}
  curtain=document.createElement('div');curtain.className='silk-transition '+(next==='dark'?'silk-night':'silk-day');curtain.setAttribute('aria-hidden','true');
  curtain.innerHTML='<div class="silk-caption"><span class="silk-symbol">'+(next==='dark'?'夜':'光')+'</span><span class="silk-caption-label">'+(next==='dark'?'MIDNIGHT · 深色主題':'DAYLIGHT · 淺色主題')+'</span></div>';
  const bands=Array.from({length:6},(_,i)=>{const band=document.createElement('div');band.className='silk-band';band.style.setProperty('--band',i);curtain.appendChild(band);return band;});
  document.body.appendChild(curtain);
  await Promise.all(bands.map((band,i)=>band.animate([{transform:'translateY(-103%)'},{transform:'translateY(0)'}],{duration:460,delay:i*42,easing:'cubic-bezier(.65,0,.2,1)',fill:'forwards'}).finished));
  // Every opaque band is now in place. Only change the palette behind the closed curtain.
  applyTheme(next);
  const caption=curtain.querySelector('.silk-caption');
  await caption.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:190,easing:'ease-out',fill:'forwards'}).finished;
  await Promise.all([caption.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-12px)'}],{duration:240,fill:'forwards'}).finished,...bands.map((band,i)=>band.animate([{transform:'translateY(0)'},{transform:'translateY(103%)'}],{duration:520,delay:(5-i)*38,easing:'cubic-bezier(.65,0,.2,1)',fill:'forwards'}).finished)]);
 }catch{applyTheme(next);}finally{curtain?.remove();themeBusy=false;themeButton.disabled=false;}
}
themeButton.addEventListener('click',switchTheme);updateThemeLabel();render();main.classList.add('entering');

 catalogBusy=true;const buttons=[...document.querySelectorAll('[data-catalog-view]')];
 buttons.forEach(b=>b.disabled=true);collection.classList.add('reflowing');
 const visible=()=>[...collection.querySelectorAll('.unit-card')].filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;});
 const animate=(el,frames,options)=>el.animate(frames,options).finished.catch(()=>{});
 const commit=()=>{catalogView=next;collection.classList.toggle('catalog-list',next==='list');collection.classList.toggle('catalog-grid',next==='grid');try{localStorage.setItem('crystal-catalog-view',next);}catch{}buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.catalogView===next)));};
 try{
  if(reduceMotion()||!collection.animate){commit();return;}
  await Promise.all(visible().map((el,i)=>animate(el,[{opacity:1,transform:'translateY(0) rotateX(0deg)'},{opacity:0,transform:'translateY(-8px) rotateX(7deg)'}],{duration:180,delay:Math.min(i,6)*12,easing:'ease-in',fill:'forwards'})));
  if(!collection.isConnected)return;
  collection.querySelectorAll('.unit-card').forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  commit();collection.classList.add('ink-reveal');
  await Promise.all(visible().map((el,i)=>animate(el,[{opacity:0,transform:'perspective(900px) translateY(18px) rotateX(-12deg)',filter:'blur(2px)'},{opacity:1,transform:'perspective(900px) translateY(0) rotateX(0deg)',filter:'blur(0px)'}],{duration:560,delay:Math.min(i,9)*24,easing:'cubic-bezier(.16,1,.3,1)'})));
 }catch{if(collection.isConnected)commit();}finally{
  collection.querySelectorAll('.unit-card').forEach(el=>el.getAnimations?.().forEach(a=>a.cancel()));
  collection.classList.remove('reflowing','ink-reveal');buttons.forEach(b=>b.disabled=false);catalogBusy=false;
  const status=document.getElementById('catalog-status');if(status)status.textContent=`已切換為${catalogView==='list'?'列表':'方塊'}目錄`;if(collection.isConnected)buttons.find(b=>b.dataset.catalogView===catalogView)?.focus({preventScroll:true});
 }
}

// Browser fullscreen remains user initiated, and follows Escape / native exits.
const fullscreenButton=document.getElementById('fullscreen-toggle');
const fullscreenStatus=document.getElementById('fullscreen-status');
let fullscreenBusy=false;
function isFullscreen(){return Boolean(document.fullscreenElement||document.webkitFullscreenElement);}
function updateFullscreen(){const active=isFullscreen();fullscreenButton.innerHTML=`<span aria-hidden="true">${active?'⤢':'⛶'}</span><span>${active?'退出全螢幕':'全螢幕'}</span>`;fullscreenButton.setAttribute('aria-label',active?'退出全螢幕':'進入全螢幕');fullscreenButton.setAttribute('aria-pressed',String(active));}
async function toggleFullscreen(){if(fullscreenBusy)return;fullscreenBusy=true;fullscreenButton.disabled=true;fullscreenStatus.textContent='';try{if(isFullscreen()){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);}else{const enter=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(!enter){fullscreenStatus.textContent='此瀏覽器暫不支援網頁全螢幕。';return;}await enter.call(document.documentElement);}}catch{fullscreenStatus.textContent='未能進入全螢幕，請在獨立瀏覽器分頁開啟後再試。';}finally{fullscreenBusy=false;fullscreenButton.disabled=false;updateFullscreen();}}
fullscreenButton.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',updateFullscreen);
document.addEventListener('webkitfullscreenchange',updateFullscreen);
updateFullscreen();

window.addEventListener('scroll',scheduleReadingProgress,{passive:true});
window.addEventListener('resize',scheduleReadingProgress,{passive:true});
document.addEventListener('toggle',scheduleReadingProgress,true);
document.addEventListener('click',e=>{const link=e.target.closest('[data-volume]');if(link&&link.getAttribute('href')===location.hash){e.preventDefault();scrollToVolume();}});
if('ResizeObserver' in window)new ResizeObserver(scheduleReadingProgress).observe(main);
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('page-hidden',document.hidden));
scrollToVolume();scheduleReadingProgress();

const furiganaButton=document.getElementById('furigana-toggle');
function updateFuriganaButton(){const on=document.documentElement.dataset.furigana!=='off';furiganaButton.innerHTML=`<span aria-hidden="true">${on?'あ':'漢'}</span><span>假名 ${on?'開':'關'}</span>`;furiganaButton.setAttribute('aria-label',on?'隱藏漢字上的平假名':'顯示漢字上的平假名');furiganaButton.setAttribute('aria-pressed',String(on));}
furiganaButton.addEventListener('click',()=>{const next=document.documentElement.dataset.furigana==='off'?'on':'off';document.documentElement.dataset.furigana=next;try{localStorage.setItem('crystal-furigana',next);}catch{}updateFuriganaButton();});
updateFuriganaButton();
</script></body></html>
