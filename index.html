<div id="reading-progress" class="reading-progress" role="progressbar" aria-label="本頁閱讀進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><div class="reading-progress-caption"><span id="reading-progress-label"></span><span id="reading-progress-value">0%</span></div><div class="reading-progress-track"><span id="reading-progress-fill"></span></div></div><div class="workspace"><header><a href="#home">日本語の時間</a><span class="edition">VOLUME 01–05 <b>／</b> 單元 01–50</span><button id="furigana-toggle" class="theme-toggle furigana-toggle" type="button" aria-label="隱藏漢字上的平假名" aria-pressed="true">あ 假名 開</button><button id="fullscreen-toggle" class="theme-toggle fullscreen-toggle" type="button" aria-label="進入全螢幕" aria-pressed="false">⛶ 全螢幕</button><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換至深色主題">☾ 深色</button><span class="avatar" aria-label="Crystal">C</span></header><div id="fullscreen-status" class="fullscreen-status" role="status" aria-live="polite"></div><main id="main" tabindex="-1"></main><footer><span>Crystal 日文之路 · v5.3｜50 課・200 題</span><span>筆記由 Nelson 提供 · 逐步向 N4 前進</span></footer></div><script>const UNITS = [{"id":1,"title":"六種品詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">認識六種常用品詞，能辨認它們在句中的角色。這是入門分類，不是日文所有品詞的完整清單。</p><h3>名詞：人、事、物與時間</h3><p>私（我）、学生（學生）、犬（狗）、部屋（房間）、地震（地震）、午後（下午）。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。＝我是學生。</p><h3>形容詞：描述性質或狀態</h3><p><ruby>美<rt>うつく</rt></ruby>しい<ruby>花<rt>はな</rt></ruby>＝美麗的花；きれいな<ruby>部屋<rt>へや</rt></ruby>＝乾淨的房間。<br>日文有い<mark class=\"study-key\">形容詞</mark>與な<mark class=\"study-key\">形容詞</mark>，詳細變化在第7課。</p><h3>動詞：動作、存在或變化</h3><p><ruby>走<rt>はし</rt></ruby>る（跑）、話す（說）、<ruby>寝<rt>ね</rt></ruby>る（睡）、ある（有）。<br>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。＝吃飯。動作的對象ご飯放在<mark class=\"study-key\">動詞</mark>前，以を連接。</p><h3>副詞：補充方式、程度等資訊</h3><p>ゆっくり<ruby>歩<rt>ある</rt></ruby>く＝慢慢走；とても<ruby>美<rt>うつく</rt></ruby>しい＝非常美麗。<br><mark class=\"study-key\">副詞</mark>可修飾<mark class=\"study-key\">動詞</mark>、形容詞等；不必硬套中文「地」的形式。</p><h3>接續詞：連接句子</h3><p>そして（<ruby>然<rt>しか</rt></ruby>後／而且）、でも（但是）、だから（所以）。<br><ruby>雨<rt>あめ</rt></ruby>です。だから、<ruby>家<rt>いえ</rt></ruby>にいます。＝下雨了，所以留在家裡。</p><h3>助詞：標示句子關係與語氣</h3><p>は提示主題；を標示動作對象；と表示「和」等關係；か<ruby>可<rt>か</rt></ruby>放在句末提問。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>寿司<rt>すし</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。＝我吃壽司。<br>日文<mark class=\"study-key\">助詞</mark>通常接在相關詞語後面，不能只逐字翻譯。</p><h3>標點小提醒</h3><p><ruby>林<rt>はやし</rt></ruby>さんは<ruby>学生<rt>がくせい</rt></ruby>ですか。／<ruby>林<rt>はやし</rt></ruby>さんは<ruby>学生<rt>がくせい</rt></ruby>ですか？都能表示問句。日文也使用「」等標點，不只有逗號與句號。</p>","symbol":"言葉","intro":"從六種角色，認識一句日文。","tag":"詞類・入門","concepts":[["名詞與形容詞","<mark class=\"study-key\">名詞</mark>指人物、事物或事件；<mark class=\"study-key\">形容詞</mark>描述它們的性質。","きれいな<ruby>部屋<rt>へや</rt></ruby>","乾淨的房間。きれい是<mark class=\"study-key\">形容詞</mark>，部屋是名詞。"],["動詞與副詞","<mark class=\"study-key\">動詞</mark>表達動作、狀態或存在；<mark class=\"study-key\">副詞</mark>修飾動詞或形容詞等。","<ruby>速<rt>はや</rt></ruby>く<ruby>走<rt>はし</rt></ruby>る","快速地跑。走る是<mark class=\"study-key\">動詞</mark>，速く修飾跑步的方式。"],["接續詞與助詞","<mark class=\"study-key\">接續詞</mark>連接句子；<mark class=\"study-key\">助詞</mark>標示詞語之間的關係，或補充說話語氣。","<ruby>寿司<rt>すし</rt></ruby>と<ruby>刺身<rt>さしみ</rt></ruby>","壽司和刺身。「と」連接兩個<mark class=\"study-key\">名詞</mark>。"]],"caution":"這六類是入門整理，並非日文所有品詞。中文「的／地」只是理解提示，不是判斷日文詞類的規則。","quiz":[{"prompt":"「猫」主要屬於哪種詞類？","options":["名詞","動詞","副詞","接續詞"],"answer":0,"explanation":"猫是動物的名稱，所以是名詞。"},{"prompt":"「静かに寝る」中，静かに的作用是甚麼？","options":["表示睡覺的人","描述睡覺的方式","把兩句連接起來","提出疑問"],"answer":1,"explanation":"静かに修飾動詞寝る，說明是安靜地睡覺。","rubyView":{"prompt":"「<ruby>静<rt>しず</rt></ruby>かに<ruby>寝<rt>ね</rt></ruby>る」中，静かに的作用是甚麼？","options":["表示睡覺的人","描述睡覺的方式","把兩句連接起來","提出疑問"],"explanation":"静かに修飾動詞寝る，說明是安靜地睡覺。"}},{"prompt":"哪一個是表示「吃」的動詞？","options":["おいしい","そして","食べる","ご飯"],"answer":2,"explanation":"食べる表示吃的動作；ご飯是名詞，おいしい是形容詞。"},{"prompt":"「パンと牛乳」中的と有甚麼作用？","options":["表示過去","形容牛奶","表示否定","連接兩個名詞"],"answer":3,"explanation":"と是助詞，在這裡把麵包和牛奶並列。","rubyView":{"prompt":"「パンと<ruby>牛乳<rt>ぎゅうにゅう</rt></ruby>」中的と有甚麼作用？","options":["表示過去","形容牛奶","表示否定","連接兩個名詞"],"explanation":"と是助詞，在這裡把麵包和牛奶並列。"}}],"uploadedOriginal":"<h3>[ 單元1 ] 六種品詞</h3><h3>學習目標</h3><h3>簡單了解什麼是</h3><p>「名詞」「動詞」「形容詞」「副詞」「連接詞」「助詞」</p><p>請大家回憶一下國高中時，在課堂上學習英文的情形。相信每個人在語言學習上都有感到頭痛的部分，像是記住單字片語、或是發音。而包括我在內，幾乎所有初學者，都會在學習文法時為了同一個問題頭痛不已:語言學專有名詞太多啦！！</p><p>讓我們回憶一下這些字:「關係子句」「受詞補語」「先行詞」「形式名詞」「不定詞」「及物不及物」，有多少人可以清楚告訴我們這些字彙的明確定義嗎？這些其實是用在學術研究上的詞彙，如果用在初級學習階段的話，對於初學者將是一大折磨。因為在研讀文法之前，得先將這些艱澀名詞全部弄懂才行，就像在學開車前，被迫要先學會拆解引擎一樣，往往在開始學之前，就耗費了許多無謂的精力。</p><p>同樣地，日文當中，也有這種艱澀語言學名詞，而且數量還不少。但是，對於學習日文來說並沒有助益。因此，我們將複雜的文法專有名詞大大地簡化，學習者只要了解以下六種基本的專有名詞，就可以立刻開始進行高效率的日語學習。</p><p>別擔心，這些字你一定聽過，我們保證十分鐘內就能夠完全了解！</p><h3>六種品詞種類</h3><h3>Ⅰ  名詞</h3><h3>表示人物東西或事件的字彙</h3><p>中文: 我  學生  下午  晚餐  電腦  小狗  房間</p><h3>地震</h3><p>日文:  私　学生　午後　夕飯　パソコン　犬　部屋 　地震</p><h3>Ⅱ  形容詞</h3><p>用來形容名詞，表示其狀況、狀態的字彙。在中文當中，形容詞後面會接「的」。</p><p>中文: 美麗的花  雄偉的房子  愉快的下午</p><h3>活潑的小狗  乾淨的房間</h3><p>日文: 美しい花　立派な屋敷　楽しい午後</p><h3>活発な犬　きれいな部屋</h3><h3>Ⅲ  動詞</h3><p>表示動作的字彙。</p><p>中文: 跑步  說話  吃飯  買東西  玩遊戲  睡覺</p><p>日文: 走る　話す　ご飯を食べる　買い物する</p><h3>ゲームをする　寝る</h3><h3>Ⅳ  副詞</h3><p>形容詞用以形容「名詞」，副詞則用以形容「形容詞」及「動詞」。中文當中，副詞後面會接「地」。</p><p>中文:（副詞+動詞）</p><h3>快速地跑步  熱烈地談話 靜靜地睡覺</h3><p>（副詞+形容詞）</p><h3>非常美麗的花  相當乾淨的房間</h3><p>日文:（副詞+動詞）</p><h3>速く走る　賑やかに喋る　静かに寝る</h3><p>（副詞+形容詞）</p><h3>非常に美しい花  かなりきれいな部屋</h3><p>Ⅴ  接續詞（連接詞）</p><p>用來連接句子和句子的字彙。</p><p>中文: 所以  然後  而且  但是  不過  對了</p><p>日文: だから　そして　それに　でも　しかし</p><h3>そういえば</h3><h3>Ⅵ  助詞</h3><p>不具有單獨意思的字彙。無法單獨使用，一般會接在其他詞類的後面。</p><p>中文: 睡著了  他是學生嗎  出去玩吧</p><p>日文: 私は犬が好きです。日本へ遊びに行きます。</p><p>寿司と刺身を食べる。</p><p>註：這裡的中日文沒有對應，僅列舉中文和日文中的常用助詞。</p><p>隨著學習進度的成長以及文法的加深，除了以上六種品詞外，還會出現其他以六種品詞為基礎的變化類型。不過，概念及用字絕對淺顯易懂，不會出現任何像「受詞補語」這種讓人有看沒有懂的艱澀詞彙。因此，只要了解以上六種品詞所代表的意義，往後你就沒有必要煩惱看不懂任何文法解說了。</p><h3>【日文小知識】</h3><p>在傳統日文中，標點符號只有逗號「、」和句號「。」二種，不過由於受到西方文化的影響，現在的日文也會使用問號、驚嘆號等等標點符號。因此，日文的疑問句最後使用句號或問號、都是正確的寫法喔！</p><p>例：</p><p>◯　林さんは学生ですか。  ◯　林さんは学生ですか？</p><p>（林先生是學生嗎？）</p><p>不過，在很正式的商業文書中，還是會傾向只使用逗號和句號，這一點要特別注意～</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":2,"title":"三種句型構造","original":"<h3>學習目標</h3><p class=\"lesson-focus\">從<mark class=\"study-key\">句末</mark>的述語認識<mark class=\"study-key\">名詞句</mark>、形容詞句、動詞句，掌握基本語序。</p><h3>名詞句：說明是甚麼</h3><p><mark class=\"study-key\">AはBです</mark>。は讀作wa，提示談論的主題。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。＝我是學生。<br>これはパソコンです。＝這是電腦。</p><h3>形容詞句：說明怎麼樣</h3><p>名詞は形容詞です。<br><ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いです。＝今天很冷。<br><ruby>夜市<rt>やじ</rt></ruby>は<ruby>賑<rt>にぎ</rt></ruby>やかです。＝夜市很熱鬧。<br>な形容詞在です前<mark class=\"study-key\">不加な</mark>：静かです，不是静かなです。</p><h3>動詞句：說明做甚麼或發生甚麼</h3><p><ruby>私<rt>わたし</rt></ruby>はご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。＝我吃飯。<br><ruby>妹<rt>いもうと</rt></ruby>がコップを<ruby>割<rt>わ</rt></ruby>りました。＝妹妹打破了杯子。<br>日文的述語通常在<mark class=\"study-key\">句末</mark>；時間、場所和動作對象放在前面，以助詞連接。</p><h3>讀句子的步驟</h3><p>先找<mark class=\"study-key\">句末</mark>述語，再找「誰／甚麼」「做甚麼」「在哪裡」。語境清楚時，主題可以省略。三種句型是入門骨架，不表示所有句子都必須明寫は。</p>","symbol":"骨格","intro":"先看句尾，再看一句話怎樣組成。","tag":"句型・結構","concepts":[["名詞句","告訴對方「<mark class=\"study-key\">是甚麼</mark>」。名詞後可接です，形成禮貌的表達。","<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。","我是學生。句子的核心是「學生」。"],["形容詞句","描述某個人或事物「<mark class=\"study-key\">怎麼樣</mark>」。","<ruby>今日<rt>きょう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いです。","今天很冷。寒い描述今天的天氣。"],["動詞句","動詞通常放在<mark class=\"study-key\">句尾</mark>，前面交代誰、甚麼事物等資訊。","<ruby>私<rt>わたし</rt></ruby>はご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。","我吃飯。食べます是動詞。"]],"caution":"看的是述語的核心，不是最後一個字是否為名詞。日文可以省略語境已清楚的主題，不必每句都說「私は」。","quiz":[{"prompt":"「これは本です。」屬於哪類句子？","options":["動詞句","名詞句","形容詞句","沒有述語的句子"],"answer":1,"explanation":"核心述語是名詞本，後接です，所以是名詞句。","rubyView":{"prompt":"「これは<ruby>本<rt>ほん</rt></ruby>です。」屬於哪類句子？","options":["動詞句","名詞句","形容詞句","沒有述語的句子"],"explanation":"核心述語是名詞本，後接です，所以是名詞句。"}},{"prompt":"哪句是在描述事物的性質？","options":["水を飲みます。","これは水です。","水は冷たいです。","水を買います。"],"answer":2,"explanation":"冷たい是形容詞，說明水是冷的。"},{"prompt":"選出符合本課基本句型的日文語序。","options":["私は読みます本を。","本私は読みますを。","読みます私はを本。","私は本を読みます。"],"answer":3,"explanation":"基本順序是主題、動作對象、動詞。読みます放在句尾。"},{"prompt":"「犬は寝ます。」的句子核心是甚麼？","options":["動詞寝ます","名詞犬","助詞は","形容詞"],"answer":0,"explanation":"雖然句子裡有名詞犬，但述語寝ます是動詞，屬於動詞句。","rubyView":{"prompt":"「<ruby>犬<rt>いぬ</rt></ruby>は<ruby>寝<rt>ね</rt></ruby>ます。」的句子核心是甚麼？","options":["動詞寝ます","名詞犬","助詞は","形容詞"],"explanation":"雖然句子裡有名詞犬，但述語寝ます是動詞，屬於動詞句。"}}],"uploadedOriginal":"<h3>[ 單元2 ] 三種句型構造</h3><h3>學習目標</h3><p>理解語言（包括日文）中的主要句型構成:</p><h3>名詞句、形容詞句、動詞句</h3><p>每位學習外文（包括日文、英文或其他語言）的人，相信一定經常為了複雜的文法句型而感到頭痛吧。千變萬化的文法、助詞位置、句子構成，看起來似乎毫無規則可循，只能見一個記一個，像是不斷重覆循環的無限迴圈。但是，其實所有的句子、每一句你所聽到的外語，都能夠簡單歸納為三種主要類型，稱為:「名詞句」、「形容詞句」、以及「動詞句」。以下以日文為對象進行介紹。</p><h3>名詞句</h3><p>日文中以名詞結尾的句子。</p><p>典型句型：「名詞　は　名詞　です。」</p><p>例:（中文）我是學生    這是電腦    這支手機是iPhone</p><p>（日本語）私は学生です。　これはパソコンです。</p><p>このケータイはiPhoneです。</p><h3>形容詞句</h3><p>日文中以形容詞結尾的句子。</p><p>典型句型：「名詞　は　形容詞　です。」</p><p>例:（中文）我很開心  夜市很熱鬧  今天很冷</p><h3>小狗很大隻</h3><p>（日本語）私は嬉しいです。　夜市は賑やかです。</p><p>今日は寒いです。 犬は大きいです。</p><h3>動詞句</h3><p>由動詞構成的句子。在中文中，動詞位於句中；在日文中，動詞句的動詞則位於句尾。</p><p>典型句型:「名詞　は　動詞　。」</p><p>例:（中文）我吃飯  樹葉掉了 小貓睡著了</p><h3>妹妹打破杯子</h3><p>（日本語）私はご飯を食べます。　葉が落ちます。</p><p>猫は眠った。　妹はコップを割った。</p><p>不過，為什麼我們必須再花費時間，了解上述三種句型呢？</p><p>首先，無論是多麼複雜的日文句子，原則上都是以這三種句型為基礎所構成的。雖然根據說話內容的不同，句子長度可能會增加、文法也可能變得複雜，但是了解以上三種句型後，就不致於產生混亂和無力感。如同構成人體的骨架一般，雖然每個人長相都不一樣，但是骨骼的形狀卻大同小異。</p><p>其次，可以幫助學習文法。像是日文當中難以掌握使用時機的「名詞化」，最有效的區別方法，就是以上面介紹的三種句型判別，屬於名詞的部分，就必須名詞化。另外，日文的語言系統不同於中文（屬於膠著語），因此日文句子當中的語順能夠自由變動，若具備基礎句型的概念，就不容易陷入混亂。</p><p>最後，學習這些句型並不會花費多少時間，但是卻是重要的基礎，時間投資報酬率很高。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":3,"title":"三項基礎日文句型","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用名詞句表達「是」「不是」和「是嗎」。</p><h3>肯定：AはBです</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。＝我是學生。<br><ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>社長<rt>しゃちょう</rt></ruby>です。＝她是社長。<br>は提示主題，です讓句子成為<mark class=\"study-key\">禮貌表達</mark>。</p><h3>否定：AはBではありません</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>ではありません。＝我不是學生。<br><ruby>彼<rt>かれ</rt></ruby>は<ruby>教師<rt>きょうし</rt></ruby>ではありません。＝他不是老師。<br>會話也常用ではないです／じゃないです。</p><h3>疑問：AはBですか</h3><p><ruby>林<rt>はやし</rt></ruby>さんは<ruby>教師<rt>きょうし</rt></ruby>ですか。＝林先生／小姐是老師嗎？<br>か是<mark class=\"study-key\">句末助詞</mark>；本課用它提問。</p><h3>自然回答</h3><p>はい、そうです。＝是的，沒錯。<br>いいえ、<ruby>違<rt>ちが</rt></ruby>います。<ruby>学生<rt>がくせい</rt></ruby>です。＝不，我是學生。<br>也可完整回答：はい、<ruby>私<rt>わたし</rt></ruby>は<ruby>教師<rt>きょうし</rt></ruby>です。／いいえ、<ruby>教師<rt>きょうし</rt></ruby>ではありません。<br>對話中知道對方姓名時，常用姓名＋さん或省略稱呼，不必每句使用あなた。</p>","symbol":"はじめ","intro":"用三個句型，開始介紹自己。","tag":"肯定・否定・疑問","concepts":[["說「是」","名詞 は 名詞 です。作為助詞的「は」讀作wa。","<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。","我是學生。"],["說「不是」","將です換成<mark class=\"study-key\">ではありません</mark>。","<ruby>私<rt>わたし</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>ではありません。","我不是學生。"],["問「是嗎？」","在です後面加疑問助詞か。","<ruby>学生<rt>がくせい</rt></ruby>ですか。","是學生嗎？可以回答：はい、そうです。／いいえ、違います。"]],"caution":"本單元的否定方式適用於名詞句；い形容詞的否定變化，會在單元七另行學習。","quiz":[{"prompt":"要說「我是老師」，哪句正確？","options":["私は先生ですか。","私は先生ではありません。","私は先生です。","私は先生をです。"],"answer":2,"explanation":"名詞は名詞です，是名詞肯定句。"},{"prompt":"將「彼は学生です。」改為否定。","options":["彼は学生ですか。","彼は学生くありません。","彼は学生ません。","彼は学生ではありません。"],"answer":3,"explanation":"名詞句的否定用ではありません。","rubyView":{"prompt":"將「<ruby>彼<rt>かれ</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>です。」改為否定。","options":["彼は学生ですか。","彼は学生くありません。","彼は学生ません。","彼は学生ではありません。"],"explanation":"名詞句的否定用ではありません。"}},{"prompt":"要問「是醫生嗎？」，應用哪句？","options":["医者ですか。","医者ではありません。","医者です。","医者をです。"],"answer":0,"explanation":"です後面加か，形成疑問句。"},{"prompt":"對方問「学生ですか。」你確實是學生，可以回答？","options":["いいえ、違います。","はい、そうです。","いいえ、学生ではありません。","はい、違います。"],"answer":1,"explanation":"はい、そうです表示「是的，沒錯」。","rubyView":{"prompt":"對方問「<ruby>学生<rt>がくせい</rt></ruby>ですか。」你確實是學生，可以回答？","options":["いいえ、違います。","はい、そうです。","いいえ、学生ではありません。","はい、違います。"],"explanation":"はい、そうです表示「是的，沒錯」。"}}],"uploadedOriginal":"<h3>[ 單元3 ] 三項基礎日文句型</h3><h3>單元3    三項基礎日文句型</h3><h3>學習目標</h3><p>①　學會日文中最基礎的三句型:肯定句、否定句、疑問句<br>②　具體學會以下用法:</p><p>＊私は社長です。社員ではありません。</p><p>＊彼は学生です。教師ではありません。</p><p>＊あなたは教師ですか。はい、そうです。</p><p>＊あなたは学生ですか。いいえ、違います。</p><h3>肯定句</h3><p>句型一：「（名詞）は（名詞）です。」</p><p>日文中的肯定句。相當於中文的「～是～」。<br>.</p><p>例：</p><p>私は学生です。    （我是學生。）</p><p>あなたは教師です。  （你是老師。）</p><p>彼は社員です。      （他是社員。）</p><p>彼女は社長です。  （她是社長。）</p><h3>否定句</h3><p>句型二：「（名詞）は（名詞）では ありません。」</p><p>日文中的否定句。相當於中文的「～不是～」。</p><p>例：</p><p>私は学生ではありません。   （我不是學生。）</p><p>あなたは教師ではありません。（你不是老師。）</p><p>彼は社員ではありません。    （他不是社員。）</p><p>彼女は社長ではありません。（她不是社長。）</p><h3>疑問句</h3><p>句型三：「（名詞）は（名詞）ですか。」</p><p>日文中的疑問句。相當於中文的「～是～嗎？」。</p><p>在肯定句「～は～です。」的最後加上表示問句的疑問詞「か」，就變成了疑問句。「か」相當於中文中的「嗎」「呢」「吧」，用於問句的句尾。</p><p>例：</p><p>あなたは教師ですか。（你是老師嗎？）</p><p>彼は社員ですか。    （他是社員嗎？）</p><p>彼女は社長ですか。 （她是社長嗎？）</p><p>回答問句時，則使用以下的慣用句，或直接重覆問句</p><p>（如例句）：</p><p>肯定的情況： はい、そうです。（是的，沒錯。）</p><p>否定的情況： いいえ、違います。（不，不是。）</p><p>例：</p><p>あなたは教師ですか。（你是老師嗎？）</p><p>はい、そうです。       （是，沒錯。）</p><p>はい、私は教師です。（是，我是老師。）</p><p>いいえ、違います。     （不，不是。）</p><p>いいえ、私は教師ではありません。（不，我不是老師。）</p><p>いいえ、私は学生です。　（不，我是學生。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":4,"title":"日本語の「こ・そ・あ・ど」","original":"<h3>學習目標</h3><p class=\"lesson-focus\">按位置選擇「這個／那個／哪個」，並區分事物、地點與名詞前的指示詞。</p><h3>こ・そ・あ・ど</h3><p>こ：靠近說話者；そ：靠近聽話者；あ：離雙方都遠；ど：提問。<br>指事物：<mark class=\"study-key\">これ</mark>／<mark class=\"study-key\">それ</mark>／あれ／どれ。<br>指地方：ここ／そこ／あそこ／どこ。<br>接名詞：この／その／あの／どの＋名詞。<br>這是眼前位置的基本用法；指向對話中提過的事物時，還要看語境。</p><h3>事物與位置</h3><p>これは<ruby>小説<rt>しょうせつ</rt></ruby>です。＝這是小說。<br>それは何ですか。＝那是甚麼？<br><ruby>私<rt>わたし</rt></ruby>のかばんはどれですか。＝我的袋是哪一個？<br>ここは<ruby>学校<rt>がっこう</rt></ruby>です。＝這裡是學校。<br><ruby>駅<rt>えき</rt></ruby>はどこですか。＝車站在哪裡？<br>「あれは<ruby>学校<rt>がっこう</rt></ruby>です」指遠處那棟建築是學校，也自然；不能把學校、醫院等名詞一律限制成ここ／そこ。</p><h3>指示詞直接接名詞</h3><p>この<ruby>犬<rt>いぬ</rt></ruby>＝這隻狗；その車＝那輛車；あの人＝那個人；どの<ruby>本<rt>ほん</rt></ruby>＝哪一本書。<br>この是一整個用語，不寫成これ犬或これの犬。</p><h3>用の表達所屬</h3><p>これは<ruby>私<rt>わたし</rt></ruby>のノートです。＝這是我的筆記本。<br>このノートは<ruby>私<rt>わたし</rt></ruby>のです。＝這本筆記本是我的。<br>それは<ruby>誰<rt>だれ</rt></ruby>のパソコンですか。＝那是誰的電腦？<br>後面名詞已清楚時，私の後可省略ノート。</p><h3>換人說話，指示詞也會改變</h3><p>A拿著書問：これは何ですか。<br>B回答：それは<ruby>小説<rt>しょうせつ</rt></ruby>です。<br>同一本書靠近A、遠離B，所以A用これ，B用それ。</p>","symbol":"こそあど","intro":"由你的位置，找到適合的指示詞。","tag":"事物・地點・所屬","concepts":[["這個、那個、哪個","<mark class=\"study-key\">これ</mark>：近自己；<mark class=\"study-key\">それ</mark>：近對方；あれ：離雙方都遠；どれ：詢問哪個。","これは<ruby>私<rt>わたし</rt></ruby>のノートです。","這是我的筆記本。の表示所屬。"],["這裡、那裡、哪裡","指地點時用<mark class=\"study-key\">ここ</mark>、そこ、あそこ、<mark class=\"study-key\">どこ</mark>。","<ruby>学校<rt>がっこう</rt></ruby>はどこですか。","學校在哪裡？"],["直接接名詞","<mark class=\"study-key\">この</mark>・<mark class=\"study-key\">その</mark>・あの・どの後面必須接名詞，不能寫「これ犬」。","このノートは<ruby>私<rt>わたし</rt></ruby>のです。","這本筆記本是我的。"]],"caution":"「<mark class=\"study-key\">これ</mark>は私の学校です」可用來介紹照片中的學校或學校建築，不能一概判錯。這裡先掌握雙方位置不同的基本情境。","quiz":[{"prompt":"一枝筆靠近對方、離你較遠，你指著它說甚麼？","options":["これ","あれ","どれ","それ"],"answer":3,"explanation":"それ指靠近聽話者的東西。"},{"prompt":"要說「這本書」，哪個正確？","options":["この本","これ本","ここ本","この"],"answer":0,"explanation":"この後面要接名詞；これ則可以單獨指事物。"},{"prompt":"問洗手間在哪裡：トイレは＿＿ですか。","options":["どれ","どこ","だれ","この"],"answer":1,"explanation":"どこ用來問地點。"},{"prompt":"「これは私のかばんです。」是甚麼意思？","options":["這是你的袋。","這裡有我的袋。","這是我的袋。","我的袋是哪個？"],"answer":2,"explanation":"私の表示「我的」；これは表示「這個是」。","rubyView":{"prompt":"「これは<ruby>私<rt>わたし</rt></ruby>のかばんです。」是甚麼意思？","options":["這是你的袋。","這裡有我的袋。","這是我的袋。","我的袋是哪個？"],"explanation":"私の表示「我的」；これは表示「這個是」。"}}],"uploadedOriginal":"<h3>[ 單元4 ] 日本語の「こ・そ・あ・ど」</h3><h3>學習目標</h3><p>①　理解表示距離遠近的指示詞「こそあど」基礎用法及句型</p><p>中文當中，我們常會指著某樣東西說「這個、那個、哪個」，對著一處場所說「這裡、那裡、哪裡」，依照距離遠近，來指稱我們所看到的事物。這是種很方便的代名詞，當我們不曉得東西名字時，比如點餐的時候，只要指著菜單說「我要這個」就解決了。在日文中，也有同樣的用法。這類用語，語言學上稱為「指示詞」，包括「這裡那裡」、「這個那個」、「這些那些」等等，簡單來說，就是用來指稱東西時用的字彙。</p><p>日文的基本指示詞為:</p><p>これ：相當於中文的「這個」。用來指距離自己近的東西。</p><p>それ：相當於中文的「那個」。用來指距離對方較近的東西。</p><p>あれ：相當於中文的「那一個」。用來指距離雙方都遠的東西。</p><p>どれ：相當於中文的「哪個」。疑問詞、用來詢問。</p><h3>基本句型用法</h3><p>（指示詞）は（名詞）です。</p><p>例：これ は 小説 です。（這是小說。）</p><p>それ は ジュース です。（那是果汁。）</p><p>あれ は カーテン です。（那是窗簾。）</p><p>（名詞）は（疑問詞）ですか。</p><p>例：小説 は どれ ですか。（小說是哪一個？）</p><p>これ は 何 ですか。（這個是什麼？）</p><p>（指示詞）は（名詞）の（名詞）です。</p><p>例：これ は 私の小説 です。（這是我的小說。）</p><p>それ は 彼のジュース です。（那是他的果汁。）</p><p>あれ は 店長のカーテン です。（那是店長的窗簾。）</p><h3>圖解</h3><p>情況一: 當物體距離A方較近時</p><p>A:これは何ですか。（這是什麼？）</p><p>B:それは正方形です。（那是正方形。）</p><p>A：なるほど、これは正方形ですね。</p><p>（原來如此，這是正方形啊。）</p><p>情況二: 當物體距離B方較近時</p><p>A:それは何ですか。（那是什麼？）</p><p>B:これは正方形です。（這是正方形。）</p><p>A：なるほど、それは正方形ですね。</p><p>（原來如此，那是正方形啊。）</p><p>情況三:當物體距離雙方都很遠時</p><p>A:あれは何ですか。（那是什麼？）</p><p>B:あれは正方形です。（那是正方形。）</p><p>A：なるほど、あれは正方形ですね。（原來如此，那是正方形啊。）</p><p>情況四:提出疑問時</p><p>A：正方形はどれですか。（正方形是哪一個啊？）</p><p>B：さあ、私もわかりませんね。（呃..我也不知道）</p><p>「これ、それ、あれ、どれ」用於指稱一件東西，若是改寫成「ここ、そこ、あそこ、どこ」的話，則會變成指一個「地點」。例如學校、家裡、餐廳、醫院、咖啡廳等等地點。</p><p>ここ：相當於中文的「這裡」。用來指距離自己近的場所。</p><p>そこ：相當於中文的「那裡」。用來指距離對方較近的場所。</p><p>あそこ：相當於中文的「那～裡」。用來指距離雙方都遠的場所。</p><p>どこ：相當於中文的「哪裡」。疑問詞。用來詢問。</p><p>例：？　これは私の学校です。（？這個是我的學校。）</p><p>○　ここは私の学校です。（○這裡是我的學校。）</p><p>？　それは病院ですね。 （？那個是醫院吧。）</p><p>○　そこは病院ですね。 （○那裡是醫院吧。）</p><p>？　あれは喫茶店です。  （？那個是咖啡廳。）</p><p>○　あそこは喫茶店です。 （○那裡是咖啡廳。）</p><p>○　そこはどこですか。　 （○那裡是哪裡？）</p><p>有沒有發現，「これ、それ、あれ、どれ」和「ここ、そこ、あそこ、どこ」前面的「こそあど」部分完全一樣？這稱為日文的「こそあど」系統。應用範圍十分廣泛，像是「這位那位哪位」、「這次那次哪次」等等，也是一樣以「こそあど」這個系統來表示。</p><p>那麼，如果我們不想講「これ」，而想直接說出名稱（例如這隻狗、這部車）時，該怎麼辦呢？</p><h3>「これ・それ・あれ・どれ」＋「名詞」</h3><h3>＝「こそあど」＋「の」＋「名詞」</h3><p>例：</p><p>これ(這個)＋犬(狗)＝？これ犬　○この犬 (這隻狗)</p><p>それ(那個)＋車(車)＝？それ車　○その車 (那部車)</p><p>あれ(那個)＋人(人)＝？あれ人　○あの人(ひと) (那個人)</p><p>「の」這個助詞，有一個大家都十分熟悉的用法，就是當作中文的「的」。</p><p>例：</p><p>これはノートです。（這是筆記本。）</p><p>これは私のノートです。（這是我的筆記本。）</p><p>このノートは私のノートです。（這本筆記本是我的筆記本。）</p><p>このノートは私のです。  （這本筆記本是我的。）</p><p>私のノートはどれですか。（我的筆記本是哪一個？）</p><p>それは誰のパソコンですか。（那是誰的電腦？）</p><p>これは私のパソコンです。（這是我的電腦。）</p><p>A:あれは鈴木さんの車ですか。（那是鈴木先生的車嗎？）</p><p>B: はい、そうです。あれは鈴木さんの車です。</p><p>（是的，沒錯。那是鈴木先生的車。）</p><p>いいえ、違います。</p><p>あれは鈴木さんの車ではありません。</p><p>（不，不是。那不是鈴木先生的車。）</p><p>日常會話中，使用這些指示詞的機會非常頻繁，你或許聽過這個的對話:</p><p>会話例：</p><p>（二人在百貨公司服飾區逛街）</p><p>A：これ、見てー　       （你看這個~）</p><p>B: どれどれ～           （哪個哪個~）</p><p>A：これこれ～           （這個這個~）</p><p>B：あ～それか～いいね   （啊~那個喔~真不錯呢）</p><p>A：でしょう～           （對吧~）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":5,"title":"時間的說法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">讀出時間、詢問幾點，並用<mark class=\"study-key\">から</mark>／<mark class=\"study-key\">まで</mark>表示起點與終點。</p><h3>時間帶與招呼</h3><p>朝（あさ）：早上；昼（ひる）：白天／中午；夜（よる）：晚上。<br>午前（ごぜん）：上午；午後（ごご）：下午。<br><ruby>朝<rt>あさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>／<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>／<ruby>晩<rt>ばん</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>：早餐／午餐／晚餐。<br>おはようございます／こんにちは／こんばんは的使用會受場合和作息影響，不以12:00、18:00作絕對分界。</p><h3>整點讀法</h3><p><ruby>一時<rt>いちじ</rt></ruby>、<ruby>二時<rt>にじ</rt></ruby>、<ruby>三時<rt>さんじ</rt></ruby>、<ruby>四時<rt>よじ</rt></ruby>、<ruby>五時<rt>ごじ</rt></ruby>、<ruby>六時<rt>ろくじ</rt></ruby>。<br><ruby>七時<rt>しちじ</rt></ruby>、<ruby>八時<rt>はちじ</rt></ruby>、<ruby>九時<rt>くじ</rt></ruby>、<ruby>十時<rt>じゅうじ</rt></ruby>、<ruby>十一時<rt>じゅういちじ</rt></ruby>、<ruby>十二時<rt>じゅうにじ</rt></ruby>。<br>特別記：<ruby>四時<rt>よじ</rt></ruby>、<ruby>七時<rt>しちじ</rt></ruby>、<ruby>九時<rt>くじ</rt></ruby>。</p><h3>分鐘讀法</h3><p><ruby>一分<rt>いっぷん</rt></ruby>、<ruby>二分<rt>にふん</rt></ruby>、<ruby>三分<rt>さんぷん</rt></ruby>、<ruby>四分<rt>よんぷん</rt></ruby>、<ruby>五分<rt>ごふん</rt></ruby>。<br><ruby>六分<rt>ろっぷん</rt></ruby>、<ruby>七分<rt>ななふん</rt></ruby>、<ruby>八分<rt>はっぷん</rt></ruby>、<ruby>九分<rt>きゅうふん</rt></ruby>、<ruby>十分<rt>じゅっぷん</rt></ruby>／じっぷん。<br>十七分＝じゅうななふん；四十八分＝よんじゅうはっぷん。<br>七時半（しちじはん）＝七點半。午後七時＝晚上七點。</p><h3>詢問時間</h3><p>すみません、今、何<ruby>時<rt>じ</rt></ruby>ですか。＝不好意思，現在幾點？<br><ruby>午後<rt>ごご</rt></ruby>三<ruby>時<rt>じ</rt></ruby>十五分です。＝下午三點十五分。<br>何時讀なんじ；何曜日讀なんようび。</p><h3>から／まで：從……到……</h3><p><ruby>授業<rt>じゅぎょう</rt></ruby>は<ruby>午後<rt>ごご</rt></ruby>一<ruby>時<rt>じ</rt></ruby>から四<ruby>時<rt>じ</rt></ruby>までです。＝課堂由下午一點到四點。<br>何<ruby>時<rt>じ</rt></ruby>からですか。＝幾點開始？何時までですか。＝到幾點？<br>から和まで可分開使用，也能說地點範圍：<ruby>家<rt>いえ</rt></ruby>から<ruby>学校<rt>がっこう</rt></ruby>まで＝從家到學校。</p>","symbol":"時間","intro":"把一天的時間，用日文說出來。","tag":"時刻・起點・終點","concepts":[["先記特別的整點","四時＝よじ；七時＝しちじ；九時＝くじ。半小時可以說「半」。","七<ruby>時半<rt>じはん</rt></ruby>です。","七點半。讀作：しちじはんです。"],["分的讀音","一分<mark class=\"study-key\">いっぷん</mark>、三分さんぷん、六分<mark class=\"study-key\">ろっぷん</mark>、八分はっぷん；二分にふん、五分ごふん。","<ruby>今<rt>いま</rt></ruby>、何<ruby>時<rt>じ</rt></ruby>ですか。","現在幾點？何時讀作なんじ。"],["從開始到結束","<mark class=\"study-key\">から</mark>表示起點；<mark class=\"study-key\">まで</mark>表示終點，也可以分開使用。","<ruby>午後<rt>ごご</rt></ruby>一<ruby>時<rt>じ</rt></ruby>から四<ruby>時<rt>じ</rt></ruby>までです。","由下午一點到四點。"]],"caution":"問候語的使用時間會因場合而變，不必硬記十二點或六點為固定界線。學習前先確認自己能讀基本數字。","quiz":[{"prompt":"四時的讀音是哪個？","options":["よじ","よんじ","しじ","よっじ"],"answer":0,"explanation":"四時讀よじ，要和一般數字四的讀音分開記。"},{"prompt":"「七時半」代表哪個時間？","options":["7:15","7:30","7:45","8:30"],"answer":1,"explanation":"半表示半小時，即三十分。"},{"prompt":"圖書館由九點開到五點：九時＿＿五時＿＿です。","options":["まで／から","に／で","から／まで","と／か"],"answer":2,"explanation":"から表示起點，まで表示終點。"},{"prompt":"三分的讀音是？","options":["さんふん","みっぷん","さんぶん","さんぷん"],"answer":3,"explanation":"三分讀さんぷん，分在這裡讀ぷん。"}],"uploadedOriginal":"<h3>[單元5 ] 時間的說法</h3><h3>學習目標</h3><h3>①　學會時間的說法</h3><h3>②　學會如何詢問時間</h3><h3>③　學習句型「～から～まで」</h3><p>「時間」一向與我們的生活密不可分，從幾點幾分、早中晚、星期、甚至是年齡，我們無時無刻都與時間為伍，時間可說與我們息息相關。因此，本回我們要學習的是，如何正確以日文表示時間、以及詢問時間。</p><p>很幸運地，日文當中，時間的表示方式和中文大同小異，用法也大致相同。需要多加費心的地方是「唸法」。在學習時間說法之前，請先確保你已經掌握了基本的數字說法（請參照語彙教材），時間由數字組成，因此時間的說法就是數字說法的變形而已。</p><p>我們先介紹日文的早中晚、以及幾點幾分的說法，其次介紹表達時間、詢問時間的常用句型以及實例，讓各位讀完後，可以立刻用於日常生活中。</p><h3>早中晚</h3><p>日文和中文相同，將一天的時間，分為早上、中午、晚上三個時間點。</p><p>朝：等同中文的早上。太陽出來後到中午十二點。</p><p>昼：等同中文的中下午。中午十二點到太陽下山。</p><p>夜：等同中文的晩上。太陽下山到隔天太陽出來前。</p><p>因此，我們向對方打招呼時的用語，也會隨著時間不同而改變。</p><p>朝：おはよう。適用於清晨～中午12:00時。</p><p>昼：こんにちは。適用於中午12:00～下午6:00時。</p><p>夜：こんばんは。適用於下午6:00～隔天早上。</p><p>另外，三餐的說法也和中文相似。「ごはん」為「飯」的意思，因此：</p><p>早飯:「朝ごはん」午飯:「昼ごはん」晚飯:「晩ごはん」</p><p>中文當中，除了早上、中午、晚上的說法外，我們也說上午、下午，日文中也有同樣的說法。</p><p>午前：中午之前。等於中文的「上午」。</p><p>午後：中午之後。等於中文的「下午」。</p><h3>時間說法</h3><p>日文時間說法與中文類似，中文稱為「~點~分」，日文則為「~時~分」。</p><p>首先是整點（例如：一點鐘、三點鐘）的唸法。</p><p>注意，「四點」「七點」「九點」，和一般數字發音不同。</p><p>一時（いちじ）　二時（にじ）三時（さんじ）</p><p>四時（よじ）　五時（ごじ）　六時（ろくじ）</p><p>七時（しちじ）　八時（はちじ）　九時（くじ）</p><p>十時（じゅうじ）十一時（じゅういちじ）</p><p>十二時（じゅうにじ）</p><p>再來，是「分」的唸法。「分」的唸法較為複雜，可唸成「ぷん」或「ふん」，必須多加練習。</p><p>記憶法:</p><p>「分」的前面假名是鼻音「ん」或促音「っ」的話，發「ぷん」。是其他假名的話，發「ふん」。</p><p>一分（いっぷん）　二分（にふん）</p><p>三分（さんぷん）</p><p>四分（よんぷん）　五分（ごふん）</p><p>六分（ろっぷん）</p><p>七分（ななふん）　八分（はっぷん）</p><p>九分（きゅうふん）十分（じっぷん・じゅっぷん）</p><p>十位數以上（十一分到五十九分），則和數字唸法相同。</p><p>例：十七分：十（じゅう）＋七分（ななふん）　→　十七分（じゅうななふん）</p><p>四十八分：四十（よんじゅう）＋八分（はっぷん）　→　四十八分（よんじゅうはっぷん）</p><h3>句型</h3><p>常用時間句型如下：</p><h3>①  ～時～分</h3><h3>②  ～時半</h3><p>③  （午前、午後、夜）＋～時～分</p><p>①　「～時～分」:這是最常使用的時間表示方式。</p><p>例：五時二十分。 三時十五分。</p><p>十一時五十九分。</p><p>②　「時半」：當時鐘跑到七點三十分的位置，可以説</p><p>「七時三十分」，也可以説成「七時半(しちじはん)」。</p><p>和中文説法相同。</p><p>③　更精確的時間表示方法，在時間前方加上「時間帶」。常用於表示容易混淆的時間。常用的有「午前」（上午)、「午後」(下午)、「夜」(晩上)</p><p>例：</p><p>△　七時   （是早上七點還是晩上七點呢？）</p><p>○　午前七時　（早上七點）</p><p>○　夜七時    （晩上七點）</p><h3>如何詢問時間</h3><p>句型:</p><p>A：すみません、今は 何時 ですか。</p><p>（不好意思，請問現在幾點？）</p><p>B：今は ～時～分 です。</p><p>（現在是～點～分。）</p><p>這句仍然使用「～は～ですか。」的基本句型。</p><p>①「すみません」：「不好意思」、用於會話一開始。</p><p>②「今」：現在。</p><p>③「何時」: 詢間時間時，疑問詞使用「何時」。另外，詢問星期時使用「何曜日」，詢問年齡時使用「何才」，當中都會有「何」這個字。</p><h3>更精確的時間說法</h3><p>有時候我們也需要類似「從幾點到幾點」這樣的說法，來清楚描述一段時間。例如朋友問你:「明天演講是什麼時候」，這時就不能只回答「下午一點」，更好的說法是:「下午一點到下午四點」。</p><p>我們可以用這個「～から～まで」句型來達到目的。</p><p>「～から～まで」：從～到～。</p><p>「から」：從～。表示開始點。</p><p>「まで」：到～。表示結束點。</p><p>例：家 から 学校 まで。      （從家裡到學校。）</p><p>学生 から 校長 まで。  （從學生到校長。）</p><p>一時 から 四時 まで。    （從一點到四點。）</p><p>午後一時 から。          （從下午一點開始。）</p><p>午後四時 まで。          （到下午四點。）</p><p>可以應用在會話當中，如下方例句。同樣使用「～は～ですか」的基本句型。</p><p>A：スピーチ は 何時 から 何時 まで ですか。</p><p>（演講從幾點到幾點呢？）</p><p>B：午後一時 から 四時 まで です。</p><p>（從下午一點到四點。）</p><p>也可以拆解成以下方式。</p><p>A：スピーチ は 何時 から ですか。</p><p>（演講從幾點開始呢？）</p><p>B：午後一時 から です。</p><p>（從下午一點開始。）</p><p>A：スピーチ は 何時 まで ですか。</p><p>（演講到幾點結束呢？）</p><p>B：午後四時 まで です。</p><p>（到下午四點。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":6,"title":"日文的助詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用と、や、など、か表達<mark class=\"study-key\">並列</mark>、<mark class=\"study-key\">舉例</mark>和選擇。</p><h3>と：把項目並列</h3><p><ruby>犬<rt>いぬ</rt></ruby>と<ruby>猫<rt>ねこ</rt></ruby>＝狗和貓。<br>パンと<ruby>牛乳<rt>ぎゅうにゅう</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。＝買麵包和牛奶。<br>在這個列舉範圍內，明確包括兩者。</p><h3>や……など：舉幾個例子</h3><p><ruby>果物<rt>くだもの</rt></ruby>や<ruby>野菜<rt>やさい</rt></ruby>などを<ruby>買<rt>か</rt></ruby>います。＝買水果、蔬菜等東西。<br>や表示非完整列舉；など表示<mark class=\"study-key\">等等</mark>，可和や配合，也可單獨用。<br>不是每句都必須同時有や和など。</p><h3>か：或者</h3><p><ruby>土曜日<rt>どようび</rt></ruby>か<ruby>日曜日<rt>にちようび</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。＝星期六或星期日去。<br>何を<ruby>食<rt>た</rt></ruby>べますか。ラーメンかうどんです。＝吃甚麼？拉麵或烏龍麵。<br>句中的か表示<mark class=\"study-key\">選擇</mark>；句末的か用於提問。</p><h3>同樣名詞，不同助詞</h3><p>パンとご<ruby>飯<rt>はん</rt></ruby>＝麵包和飯。<br>パンやご<ruby>飯<rt>はん</rt></ruby>など＝麵包、飯等。<br>パンかご<ruby>飯<rt>はん</rt></ruby>＝麵包或飯。<br>先決定是「<mark class=\"study-key\">都包括</mark>」「<mark class=\"study-key\">舉例</mark>」還是「擇一」，再選助詞。</p>","symbol":"つながり","intro":"換一個助詞，意思就不一樣。","tag":"と・や・か・など","concepts":[["と：和","把談論的項目<mark class=\"study-key\">並列</mark>列出。","<ruby>犬<rt>いぬ</rt></ruby>と<ruby>猫<rt>ねこ</rt></ruby>","狗和貓。"],["や～など：例如……等等","列出<mark class=\"study-key\">部分例子</mark>，暗示還有其他項目。など接在所列舉的項目之後。","<ruby>寿司<rt>すし</rt></ruby>や<ruby>天<rt>てん</rt></ruby>ぷらなど","壽司、天婦羅<mark class=\"study-key\">等等</mark>。"],["か：或者","在列出的項目中<mark class=\"study-key\">選擇</mark>。這與句尾疑問助詞か的用法不同。","<ruby>土曜日<rt>どようび</rt></ruby>か<ruby>日曜日<rt>にちようび</rt></ruby>です。","星期六或星期日。"]],"caution":"助詞的意思要配合語境理解。例如「私は刺身はいいです」可能是婉拒，但不能只憑は就把整句固定翻譯成「不要」。","quiz":[{"prompt":"「お茶かコーヒー」是甚麼意思？","options":["茶和咖啡都要","茶或咖啡","只有茶，不能選咖啡","茶比咖啡好"],"answer":1,"explanation":"名詞之間的か表示選擇，相當於「或」。","rubyView":{"prompt":"「お<ruby>茶<rt>ちゃ</rt></ruby>かコーヒー」是甚麼意思？","options":["茶和咖啡都要","茶或咖啡","只有茶，不能選咖啡","茶比咖啡好"],"explanation":"名詞之間的か表示選擇，相當於「或」。"}},{"prompt":"想把「貓和狗」兩樣並列，應用？","options":["猫か犬","猫の犬","猫と犬","猫まで犬"],"answer":2,"explanation":"と把兩個名詞並列，表示貓和狗。"},{"prompt":"「りんごやバナナなど」最合適的理解是？","options":["只能選一種水果","只列出所有水果，絕無其他","香蕉屬於蘋果","蘋果、香蕉等，還可能有其他"],"answer":3,"explanation":"や～など是舉例，並不列盡全部項目。"},{"prompt":"店員問吃甚麼，你回答「パンと卵です」。意思是？","options":["麵包和雞蛋都要","只要其中一樣","只是舉例，沒有指定","兩樣都不要"],"answer":0,"explanation":"と把麵包和雞蛋並列；要說二選一才用か。"}],"uploadedOriginal":"<h3>[ 單元6 ] 日文的助詞</h3><h3>學習目標</h3><h3>①　了解助詞「と・や・か・など」的用法</h3><p>這回開始進入助詞的範圍。助詞是什麼？簡單來說，助詞就是單獨不具有意思，一般會接在名詞、動詞或其他詞類後方的詞。舉例來說:「我和朋友去吃飯」這句話當中，「和」就是助詞，你無法將「和」單獨當作一句話來說，必須要配合「我」「朋友」才具有意思。我們學過的「の」也是助詞。</p><p>助詞不具單獨意思，但是就像空氣一樣，雖然沒什麼存在感，但是在會話時卻扮演著很重要的角色，隨著助詞的不同，句子的意思也會改變，例如「私は刺身がいいです」是「我想吃生魚片」，但是如果改成「私は刺身はいいです」，就變成了「我不要生魚片」，意思完全不同。因此，在日文學習的過程中，助詞的學習是相當重要的部分。</p><p>這次我們要介紹「と、や、か、など」四個助詞，這些助詞的使用頻率非常之高，概念也很好理解，很快就能夠上手。</p><h3>と</h3><p>「と」: 連接名詞，表示並列。相當於中文的「和」。</p><p>基本用法: （名詞）＋ と ＋（名詞）</p><p>例：</p><p>私 と 妹 と 弟 （我和妹妹和弟弟）</p><p>犬 と 猫 （狗和貓）</p><p>テーブル と 椅子 （桌子和椅子）</p><p>梅 と 桜 （梅花和櫻花）</p><p>ハンバーガー と コーラ（漢堡和可樂）</p><h3>や・など</h3><p>「や」: 連接名詞，表示從眾多物品中選擇幾樣當作例子。相當於中文的「像是…」。</p><p>「など」: 和「や」一起用，接在句子的最後面。相當於</p><p>中文的「…等等」。</p><p>基本用法:（名詞）＋ や ＋（名詞）＋ など</p><p>例：</p><p>和食と言えば、寿司 や 味噌汁 や てんぷらなどです。</p><p>（說到和食，有壽司、味噌湯、天婦羅等等。）</p><p>ペットと言えば、犬 や 猫 や 兎 や 鼠 など です。</p><p>（說到寵物，有狗、貓、兔子、老鼠等等。）</p><h3>飲み物と言えば、</h3><p>コーラ や ジュース や お茶 など です。</p><p>（說到飲料，有可樂、果汁、茶等等。）</p><h3>か</h3><p>「か」: 連接名詞，表示從中擇一。相當於中文的「或者」。</p><p>基本用法:（名詞）＋ か ＋（名詞）</p><p>例：</p><p>①　A：いつが暇ですか。（什麼時候有空呢？）</p><p>B：土曜日 か 日曜日 です。（星期六或是星期日。）</p><p>②　A：旅行はいつですか。（旅行是什麼時候呢？）</p><p>B：明日 か あさって です。（明天或是後天。）</p><p>③　A：何を食べますか。（要吃什麼呢？）</p><p>B：定食 か うどん か ラーメン です。（定食或烏龍麵或拉麵。）</p><p>④　A：何を買いますか。（要買什麼呢？）</p><p>B：かばん か 服 か 化粧品です。（包包或衣服或化妝品。）</p><p>在會話中，同樣的單字句型，使用不同助詞的話，就會有完全不同的意思喔！請參照以下舉例：</p><p>会話例 ①：</p><p>A：何を食べますか。（要吃什麼呢？）</p><p>B：①  定食 や うどん や ラーメン など ですね。</p><p>（像是定食、烏龍麵、拉麵等等的吧。）沒有明確指定吃哪一樣</p><p>②  定食 か うどん か ラーメン ですね。</p><p>（定食、烏龍麵、或是拉麵吧。）明確表示從三樣中挑選其中一樣</p><p>③  定食 と うどん と ラーメンです。</p><p>（定食和烏龍麵和拉麵。） 明確表示三樣都要</p><p>会話例 ②：</p><p>A：テストは いつ ですか。（考試是什麼時候呢？）</p><p>B：①　明日 や 明後日 や 来週 など ですね。</p><p>（明天、後天、下週等等吧。）表示考試很多，不只明天、後天、下週。</p><p>②　明日 か 明後日 か 来週 ですね。</p><p>（明天、後天、或是下週吧。）表示考試是明天、後天、下週其中一天。</p><p>③　明日 と 明後日 と 来週 ですね。</p><p>（明天和後天和下週吧。）表示考試是在明天、後天、以及下週，共有三次。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":7,"title":"形容詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">區分<mark class=\"study-key\">い形容詞</mark>與<mark class=\"study-key\">な形容詞</mark>，學會修飾名詞和表達否定。</p><h3>兩類形容詞</h3><p><mark class=\"study-key\">い形容詞</mark>：<ruby>長<rt>なが</rt></ruby>い、短い、広い、おいしい、<ruby>忙<rt>いそが</rt></ruby>しい。<br><mark class=\"study-key\">な形容詞</mark>：<ruby>静<rt>しず</rt></ruby>か、親切、便利、有名、きれい、<ruby>嫌<rt>きら</rt></ruby>い。<br>きれい和嫌い雖然讀音以い結尾，仍是な形容詞。不可單靠漢字寫法或最後一個音判斷。</p><h3>放在名詞前</h3><p><mark class=\"study-key\">い形容詞</mark><mark class=\"study-key\">直接接名詞</mark>：<ruby>長<rt>なが</rt></ruby>い<ruby>傘<rt>かさ</rt></ruby>、おいしい<ruby>料理<rt>りょうり</rt></ruby>、広い<ruby>部屋<rt>へや</rt></ruby>。<br>な形容詞加な：<ruby>静<rt>しず</rt></ruby>かな<ruby>教室<rt>きょうしつ</rt></ruby>、親切な先生、きれいな<ruby>公園<rt>こうえん</rt></ruby>。<br>前者是「長的傘」這個詞組；傘は長いです則是完整的「傘很長」一句話。</p><h3>肯定句</h3><p><ruby>傘<rt>かさ</rt></ruby>は<ruby>長<rt>なが</rt></ruby>いです。＝傘很長。<br><ruby>教室<rt>きょうしつ</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かです。＝教室很安靜。<br><mark class=\"study-key\">な形容詞</mark>在です前<mark class=\"study-key\">不加な</mark>。</p><h3>否定句</h3><p><mark class=\"study-key\">い形容詞</mark>：最後い→<mark class=\"study-key\">くないです</mark>／くありません。<br><ruby>長<rt>なが</rt></ruby>い→長くないです；おいしい→おいしくありません。<br>な形容詞：加ではないです／ではありません。<br><ruby>静<rt>しず</rt></ruby>か→<ruby>静<rt>しず</rt></ruby>かではありません。＝不安靜。<br>いい的否定是よくないです／よくありません。</p><h3>會話中的形式</h3><p>～ないです和～ありません都能表達禮貌的否定。選擇取決於場合、習慣與語氣，不宜按性別劃分。</p>","symbol":"彩り","intro":"學會描述，也學會說「不是那樣」。","tag":"い形容詞・な形容詞","concepts":[["い形容詞","修飾名詞時<mark class=\"study-key\">直接接名詞</mark>；否定時將末尾い改為くありません。","おいしいデザート","好吃的甜點。否定：おいしくありません。"],["な形容詞","修飾名詞時<mark class=\"study-key\">加な</mark>；作句子述語時用です，前面<mark class=\"study-key\">不加な</mark>。","<ruby>静<rt>しず</rt></ruby>かな<ruby>部屋<rt>へや</rt></ruby>。<ruby>部屋<rt>へや</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かです。","安靜的房間。房間很安靜。否定：静か<mark class=\"study-key\">ではありません</mark>。"],["別只看最後一個い","<mark class=\"study-key\">きれい</mark>、<mark class=\"study-key\">嫌い</mark>都是な形容詞，要把詞類和單字一起記。","きれいな<ruby>公園<rt>こうえん</rt></ruby>","漂亮的公園。不是「<mark class=\"study-key\">きれい</mark>公園」。"]],"caution":"補充：いい的否定是よくありません／よ<mark class=\"study-key\">くないです</mark>。<mark class=\"study-key\">な形容詞</mark>不能靠「是否寫成漢字」判斷；有名讀作ゆうめい。","quiz":[{"prompt":"「安靜的房間」應該是？","options":["静かの部屋","静か部屋","静かな部屋","静かい部屋"],"answer":2,"explanation":"静か是な形容詞，修飾名詞時加な。"},{"prompt":"「おいしいです」的否定是？","options":["おいしいではありません","おいしいません","おいしありません","おいしくありません"],"answer":3,"explanation":"い形容詞把末尾い改成く，再接ありません。"},{"prompt":"きれい屬於哪一類？","options":["な形容詞","い形容詞","動詞","助詞"],"answer":0,"explanation":"きれい雖以い音結尾，仍是な形容詞：きれいな部屋。"},{"prompt":"想說「這裡很安靜」，哪句正確？","options":["ここは静かなです。","ここは静かです。","ここは静かいです。","ここは静かのです。"],"answer":1,"explanation":"な形容詞在です前不加な。"}],"uploadedOriginal":"<h3>[ 單元7 ] 形容詞</h3><h3>學習目標</h3><h3>①　了解何謂「い形容詞」及「な形容詞」</h3><h3>②　了解如何區別「い形容詞」及「な形容詞」</h3><h3>③　形容詞的基本用法</h3><h3>④　形容詞的肯定及否定用法</h3><p>我們本回要介紹的是，日文中的形容詞。如同我們在先前的講義中提到的，形容詞的功能是用來形容名詞，如:「漂亮的花」、「乾淨的房間」，其中「花、房間」是名詞，「漂亮的」和「乾淨的」即是形容詞。形容詞的概念，對中文母語者來說，並不難理解，我們日常生活中無時無刻都會用到形容詞；正確且廣泛地使用形容詞，會讓你的話顯得更為生動，同時能更精準傳達自己的意思（例如，比起說「這裡有怪味道」，說「好臭！」更能快速且精準地表達自己想法）。因此，我們將形容詞的學習放在初期階段。</p><p>日文中的形容詞，和中文略為不同，主要分為二大類: 「い形容詞」及「な形容詞」。關於名稱的由來，之後會詳細介紹。我們將依序學習這二種形容詞的區分方法、形容詞的基本用法句型、以及形容詞的否定形。</p><h3>二大種類</h3><p>日文形容詞分為二類: 「い形容詞」和「な形容詞」，區分方法很簡單。</p><p>い形容詞:以假名い結尾的形容詞。</p><p>例：</p><p>長い (長的) 短い (短的) 広い (寬的) 狭い (窄的)</p><p>深い (深的) 浅い (淺的) おいしい (好吃的)</p><p>まずい (難吃的) 寂しい (寂寞的) 忙しい (忙碌的)</p><p>楽しい (快樂的) 暖かい (溫暖的)</p><p>名稱由來: 以い形容詞來修飾名詞時，</p><p>使用「い形容詞＋名詞」的方式。</p><p>例：長い傘 (很長的傘)</p><p>短い鉛筆 (很短的鉛筆)</p><p>広い部屋 (很寬的房間)</p><p>狭い部屋 (很窄的房間)</p><p>深い湖 (很深的湖)</p><p>浅い川 (很淺的河)</p><p>おいしいデザート (很好吃的甜點)</p><p>まずい料理 (很難吃的料理)</p><p>寂しい人 (很寂寞的人)</p><p>忙しい会社員 (很忙碌的上班族)</p><p>楽しい一日 (很快樂的一天)</p><p>暖かい手 (很溫暖的手)</p><p>な形容詞:  不以假名い結尾的形容詞。</p><p>例：静か (安靜的)  親切 (親切的)  賑やか (熱鬧的)</p><p>便利 (方便的)  元気 (有精神的)  簡単(簡單的)</p><p>上手 (拿手的)  下手 (不拿手的)</p><p>名稱由來: 以な形容詞來修飾名詞時，</p><p>使用「な形容詞＋な＋名詞」的方式。</p><p>例：</p><p>静かな教室（安靜的教室）</p><p>親切な先生（親切的老師）</p><p>賑やかなスーパー（熱鬧的超市）</p><p>便利な所（方便的地方）</p><p>元気な子ども（朝氣十足的小孩）</p><p>簡単な質問（簡單的問題）</p><p>上手なコック（厲害的廚師）</p><p>下手な選手（憋腳的選手）</p><p>另外，有些形容詞經常會讓人產生混亂。</p><p>例：有名（有名的）  綺麗（漂亮的）  嫌い（討厭的）</p><p>前面二個形容詞，雖然寫成假名時是以「い」結尾，但是寫成漢字時，後面並不會出現「い」，因此將它們歸類在「な形容詞」。最後的「嫌い」算是特例，雖然是「い」結尾，但仍屬於「な形容詞」。</p><p>例：</p><p>有名な歌手（有名的歌手）</p><p>きれいな公園（乾淨漂亮的公園）</p><p>嫌いな店員（討厭的店員）</p><h3>形容詞的肯定句型</h3><p>以形容詞來修飾名詞時，除了使用「形容詞＋名詞」的形式外，我們也可以運用「～は～です」這個基本句型。</p><p>二種都可以，意思上沒有區分。</p><p>肯定句型:</p><p>（名詞）は（い形容詞/な形容詞）です。</p><p>例：長い傘　→　傘は長いです。</p><p>短い鉛筆　→　鉛筆は短いです。</p><p>おいしいデザート　→　デザートはおいしいです。</p><p>静かな教室　→　教室は静かです。</p><p>親切な先生　→　先生は親切です。</p><p>賑やかなスーパー　→　スーパーは賑やかです。</p><h3>形容詞的否定句型</h3><p>形容詞的否定用法，各自不同。</p><p>い形容詞：</p><p>將字尾的「い」改成「く」後，加上「ありません」。</p><p>例：長い傘　→　傘は長いです</p><p>→　傘は長くありません。（傘不長。）</p><p>短い鉛筆　→　鉛筆は短いです</p><p>→　鉛筆は短くありません。（鉛筆不短。）</p><p>おいしいデザート　→　デザートはおいしいです</p><p>→　デザートはおいしくありません。（甜點不好吃。）</p><p>な形容詞：直接加上「ではありません」。</p><p>例：静かな教室  →  教室は静かです</p><p>→　教室は静かではありません。（教室不安靜。）</p><p>親切な先生  →  先生は親切です</p><p>→  先生は親切ではありません。（老師不親切。）</p><p>賑やかなスーパー　→　スーパーは賑やかです。</p><p>→　スーパーは賑やかではありません。（超市不熱鬧。）</p><h3>【補充】</h3><p>日文「です・ます体」的否定語氣，除了「～ありません」之外，各位可能也會在日劇或電影中看到「～ないです」這項用法。二項用法都可以、都是正確用法，差別在於：</p><p>「～ありません」：正統文法，可用在口語會話、文章書信和正式場合中。</p><p>「～ないです」：口語文法，一般常用在口語會話中。</p><p>由於「～ないです」最後是「です」結尾、否定語氣感覺起來沒那麼強烈，因此許多年輕人（特別是女性）會較偏向使用這種說法。「～ない」是表示否定的動詞變化，我們在之後的章節會再進行詳細介紹。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":8,"title":"名詞和形容詞的過去式","original":"<h3>學習目標</h3><p class=\"lesson-focus\">比較名詞、い形容詞、な形容詞的非過去與過去、肯定與否定。</p><h3>い形容詞：改變い</h3><p><ruby>高<rt>たか</rt></ruby>いです＝貴；<ruby>高<rt>たか</rt></ruby>くないです＝不貴。<br><ruby>高<rt>たか</rt></ruby>かったです＝當時貴；<ruby>高<rt>たか</rt></ruby>くなかったです＝當時不貴。<br>也可說高くありません／<ruby>高<rt>たか</rt></ruby>くありませんでした。<br><ruby>昨日<rt>きのう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>かったです。＝昨天很冷。不是寒いでした。<br>いい→よかったです；よくなかったです。</p><h3>名詞與な形容詞：改變句尾</h3><p><ruby>学生<rt>がくせい</rt></ruby>です→<ruby>学生<rt>がくせい</rt></ruby>でした。＝是學生→當時是學生。<br><ruby>静<rt>しず</rt></ruby>かです→<ruby>静<rt>しず</rt></ruby>かでした。＝安靜→當時很安靜。<br><ruby>学生<rt>がくせい</rt></ruby>ではありません→<ruby>学生<rt>がくせい</rt></ruby>ではありませんでした。<br><ruby>静<rt>しず</rt></ruby>かではありません→<ruby>静<rt>しず</rt></ruby>かではありませんでした。<br>也可說学生ではなかったです／<ruby>静<rt>しず</rt></ruby>かではなかったです。</p><h3>不要混用規則</h3><p>い形容詞：<mark class=\"study-key\">い→かった</mark>，再加です。<br>名詞／な形容詞：<mark class=\"study-key\">です→でした</mark>。<br>否定若用ない：ない→なかった，再加です；不是ないでした。</p><h3>時態怎樣理解？</h3><p><ruby>昨日<rt>きのう</rt></ruby>の<ruby>試験<rt>しけん</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しかったです。＝昨天的考試很難。<br>描述過去的情況，不保證目前已經不同。中文的「了」也不能一律當作日文過去式的對應。<br>非過去形可依語境描述現在、習慣或未來，不只指此刻。</p>","symbol":"昨日","intro":"用不同的句尾，說昨天的事情。","tag":"名詞・形容詞・過去","concepts":[["い形容詞的過去","去掉最後的い，再加<mark class=\"study-key\">かったです</mark>。","<ruby>昨日<rt>きのう</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>かったです。","昨天很冷。不能說「寒いでした」。"],["名詞與な形容詞的過去","將です換成でした。","<ruby>学生<rt>がくせい</rt></ruby>でした。<ruby>静<rt>しず</rt></ruby>かでした。","以前是學生。當時很安靜。"],["過去否定","使用ありません的否定形式時，在後面加でした。","<ruby>高<rt>たか</rt></ruby>くありませんでした。","當時不貴。名詞例：学生<mark class=\"study-key\">ではありませんでした</mark>。"]],"caution":"「現在式」更精確地說是非過去式，也能表達將來。若用ないです形式，過去否定要變成な<mark class=\"study-key\">かったです</mark>；不能直接加でした。いい的過去是<mark class=\"study-key\">よかった</mark>です。","quiz":[{"prompt":"寒いです的過去肯定是？","options":["寒いでした","寒くでした","寒いかったです","寒かったです"],"answer":3,"explanation":"去掉末尾い，接かったです。"},{"prompt":"「以前是學生」應該怎樣說？","options":["学生でした。","学生かったです。","学生ました。","学生くでした。"],"answer":0,"explanation":"名詞句把です換成でした。"},{"prompt":"「當時不安靜」是哪句？","options":["静かでした。","静かではありませんでした。","静かくありませんでした。","静かではあります。"],"answer":1,"explanation":"な形容詞過去否定使用ではありませんでした。"},{"prompt":"「高くありませんでした」表示甚麼？","options":["現在很貴","當時很貴","當時不貴","現在不貴"],"answer":2,"explanation":"ありませんでした是過去否定，表示當時不貴。","rubyView":{"prompt":"「<ruby>高<rt>たか</rt></ruby>くありませんでした」表示甚麼？","options":["現在很貴","當時很貴","當時不貴","現在不貴"],"explanation":"ありませんでした是過去否定，表示當時不貴。"}}],"uploadedOriginal":"<h3>[ 單元8 ] 名詞和形容詞的過去式</h3><h3>學習目標</h3><h3>①　複習名詞和形容詞的肯定否定用法</h3><h3>②　了解名詞和形容詞的過去式</h3><h3>③　了解名詞和形容詞的過去否定式</h3><p>在前幾回講義中，我們學到了名詞和形容詞（包括い形容詞和な形容詞）的肯定用法:</p><p>「～は～です」：　① 私は学生です。（我是學生。）</p><p>② 傘は長いです。（傘很長。）</p><p>③ 教室は静かです。（教室很安靜。）</p><p>也學到了名詞及形容詞的否定用法:</p><p>「～は～ではありません」：</p><p>① 私は学生ではありません。（我不是學生。）</p><p>② 傘は長くありません。（傘不長。）</p><p>③ 教室は静かではありません。（教室不安靜。）</p><p>我們可以稱呼以上二種用法為「現在肯定形」和「現在否定形」。顧名思義，以上的例句，表達的都是「現在」這個時間點的情況，也可以寫成「我現在是學生」、「教室現在很安靜」，意思相同。</p><p>這裡有一點值得注意：「名詞」和「な形容詞」的肯定否定用法，完全一樣。沒錯，其實「な形容詞」和「名詞」，在文法上的性質是類似的，因此文法上的變化也大致相同。所以在學習時，可以將「な形容詞」和「名詞」一起記憶。</p><p>我們複習完名詞和形容詞的現在式後，接著，我們要進入所謂的「過去式」了。</p><p>大家對「過去式」這三個字應該不陌生，從字面上就可以看出來，「過去式」是表示「過去發生的事」。許多人說中文當中沒有時態的觀念，其實中文也有所謂的過去式，例如「你吃什麼？我吃飯」和「我吃飯了」這二句話，前一句為單純敘述「我吃飯」這件事，屬於現在式；但是後一句，多了一個「了」，很明顯地表示出「我吃完飯了」的意思、屬於過去發生的事，因此屬於「過去式」。</p><p>接下來，我們有二項學習重點，分別是「過去肯定」及「過去否定」的用法。</p><h3>過去肯定</h3><p>無論是名詞或形容詞（包括い形容詞和な形容詞），它們過去式的演變方法都遵循以下法則。這項法則，對於我們學習過去式時很有幫助，等會各位就知道為什麼了。</p><p>法則：</p><p>①　現在肯定 →　過去肯定</p><p>②　現在否定 →　過去否定</p><p>①  い形容詞過去式:</p><h3>將現在式語尾的い，改為かった即可</h3><p>例：犬 は 大きい です。（狗很大隻。）</p><p>犬 は 大きかった です。（狗以前很大隻。）</p><p>動物園のパンダ は 小さい です。</p><p>（動物園的貓熊很小隻。）</p><p>動物園のパンダ は 小さかったです。</p><p>（動物園的貓熊以前很小隻。）</p><p>庭の松 は 高い です。（院子裡的松樹很高。）</p><p>庭の松 は 高かった です。</p><p>（院子裡的松樹以前很高。）</p><p>夏 は 涼しい です。（夏天很涼。）</p><p>冬 は 暖かい です。（冬天很溫暖。）</p><p>夏 は 涼しかった です。（從前夏天很涼。）</p><p>冬 は 暖かかった です。（從前冬天很溫暖。）</p><p>②　名詞・な形容詞過去式:</p><h3>將現在式句尾的です，改為でした即可</h3><p>例：私は学生です。（我是學生。）</p><p>私は学生でした。（我以前是學生。）</p><p>彼は社長です。（他是社長。）</p><p>彼は社長でした。（他以前是社長。）</p><p>佐々木さんはサラリーマンです。</p><p>（佐佐木先生是上班族。）</p><p>佐々木さんはサラリーマンでした。</p><p>（佐佐木先生以前是上班族。）</p><p>九份は賑やかです。（九份很熱鬧。）</p><p>九份は賑やかでした。（九份從前很熱鬧。）</p><p>あの歌手は有名です。（那位歌手很有名。）</p><p>あの歌手は有名でした。（那位歌手從前很有名。）</p><p>期末テストは大変です。（期末考很累人。）</p><p>期末テストは大変でした。（之前的期末考很累人。）</p><p>初學者經常會將「い形容詞」和「な形容詞」的過去式搞混，而產生「大きいでした」「高いでした」「寒いでした」這種錯誤的寫法，需特別注意。</p><p>「現在肯定」和「過去肯定」的整理表格，如下所示:</p><div class=\"table-scroll\"><table><tr><th></th><th>現在肯定</th><th>過去肯定</th></tr><tr><td>い形容詞</td><td>高いです</td><td>高かったです</td></tr><tr><td>名詞・な形容詞</td><td>学生です。</td><td>学生でした。</td></tr></table></div><h3>過去否定</h3><p>我們同樣遵照「現在否定 → 過去否定」這個變化法則。</p><p>「過去否定」的用法較單純，且「い形容詞」「な形容詞」和「名詞」的變化方法皆相同。</p><p>①　い形容詞「過去否定」:</p><p>在「現在否定」句尾加上「でした」即可。</p><p>例：犬は 大きく ありません。（狗不大隻。）</p><p>犬は大きくありませんでした。（狗以前不大隻。）</p><p>動物園のパンダは 小さく ありません。</p><p>（動物園的貓熊體型不小。）</p><p>動物園のパンダは 小さく ありませんでした。</p><p>（動物園的貓熊以前體型不小。）</p><p>庭の松は 高く ありません。（院子裡的松樹不高。）</p><p>庭の松は 高く ありませんでした。</p><p>（院子裡的松樹以前不高。）</p><p>夏は 涼しく ありません。（夏天不涼。）</p><p>冬は 暖かく ありません。（冬天不溫暖。）</p><p>夏は 涼しく ありませんでした。（從前夏天不涼。）</p><p>冬は 暖かく ありませんでした。</p><p>（從前冬天不溫暖。）</p><p>②　名詞・な形容詞「過去否定」:</p><p>在「現在否定」的句尾加上「でした」即可。</p><p>例：私は 学生では ありません。（我不是學生。）</p><p>私は 学生では ありませんでした。（我以前不是學生。）</p><p>彼は 社長では ありません。（他不是社長。）</p><p>彼は 社長では ありませんでした。（他以前不是社長。）</p><p>佐々木さんは サラリーマンでは ありません。</p><p>（佐佐木先生不是上班族。）</p><p>佐々木さんは サラリーマンでは ありませんでした。</p><p>（佐佐木先生以前不是上班族。）</p><p>九份は 賑やかでは ありません。（九份不熱鬧。）</p><p>九份は 賑やかでは ありませんでした。（九份以前不熱鬧。）</p><p>あの歌手は 有名では ありません。</p><p>（那位歌手不有名。）</p><p>あの歌手は 有名では ありませんでした。</p><p>（那位歌手以前不有名。）</p><p>期末テストは 大変では ありません。</p><p>（期末考不累人。）</p><p>期末テストは 大変では ありませんでした。</p><p>（之前期末考不累人。）</p><p>將現在否定和過去否定整理成表格，如下所示:</p><div class=\"table-scroll\"><table><tr><th></th><th>現在否定</th><th>過去否定</th></tr><tr><td>い形容詞</td><td>高く<br>ありません。</td><td>高く<br>ありませんでした。</td></tr><tr><td>名詞・<br>な形容詞</td><td>学生では<br>ありません。</td><td>学生では<br>ありませんでした。</td></tr></table></div><h3>現在式和過去式總整理</h3><p>い形容詞 （以「高い」為例）</p><div class=\"table-scroll\"><table><tr><th></th><th>現在</th><th>過去</th></tr><tr><td>肯定</td><td>高いです。</td><td>高かったです。</td></tr><tr><td>否定</td><td>高く<br>ありません。</td><td>高く<br>ありませんでした。</td></tr></table></div><p>な形容詞 （以「有名」為例）</p><div class=\"table-scroll\"><table><tr><th></th><th>現在</th><th>過去</th></tr><tr><td>肯定</td><td>有名です。</td><td>有名でした。</td></tr><tr><td>否定</td><td>有名では<br>ありません。</td><td>有名では<br>ありませんでした。</td></tr></table></div><p>名詞 （以「学生」為例）</p><div class=\"table-scroll\"><table><tr><th></th><th>現在</th><th>過去</th></tr><tr><td>肯定</td><td>学生です。</td><td>学生でした。</td></tr><tr><td>否定</td><td>学生では<br>ありません。</td><td>学生では<br>ありませんでした。</td></tr></table></div><p>例句請參照先前文法解說時的例句。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":9,"title":"比較的說法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">比較兩者的程度，並詢問哪個比較好。</p><h3>AはBより……：A比B……</h3><p><ruby>電車<rt>でんしゃ</rt></ruby>は<ruby>自転車<rt>じてんしゃ</rt></ruby>より<ruby>速<rt>はや</rt></ruby>いです。＝電車比自行車快。<br><ruby>図書館<rt>としょかん</rt></ruby>はスーパーより<ruby>静<rt>しず</rt></ruby>かです。＝圖書館比超市安靜。<br>より前是比較基準，は前是本句談論的對象。</p><h3>AはBほど……ない：A不及B……</h3><p><ruby>自転車<rt>じてんしゃ</rt></ruby>は<ruby>電車<rt>でんしゃ</rt></ruby>ほど<ruby>速<rt>はや</rt></ruby>くありません。＝自行車不及電車快。<br>この<ruby>部屋<rt>へや</rt></ruby>はあの<ruby>部屋<rt>へや</rt></ruby>ほど<ruby>広<rt>ひろ</rt></ruby>くないです。＝這房間沒有那間寬敞。<br>本課先記<mark class=\"study-key\">ほど＋否定</mark>；不能推論<mark class=\"study-key\">より</mark>永遠不接否定。</p><h3>詢問與回答</h3><p><ruby>犬<rt>いぬ</rt></ruby>と<ruby>猫<rt>ねこ</rt></ruby>、どちらが<ruby>好<rt>す</rt></ruby>きですか。＝狗和貓，你較喜歡哪個？<br><ruby>猫<rt>ねこ</rt></ruby>のほうが<ruby>好<rt>す</rt></ruby>きです。＝比較喜歡貓。<br>どっち是どちら的口語說法。<br>比較兩個選項常用どちら；三個以上通常用どれ：この<ruby>三<rt>みっ</rt></ruby>つの中で、どれが<ruby>一番<rt>いちばん</rt></ruby><ruby>好<rt>す</rt></ruby>きですか。</p><h3>同一個比較，換個角度</h3><p>この<ruby>辞書<rt>じしょ</rt></ruby>はあの<ruby>雑誌<rt>ざっし</rt></ruby>より<ruby>厚<rt>あつ</rt></ruby>いです。＝這本字典比那本雜誌厚。<br>あの<ruby>雑誌<rt>ざっし</rt></ruby>はこの<ruby>辞書<rt>じしょ</rt></ruby>ほど<ruby>厚<rt>あつ</rt></ruby>くありません。＝那本雜誌沒這本字典厚。<br>交換主題時，記得同時調整比較詞與肯定／否定。</p>","symbol":"くらべる","intro":"表達比較，也說出自己的選擇。","tag":"より・ほど・どちら","concepts":[["A比B更……","AはB<mark class=\"study-key\">より</mark>＋形容詞。<mark class=\"study-key\">より</mark>前面是比較基準。","<ruby>電車<rt>でんしゃ</rt></ruby>は<ruby>自転車<rt>じてんしゃ</rt></ruby>より<ruby>速<rt>はや</rt></ruby>いです。","電車比單車快。"],["A沒有B那麼……","AはB<mark class=\"study-key\">ほど＋否定</mark>形式。留意形容詞的否定變化。","<ruby>自転車<rt>じてんしゃ</rt></ruby>は<ruby>電車<rt>でんしゃ</rt></ruby>ほど<ruby>速<rt>はや</rt></ruby>くありません。","單車沒有電車那麼快。"],["二選一的問答","用<mark class=\"study-key\">どちら</mark>が詢問；以～<mark class=\"study-key\">のほうが</mark>回答自己的選擇。","<ruby>犬<rt>いぬ</rt></ruby>と<ruby>猫<rt>ねこ</rt></ruby>、どちらが<ruby>好<rt>す</rt></ruby>きですか。","狗和貓，你比較喜歡哪種？猫<mark class=\"study-key\">のほうが</mark>好きです。"]],"caution":"這裡先學<mark class=\"study-key\">ほど＋否定</mark>的常用搭配；不要推論成所有<mark class=\"study-key\">より</mark>都不能接否定。三個以上選項，依對象可用どれ、何或誰等疑問詞。","quiz":[{"prompt":"「A比B大」的基本句型是哪個？","options":["AはBより大きいです。","BはAより大きいです。","AはBほど大きいです。","AはBの大きいです。"],"answer":0,"explanation":"より前的B是比較基準；被描述為較大的則是A。"},{"prompt":"「這本書沒有那本那麼貴」應用？","options":["この本はあの本ほど高いです。","この本はあの本ほど高くありません。","この本はあの本と高いです。","この本はあの本が高くありません。"],"answer":1,"explanation":"「沒有……那麼」常用ほど＋否定。"},{"prompt":"問「茶和咖啡，較喜歡哪種？」用哪個？","options":["だれが","どこが","どちらが","いつが"],"answer":2,"explanation":"在兩個選項之間作選擇，用どちら。"},{"prompt":"回答「我較喜歡茶」，哪句正確？","options":["お茶ほど好きです。","お茶と好きです。","お茶よりの好きです。","お茶のほうが好きです。"],"answer":3,"explanation":"名詞＋のほうが＋形容詞，用來說哪一方比較符合。"}],"uploadedOriginal":"<h3>[ 單元9 ] 比較的說法</h3><h3>學習目標</h3><h3>①　學會比較的說法</h3><p>②　學會「より」「ほど」「どちらが」「のほうが」的用法</p><p>我們學過了名詞、形容詞、助詞的用法，本回開始就要進入應用階段了。這裡所學到的，不再是枯燥的文法例句，而是和我們生活息息相關的語言表現。這次我們要介紹的是日文中「比較」的說法。</p><p>什麼是「比較」說法呢？就是「我比你高」、「冬天比夏天冷」、「日本不像台灣一樣炎熱」等等，具有將二者互相比較意思的語句。日文當中，最常用以表示「比較」的用法，就是助詞「より」和「ほど」，以及「どちらが」、「のほうが」二個簡短句型。</p><h3>より</h3><p>「より」相當於中文「我比你高」的「比」，常用來表示二者的比較關係。</p><p>這裡要注意的是「比較物」與「被比較物」的位置。</p><p>より：（比較物）は（形容詞）です。</p><h3>↓.</h3><p>(比較物）は　(被比較物）より　(形容詞）です。</p><p>例：</p><p>台湾 は 暑い です。　　（台灣很炎熱。）</p><p>台湾 は 日本より 暑い です。    （台灣比日本炎熱。）</p><p>如上所述，將「被比較物＋より」放在「は」和「形容詞」的中間，就可以達到比較的效果。</p><p>例：</p><p>日本 は 台湾より 寒い です。（日本比台灣寒冷）</p><p>電車 は 自転車より 速い です。</p><p>（電車比自行車快。）</p><p>ワンピース は スカートより 高い です。</p><p>（洋裝比裙子貴。）</p><p>図書館 は スーパーより 静か です。</p><p>（圖書館比超市安靜。）</p><p>都市 は 田舎より 便利 です。（都市比鄉下方便。）</p><p>ひまわり は 草より きれい です。</p><p>（向日葵比雜草漂亮。）</p><h3>ほど</h3><p>上面例句中，有一句是「台湾は日本より暑いです。（台灣比日本熱）」，那麼如果我們想以否定的形式「日本不像台灣那麼熱」來敘述的話，要怎麼說呢？</p><p>？　日本は台湾より暑くありません。</p><p>（日本比台灣不熱。）</p><p>相信有不少人會將後面的形容詞直接改成否定形吧。不過很抱歉，雖然文法上沒有大問題，不過這種用法不太自然。「より」後面一般不接否定形。</p><p>因此以下的例句也不太自然：</p><p>？　自転車は電車より速くありません。</p><p>（自行車比電車不快。）</p><p>？　田舎は都市より便利ではありません。</p><p>（鄉下比都市不方便。）</p><p>如果我們想以「日本不像台灣那麼熱」「自行車不像電車那麼快」等等否定形式敘述的話，一般會使用「ほど」這個助詞。</p><p>ほど：相當於中文的「不像…」，用於否定句型中。</p><p>句型：</p><p>(比較物)は　(被比較物)　ほど　(形容詞否定形)。</p><p>例：</p><p>日本 は 台湾 ほど 暑くありません。</p><p>（日本不像台灣那麼熱。）</p><p>自転車 は 電車 ほど 速くありません。</p><p>（自行車不像電車那麼快。）</p><p>ジュース は コーヒー ほど 高くありません。</p><p>（果汁不像咖啡那麼貴。）</p><p>田舎 は 都市 ほど 便利ではありません。</p><p>（鄉下不像都市那麼方便。）</p><p>私は あの野球選手 ほど 有名ではありません。</p><p>（我不像那位棒球選手那麼有名。）</p><p>期末レポート は 中間レポートほど 大変ではありません。</p><p>（期末報告不像期中報告那麼累人。）</p><p>因此，同樣一句話，可以有二種不同的說法。</p><p>例：</p><p>夜市 は スーパーより うるさい です。</p><p>（夜市比超市吵雜。）</p><p>スーパー は 夜市ほど うるさくありません。</p><p>（超市沒有像夜市那麼吵雜。）</p><p>辞書 は 雑誌より 厚い です。</p><p>（字典比雜誌厚。）</p><p>雑誌 は 辞書ほど 厚くありません。</p><p>（雜誌沒有像字典那麼厚。）</p><h3>詢問及回答</h3><p>介紹另一種在會話中相當常見的比較句型，這項句型主要用於詢問對方的意見，例如：「（在餐廳中）咖哩飯和蛋包飯，哪一個比較好吃？」、「（購物時）這件衣服和那件衣服，哪一件比較可愛？」。</p><p>這句話最廣為人知的地方，就是日本美食節目「料理東西軍」，二位主持人在節目最後二選一時，一定會說「今(こん)夜(や)のご注(ちゅう)文(もん)は、どっち？（今晚的餐點，你選擇哪一樣？）」。</p><p>要詢問對方意見、以及回答對方問題時，我們可以使用以下二種句型:</p><p>①　詢問句型：</p><p>名詞　と　名詞　、どちらが　形容詞　ですか。（____和____ ，哪一種比較____呢？）</p><p>解説：<br>.</p><p>「と」：助詞，表示「和」。</p><p>「どちら」：和先前介紹過「こそあど」的「どれ」用法大致相同，是「哪個」的意思。會話中可以省略為「どっち」。</p><p>「が」：雖然我們已經習慣了「～は～ですか。」這個句型。但是這裡不用「は」，而改用「が」這個助詞。</p><p>例：</p><p>カレーライス と オムライス、どちらが おいしいですか。</p><p>（咖哩飯和蛋包飯，哪一種比較好吃？）</p><p>この服 と あの服、どちらが かわいい ですか。</p><p>（這件衣服和那件衣服，哪一件比較可愛？）</p><p>犬 と 猫、どちらが 好き ですか。</p><p>（狗和貓，你比較喜歡哪一種？）</p><p>自転車 と バイク、どちらが 便利 ですか。</p><p>（自行車和機車，哪一種比較方便？）</p><p>另外，「～、どちらが～」的句型，一般用在「二選一」的情況，例如「犬と猫」、「自転車とバイク」等等，</p><p>如果是「三種東西以上」，例如「犬と猫と兎」、「自転車とバイクと車」等等情況，就不能使用「どちら」，而要改用「どれ」。</p><p>「どちら」：用於從二樣東西當中、選擇一樣的情況。</p><p>「どれ」：用於從三樣以上的東西中、選擇一樣的情況。</p><p>例：</p><p>犬と 猫と 兎、どれが 好き ですか。</p><p>（狗和貓和兔子，你比較喜歡哪一種？）</p><p>自転車と バイクと 車、どれが 便利 ですか。</p><p>（自行車和機車和汽車，哪一種比較方便？）</p><h3>小テストと 中間テストと 期末テスト、</h3><p>どれが 難しい ですか。</p><p>（隨堂考和期中考和期末考，哪一種比較難？）</p><p>② 回答句型： 名詞　のほうが　形容詞　です。</p><p>（____的那一方，比較____。）</p><p>解説：</p><p>「の」：連接名詞和名詞，相當於中文的「的」。</p><p>「ほう」：漢字寫作「方」，相當於中文中「那一方」的「方」。</p><p>例：</p><p>A：カレーライスとオムライス、どちらがおいしいですか。</p><p>（咖哩飯和蛋包飯，哪一種比較好吃？）</p><p>B：カレーライス のほうが おいしい です。</p><p>（咖哩飯比較好吃。）</p><p>A：この服 と あの服、どちらが かわいい ですか。</p><p>（這件衣服和那件衣服，哪一件比較可愛？）</p><p>B：あの服 のほうが かわいい です。</p><p>（那件衣服比較可愛。）</p><p>A：犬 と 猫、どちらが 好き ですか。</p><p>（狗和貓，你比較喜歡哪一種？）</p><p>B：猫 のほうが 好き です。</p><p>（我比較喜歡貓。）</p><p>A：自転車 と バイク、どちらが 便利 ですか。</p><p>（自行車和機車，哪一種比較方便？）</p><p>B：バイク のほうが 便利 です。</p><p>（機車比較方便。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":10,"title":"動詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">認識三類動詞，從辭書形變成<mark class=\"study-key\">ます</mark>形。先記類別，再套變化。</p><h3>三類與字典名稱</h3><p><mark class=\"study-key\">第一類</mark>＝五段動詞：<ruby>書<rt>か</rt></ruby>く、<ruby>飲<rt>の</rt></ruby>む、<ruby>話<rt>はな</rt></ruby>す、<ruby>帰<rt>かえ</rt></ruby>る。<br><mark class=\"study-key\">第二類</mark>＝一段動詞（上一段／下一段）：<ruby>見<rt>み</rt></ruby>る、<ruby>起<rt>お</rt></ruby>きる、<ruby>食<rt>た</rt></ruby>べる。<br>第三類＝不規則動詞：する、来る，以及勉強する等する複合動詞。</p><h3>如何確認類別</h3><p>先認する／<ruby>来<rt>く</rt></ruby>る。其他常見動詞不是る結尾時，通常是<mark class=\"study-key\">第一類</mark>。<br>る前為<mark class=\"study-key\">い段</mark>／え段時，可能是第二類，但有常見例外：<ruby>帰<rt>かえ</rt></ruby>る、<ruby>切<rt>き</rt></ruby>る、<ruby>走<rt>はし</rt></ruby>る、<ruby>入<rt>はい</rt></ruby>る、知る都是第一類。<br>把類別與單字一起記，不確定就查詞典。沒有能涵蓋全部詞語的簡單字尾猜法。</p><h3>辭書形與ます形</h3><p>辭書形是查字典時的形式，例如行く。<mark class=\"study-key\">ます</mark>形常用於禮貌表達，例如行き<mark class=\"study-key\">ます</mark>。<br>只有「辭書形」字尾為う段；變化後的動詞不一定以う段結尾。動詞也不只有這兩種形式，之後會學て形、ない形等。</p><h3>第一類：う段換い段＋ます</h3><p>う→い、く→き、ぐ→ぎ、す→し、つ→ち、ぬ→に、ぶ→び、む→み、る→り。<br><ruby>書<rt>か</rt></ruby>く→<ruby>書<rt>か</rt></ruby>きます；<ruby>泳<rt>およ</rt></ruby>ぐ→<ruby>泳<rt>およ</rt></ruby>ぎます；<ruby>話<rt>はな</rt></ruby>す→<ruby>話<rt>はな</rt></ruby>します；<ruby>待<rt>ま</rt></ruby>つ→<ruby>待<rt>ま</rt></ruby>ちます。<br><ruby>読<rt>よ</rt></ruby>む→<ruby>読<rt>よ</rt></ruby>みます；<ruby>会<rt>あ</rt></ruby>う→<ruby>会<rt>あ</rt></ruby>います；<ruby>帰<rt>かえ</rt></ruby>る→<ruby>帰<rt>かえ</rt></ruby>ります。</p><h3>第二類：去る＋ます</h3><p><ruby>食<rt>た</rt></ruby>べる→<ruby>食<rt>た</rt></ruby>べます；<ruby>見<rt>み</rt></ruby>る→<ruby>見<rt>み</rt></ruby>ます；<ruby>起<rt>お</rt></ruby>きる→<ruby>起<rt>お</rt></ruby>きます。<br><ruby>教<rt>おし</rt></ruby>える→<ruby>教<rt>おし</rt></ruby>えます；<ruby>忘<rt>わす</rt></ruby>れる→<ruby>忘<rt>わす</rt></ruby>れます。</p><h3>第三類：單獨記</h3><p><mark class=\"study-key\">する→します</mark>；<ruby>勉強<rt>べんきょう</rt></ruby>する→<ruby>勉強<rt>べんきょう</rt></ruby>します。<br>来る（くる）→来ます（きます），漢字相同但讀音改變。</p><h3>兩個る，不能用同一規則</h3><p>帰る（<mark class=\"study-key\">第一類</mark>）→<ruby>帰<rt>かえ</rt></ruby>ります。<br>食べる（第二類）→<ruby>食<rt>た</rt></ruby>べます。<br>先確認類別，才知道要換る或去る。</p>","symbol":"動く","intro":"掌握三類動詞，打開變化的大門。","tag":"分類・辭書形・ます形","concepts":[["第一類：五段動詞","把字尾的<mark class=\"study-key\">う段</mark>音改成同一行的<mark class=\"study-key\">い段</mark>音，再加ます。","<ruby>飲<rt>の</rt></ruby>む → <ruby>飲<rt>の</rt></ruby>みます","む→み。其他例：書く→書き<mark class=\"study-key\">ます</mark>、話す→話します。"],["第二類：一段動詞","去掉末尾る，再加<mark class=\"study-key\">ます</mark>。","<ruby>食<rt>た</rt></ruby>べる → <ruby>食<rt>た</rt></ruby>べます","其他例：見る→見<mark class=\"study-key\">ます</mark>、起きる→起きます。"],["第三類：不規則動詞","する與来る，以及含する的複合動詞，要記住特別變化。","する → します ／ <ruby>来<rt>く</rt></ruby>る → <ruby>来<rt>き</rt></ruby>ます","来る讀くる，来<mark class=\"study-key\">ます</mark>讀きます。勉強する→勉強します。"]],"caution":"「字尾是u音」只適用於辭書形，<mark class=\"study-key\">ます</mark>、た等變化形不適用。以iru／eru結尾不保證是<mark class=\"study-key\">第二類</mark>，例如帰る、切る、走る是第一類。動詞不只兩種形態，本課先學兩種。","quiz":[{"prompt":"飲む的ます形是？","options":["飲むます","飲みます","飲めます","飲ます"],"answer":1,"explanation":"飲む是第一類，把む改成み，再加ます。"},{"prompt":"食べる的ます形是？","options":["食べります","食べるます","食べます","食べいます"],"answer":2,"explanation":"食べる是第二類，去る後接ます。"},{"prompt":"来る變為来ます時，来ます讀作？","options":["くます","こます","くらます","きます"],"answer":3,"explanation":"来る讀くる，来ます讀きます，是不規則變化。"},{"prompt":"哪個動詞雖以eru音結尾，卻屬第一類？","options":["帰る","食べる","教える","覚える"],"answer":0,"explanation":"帰る是第一類，ます形是帰ります；不能單憑eru判成第二類。"}],"uploadedOriginal":"<h3>[ 單元10 ] 動詞</h3><h3>學習目標</h3><h3>①　了解日文動詞的分類</h3><h3>②　了解何謂「原形」和「ます形」</h3><h3>③　理解如何將「原形」轉變為「ます形」</h3><p>我們已經將名詞和形容詞學到一個段落，也學過許多助詞了，這一回，我們要進行一項艱鉅的任務─學習日文的動詞。</p><p>日文動詞，是所有日文老師認為最難教的部分，也是許多日文學習者最為頭痛的部分。學日文有三道大關卡，第一道是五十音，大約有百分之八十的學習者在五十音階段放棄；第二道就是日文動詞，也有大約百分之八十的學習者背完五十音後，在這裡放棄學習日文。因此，在這階段扮演最重要角色的，就是動詞的教授法了。如何將日文動詞的系統介紹地淺顯易懂、同時又不能偷工減料，這是最關鍵的部分。</p><p>因此，在這裡，我們捨棄了傳統日文學術界使用的動詞教學法。各位有機會可以去翻翻日文系所使用的文法課本，你就會了解到那有多麼難懂，明明寫滿了字，卻仍然像無字天書般另人摸不著頭緒。我們將採用獨立開發的學習方法，教導大家學習日文的動詞，不但清楚易懂、同時能節省各位思考複雜文法的時間。</p><p>我們有所謂的「品管」，拿著我們開發出來的教材，隨便到路上抓十個人，如果有一個人壓根看不懂我們在寫什麼，那麼這份教材就得扔垃圾桶。因此，如果你覺得這份教材有任何看不懂或不清楚的地方，請儘速讓我們知道。相對地，動詞這個部分的學習相當重要，請務必確定你能完全理解我們的講解內容。</p><p>我們在這一課，有三項學習重點。</p><p>① 了解日文動詞的分類。</p><p>② 了解何謂「原形」和「ます形」。</p><p>③ 理解如何將「原形」轉變為「ます形」。</p><p>將依序介紹下去。</p><h3>動詞的分類</h3><p>日文的動詞，分為三類。但是第三類只包含二個動詞，所以嚴格說起來，動詞只分為二類。還記得學五十音時，我們告訴過你，記得將五十音的羅馬拼音一併記起來嗎？因為在學習動詞時，羅馬拼音就會大大地派上用場！！</p><h3>①第一類動詞</h3><p>第一類動詞的名稱，就叫做「第一類動詞」。</p><p>可以略稱為「Ⅰ動詞」。</p><p>例：</p><p>歩く(走路)  行く(去)  泳ぐ(游泳)  押す(壓)</p><p>話す(說話)  死ぬ(死亡)  遊ぶ(遊玩)  住む(居住)</p><p>飲む(喝)  会う(見面)  売る(賣)  切る(切)</p><h3>②第二類動詞</h3><p>第二類動詞的名稱，就叫做「第二類動詞」。</p><p>可以略稱為「Ⅱ動詞」。</p><p>例：</p><p>開ける(打開)  生まれる(出生)  覚える(記住)</p><p>食べる(吃飯)  出る(出去)  忘れる(忘記)</p><p>起きる(起床)  見る(看見)  教える(教)</p><h3>③不規則動詞</h3><p>第三類動詞的名稱，叫做「不規則動詞」，只有二個。</p><p>例：する(做)   来る(來)</p><p>好了，你心裡一定想問，為什麼動詞要分成三類！？</p><p>語言學家們當然不是吃飽閒著、沒事找事做，事實是，將動詞分為三類，能夠非常有效率地促進動詞的學習。</p><p>大家應該對「動詞變化」這個詞不陌生，由於中文的動詞沒有變化，一個字就是一個字，因此在學習外文（例如英文）時，看到動詞會隨著不同時間和場合而有不同的變化，相信每個人一定費了一番功夫理解和學習。將日文動詞分為三類，就是為了有效學習動詞變化。同一類動詞，它們的動詞變化（無論是過去式、現在式、或是其他亂七八糟的變化）都完全相同。</p><p>換句話說，我們將繁雜的動詞變化，簡化為三大類，從此你不用一個字一個字記憶，只要弄懂這三種類型的變化方法，就可以套用在日文中所有動詞上。就像是郵局的自動分類器一樣，你不需要一件一件去慢慢分類，會有機器自動幫忙分好信件一堆、包裹一堆、掛號信一堆，你只要知道哪一籃是信件、哪一籃是包裹，然後整堆抱走就可以了。</p><h3>動詞的特性</h3><h3>①　動詞的結尾一定是「u」</h3><p>日文動詞，無論哪一類型，字尾最後一個發音一定是「u」。</p><h3>＊第一類動詞</h3><p>例：</p><p>歩く(aruku)  行く(iku)    泳ぐ(oyogu)</p><p>押す(osu)    話す(hanasu)</p><h3>＊第二類動詞</h3><p>例：</p><p>開ける(akeru)  生まれる(umareru)</p><p>覚える(oboeru)  食べる(taberu)  出る(deru)</p><h3>＊不規則動詞</h3><p>例：する(suru)   来る(kuru)。</p><p>因此，若是你看到字尾不是「u」發音的字，不用懷疑，那一定不是動詞。</p><h3>動詞的不同名稱</h3><p>我們上面介紹過，日文動詞分為「第一類動詞」「第二類動詞」「不規則動詞」三類。不過，當你在查字典、或是閱讀一些語言學書籍時，應該會看到一些不同的名稱。</p><p>第一類動詞　→　五段動詞</p><p>第二類動詞　→　上下段動詞</p><p>不規則動詞　→　カ変・サ変動詞</p><p>在字典中所使用的詞彙，不是左邊、而是右邊那種看起來較為艱澀的字。請在大腦中自動轉換，這應該不會是太大的問題。至於「五段動詞」「上下段動詞」「カ変・サ変動詞」這些字的意思，由於對學習幾乎沒有幫助，因此可以不用耗費腦容量記憶，有興趣的人上網查一下即可。</p><h3>如何分類動詞</h3><p>那麼，當我們看到一個動詞時，該如何判斷它是屬於哪一類型呢？</p><p>在此提供二種方法，第一種較簡單，第二種較花時間、不過可以快速培養語感。</p><h3>①　直接查字典</h3><p>你可以查閱紙本字典、電子字典、或是網路字典。上面會直接告訴你這個動詞是哪一類，查過幾次，你就會自然記起來了。推薦使用網路字典，紙本字典約數年改版一次、電子字典每年推出新機型、而網路字典的內容則是每秒鐘都在更新，永遠保證能獲得最新的資訊。</p><p>②　手動  Ⅰ類和Ⅱ類動詞區別法（正確率98%）</p><p>步驟 1 ：  除去不規則動詞「する」和「くる」。</p><p>步驟 2 ：　不是以「る」結尾的動詞、100％為Ⅰ類動詞。</p><p>例：飲む(喝)  歌う(唱歌)  動く(動)</p><p>開く(開啟)  伸ばす(伸長)</p><p>步驟 3　：　關於以「る」結尾的動詞。</p><p>＊「る」前面的假名結尾為 i或 e的話，絕大部份為Ⅱ類動詞</p><p>例：</p><p>起きる(起床)  さびる(生鏽)  着る(穿)</p><p>見る(看見)  食べる(吃)  覚える(記住)</p><p>寝る(睡覺)</p><p>＊「る」前面的假名字尾為 a、u、o 的動詞，絕大部份為Ⅰ類動詞。</p><p>例：</p><p>閉まる(關)  ほうむる(埋葬)  起こる(發生)</p><p>例外：</p><h3>以下三項動詞，均為Ⅰ類動詞</h3><p>帰る（回家）  切る（切）  走る（跑步）</p><h3>動詞的二種形態</h3><p>另外，動詞依照使用時機，有二種形態: 「原形」和「ます形」。</p><p>以「行く」這個字為例，你在字典上查到的，會是「行く」，但是你在課本上看到的，可能會是「行きます」，例：「私は日本に行きます」。這二個字是一樣的，但是為什麼同樣的字，會有二種不同的樣子呢？</p><p>動詞原形:動詞原本的樣子。又稱為辭書形，因為在字典中會查到這種樣子的動詞。</p><p>例：</p><h3>歩く  行く  泳ぐ  覚える</h3><h3>食べる  出る  する  来る</h3><p>動詞ます形: 將動詞原形，變化成字尾是「ます」的形態。比動詞原形更尊敬、禮貌。對長輩說話、以及在課本中，多採用「動詞ます形」。</p><p>例：</p><h3>歩きます  行きます  泳ぎます  覚えます</h3><h3>食べます  出ます  します  来ます</h3><p>大家知道電影變形金鋼吧。將電影中機器人的卡車形態當作是「動詞原形」，將機器人形態當作是「動詞ます形」。平時沒事時是卡車（動詞原形），當遇到敵人（面對上司、師長等需要表示禮貌的人）時，就變身成機器人（動詞ます形）。使用時機就是這麼單純。</p><p>對於我們外國人來說，學習日文後，第一次說日文的對象，幾乎都是不太熟的日本人（交換學生、日本老師、公司上司等等），使用「動詞ます形」較為禮貌，因此，我們習慣從「動詞ます形」開始學習。也就是說，我們經常保持機器人出擊形態，如此一來，學完後就能夠馬上應用在會話上，較為實用。</p><p>問題來了，我們在字典上查到的是「動詞原形」，但是實際會話時，使用的是「動詞ます形」，這二者該如何轉換呢？</p><p>要如何將卡車變成機器人呢？</p><p>動詞原形 → 動詞ます形</p><p>以下是「動詞原形」變換成「動詞ます形」的方法。這是這個單元最後的部分，同時也是較為應用的部分，得看仔細了。雖然目前在教材上都會直接以「動詞ます形」呈現，很少需要手動將「動詞原形」變換成「動詞ます形」，但是隨著日文程度提高，將來轉變的機會將愈來愈多。請練習至熟練。</p><h3>①　第一類動詞</h3><p>變化法:</p><p>將動詞字尾的「u」改成「i」後，加上「ます」。</p><p>例：</p><p>歩く（aruku）→　歩き（aruki）→　歩きます(aruki masu)</p><p>押す（osu）→　押し（osi）→　押します(osi masu)</p><p>遊ぶ（asobu）→　遊び（asobi）→遊びます(asobi masu)</p><p>住む（sumu）→　住み（sumi）→　住みます(sumi masu)</p><p>会う（au）→　会い（ai）→　会います(ai masu)</p><p>売る（uru）→　売り（uri）→　売ります(uri masu)</p><h3>②　第二類動詞</h3><p>變化法:</p><p>將動詞字尾的「る」去掉，加上「ます」即可。</p><p>例：覚える　→　覚えます</p><p>食べる　→　食べます</p><p>出る　  →　出ます</p><p>忘れる　→　忘れます</p><p>起きる　→　起きます</p><p>見る　  →　見ます</p><p>教える　→　教えます</p><h3>③　不規則動詞</h3><p>變化法:只有二個，沒有規則可言，直接記起來吧。</p><p>する　→　します</p><p>来(く)る　→　来(き)ます（注意發音）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":11,"title":"動詞基本用法和時式","original":"<h3>學習目標</h3><p class=\"lesson-focus\">用を連接動作對象，掌握ます句尾的四種形式及邀請用法。</p><h3>名詞＋を＋動詞</h3><p>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。＝吃飯。<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。＝看書。<br><ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。＝喝水。ドアを<ruby>開<rt>あ</rt></ruby>けます。＝開門。<br>を讀o，常標示他動詞的直接對象。不是每個動詞都必須有を：<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。</p><h3>四種句尾</h3><p><ruby>買<rt>か</rt></ruby>います：買／會買；<ruby>買<rt>か</rt></ruby>いません：不買。<br><ruby>買<rt>か</rt></ruby>いました：買了；<ruby>買<rt>か</rt></ruby>いませんでした：當時沒有買。<br>します→しません→しました→しませんでした。<br><ruby>食<rt>た</rt></ruby>べます→<ruby>食<rt>た</rt></ruby>べません→<ruby>食<rt>た</rt></ruby>べました→<ruby>食<rt>た</rt></ruby>べませんでした。<br>明日、<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>います。＝明天買書。ます也能表達未來，並非只代表「現在正在做」。</p><h3>邀請：ます→ましょう</h3><p><ruby>食<rt>た</rt></ruby>べます→<ruby>食<rt>た</rt></ruby>べましょう；<ruby>飲<rt>の</rt></ruby>みます→<ruby>飲<rt>の</rt></ruby>みましょう。<br><ruby>一緒<rt>いっしょ</rt></ruby>にご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べましょう。＝一起吃飯吧。<br>コーヒーを<ruby>飲<rt>の</rt></ruby>みましょうか。＝一起喝咖啡好嗎？<br>ましょうか也能主動提出協助：荷物を持ちましょうか。＝要我幫忙拿行李嗎？</p><h3>よ與か的語氣</h3><p><ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きましょうよ。可帶催促或勸誘。<br><ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きましょうか。徵詢對方意見。<br>語氣要看情境和語調，並非固定的強弱公式。</p>","symbol":"日々","intro":"把動作放進句子，說現在，也說過去。","tag":"を・時態・邀請","concepts":[["動作的對象","用「<mark class=\"study-key\">名詞＋を＋動詞</mark>」表達吃甚麼、看甚麼等。助詞を通常讀作o。","パンを<ruby>食<rt>た</rt></ruby>べます。","吃麵包。パン是吃的對象。"],["禮貌形的四種變化","ます、<mark class=\"study-key\">ません</mark>、<mark class=\"study-key\">ました</mark>、ませんでした，分別表示非過去肯定、非過去否定、過去肯定、過去否定。","<ruby>昨日<rt>きのう</rt></ruby>、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ませんでした。","昨天沒有看電影。否定也要交代是過去。"],["一起做某事","把ます換成<mark class=\"study-key\">ましょう</mark>，便可以提出一起行動的建議。","<ruby>一緒<rt>いっしょ</rt></ruby>にお<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みましょう。","一起喝茶吧。<mark class=\"study-key\">ましょう</mark>か則帶有詢問意向，也可用於主動提供幫忙。"]],"caution":"不是所有動詞都需要を，例如「寝ます」可以直接表達睡覺。ます形也可表示習慣或將來，不等於正在進行。","quiz":[{"prompt":"「喝水」的基本句子是？","options":["水がを飲みます。","飲みますを水。","水を飲みます。","水です飲みます。"],"answer":2,"explanation":"水是喝的對象，用水を飲みます。"},{"prompt":"想說「昨天沒有買書」，哪個結尾正確？","options":["買います","買いません","買いました","買いませんでした"],"answer":3,"explanation":"昨天沒有做，應用過去否定ませんでした。"},{"prompt":"要邀請對方一起吃飯，哪句最合適？","options":["一緒にご飯を食べましょう。","一緒にご飯を食べませんでした。","一緒にご飯を食べました。","一緒にご飯を食べるです。"],"answer":0,"explanation":"ます改為ましょう，表示一起做某事的建議。"},{"prompt":"「昨日、映画を見ました。」表示？","options":["昨天沒看電影","昨天看了電影","明天看電影","一起看電影吧"],"answer":1,"explanation":"ました是過去肯定；昨日也交代時間是昨天。","rubyView":{"prompt":"「<ruby>昨日<rt>きのう</rt></ruby>、<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。」表示？","options":["昨天沒看電影","昨天看了電影","明天看電影","一起看電影吧"],"explanation":"ました是過去肯定；昨日也交代時間是昨天。"}}],"uploadedOriginal":"<h3>[ 單元11 ] 動詞基本用法和時式</h3><h3>學習目標</h3><h3>①　學習助詞「を」，了解日文動詞的基本用法</h3><h3>②　學習動詞的現在式和過去式</h3><p>③　學習動詞的「勧誘形(邀請形)」</p><p>在上一單元中，我們大致解說了日文動詞的分類及主要特徵，如果你還沒有被嚇倒（我相信你還沒，否則就不會翻開這一回了），那麼恭喜你，你已經向前跨越了一大步，有眾多的日語學習者在這裡倒下放棄，然而你沒有。因此，我們現在要做的，除了稱許自己外，就是不斷地前進學習。</p><p>我們在上一單元介紹過「什麼是動詞」，而在這一單元，我們將介紹「如何使用動詞」。就某方面來說，知道如何使用、甚至比獲得該東西本身重要。例如在我們小時候，生日時收到了一輛腳踏車當作禮物，那麼最重要的事，不是晚上抱著腳踏車睡覺，而是學習如何騎車，學習如何使用腳踏車。同樣地，我們學習了動詞，過程可能很不輕鬆，但是我們該做的不是抱著學過的動詞睡覺，而是要學習如何使用。因此，我們在學習動詞後，馬上安排了這個單元，打鐵趁熱。</p><p>我們有三項學習重點。</p><p>① 學習助詞「を」，了解日文動詞的基本用法。</p><p>② 學習動詞的現在式和過去式。</p><p>③ 學習動詞的「勧誘用法（邀請用法）」。</p><p>我們將依照順序進行介紹。</p><h3>助詞「を」</h3><p>說到日文動詞的用法，就不能不提到「を」這個助詞，</p><p>它是日文動詞的核心要素之一。</p><p>回想一下中文當中使用動詞的情況，「吃飯」「看書」「喝水」「玩遊戲」「開門」，我們中文習慣以「動詞＋名詞」的形式敘述，「吃」是動詞、「飯」是名詞；「看」是動詞，「書」是名詞等等。如果少了動詞或名詞其中一項，意思就會變得不完整，像是「我看」「我書」，有人聽得懂那是什麼嗎？</p><p>相較於中文「動詞＋名詞」的形式，日文中的動詞，則以不同的方式使用。</p><p>中国語の動詞：動詞＋名詞</p><p>例：吃 ＋ 飯</p><h3>看 ＋ 書</h3><h3>喝 ＋ 水</h3><p>日本語の動詞：名詞　を　動詞</p><p>例：ご飯（飯）　 を　  食べる（吃）</p><p>本 (書)　　を　　読む(讀)</p><p>水(みず) (水)　　を　　飲(の)む(喝)</p><p>現在你應該可以知道，日文的語順和中文剛好相反，而且助詞「を」也是中文當中所沒有的概念，接在名詞和動詞中間。這就是「を」最主要的功能。</p><p>也許你在一時三刻內很難理解這樣的用法，不過根據我們的教學經驗，不用幾天，你就會非常習慣這樣的用法了。具體原因並不清楚，不過對於中文母語者來說，這似乎不是太困難的問題。</p><p>其他例句如下:</p><p>例：ゲーム を する（玩遊戲）</p><p>ドア を 開ける（開門）</p><p>飲み物 を 買う（買飲料）</p><p>テレビ を 付ける（開電視）</p><p>傘 を さす（撐傘）</p><p>ボタン を 押す（按下按鈕）</p><p>字 を 書く（寫字）</p><p>絵 を 描く（畫畫）</p><p>犬 を 飼う（養狗）</p><p>不不，我知道你在想什麼，現在不是背這些動詞的時候，不要急著像背單字卡一樣，急著將這些新看到的字全部背起來。關於最好的單字記憶方法，我們會在「音速老師的日語成功筆記」書中談到，目前，你只要跟著聲音檔多念幾次，確定發音正確，並且了解文法架構就好。</p><h3>動詞的現在式和過去式</h3><p>我們先前學過名詞和形容詞的現在式、過去式，因此現在學習動詞時，就顯得容易多了。我們先將剛才提到的例句，由「動詞原形」轉換為「動詞ます形」，因為在目前階段，我們的日文會話都是以「動詞ます形」居多。你必須變成機器人形態。</p><p>例：</p><p>（Ⅲ動詞）ゲーム を する　→　ゲーム を します</p><p>（Ⅱ動詞）ドア を 開ける　→　ドア を 開けます</p><p>（Ⅰ動詞）飲み物 を 買う　→　飲み物 を 買います</p><p>（Ⅱ動詞）テレビ を 付ける　→　テレビ を 付けます</p><p>以上你所看到的，是「動詞ます形」的現在式。還記得「現在式 → 過去式、現在否定 → 過去否定」這個變化規則嗎？我們先介紹「現在否定」。</p><p>動詞ます形現在式: ～ます</p><h3>↓　將「ます」改為「ません」</h3><p>動詞ます形現在否定: ～ません</p><p>例：ゲームをします　→　ゲームをしません（不玩遊戲）</p><p>ドアを開けます　→　ドアを開けません（不開門）</p><p>飲み物を買います　→　飲み物を買いません（不買飲料）</p><p>テレビを付けます　→　テレビを付けません（不開電視）</p><p>接著，來理解動詞現在式如何變成過去式。「現在式 → 過去式、現在否定 → 過去否定」法則的前面部分。</p><p>動詞ます形現在式: ～ます</p><h3>↓　將「ます」改為「ました」</h3><p>動詞ます形過去式: ～ました</p><p>例：ゲームをします　→　ゲームをしました（玩了遊戲）</p><p>ドアを開けます　→　ドアを開けました（開了門）</p><p>飲み物を買います　→　飲み物を買いました（買了飲料）</p><p>テレビを付けます　→　テレビを付けました（開了電視）</p><p>最後，來理解動詞「現在否定」如何變成「過去否定」。</p><p>「現在式→過去式、現在否定→過去否定」的後面部分。</p><p>動詞ます形現在否定: ～ません</p><h3>↓　加上「でした」</h3><p>動詞ます形過去否定: ～ませんでした</p><p>例：ゲームをしません　→　ゲームをしませんでした　（之前沒玩遊戲）</p><p>ドアを開けません　→　ドアを開けませんでした（之前沒開門）</p><p>飲み物を買いません → 飲み物を買いませんでした（之前沒有買飲料）</p><p>テレビを付けません → テレビを付けませんでした（先前沒有開電視）</p><p>我想現在你或許頭腦已經一片混亂了，「ます、ません、でした」跳來跳去，為了更方便理解，我們將上面的全部內容，簡單整理成以下表格。</p><div class=\"table-scroll\"><table><tr><th></th><th>現在</th><th>過去</th></tr><tr><td>肯定</td><td>～ます</td><td>～ました</td></tr><tr><td>否定</td><td>～ません</td><td>～ませんでした</td></tr></table></div><p>有沒有什麼更快速記憶的方法？有！</p><h3>「ます！ません！ました！ませんでした！」</h3><p>將上面這句話多唸幾次後，會發現它的韻律感、就像是唸繞口令般，再多唸幾次，你就能完全記起來了。這個方法雖然原始，看起來也有些笨，不過相信我們，這絕對是記憶的好方法。</p><h3>動詞的邀請用法</h3><p>最後，我們再學一個會話中非常實用的動詞用法，語言學上稱為「勸誘用法」，不過我傾向以白話文解釋，其實就是「邀請用法」。什麼是邀請用法？簡單來說，就是邀請別人做某件事情，例如「一起喝杯咖啡吧！  一起去吃飯吧！</p><p>一起去玩吧！  鐘響了，我們一起回教室吧！」等等，中文當中的「一起…吧！」就是典型的邀請用法。當然日文中也有，而且用一個動詞變化就可以表達。</p><p>邀請用法：等於中文的「一起…吧！」</p><p>動詞ます形：～ます</p><h3>↓　將「ます」改為「ましょう」</h3><p>邀請用法：～ましょう</p><p>例：ご飯 を 食べましょう。（一起吃飯吧！）</p><p>ゲーム を しましょう。（一起玩遊戲吧！）</p><p>遊びましょう。（一起玩吧！）</p><p>コーヒー を 飲みましょう。（一起喝咖啡吧！）</p><p>ジーンズ を 買いましょう。（一起買牛仔褲吧！）</p><p>ペット を 飼いましょう。（一起養寵物吧！）</p><p>如果想加強或減弱語氣，可以在最後加上表示語氣的助詞「よ」和「か」。聆聽一下聲音檔，你很容易就可以感受到語氣上的差別。</p><p>加強語氣:相當於中文的「一起…啦！」</p><p>例：コーヒー を 飲みましょうよ。（一起喝咖啡啦！）</p><p>ジーンズ を 買いましょうよ。（一起買牛仔褲啦！）</p><p>ペット を 飼いましょうよ。（一起養寵物啦！）</p><p>減弱語氣:相當於中文的「一起…吧，好不好？」</p><p>例：コーヒーを飲みましょうか。（一起喝咖啡，好不好？）</p><p>ジーンズを買いましょうか。（一起買褲子，好不好？）</p><p>ペットを飼いましょうか。（一起養寵物，好不好？）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":12,"title":"和動詞連用的助詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">分清も、に、で、と在動詞句中的角色。</p><h3>も：也</h3><p><ruby>鈴木<rt>すずき</rt></ruby>さんは<ruby>学生<rt>がくせい</rt></ruby>です。<ruby>私<rt>わたし</rt></ruby>も<ruby>学生<rt>がくせい</rt></ruby>です。＝鈴木是學生，我也是。<br>パンを<ruby>買<rt>か</rt></ruby>いました。<ruby>牛乳<rt>ぎゅうにゅう</rt></ruby>も<ruby>買<rt>か</rt></ruby>いました。＝買了麵包，也買了牛奶。<br><mark class=\"study-key\">も可替代這裡的は或を</mark>；不表示後面的動詞要再加です。</p><h3>に：移動的目的地</h3><p><ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。＝去日本。<br><ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>りました。＝回家了。<br><ruby>友達<rt>ともだち</rt></ruby>が<ruby>学校<rt>がっこう</rt></ruby>に<ruby>来<rt>き</rt></ruby>ました。＝朋友來了學校。<br>本課先學目的地，に在其他句型還能表示時間、存在位置、對象。</p><h3>で：工具、交通方式與材料</h3><p><mark class=\"study-key\">鉛筆で</mark>字を書きます。＝用鉛筆寫字。<br>バスで<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。＝坐巴士上學。<br><ruby>紙<rt>かみ</rt></ruby>で<ruby>鶴<rt>つる</rt></ruby>を<ruby>作<rt>つく</rt></ruby>りました。＝用紙摺了鶴。<br>步行通常說歩いて行きます。</p><h3>と：一起行動的對象</h3><p><ruby>友達<rt>ともだち</rt></ruby>と<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。＝和朋友看了電影。<br><ruby>父<rt>ちち</rt></ruby>と<ruby>食事<rt>しょくじ</rt></ruby>をします。＝和爸爸吃飯。<br>と放在<mark class=\"study-key\">一起行動的對象</mark>後面：友達と，不是と友達。</p><h3>合在一句</h3><p><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>とバスで<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。<br>我和朋友一起坐巴士上學。<ruby>友達<rt>ともだち</rt></ruby>と＝和誰；バスで＝用甚麼方式；<ruby>学校<rt>がっこう</rt></ruby>に＝到哪裡。</p>","symbol":"一緒に","intro":"用助詞交代去哪裡、怎樣去、跟誰去。","tag":"も・に・で・と","concepts":[["も：也","當名詞的<mark class=\"study-key\">角色相同</mark>，も可<mark class=\"study-key\">取代は或を</mark>，表示「也」。","パンを<ruby>買<rt>か</rt></ruby>いました。<ruby>牛乳<rt>ぎゅうにゅう</rt></ruby>も<ruby>買<rt>か</rt></ruby>いました。","買了麵包，也買了牛奶。這裡も取代を。"],["に與で","<mark class=\"study-key\">移動目的地</mark>用に；<mark class=\"study-key\">交通工具</mark>、工具或方法可用で。","<ruby>電車<rt>でんしゃ</rt></ruby>で<ruby>京都<rt>きょうと</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","乘電車去京都。電車是<mark class=\"study-key\">交通工具</mark>，京都是目的地。"],["と：和誰一起","<mark class=\"study-key\">一起行動的對象</mark>後面放と，再接動作。","<ruby>友達<rt>ともだち</rt></ruby>と<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ます。","和朋友一起看電影。"]],"caution":"動詞ます形後不再加です，例如「私も行きます」，不是「行きますです」。に和で還有其他用法，下一課會學存在與動作場所。","quiz":[{"prompt":"乘巴士去學校：バス＿＿学校＿＿行きます。","options":["に／で","と／も","を／が","で／に"],"answer":3,"explanation":"交通工具用で，目的地用に。"},{"prompt":"和朋友看電影：友達＿＿映画を見ます。","options":["と","で","を","が"],"answer":0,"explanation":"共同做事的對象後面用と。"},{"prompt":"我也去：私＿＿行きます。","options":["を","も","で","の"],"answer":1,"explanation":"も表示也；這裡取代主題助詞は。"},{"prompt":"用鉛筆寫字：鉛筆＿＿字を書きます。","options":["に","と","で","も"],"answer":2,"explanation":"工具或手段以で表示。"}],"uploadedOriginal":"<h3>[ 單元12 ] 和動詞連用的助詞</h3><h3>學習目標</h3><h3>①　了解助詞「も」「に」「で」「と」的意思</h3><p>②　了解助詞「も」「に」「で」「と」的基本用法</p><p>經過上一回的練習，我們已經克服了動詞入門時最棘手的部分，你已經大致掌握了日文動詞的技巧，包括:「區分動詞原形和動詞ます形」、現在過去式、以及用替換字尾羅馬拼音字母的方式，將動詞原形變換為動詞ます形。隨著文法的加深，必須學習的東西也會愈來愈多，但是基本技巧都是一樣的，特別是「替換字尾羅馬拼音字母」，這個技巧我們以後會常常用到。事實上，只要熟練後，往後的動詞學習，並不會遇到太大的困難。</p><p>這一單元，我們要來學習「も」「に」「で」「と」這四個助詞，這些助詞常常和動詞一起使用。什麼意思呢？我們來看看中文的情況:「我也喜歡小狗」「我到學校去」「我和同學一起寫作業」，這些例句中，「也」「到」「和」這三個字是助詞，本身沒有意思，主要的功能是和後面的動詞「喜歡」「去」「寫作業」一起使用，形成一句完整的句子。日文中的「も」「に」「で」「と」也是一樣，和動詞一起使用，形成一句意思完整的句子。</p><p>學習重點有:</p><p>①了解助詞「も」「に」「で」「と」的意思。</p><p>②了解助詞「も」「に」「で」「と」的基本用法。</p><p>我們將依序介紹下去。</p><h3>も</h3><p>「も」：等同中文的「也」。是使用頻率非常高的助詞。</p><p>句型:</p><p>（名詞）も　（名詞／形容詞／動詞）です。</p><p>例：</p><p>鈴木さん は 大学生 です。私 も 大学生 です。</p><p>（鈴木先生是大學生，我也是大學生。）</p><p>私 は サラリーマン です。彼(かれ) も サラリーマン です。</p><p>（我是上班族，他也是上班族。）</p><p>台北の夜市 は 賑やか です。九份 も 賑やか です。</p><p>（台北的夜市很熱鬧，九份也很熱鬧。）</p><p>学食の料理 は まずい です。このレストランの料理 も まずい です。</p><p>（學生餐廳的料理很難吃，這間餐廳的料理也很難吃。）</p><p>ピザ を 買いました。パスタ も　買いました。</p><p>（買了比薩，也買了義大利麵。）</p><p>両親 は 日本 に 行きます。私 も 行きます。</p><p>（雙親要去日本，我也要去。）</p><h3>に</h3><p>助詞「に」的後面，主要接續和「移動」有關的動詞，像是：行く（去）、来る（來）、帰る（回家），表示「移動的目的地」。</p><p>「に」：表示「目的地」</p><p>句型:</p><p>（名詞)は　（場所地方)  に　（行きます・来ます・帰ります）。</p><p>例：</p><p>私 は 日本に 行きます。（我去日本。）</p><p>私 は 会社に 行きます。（我去公司。）</p><p>私 は アメリカに 行きました。（我去了美國。）</p><p>彼 は 学校に 来ませんでした。（他之前沒來學校。）</p><p>お客さん は 家に 来ました。（客人來了家裡。）</p><p>お母さん は 実家に 帰ります。（母親回去老家。）</p><p>弟 は 家に 帰りました。（弟弟回家了。）</p><h3>で</h3><p>助詞「で」最基本的用法，就是用以表示「方法．手段」。</p><p>「で」：表示方法或手段。</p><p>相當於中文的「利用…、使用…」。</p><p>句型:（名詞）は　（名詞）　で　（動作）。</p><p>例：</p><p>私 は 鉛筆 で 字を書く（書きます）。</p><p>（我用鉛筆寫字。）</p><p>私 は フォーク で パスタを食べます。</p><p>（我用叉子吃義大利麵。）</p><p>私 は バス で 学校に行きます。</p><p>（我坐（使用）公車去學校。）</p><p>私 は 飛行機 で 日本に行きます。</p><p>（我坐（使用）飛機去日本。）</p><p>私 は 紙 で 鶴を作りました。</p><p>（我用紙摺了鶴。）</p><p>私 は 紙粘土 で ドラゴンを作りました。</p><p>（我用紙黏土做了龍。）</p><p>私 は 自分の力 で 仕事を探します。</p><p>（我用自己的力量找工作。）</p><p>私 は 両親の支え で マンションを買いました。</p><p>（我經由父母親的援助買了公寓。）</p><h3>と</h3><p>在之前的單元中，我們學過「と」這個助詞的用法，例如「先生と学生」「松と竹と桜」等等，「と」相當於中文的「和」。而「と」和動詞一起使用時，同樣也是「和」的意思。</p><p>「と」:表示連帶關係，等同中文的「和」。</p><p>句型: 私 は （人名） と  （動作）。</p><p>（我和某人～～）</p><p>這裡要特別注意，中文的「和」，是接在人名之前，像「我『和』『他』一起去旅行」，然而日文則相反，「と」必須接在人名之後，例如「私は『彼』『と』日本に行きます。」</p><p>例：</p><p>私は 先生と 職員室に 行きました。</p><p>（我和老師去辦公室。）</p><p>私は 父と 食事を しました。</p><p>（我和父親去吃飯。）</p><p>母は ペットと 海外旅行を しました。</p><p>（母親和寵物去海外旅行。）</p><p>上野さんは 彼女と 映画を 見ました。</p><p>（上野先生和女朋友去看了電影。）</p><p>私は 弟と妹と 実家に 帰りました。</p><p>（我和弟弟妹妹回了老家。）</p><p>社長は 部長と 出掛けました。</p><p>（社長和部長出去了。）</p><h3>句型整理</h3><p>即使是架構相同的句子，隨著助詞的不同、意思也會相差很多。請比較看看我們在這一單元學到的四個助詞：</p><p>①私 は 日本 に 行きます。</p><p>我去日本。以「に」表示目的地。</p><p>②私 も 日本に行きます。</p><p>我也去日本。以「も」表示「也」的意思。</p><p>③私 は 友達 と 日本に行きます。</p><p>我和朋友去日本。以「と」表示「和」的意思。</p><p>④私 は 飛行機 で 日本に行きます。</p><p>我坐飛機去日本。以「で」表示交通工具、方法手段。</p><p>以上四項句型，同時也是會話中經常用到的句型，請務必完全理解其意思。</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":13,"title":"描述場所的句型","original":"<h3>學習目標</h3><p class=\"lesson-focus\">區分<mark class=\"study-key\">存在</mark>位置與動作場所，並用方位詞說得更準確。</p><h3>某地有甚麼：場所に＋名詞が＋あります／います</h3><p><ruby>部屋<rt>へや</rt></ruby>にベッドがあります。＝房間裡有床。<br>教室に先生が<mark class=\"study-key\">います</mark>。＝教室裡有老師。<br>人和動物等通常用います；物件與植物通常用あります。<br><ruby>庭<rt>にわ</rt></ruby>に<ruby>木<rt>き</rt></ruby>があります。＝庭院裡有樹。不要只按有沒有生命決定。</p><h3>甚麼在哪裡：名詞は＋場所に＋あります／います</h3><p><ruby>本<rt>ほん</rt></ruby>は<ruby>机<rt>つくえ</rt></ruby>の上にあります。＝書在桌上。<br>先生は教室に<mark class=\"study-key\">います</mark>。＝老師在教室。<br>前一種引入「有甚麼」；這一種回答已知對象「在哪裡」。</p><h3>某地做甚麼：場所で＋動作</h3><p><ruby>図書館<rt>としょかん</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。＝在圖書館看書。<br>プールで<ruby>泳<rt>およ</rt></ruby>ぎます。＝在泳池游泳。<br>不能推成「ある／いる以外都用で」：<ruby>学校<rt>がっこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>く、東京に住む等仍用に。</p><h3>方位詞</h3><p>上（うえ）、下（した）、前（まえ）、後ろ（うしろ）、中（なか）、隣（となり）、そば。<br><ruby>机<rt>つくえ</rt></ruby>の上に<ruby>本<rt>ほん</rt></ruby>があります。＝桌上有書。<br>ベッドの下に<ruby>猫<rt>ねこ</rt></ruby>がいます。＝床下有貓。<br><ruby>学校<rt>がっこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>で<ruby>友達<rt>ともだち</rt></ruby>に<ruby>会<rt>あ</rt></ruby>います。＝在學校前面見朋友。<br>場所＋の＋方位詞後，再按「存在」或「動作」選に／で。</p>","symbol":"場所","intro":"分清「在那裡」和「在那裡做事」。","tag":"存在・場所・方位","concepts":[["有甚麼在那裡","場所に＋事物が＋<mark class=\"study-key\">あります</mark>／<mark class=\"study-key\">います</mark>。人和動物一般用います；物件與植物一般用あります。","<ruby>庭<rt>にわ</rt></ruby>に<ruby>猫<rt>ねこ</rt></ruby>がいます。<ruby>庭<rt>にわ</rt></ruby>に<ruby>木<rt>き</rt></ruby>があります。","庭院有貓，也有樹。植物雖有生命，仍用<mark class=\"study-key\">あります</mark>。"],["在某處做某事","<mark class=\"study-key\">動作發生的地方</mark>用で。先想清楚是在說<mark class=\"study-key\">存在</mark>，還是在說一個動作。","<ruby>図書館<rt>としょかん</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。","在圖書館看書。對照：図書館に本が<mark class=\"study-key\">あります</mark>。"],["說得更精確","用「<mark class=\"study-key\">名詞＋の＋方位詞</mark>」，例如上、下、前、後ろ、中、隣。","<ruby>机<rt>つくえ</rt></ruby>の下に<ruby>犬<rt>いぬ</rt></ruby>がいます。","桌子下面有狗。"]],"caution":"不要把「除<mark class=\"study-key\">あります</mark>／<mark class=\"study-key\">います</mark>外全部用で」當作規則：移動目的地仍用に。以動詞的意思判斷，而非只看是否有動作。","quiz":[{"prompt":"公園裡有一棵樹，應該用哪個動詞？","options":["あります","います","読みます","食べます"],"answer":0,"explanation":"植物一般使用あります，即使它有生命。"},{"prompt":"在咖啡店看書：喫茶店＿＿本を読みます。","options":["に","で","が","を"],"answer":1,"explanation":"讀書發生的場所用で。"},{"prompt":"桌子下面有貓：机＿＿下＿＿猫がいます。","options":["に／で","で／の","の／に","が／を"],"answer":2,"explanation":"「机の下」是一個位置，存在的場所接に。","rubyView":{"prompt":"桌子下面有貓：机＿＿下＿＿猫がいます。","options":["に／で","で／の","の／に","が／を"],"explanation":"「<ruby>机<rt>つくえ</rt></ruby>の下」是一個位置，存在的場所接に。"}},{"prompt":"「教室に先生がいます。」是甚麼意思？","options":["老師去教室","老師在教室教書","教室沒有老師","教室裡有老師"],"answer":3,"explanation":"います表達人的存在，沒有額外說明老師正在做甚麼。"}],"uploadedOriginal":"<h3>[ 單元13 ] 描述場所的句型</h3><h3>學習目標</h3><h3>①　理解「存在句型」的用法</h3><p>②　了解「あります（ある）」和「います（いる）」差別</p><h3>③　理解「動作地點句型」的用法</h3><h3>④　了解「方位詞」的用法</h3><p>學習日文時，最有效率的方法之一，就是直接學習「句型」。以句型學習有很多好處，像是「～は～です」的句型，我們只要在空白處填上名詞，基本上文法就不會有錯誤，有利於學習者說出正確的語句。其次，日文中的某些「助詞」和「動詞」，有固定搭配方法，例如「に」＋「行きます・来ます」，單獨記憶每個助詞的用法，很容易招致混亂，不如連後面的動詞一起記、記住「一整個句型」，如此一來，待日後句型更為熟練後，自然懂得如何再進行變化及應用。我們這次介紹的，正是二個和「場所」有關的句型。</p><p>和場所有關的句型，簡單來說，就像中文的「後院有貓」、「床底下有螞蟻」、「在家裡睡覺」、「在教室寫作業」等等的「在什麼地方有什麼」和「在什麼地方做什麼」的句型。日文中也有對應的句型，前者稱為「存在句型」，表示某物存在於某地方；後者稱為「動作地點句型」，表示某動作發生的地點。好吧，以上二個詞彙都是我們創造出來的，目的是為了使大家更容易理解。</p><p>從本單元開始，會出現同一個助詞有二種至三種用法的情況，我們會在之後將助詞的用法整理成表格，以方便理解。</p><h3>存在句型</h3><p>存在句型，即表示「在什麼地方有什麼東西」的句型。在這裡要特別注意動詞「あります」、「います」二者的使用時機。</p><p>存在句型:</p><p>（場所地點）に　（東西）が　あります。</p><p>（場所地點）に　（東西）が　います。</p><p>（在～有～）</p><p>例：</p><p>庭に 松が あります。（庭院裡有松樹。）</p><p>部屋に ベッドが あります。（房間裡有床。）</p><p>かばんに 香水が あります。（包包裡有香水。）</p><p>紙箱に 猫が います。（紙箱裡有貓。）</p><p>動物園に ライオンが います。（動物園裡有獅子。）</p><p>コンビニに 電子レンジが あります。</p><p>（便利商店裡有微波爐。）</p><p>你現在心裡一定有很多的疑問，讓我們來一個一個解決。這裡要解答的問題有二個：</p><h3>第一，是助詞「に」的用法，</h3><p>第二，則是為什麼同樣意思的句型，會有「あります」「います」二種不同的動詞出現。</p><p>① 助詞「に」，除了之前介紹過，可以用來表示「目的地」之外，也可以用來表示「東西存在的場所」，如本單元介紹的句型。「に」是用途極為廣泛的助詞之一。</p><p>② 關於何時使用「あります」、何時使用「います」，其實是依據「地點 に　東西  が　あります」句型中的「東西」部分決定的。至於區別方法，有許多學者做過研究，也提出許多方法，其中有些方法非常準確、但是卻過於複雜，對於學習反而造成負擔，因此我們教你一個最簡單的方法:</p><p>有生命的東西，使用「います」。</p><p>沒有生命的東西，使用「あります」。</p><p>人、動物等有生命的東西，使用「（地點）に（東西）がいます」這個句型。其他無生命的東西，則使用「（地點）に（東西）があります」這個句型。</p><p>例：</p><p>教室に 学生と先生 が います。</p><p>（教室裡有學生和老師。）</p><p>床 に 蟻 が います。（地板上有螞蟻。）</p><p>森 に 熊 が います。（森林裡有熊。）</p><p>アフリカ に キリン が います。（非洲有長頸鹿。）</p><p>本棚 に 小説と雑誌 が あります。</p><p>（書架上有小說和雜誌。）</p><p>ゴミ箱 に ペットボトル が あります。</p><p>（垃圾桶裡有保特瓶。）</p><p>図書館 に 本とパソコン が あります。</p><p>（圖書館裡有書和電腦。）</p><p>有幾個字是例外的，但是並不難理解，如下:</p><p>植物:雖然植物有生命，但是因為不會動、看起來和無生命的東西一樣，因此使用「あります」。</p><p>幽靈妖怪:雖然幽靈妖怪理論上沒有生命，但是由於和人類形體相像、像是有生命的東西，因此使用「います」。</p><p>例：川の岸に桜の木があります。（河岸上有櫻花樹。）</p><p>A：あの屋敷に幽霊がいますよ！</p><p>（那間房子裡有幽靈喔！）</p><p>B：うそ！（真的假的！）</p><h3>動作地點句型</h3><p>接下來，我們要介紹的是「動作地點句型」，顧名思義，就是「在某地點進行某動作」，也就是「在某地方做某事」的意思。和之前介紹的「存在句型」很像，都是用來表示「地點」的用法。</p><p>動作地點句型:（場所地點）で（動詞）</p><p>（在～做～）</p><p>例：</p><p>部屋で ご飯を 食べます。（在房間吃飯。）</p><p>本屋で 小説を 買います。（在書店買小說。）</p><p>喫茶店で 教科書を 読みます。（在咖啡廳讀教科書。）</p><p>運動場で 走ります。（在運動場跑步。）</p><p>プールで 泳ぎます。（在游泳池游泳。）</p><p>ソファで 寝ます。（在沙發上睡覺。）</p><p>好了好了，你一定也有二個問題等著要發問，第一是關於助詞「で」的用法，第二是如何區別表示場所地點的助詞「に」和「で」。讓我們依序解決吧！</p><p>① 助詞「で」，我們目前學到了二個用法，分別是表示「方法手段」和「動作發生的地點」。在短時間內，我們保證不會再有其他用法了，請將這二種用法記起來。</p><p>② 助詞「に」和「で」的區別方法，也可以換個方式說：如何區分什麼時候使用「存在句型」、什麼時候使用「動作發生句型」。我們用中文來思考即可。</p><p>存在句型「～に～があります」:</p><h3>用於表示「什麼東西在什麼地方」</h3><p>動作發生句型「～で～」:</p><h3>用於表示「在什麼地方做什麼動作」</h3><h3>簡單來說，</h3><p>・後方是「あります、います」時，前面用「に」。</p><p>・後方是其他動詞時，前面用「で」。</p><h3>存在句型、方位詞</h3><p>儘管我們介紹了存在句型，但是有時候實際運用時、意思仍是不夠完整，例如「机に本があります」，中文是「書在桌子」，聽到這句話的人，一定會尋思:「書到底在桌子的上面、下面、還是前面後面呢？」。這就是我們將補充介紹的部分，經由表示物體方位的「上面、下面、前後方」這些方位詞，讓句子的意思更完整。</p><p>方位詞:</p><p>上方 :上【0】　下方 : 下【0】　前方 : 前【1】</p><p>後方 : 後ろ【0】   ～之内 : 中【1】</p><p>旁邊 : 隣【0】そば【1】</p><p>句型用法:</p><p>（場所地點）の（方位詞）に（東西）が　あります。います。</p><p>例：庭の中に 松が あります。　（庭院裡有松樹。）</p><p>机の上に 雑誌が あります。（桌子上有雜誌。）</p><p>ベッドの下に ゴキブリが います。</p><p>（床下面有蟑螂。）</p><p>レストランの前に 看板が あります。</p><p>（餐廳前面有招牌。）</p><p>車の後ろに 子猫と子犬が います。</p><p>（車子後面有小貓和小狗。）</p><p>先生のとなりに 父と母が います。</p><p>（老師的旁邊是父親和母親。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":14,"title":"授受動詞的用法","original":"<h3>學習目標</h3><p class=\"lesson-focus\">學會<mark class=\"study-key\">あげる</mark>、<mark class=\"study-key\">くれる</mark>、もらう，按給予方向選詞。</p><h3>あげる：給別人</h3><p>給予者は＋接受者に＋物品を＋あげます。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>妹<rt>いもうと</rt></ruby>にプレゼントをあげました。＝我送妹妹禮物。<br><ruby>田中<rt>たなか</rt></ruby>さんは<ruby>友達<rt>ともだち</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をあげました。＝田中送朋友書。<br>常用於我給別人，或第三者之間的給予。</p><h3>くれる：別人給我方</h3><p>給予者は／が＋我方に＋物品を＋くれます。<br><ruby>友達<rt>ともだち</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をくれました。＝朋友送我書。<br><ruby>友達<rt>ともだち</rt></ruby>が<ruby>妹<rt>いもうと</rt></ruby>に<ruby>飴<rt>あめ</rt></ruby>をくれました。＝朋友給我妹妹糖果。<br>我方也能包括語境中的家人等親近者，不限本人。<ruby>私<rt>わたし</rt></ruby>に清楚<ruby>時<rt>じ</rt></ruby>常省略。</p><h3>もらう：從別人得到</h3><p>接受者は＋給予者に／から＋物品を＋もらいます。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をもらいました。＝我從朋友那裡得到書。<br>從公司、學校等機構得到物品時，常用から。</p><h3>同一件事，換主題</h3><p><ruby>友達<rt>ともだち</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をくれました。<br><ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をもらいました。<br>兩句都是朋友給我書。<mark class=\"study-key\">くれる</mark>的主題是<mark class=\"study-key\">給予者</mark>；もらう的主題是接受者。</p><h3>先認方向，再看關係</h3><p>我→妹妹：<mark class=\"study-key\">あげる</mark>。朋友→<mark class=\"study-key\">我方</mark>：くれる。我方←朋友：もらう。<br>這些是基本授受用語，不是敬語的全部。第26課會把「給物品」延伸到「替人做事」。</p>","symbol":"贈り物","intro":"同一份禮物，從不同人的角度來說。","tag":"あげる・くれる・もらう","concepts":[["あげる：給出去","<mark class=\"study-key\">給予者</mark>は＋<mark class=\"study-key\">接受者</mark>に＋物品を＋あげます。常用於我給別人，或別人之間的給予。","<ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をあげました。","我送了一本書給朋友。"],["くれる：給我方","以<mark class=\"study-key\">給予者</mark>作主題，說別人給我或<mark class=\"study-key\">我方</mark>親近的人東西。","<ruby>友達<rt>ともだち</rt></ruby>は<ruby>私<rt>わたし</rt></ruby>に<ruby>花<rt>はな</rt></ruby>をくれました。","朋友送花給我。"],["もらう：收下來","<mark class=\"study-key\">接受者</mark>は＋<mark class=\"study-key\">給予者</mark>に／から＋物品を＋もらいます。主題變成收到的人。","<ruby>私<rt>わたし</rt></ruby>は<ruby>友達<rt>ともだち</rt></ruby>から<ruby>花<rt>はな</rt></ruby>をもらいました。","我從朋友那裡收到花。和上一例是同一件事。"]],"caution":"先找出誰給、誰收、誰在說話。<mark class=\"study-key\">くれる</mark>的接受方也可包括<mark class=\"study-key\">我方</mark>親近者；不要只按句中出現私就決定用哪個詞。","quiz":[{"prompt":"從「我送朋友禮物」的角度，應用哪個？","options":["くれました","あげました","もらいました","いました"],"answer":1,"explanation":"私は友達にプレゼントをあげました：我把禮物給朋友。"},{"prompt":"友達は私に花を＿＿。","options":["もらいました","あげました","くれました","行きました"],"answer":2,"explanation":"別人給我東西，以くれました描述。"},{"prompt":"「我從老師收到一本書」，哪句正確？","options":["先生は私に本をもらいました。","私は先生に本をくれました。","私は先生から本をあげました。","私は先生から本をもらいました。"],"answer":3,"explanation":"もらう的主題是接受方；から指出給予方。"},{"prompt":"「姉は私に本をくれました。」換個角度說是？","options":["私は姉から本をもらいました。","私は姉に本をあげました。","姉は私から本をもらいました。","私は姉に本をくれました。"],"answer":0,"explanation":"兩句都表示姐姐給我書，只是分別從給予者和接受者敘述。","rubyView":{"prompt":"「姉は<ruby>私<rt>わたし</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>をくれました。」換個角度說是？","options":["私は姉から本をもらいました。","私は姉に本をあげました。","姉は私から本をもらいました。","私は姉に本をくれました。"],"explanation":"兩句都表示姐姐給我書，只是分別從給予者和接受者敘述。"}}],"uploadedOriginal":"<h3>[ 單元14 ] 授受動詞的用法</h3><h3>學習目標</h3><h3>①　了解何謂「授受動詞」</h3><p>②　了解授受動詞「くれる」「あげる」「もらう」用法</p><p>看到本單元的篇名「授受動詞」，相信你一定會感到疑惑「這究竟是啥？」，雖然我們並不喜歡在教材上使用這種語言學名詞，不過這是最簡潔有力的說法。所謂的「授受」，第一個「授」是「授予」「給予」之意，第二個「受」，則是「接受」的意思。因此這類動詞，就是用在「給予他人東西」或「接受他人東西」的相關句型上。日文當中，授受動詞不多，基本上只有三個，由於中文當中沒有類似概念，因此必須花些時間理解。</p><p>日本人非常重視「禮節」，因此「給予他人東西」或「接受他人東西」，會依照對象的不同，而有不同的說法。關於這些說法，我們之後會深入淺出進行介紹。總之，授受動詞具體表現了日本人特有的禮節觀念，因此其概念及用法，在往後的日文學習上也佔有相當重要的地位，請務必完全理解。</p><p>日文的授受動詞有三個:「くれる」「あげる」「もらう」，簡單定義如下:</p><p>「くれる」: 別人給我東西時使用。</p><p>「あげる」: 我給別人東西、或別人互給東西時使用。</p><p>「もらう」: 從他人得到東西時使用。</p><p>各有其固定的句型用法，以下將逐一進行介紹。</p><h3>くれる</h3><p>為了方便理解，我們以「第一人稱（我）」「第二人稱（你）」「第三人稱（他她）」為說話對象進行說明。</p><p>Ⅱ動詞「くれる」:</p><p>相當於中文的「給予」。只用在「第二人稱」及「第三人稱」給予「第一人稱」時使用。簡單來說，就是用在別人給我東西時。</p><p>句型:（某人）は　私　に　（東西）を　くれます。</p><p>（某人 給予 我 某樣東西。）</p><p>首先，關於「くれる」的具體說明，請參照下圖:<br>（圖表見PDF講義）</p><p>例：</p><p>（あなたは）私に この飲み物 を くれますか。</p><p>（你要給我這杯飲料嗎？）</p><p>（あなたは）私に ボールペン を くれました。</p><p>（你給了我原子筆。）</p><p>彼は 私に ノートパソコン を くれました。</p><p>（他給了我筆記型電腦。）</p><p>彼女は 私に 新しい手帳 を くれました。</p><p>（她給了我新的記事本。）</p><p>先生は 私に １００点 を くれました。</p><p>（老師給了我一百分。）</p><p>林さんは私にコンサートのチケットをくれました。</p><p>（林先生給了我演奏會的門票。）</p><h3>助詞「に」</h3><p>這裡的助詞「に」，用於表示「對象」，和之前學到的「目的地」意思相似。「某人給我東西」，「我」就是那個被給予的對象，也是對方給予東西的「目的地」。至今為止，我們學到了二種助詞「に」的用法。</p><p>（圖表見PDF講義）</p><h3>あげる</h3><p>Ⅱ動詞「あげる」:</p><p>相當於中文的「給予」。用在「第一人稱」給予「第二第三人稱」時，以及「第二三人稱」互給時。簡單來說，就是用在我給別人東西，以及別人互給東西時。</p><p>句型:</p><p>（人称）は　（他人）　に　（東西）を　あげます。</p><p>（某人 給予 某人 一樣東西。）</p><p>關於「あげる」的具體說明，請參照下圖:</p><p>（圖表見PDF講義）</p><p>例：</p><p>私は（あなたに）プレゼントを あげましたよね。</p><p>（我給了你禮物吧？）</p><p>私は 彼に 使い捨ての箸を あげました。</p><p>（我給了他免洗筷。）</p><p>私は 石原さんに 防虫スプレーを あげました。</p><p>（我給了石原先生防蟲噴霧器。）</p><p>（あなたは）弟さんに ケーキを あげましたか。</p><p>（你給了你弟弟蛋糕嗎？）</p><p>小西さんは（あなたに）映画のチケットをあげましたよね。</p><p>（小西小姐給了你電影票吧。）</p><p>彼は彼のお父さんに新しい腕時計をあげました。</p><p>（他給了他父親新手錶。）</p><p>小林さんの妻は 小林さんに 愛妻弁当をあげました。</p><p>（小林先生的太太給小林先生愛妻便當。）</p><h3>もらう</h3><p>Ⅰ動詞「もらう」:</p><p>相當於中文的「得到」。用在「從某人那裡得到什麼東西」時。要注意的是，一般來說給予方不使用第一人稱（私），否則會有較不自然的感覺。</p><p>「給予方」後面的助詞，使用「に、から」都可以。</p><p>句型:（接受方）は（給予方）に／から（東西）をもらいます。</p><p>（某人 從 他人那裡 得到、拿到一樣東西。）</p><p>關於「もらう」的具體說明，請參照下圖:</p><p>（圖表見PDF講義）</p><p>例：</p><p>私はあなたに誕生日プレゼントを もらいましたよね。</p><p>（我從你那裡拿到了生日禮物，對吧？）</p><p>私は 彼と彼女に 誕生日カードを もらいました。</p><p>（我從他和她那裡拿到了生日卡片。）</p><p>あなたは 国仲さんに ゲームソフトを もらいました ね。</p><p>（你從國仲小姐那裡得到了遊戲軟體吧？）</p><p>国仲さんは あなたに ギターを もらいました よ。</p><p>（國仲小姐從你那裡得到了吉他喔！）</p><p>彼(かの)女は 朱さんに中間テストのノートをもらいました。</p><p>（她從朱先生那裡拿到了期中考的筆記。）</p><p>あなたは彼女に 期末テストの解答をもらいましたよね。</p><p>（你從她那裡拿到了期末考解答，對吧？）</p><p>另外，上面學到的二個表示「給予」的「くれる」「あげる」句型，也可以用「もらう」來「換句話說」。</p><p>例：①（あなたは）私にボールペンをくれました。</p><p>（你給了我原子筆。）</p><p>私はあなたにボールペンをもらいました。</p><p>（我從你那裡拿到了原子筆。）</p><p>②　彼は私にノートパソコンをくれました。</p><p>（他給了我筆記型電腦。）</p><p>私は彼にノートパソコンをもらいました。</p><p>（我從他那裡拿到了筆記型電腦。）</p><p>③　彼は石原さんに防虫スプレーをあげました。</p><p>（他給了石原先生防蟲噴霧器。）</p><p>石原さんは彼に防虫スプレーをもらいました。</p><p>（石原先生從他那裡拿到了防蟲噴霧器。）</p><p>④　小西さんは（あなたに）映画のチケットをあげましたよね。</p><p>（小西小姐給了你電影票，對吧？）</p><p>あなたは小西さんに映画のチケットをもらいましたよね。</p><p>（你從小西小姐那裡拿到了電影票，對吧？）</p><p>⑤  彼は彼のお父さんに新しい腕時計をあげました。</p><p>（他給了他父親新的手錶。）</p><p>彼のお父さんは彼に新しい腕時計をもらいました。</p><p>（他的父親從他那裡得到了新的手錶。）</p><h3>關於人稱</h3><p>我們剛才學到，「くれる」這個句型，一般用在「別人給我東西時」時。但是，當「別人給我身邊親近的人（例如父母兄弟姐妹）」時，由於也算是廣義的「我」，因此同樣是用「くれる」的句型。</p><p>以下為圖示說明。（圖表見PDF講義）</p><p>例：</p><p>（あなたは）私の妹に 飴を くれました ね、ありがとう。</p><p>（你給了我妹妹糖果吧，謝謝。）</p><p>彼は 私の両親に 美味しい日本料理をくれました。</p><p>（他送我父母親好吃的日本料理。）</p><p>役所の人は おばあちゃんにきれいな カレンダーを くれました。</p><p>（區公所的人送給阿媽漂亮的月曆。）</p><p>隣の人は 私の猫に 餌を くれました。</p><p>（隔壁的人餵我的貓飼料。）</p><p>あなたの会社は 私の会社に統計ソフトウエアを くれました。</p><p>（你們公司給我們公司一套統計軟體。）</p>","noteRevision":"精修版","revisionReason":"已刪減重複鋪陳與離題文字，保留學習重點、接續規則及例句；必要處已修正文法說明。頁末可查看上傳原文。"},{"id":15,"title":"日文中的單位詞","original":"<h3>學習目標</h3><p class=\"lesson-focus\">認識常用量詞及讀音，用完整句子表達<mark class=\"study-key\">數量</mark>。</p><h3>個（こ）：小型物件</h3><p><ruby>一個<rt>いっこ</rt></ruby>、<ruby>二個<rt>にこ</rt></ruby>、<ruby>三個<rt>さんこ</rt></ruby>、<ruby>四個<rt>よんこ</rt></ruby>、<ruby>五個<rt>ごこ</rt></ruby>。<br><ruby>六個<rt>ろっこ</rt></ruby>、<ruby>七個<rt>ななこ</rt></ruby>、<ruby>八個<rt>はっこ</rt></ruby>、<ruby>九個<rt>きゅうこ</rt></ruby>、<ruby>十個<rt>じゅっこ</rt></ruby>。<ruby>何個<rt>なんこ</rt></ruby>。<br>例如りんご三個。個不只用在口語，也不能取代所有量詞。</p><h3>つ：一般物件或抽象項目</h3><p><ruby>一つ<rt>ひとつ</rt></ruby>、<ruby>二つ<rt>ふたつ</rt></ruby>、<ruby>三つ<rt>みっつ</rt></ruby>、<ruby>四つ<rt>よっつ</rt></ruby>、<ruby>五つ<rt>いつつ</rt></ruby>。<br><ruby>六つ<rt>むっつ</rt></ruby>、<ruby>七つ<rt>ななつ</rt></ruby>、<ruby>八つ<rt>やっつ</rt></ruby>、<ruby>九つ<rt>ここのつ</rt></ruby>、十とお。<br>十的傳統讀法是とお，不是沒有十。詢問用いくつ。<br>例如願いが三つあります。＝有三個願望。</p><h3>本（ほん）：細長物件</h3><p><ruby>一本<rt>いっぽん</rt></ruby>、<ruby>二本<rt>にほん</rt></ruby>、<ruby>三本<rt>さんぼん</rt></ruby>、<ruby>四本<rt>よんほん</rt></ruby>、<ruby>五本<rt>ごほん</rt></ruby>。<br><ruby>六本<rt>ろっぽん</rt></ruby>、<ruby>七本<rt>ななほん</rt></ruby>、<ruby>八本<rt>はっぽん</rt></ruby>、<ruby>九本<rt>きゅうほん</rt></ruby>、<ruby>十本<rt>じゅっぽん</rt></ruby>。<ruby>何本<rt>なんぼん</rt></ruby>。<br>鉛筆、傘、瓶裝飲料等可用本；書本通常用冊。</p><h3>枚（まい）：薄而平的物件</h3><p><ruby>一枚<rt>いちまい</rt></ruby>、<ruby>二枚<rt>にまい</rt></ruby>、<ruby>三枚<rt>さんまい</rt></ruby>；後面依數字加まい。<br>例如紙、写真、皿、シャツ。<ruby>何枚<rt>なんまい</rt></ruby>。</p><h3>匹（ひき）：常見小動物</h3><p><ruby>一匹<rt>いっぴき</rt></ruby>、<ruby>二匹<rt>にひき</rt></ruby>、<ruby>三匹<rt>さんびき</rt></ruby>、<ruby>四匹<rt>よんひき</rt></ruby>、<ruby>五匹<rt>ごひき</rt></ruby>。<br><ruby>六匹<rt>ろっぴき</rt></ruby>、<ruby>七匹<rt>ななひき</rt></ruby>、<ruby>八匹<r
